<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>页面不存在 · HWVCTS</title>
  <link rel="stylesheet" href="css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <style>
    .nf-wrap {
      min-height: 60vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 40px 20px;
    }
    .nf-code {
      font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--coral-pulse);
    }
    .nf-title {
      margin: 12px 0 10px; font-size: clamp(28px, 5vw, 44px); font-weight: 700;
      letter-spacing: -0.02em; color: var(--pure-white);
    }
    .nf-desc { margin: 0 auto 24px; max-width: 420px; color: var(--ash); font-size: 15px; line-height: 1.8; }
    .nf-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body data-page="404">
  <main class="page">
    <div class="container">
      <div class="nf-wrap">
        <div>
          <div class="nf-code">404 · Not Found</div>
          <h1 class="nf-title">这一页不在赛程里</h1>
          <p class="nf-desc">链接可能过期、被移动，或者从未存在。你可以回到主页，或者去活动大厅看看正在进行的赛事。</p>
          <div class="nf-actions">
            <a class="btn btn-primary" href="index.html">回到主页</a>
            <a class="btn btn-ghost" href="events.html">去活动大厅</a>
            <button class="btn btn-ghost" type="button" onclick="history.back()">返回上一页</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
