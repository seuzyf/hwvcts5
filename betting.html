<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛事预测 · HWVCTS</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/layout.js"></script>
        <style>
        /* ═════════ 竞猜 · 重构版（纯 theme 组件语言 · 无 legacy 别名 · 无旧装饰条） ═════════ */
        body { padding-top: 80px; }

        /* 头部右侧：账户芯片 + 操作 */
        .bet-user { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        #user-display {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end;
            background: var(--ink); border: 1px solid var(--border); border-radius: var(--r-btn);
            padding: 8px 14px; font-size: 14px; color: var(--ash);
        }
        #user-display #username-display { color: var(--pure-white); font-weight: 600; }
        #user-display .bal { font-family: var(--font-mono); font-weight: 700; color: var(--coral-pulse); }
        #user-display .sep { color: var(--iron); }
        .bet-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

        /* 活动页同款卡片信息流 */
        #main-content { display: flex; flex-direction: column; gap: 22px; }
        .group-section { display: flex; flex-direction: column; gap: 12px; }
        .group-header {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            margin: 0; padding-bottom: 12px; border-bottom: 1px solid var(--border);
            font-size: 16px; font-weight: 600; color: var(--pure-white); letter-spacing: 0;
        }
        .betting-matches-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px;
        }
        .betting-card {
            background: var(--ink); border-radius: var(--r-card); overflow: hidden;
            border: 1px solid var(--border); cursor: pointer;
            box-shadow: var(--key-shadow);
            transition: box-shadow var(--t-swap) var(--ease-out), transform var(--t-swap) var(--ease-out), border-color var(--t-hover) var(--ease-out);
            position: relative;
        }
        .betting-card:hover { box-shadow: var(--key-shadow-hover); transform: translateY(-3px); }
        /* 状态色：可竞猜（绿） / 已锁定待结算（琥珀） / 已结算（灰） */
        .betting-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
        .betting-card.bettable { border-color: rgba(89, 212, 153, 0.35); }
        .betting-card.bettable::before { background: var(--success-green); }
        .betting-card.locked-pending { border-color: rgba(255, 190, 60, 0.35); cursor: pointer; }
        .betting-card.locked-pending::before { background: #ffbe3c; }
        .betting-card.settled { border-color: var(--border); cursor: pointer; opacity: 0.72; }
        .betting-card.settled::before { background: var(--iron); }
        .bc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px 0; }
        .bc-state { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
        .bettable .bc-state { color: var(--success-green); }
        .locked-pending .bc-state { color: #ffbe3c; }
        .settled .bc-state { color: var(--smoke); }
        .bc-date { font-size: 12px; color: var(--smoke); font-family: var(--font-mono); }
        .bc-teams { padding: 10px 14px 4px; }
        .bc-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; }
        .bc-row + .bc-row { border-top: 1px dashed rgba(255,255,255,0.06); }
        .bc-team { font-size: 15px; font-weight: 600; color: var(--pure-white); }
        .bc-score { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--pure-white); }
        .bc-odds { display: flex; align-items: baseline; gap: 6px; font-family: var(--font-mono); font-size: 13px; color: var(--ash); }
        .bc-share { font-size: 11px; color: var(--smoke); }
        .bc-foot { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px 12px; font-size: 12px; color: var(--smoke); }
        /* 详情弹窗两队名单 */
        .md-teams { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width: 640px) { .md-teams { grid-template-columns: 1fr; } }
        .md-team-card { background: var(--obsidian); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
        .md-team-card h4 { margin: 0 0 8px; font-size: 14px; color: var(--pure-white); display: flex; justify-content: space-between; }
        .md-player { display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 8px; align-items: center; padding: 6px 0; font-size: 12.5px; border-top: 1px solid rgba(255,255,255,0.05); }
        .md-player:first-of-type { border-top: none; }
        .md-player .nm { color: var(--mist); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .md-player .st { color: var(--smoke); font-family: var(--font-mono); font-size: 11.5px; text-align: right; min-width: 52px; }
        .md-player .st b { color: var(--mist); font-weight: 600; }
        .md-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--smoke); margin: 0 0 10px; }
        .team { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; }
        .team-name-container { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .team-name { font-size: 15px; font-weight: 600; color: var(--pure-white); }
        .team-odds { font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; color: var(--smoke); }
        .team-odds.high-odds { color: var(--success-green); font-weight: 700; }
        .team-share { font-size: 11px; color: var(--ash); margin-left: 5px; font-weight: 400; }
        .betting-card hr, hr { border: none; border-top: 1px solid var(--border); margin: 6px 0; opacity: 0.6; }
        .roster-btn {
            width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border);
            background: transparent; color: var(--smoke); font-size: 12px; line-height: 1;
            cursor: pointer; transition: background var(--t-hover) var(--ease-out), color var(--t-hover) var(--ease-out), border-color var(--t-hover) var(--ease-out); padding: 0; font-weight: 700;
        }
        .roster-btn:hover { border-color: var(--coral-pulse); color: var(--coral-pulse); }

        /* 排名榜（卡片 + 数据表语言） */
        #leaderboard-section { display: none; }
        .lb-scroll { max-height: 60vh; overflow-y: auto; }
        .leaderboard-table, .history-table { width: 100%; border-collapse: collapse; }
        .leaderboard-table th, .history-table th {
            font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--smoke); font-weight: 500; text-align: left; padding: 10px 8px;
            border-bottom: 1px solid var(--border);
        }
        .leaderboard-table td, .history-table td {
            padding: 11px 8px; font-size: 14px; text-align: left; color: var(--ash);
            border-bottom: 1px solid var(--border); white-space: nowrap;
        }
        .leaderboard-table tr:last-child td, .history-table tr:last-child td { border-bottom: none; }
        .leaderboard-table td:first-child, .history-table td:first-child {
            font-family: var(--font-mono); color: var(--smoke); font-variant-numeric: tabular-nums;
        }
        .leaderboard-table .username-cell { cursor: pointer; color: var(--pure-white); font-weight: 600; }
        .leaderboard-table .username-cell:hover { color: var(--coral-pulse); }

        /* 我的预测记录（弹窗内） */
        .bet-record {
            display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
            background: var(--obsidian); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px 12px; margin-bottom: 8px; font-size: 14px; color: var(--ash);
        }
        .bet-record > span:first-child { color: var(--pure-white); font-weight: 600; }
        .bet-record .cancel-bet-btn {
            height: 28px; border-radius: var(--r-btn); border: 1px solid rgba(255, 99, 99, 0.4);
            background: transparent; color: #ff8f8f; font-size: 12px; padding: 0 12px;
            cursor: pointer; transition: background var(--t-hover) var(--ease-out), color var(--t-hover) var(--ease-out), border-color var(--t-hover) var(--ease-out); font-family: inherit;
        }
        .bet-record .cancel-bet-btn:hover { background: rgba(255, 99, 99, 0.1); }
        /* 快捷分数：常用金额一键填入，省去手机上打字 */
        .bet-quick { display: flex; gap: 8px; margin-top: 8px; }
        .bet-quick button {
            flex: 1; height: 30px; border-radius: var(--r-btn);
            border: 1px solid var(--border); background: var(--obsidian);
            color: var(--ash); font-family: var(--font-mono); font-size: 13px;
            cursor: pointer; transition: background var(--t-hover) var(--ease-out),
                color var(--t-hover) var(--ease-out), border-color var(--t-hover) var(--ease-out);
        }
        .bet-quick button:hover { background: var(--graphite); color: var(--pure-white); border-color: var(--smoke); }
        .bet-quick button:active { transform: scale(0.96); }
        .bet-record .cancel-bet-btn.confirming {
            color: #ffbe3c; border-color: rgba(255, 190, 60, 0.55);
            background: rgba(255, 190, 60, 0.12);
        }
        #existing-bets-section { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
        #existing-bets-section h4 {
            margin: 0 0 10px; font-family: var(--font-mono); font-size: 11px;
            text-transform: uppercase; letter-spacing: 0.08em; color: var(--smoke); text-align: center;
        }

        /* 弹窗内部（容器/关闭钮由 theme.css 单源提供） */
        .modal-header {
            margin: 6px 0 4px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
            color: var(--pure-white); font-size: 17px; font-weight: 500; text-align: left;
        }
        .modal-body { display: flex; flex-direction: column; gap: 14px; max-height: 60vh; overflow-y: auto; margin-top: 16px; }
        .modal-footer {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px;
        }
        .modal-footer.center { justify-content: center; }
        .modal-footer .my-bal { font-size: 14px; color: var(--smoke); }
        .modal-footer .my-bal b {
            font-family: var(--font-mono); color: var(--coral-pulse); font-size: 16px; margin-left: 4px;
        }
        .bet-hint { text-align: center; color: var(--smoke); font-size: 14px; margin: 0 0 14px; }
        #bet-team-a-btn, #bet-team-b-btn { flex: 1; }
        .modal-panel .input { width: 100%; box-sizing: border-box; }

        /* 队伍名单弹窗 */
        .roster-list { list-style: none; margin: 14px 0 0; padding: 0; }
        .roster-list li {
            display: flex; align-items: baseline; gap: 8px; padding: 10px 2px;
            border-bottom: 1px solid var(--border); font-size: 15px;
        }
        .roster-list li:last-child { border-bottom: none; }
        .roster-list .r-name { color: var(--pure-white); font-weight: 600; }
        .roster-list .r-id { font-family: var(--font-mono); font-size: 13px; color: var(--smoke); }
    </style>
</head>
<body data-page="betting" data-crumb="events">
    <main class="page">
        <div class="container">
            <header class="page-header flex-between">
                <div>
                    <span class="eyebrow">Betting</span>
                    <h1 id="main-title" class="page-title">赛事预测</h1>
                    <p class="page-sub" style="margin:0;">本功能仅供娱乐，预测分数无任何实际价值</p>
                </div>
                <div class="bet-user">
                    <div id="user-display" style="display:none;">
                        <span id="username-display"></span>
                        <span class="sep">|</span>
                        余额 <span class="bal" id="user-balance"></span>
                    </div>
                    <div class="bet-actions">
                        <button id="login-btn" class="btn btn-ghost" type="button">登录 / 注册</button>
                        <button id="history-btn" class="btn btn-ghost" type="button" style="display:none;">我的预测记录</button>
                        <button id="toggle-view-btn" class="btn btn-ghost" type="button">预测排名</button>
                    </div>
                </div>
            </header>

            <div id="event-bar" hidden></div>

            <div id="group-lock-bar" hidden style="margin-bottom:14px;"></div>
            <div id="main-content"></div>

            <section id="leaderboard-section" class="card" style="display:none;">
                <div class="flex-between" style="margin-bottom:10px;">
                    <h2 style="margin:0; font-size:16px; font-weight:500; color:var(--pure-white);">预测积分排名</h2>
                    <span class="eyebrow">Leaderboard</span>
                </div>
                <div class="lb-scroll table-wrap">
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>排名</th><th>ID</th><th>当前分数</th><th>预测次数</th><th>正确率</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-table-body"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <div id="login-modal" class="modal-backdrop">
        <div class="modal-panel" style="max-width:440px;">
            <button class="modal-close" type="button" aria-label="关闭" onclick="document.getElementById('login-modal').classList.remove('visible')">&times;</button>
            <span class="modal-eyebrow">Account</span>
            <h3 class="modal-header">登录或注册</h3>
            <div class="modal-body" style="overflow:visible;">
                <input class="input" type="text" id="username-input" placeholder="请输入您的用户名（建议使用真名）" required>
                <input class="input" type="password" id="password-input" placeholder="请输入您的密码" required>
            </div>
            <div class="modal-footer center">
                <button id="login-confirm-btn" class="btn btn-primary" type="button">确认</button>
            </div>
        </div>
    </div>

    <div id="bet-modal" class="modal-backdrop">
        <div class="modal-panel" style="max-width:480px;">
            <button class="modal-close" type="button" aria-label="关闭" onclick="document.getElementById('bet-modal').classList.remove('visible')">&times;</button>
            <span class="modal-eyebrow">Prediction</span>
            <h3 class="modal-header" id="bet-modal-header"></h3>
            <div class="modal-body">
                <div id="bet-controls-section">
                    <p class="bet-hint">请选择您要支持的队伍</p>
                    <div style="display:flex; gap:12px; margin-bottom:14px;">
                        <button id="bet-team-a-btn" class="btn btn-primary" type="button"></button>
                        <button id="bet-team-b-btn" class="btn btn-primary" type="button"></button>
                    </div>
                    <input class="input" type="number" id="bet-amount-input" min="1" placeholder="支持分数（最小 1）">
                    <div class="bet-quick" id="bet-quick" role="group" aria-label="快捷选择分数">
                        <button type="button" data-amt="10">10</button>
                        <button type="button" data-amt="25">25</button>
                        <button type="button" data-amt="50">50</button>
                        <button type="button" data-amt="all">全部</button>
                    </div>
                    <div id="bet-preview" class="smoke" style="font-size:13px; margin-top:8px; min-height:20px;">选择队伍与分数后显示支持比与预计赢利</div>
                </div>
                <div id="existing-bets-section">
                    <h4>本场所有预测记录</h4>
                    <div id="existing-bets-list"></div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="my-bal">剩余分数<b id="modal-user-balance"></b></div>
                <button id="bet-confirm-btn" class="btn btn-primary" type="button">确认预测</button>
            </div>
        </div>
    </div>

    <div id="history-modal" class="modal-backdrop">
        <div class="modal-panel" style="max-width:840px;">
            <button class="modal-close" type="button" aria-label="关闭" onclick="document.getElementById('history-modal').classList.remove('visible')">&times;</button>
            <span class="modal-eyebrow">History</span>
            <h3 class="modal-header" id="history-modal-header">预测记录</h3>
            <div class="modal-body">
                <div class="table-wrap">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>比赛</th><th>支持队伍</th><th>支持分数</th><th>结算回报指数</th><th>状态</th><th>分数结算</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="match-detail-modal" class="modal-backdrop">
        <div class="modal-panel" style="max-width:720px;">
            <button class="modal-close" type="button" aria-label="关闭" onclick="document.getElementById('match-detail-modal').classList.remove('visible')">&times;</button>
            <span class="modal-eyebrow">Match</span>
            <h3 class="modal-header" id="md-title"></h3>
            <div id="md-status" style="margin:-6px 0 12px;"></div>
            <div id="md-body"><div class="sk-loader"><div class="sk"></div><div class="sk"></div><div class="sk"></div><span class="sr-only">正在加载</span></div></div>
            <div class="modal-footer">
                <button id="md-bet-btn" class="btn btn-primary" type="button" hidden>参与竞猜 →</button>
            </div>
        </div>
    </div>

    <div id="roster-modal" class="modal-backdrop">
        <div class="modal-panel" id="roster-modal-content" role="dialog" aria-modal="true"></div>
    </div>

<script>

document.addEventListener('DOMContentLoaded', () => {
    var boundEv = null;   /* P13f：绑定活动（活动封禁判定） */
    const supabaseClient = HWLayout.supa(); /* 连接配置收敛：js/layout.js 唯一出处 */

    let currentUser = null;
    let allMatchesData = [];
    let allBetsData = [];
    let allUsersData = [];
    let allLedgerData = [];
    let allPlayersData = [];
    let currentSeason = 's6'; // 默认 S6 赛季
    /* 竞猜表按赛季选表；s5 表缺失（未执行 hardening.sql）时由调用方回退 s6 */
    const betsTable = () => currentSeason === 's5' ? 's5_bet_bets' : 's6_bet_bets';
    const BET_COLUMNS = 'id, user_id, match_id, amount, predicted_winner, created_at';

    const loginBtn = document.getElementById('login-btn');
    const historyBtn = document.getElementById('history-btn');
    const loginModal = document.getElementById('login-modal');
    const loginConfirmBtn = document.getElementById('login-confirm-btn');
    const mainContent = document.getElementById('main-content');
    const betModal = document.getElementById('bet-modal');
    const betConfirmBtn = document.getElementById('bet-confirm-btn');
    const toggleViewBtn = document.getElementById('toggle-view-btn');
    const leaderboardSection = document.getElementById('leaderboard-section');
    const mainTitle = document.getElementById('main-title');

    loginBtn.addEventListener('click', () => loginModal.classList.add('visible'));
    loginConfirmBtn.addEventListener('click', handleLoginOrRegister);
    historyBtn.addEventListener('click', () => showHistory(currentUser.id, "我"));
    toggleViewBtn.addEventListener('click', toggleView);

    async function handleLoginOrRegister() {
        const username = document.getElementById('username-input').value.trim();
        const password = document.getElementById('password-input').value;
        if (!username || !password) {
            HWLayout.toast('请输入用户名和密码');
            return;
        }
        try {
            // 统一账号登录（auth.js）：用户不存在时自动注册，与原行为一致
            currentUser = await HWAuth.login(username, password);
            loginModal.classList.remove('visible');
            await initializePage();
        } catch (err) {
            HWLayout.toast(err.message || '登录失败，请重试');
        }
    }


    function updateUserDisplay() {
        const userDisplay = document.getElementById('user-display');
        const usernameDisplay = document.getElementById('username-display');
        const userBalance = document.getElementById('user-balance');
        
        if (currentUser) {
            userDisplay.style.display = 'flex';
            loginBtn.style.display = 'none';
            historyBtn.style.display = 'inline-flex';
            usernameDisplay.textContent = currentUser.username;
            userBalance.textContent = typeof currentUser.balance === 'number' ? Math.round(currentUser.balance) : '100';
            /* P13e：权威余额（含积分流水）覆盖 */
            if (currentUser.id && typeof HWLayout !== 'undefined' && HWLayout.recalcBalance) {
                HWLayout.recalcBalance(currentUser.id).then(function (b) {
                    if (b == null) return;
                    currentUser.balance = b;
                    var el = document.getElementById('user-balance');
                    if (el) el.textContent = Math.round(b);
                });
            }
        } else {
            userDisplay.style.display = 'none';
            loginBtn.style.display = 'inline-flex';
            historyBtn.style.display = 'none';
        }
    }

    async function loadGroupLocks() {
        try {
            const table = (currentSeason === 's5' ? 's5' : 's6') + '_betting_groups';
            const r = await supabaseClient.from(table).select('group_name, is_locked');
            const rows = (r && r.data) || [];
            lockedGroups = new Set(rows.filter(g => g.is_locked).map(g => g.group_name));
            renderGroupLockBar(rows);
        } catch (e) { /* 表未部署时无手动锁 */ }
    }
    function renderGroupLockBar(rows) {
        const bar = document.getElementById('group-lock-bar');
        if (!bar) return;
        if (!HWLayout.isAdminNow()) { bar.hidden = true; return; }
        const names = [...new Set(allMatchesData.map(m => m.group).filter(Boolean))];
        if (!names.length) { bar.hidden = true; return; }
        bar.hidden = false;
        bar.innerHTML = '<div class="card" style="padding:12px 16px;"><span class="eyebrow">组别锁定（管理员紧急兜底，自动锁定按对战时间）</span>' +
            '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;">' + names.map(g => {
                const locked = lockedGroups.has(g);
                return '<button class="btn ' + (locked ? 'btn-primary' : 'btn-ghost') + ' btn-sm" type="button" data-glock="' + g + '">' +
                    g + (locked ? ' · 已锁' : ' · 解锁中') + '</button>';
            }).join('') + '</div></div>';
        bar.querySelectorAll('[data-glock]').forEach(b => b.addEventListener('click', async () => {
            const g = b.dataset.glock;
            const next = !lockedGroups.has(g);
            const table = (currentSeason === 's5' ? 's5' : 's6') + '_betting_groups';
            const r = await supabaseClient.from(table).upsert([{ group_name: g, is_locked: next }], { onConflict: 'group_name' });
            if (r.error) { HWLayout.toast('操作失败（请先执行 install.sql）: ' + r.error.message, 'err'); return; }
            HWLayout.writeAudit(next ? 'bet.group_lock' : 'bet.group_unlock', 'betting_group', g, { season: currentSeason });
            HWLayout.toast(next ? '已锁定组别 ' + g : '已解锁组别 ' + g);
            await loadGroupLocks();
            renderMatches();
        }));
    }

    async function calculateAllUserBalances() {
        const matchPools = {};
        allBetsData.forEach(bet => {
            if (!matchPools[bet.match_id]) {
                matchPools[bet.match_id] = { betsOnA: 0, betsOnB: 0 };
            }
            const match = allMatchesData.find(m => m.id === bet.match_id);
            if (match) {
                if (bet.predicted_winner === match.team_a) matchPools[bet.match_id].betsOnA += bet.amount;
                else matchPools[bet.match_id].betsOnB += bet.amount;
            }
        });

        allUsersData.forEach(user => {
            const userBets = allBetsData.filter(b => b.user_id === user.id);
            let totalStaked = 0;
            let totalWinnings = 0;
            
            userBets.forEach(bet => {
                totalStaked += bet.amount;
                const match = allMatchesData.find(m => m.id === bet.match_id);
                if (match && match.score_a !== null && match.score_b !== null && match.score_a !== match.score_b) {
                    const winner = match.score_a > match.score_b ? match.team_a : match.team_b;
                    if (bet.predicted_winner === winner) {
                        const pool = matchPools[bet.match_id];
                        const winnerPool = (winner === match.team_a) ? (100 + pool.betsOnA) : (100 + pool.betsOnB);
                        const loserPool = (winner === match.team_a) ? (100 + pool.betsOnB) : (100 + pool.betsOnA);
                        const profit = Math.ceil((bet.amount / winnerPool) * loserPool);
                        totalWinnings += bet.amount + profit;
                    }
                }
            });
            const ledgerNet = (allLedgerData || []).filter(l => l.user_id === user.id).reduce((sum, l) => sum + (l.delta || 0), 0);
            user.balance = Math.round(100 - totalStaked + totalWinnings + ledgerNet);
        });
    }

    /* 比赛状态：bettable 可竞猜 / locked-pending 已锁定待结算 / settled 已结算 */
    /* 竞猜状态（自动锁定）：已结算 > 组别手动锁 > 到时自动锁 > 可竞猜；未排时间不开放 */
    let lockedGroups = new Set();
    function matchBetState(m) {
        const hasScore = m.score_a != null && m.score_b != null && (m.score_a > 0 || m.score_b > 0);
        if (hasScore) return 'settled';
        if (m.group && lockedGroups.has(m.group)) return 'group-locked';
        if (!m.match_date) return 'unscheduled';
        if (new Date(m.match_date).getTime() < Date.now()) return 'locked-pending';
        return 'bettable';
    }
    const STATE_ZH = { bettable: '可竞猜', 'locked-pending': '已锁定 · 待结算', settled: '已结算', 'group-locked': '已锁定（管理员）', unscheduled: '时间待定' };

    /* 状态签名：比赛时间跨过「开赛」时自动刷新卡片，不必手动刷新页面 */
    let lastStateSig = '';
    function stateSignature() {
        return allMatchesData.map(m => m.id + ':' + matchBetState(m)).join('|');
    }

    function renderMatches() {
        mainContent.innerHTML = '';
        /* 分组从数据推导，避免活动使用自定义组名时整组比赛消失 */
        const preferred = ['传奇组', '中坚组', '挑战组'];
        const seen = {};
        allMatchesData.forEach(m => { if (m.group) seen[m.group] = 1; });
        const groups = preferred.filter(g => seen[g])
            .concat(Object.keys(seen).filter(g => preferred.indexOf(g) === -1));
        groups.forEach(group => {
            const groupMatches = allMatchesData.filter(m => m.group === group && m.team_a && m.team_b);
            if (groupMatches.length === 0) return;
            const section = document.createElement('section');
            section.className = 'group-section';
            section.innerHTML = `<h2 class="group-header">${group}<span class="eyebrow">${groupMatches.length} 场</span></h2>
                <div class="betting-matches-grid"></div>`;
            const grid = section.querySelector('.betting-matches-grid');

            groupMatches.forEach(match => {
                const state = matchBetState(match);
                const betsForMatch = allBetsData.filter(b => b.match_id === match.id);
                const betsOnA = betsForMatch.filter(b => b.predicted_winner === match.team_a).reduce((sum, b) => sum + b.amount, 0);
                const betsOnB = betsForMatch.filter(b => b.predicted_winner === match.team_b).reduce((sum, b) => sum + b.amount, 0);
                const poolA = 100 + betsOnA, poolB = 100 + betsOnB;
                const shareA = Math.round(poolA / (poolA + poolB) * 100);
                const dateStr = match.match_date
                    ? new Date(match.match_date).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
                    : '时间待定';
                const scoreA = (state === 'settled') ? match.score_a : '–';
                const scoreB = (state === 'settled') ? match.score_b : '–';

                const card = document.createElement('div');
                card.className = 'betting-card ' + state;
                card.dataset.matchId = match.id;
                card.setAttribute('tabindex', '0');
                card.setAttribute('role', 'button');
                card.setAttribute('aria-label', match.team_a + ' vs ' + match.team_b + '，' + STATE_ZH[state]);
                card.innerHTML = `
                    <div class="bc-head">
                        <span class="bc-state">${STATE_ZH[state]}</span>
                        <span class="bc-date">${dateStr}</span>
                    </div>
                    <div class="bc-teams">
                        <div class="bc-row">
                            <span class="bc-team">${match.team_a}</span>
                            <span class="bc-odds">${(poolA / (poolA + poolB) * 100).toFixed(0)}%<span class="bc-share">支持比</span></span>
                            <span class="bc-score">${scoreA}</span>
                        </div>
                        <div class="bc-row">
                            <span class="bc-team">${match.team_b}</span>
                            <span class="bc-odds">${(poolB / (poolA + poolB) * 100).toFixed(0)}%<span class="bc-share">支持比</span></span>
                            <span class="bc-score">${scoreB}</span>
                        </div>
                    </div>
                    <div class="bc-foot">
                        <span>点开查看双方名单与数据</span>
                        <span>${betsForMatch.length} 人已预测</span>
                    </div>`;
                const open = () => openMatchDetail(match.id);
                card.addEventListener('click', open);
                card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
                grid.appendChild(card);
            });
            mainContent.appendChild(section);
        });
        lastStateSig = stateSignature();
        renderGroupLockBar([]);
    }

    /* 开赛时间到达后，卡片状态自动从「可竞猜」切到「已锁定 · 待结算」。
       走全站时钟总线：同一节奏、同一处管理，页面切走时自动停。 */
    if (HWLayout.clock) {
        HWLayout.clock(function () {
            if (!allMatchesData.length) return;
            if (stateSignature() !== lastStateSig) renderMatches();
        });
    }

    /* ---------- 比赛详情：双方名单 + 生涯/本次排名与 ACS ---------- */
    function aggPlayerStats(matchRows) {
        const byId = {};
        matchRows.forEach(m => {
            ['team_a', 'team_b'].forEach(tk => {
                for (let i = 1; i <= 5; i++) {
                    const gid = m[tk + '_player' + i + '_id'];
                    const ds = m[tk + '_player' + i + '_data'];
                    if (!gid || !ds) continue;
                    const st = String(ds).split('/').map(Number);
                    if (st.length < 4 || st.some(isNaN)) continue;
                    const rec = byId[gid] || (byId[gid] = { acsSum: 0, acsN: 0, matches: 0 });
                    rec.matches++;
                    if (st[0] > 0) { rec.acsSum += st[0]; rec.acsN++; }
                }
            });
        });
        Object.keys(byId).forEach(k => {
            byId[k].acs = byId[k].acsN > 0 ? byId[k].acsSum / byId[k].acsN : 0;
        });
        return byId;
    }

    async function openMatchDetail(matchId) {
        const match = allMatchesData.find(m => m.id === matchId);
        if (!match) return;
        const state = matchBetState(match);
        document.getElementById('md-title').textContent = `${match.team_a} vs ${match.team_b}`;
        document.getElementById('md-status').innerHTML =
            `<span class="badge ${state === 'bettable' ? 'badge-green' : state === 'locked-pending' ? 'badge-gold' : 'badge-quiet'}">${STATE_ZH[state]}</span>` +
            (match.match_date ? `<span class="smoke" style="margin-left:8px; font-size:12px;">${HWLayout.fmtBJ(match.match_date)}（北京时间）</span>` : '<span class="smoke" style="margin-left:8px; font-size:12px;">对战时间待定</span>');
        const body = document.getElementById('md-body');
        body.innerHTML = HWLayout.loader({ label: '正在加载' });
        const betBtn = document.getElementById('md-bet-btn');
        betBtn.hidden = state !== 'bettable';
        betBtn.onclick = () => {
            document.getElementById('match-detail-modal').classList.remove('visible');
            openBetModal(matchId);
        };
        document.getElementById('match-detail-modal').classList.add('visible');

        try {
            const seasonTables = ['s6_matches', 's5_matches'];
            const results = await Promise.all(seasonTables.map(t =>
                supabaseClient.from(t).select('*').catch(() => ({ data: [] }))));
            const allRows = results.flatMap(r => (r && r.data) || []);
            const evId = match.event_id || (boundEv && boundEv.id) || null;
            const careerAgg = aggPlayerStats(allRows);
            const eventAgg = evId ? aggPlayerStats(allRows.filter(m2 => String(m2.event_id) === String(evId))) : careerAgg;

            const careerRank = {}; /* gid → 名次（按生涯 ACS） */
            Object.keys(careerAgg).sort((a, b) => careerAgg[b].acs - careerAgg[a].acs)
                .forEach((gid, i) => { careerRank[gid] = i + 1; });
            const eventRank = {};
            Object.keys(eventAgg).sort((a, b) => eventAgg[b].acs - eventAgg[a].acs)
                .forEach((gid, i) => { eventRank[gid] = i + 1; });

            const rosterOf = team => (allPlayersData || []).filter(p => p.team === team && (!match.group || p.group === match.group));
            const renderTeam = team => {
                const roster = rosterOf(team);
                if (!roster.length) return `<div class="md-team-card"><h4>${team}</h4><p class="smoke" style="font-size:12.5px; margin:0;">暂无名单</p></div>`;
                return `<div class="md-team-card"><h4><span>${team}</span><span class="smoke" style="font-weight:400;">${roster.length} 人</span></h4>` +
                    roster.map(p => {
                        const c = careerAgg[p.id] || null;
                        const e = eventAgg[p.id] || null;
                        return `<div class="md-player">
                            <span class="nm">${p.name || p.id}</span>
                            <span class="st" title="生涯比赛排名">${careerRank[p.id] ? '#' + careerRank[p.id] : '—'}</span>
                            <span class="st" title="本次比赛排名">${eventRank[p.id] ? '#' + eventRank[p.id] : '—'}</span>
                            <span class="st" title="生涯 ACS">${c && c.acs > 0 ? '<b>' + c.acs.toFixed(1) + '</b>' : '—'}</span>
                            <span class="st" title="比赛 ACS">${e && e.acs > 0 ? '<b>' + e.acs.toFixed(1) + '</b>' : '—'}</span>
                        </div>`;
                    }).join('') + '</div>';
            };
            body.innerHTML = `
                <div class="md-legend">
                    <span>列：</span><span>生涯排名</span><span>本次排名</span><span>生涯 ACS</span><span>比赛 ACS</span>
                </div>
                <div class="md-teams">${renderTeam(match.team_a)}${renderTeam(match.team_b)}</div>`;
            loadOddsTrend(match, body);
        } catch (e) {
            body.innerHTML = '<p style="color:var(--coral-pulse); text-align:center;">名单数据加载失败</p>';
        }
    }

    /* 赔率走势小图（bet_odds_snapshots；无快照时不显示） */
    async function loadOddsTrend(match, body) {
        try {
            const r = await supabaseClient.from('bet_odds_snapshots').select('*')
                .eq('season', currentSeason).eq('match_id', match.id)
                .order('created_at', { ascending: true }).limit(60);
            const rows = (r && r.data) || [];
            if (rows.length < 2) return;
            const wrap = document.createElement('div');
            wrap.style.cssText = 'margin-top:14px;';
            wrap.innerHTML = '<div class="smoke" style="font-size:12px; margin-bottom:6px;">赔率走势（' + match.team_a + ' 赔率）</div>' +
                '<canvas width="520" height="90" style="width:100%; height:90px; display:block;"></canvas>';
            body.appendChild(wrap);
            const cv = wrap.querySelector('canvas');
            const ctx = cv.getContext('2d');
            const vals = rows.map(x => Number(x.rate_a) || 0);
            const min = Math.min(...vals), max = Math.max(...vals), pad = (max - min) * 0.15 || 0.1;
            ctx.strokeStyle = '#ff4655'; ctx.lineWidth = 2; ctx.beginPath();
            vals.forEach((v, i) => {
                const x = 8 + (cv.width - 16) * (vals.length === 1 ? 0 : i / (vals.length - 1));
                const y = cv.height - 8 - (cv.height - 16) * ((v - min + pad) / (max - min + 2 * pad));
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();
        } catch (e) { /* 快照表未部署则跳过 */ }
    }

    function openBetModal(matchId) {
        if (!currentUser) {
            HWLayout.toast('请先登录再进行操作。');
            loginModal.classList.add('visible');
            return;
        }
        const match = allMatchesData.find(m => m.id === matchId);
        const st = matchBetState(match);
        if (st === 'settled') { HWLayout.toast('该场比赛已结算，不再接受预测'); return; }
        if (st === 'locked-pending') { HWLayout.toast('比赛时间已过，预测已锁定，等待结算'); return; }
        if (st === 'group-locked') { HWLayout.toast('该组别已被管理员锁定，暂停预测'); return; }
        if (st === 'unscheduled') { HWLayout.toast('对战时间待定，暂未开放竞猜'); return; }

        document.getElementById('bet-modal-header').textContent = `${match.team_a} vs ${match.team_b}`;
        document.getElementById('modal-user-balance').textContent = Math.round(currentUser.balance);
        document.getElementById('bet-amount-input').value = '';

        const teamABtn = document.getElementById('bet-team-a-btn');
        const teamBBtn = document.getElementById('bet-team-b-btn');
        teamABtn.textContent = match.team_a;
        teamBBtn.textContent = match.team_b;
        [teamABtn, teamBBtn].forEach(btn => btn.style.borderColor = 'var(--border)');

        loadAndRenderExistingBets(match.id, match.group);
        
        let selectedTeam = null;
        teamABtn.onclick = () => { selectedTeam = match.team_a; teamABtn.style.borderColor = 'var(--success-green)'; teamBBtn.style.borderColor = 'var(--border)'; updPreview(); };
        teamBBtn.onclick = () => { selectedTeam = match.team_b; teamBBtn.style.borderColor = 'var(--success-green)'; teamABtn.style.borderColor = 'var(--border)'; updPreview(); };

        /* P13h：支持比 + 预计赢利 实时预览 */
        const betAmtEl = document.getElementById('bet-amount-input');
        function updPreview() {
            const el = document.getElementById('bet-preview');
            if (!el) return;
            const amt = parseInt(betAmtEl.value, 10);
            if (!selectedTeam || isNaN(amt) || amt < 1) {
                el.textContent = '选择队伍与分数后显示支持比与预计赢利';
                return;
            }
            const betsFor = allBetsData.filter(b => b.match_id === match.id);
            const bA = betsFor.filter(b => b.predicted_winner === match.team_a).reduce((s, b) => s + b.amount, 0);
            const bB = betsFor.filter(b => b.predicted_winner === match.team_b).reduce((s, b) => s + b.amount, 0);
            const pA = 100 + bA, pB = 100 + bB;
            const onA = selectedTeam === match.team_a;
            const share = Math.round((onA ? pA : pB) / (pA + pB) * 100);
            const wPool = onA ? pA : pB;
            const lPool = onA ? pB : pA;
            const win = amt + Math.ceil((amt / wPool) * lPool);
            el.textContent = '支持比 ' + share + '% · 猜对预计赢利 +' + win;
        }
        betAmtEl.oninput = updPreview;
        /* 快捷分数：常用金额一键填入；「全部」按当前余额取整 */
        var quick = document.getElementById('bet-quick');
        if (quick) {
            quick.onclick = function (e) {
                var b = e.target.closest('button[data-amt]');
                if (!b) return;
                var v = b.dataset.amt === 'all'
                    ? Math.max(1, Math.floor(currentUser.balance || 0))
                    : parseInt(b.dataset.amt, 10);
                betAmtEl.value = v;
                updPreview();
            };
        }
        updPreview();

        betConfirmBtn.onclick = async () => {
            const amount = parseInt(document.getElementById('bet-amount-input').value);
            if (!selectedTeam || isNaN(amount) || amount < 1 || amount > Math.round(currentUser.balance)) {
                HWLayout.toast("请选择队伍并输入有效的分数（不能超过您的余额）");
                return;
            }

            /* P13f：封禁拦截（全局 + 比赛所属活动） */
            var gBan = await HWLayout.myBanState();
            if (HWLayout.isBannedUser(gBan)) { HWLayout.toast('你已被禁赛，无法下注', 'err'); return; }
            var banEvId = match.event_id || (boundEv && boundEv.id);
            if (banEvId) {
                var eBan = await HWLayout.fetchEventBan(banEvId, currentUser.id);
                if (eBan) { HWLayout.toast('你在该活动被禁赛，无法下注', 'err'); return; }
            }
            
            {
                /* 提交瞬间复查（防止开着弹窗跨过开赛点） */
                const stC = matchBetState(match);
                if (stC !== 'bettable') {
                    HWLayout.toast('比赛已锁定或时间待定，无法提交预测', 'err');
                    betModal.classList.remove('visible');
                    return;
                }
            }

            betConfirmBtn.disabled = true; betConfirmBtn.textContent = '提交中...';
            /* 服务端裁决（place_bet 以数据库时间为准）；未部署该函数时回退前端校验直插 */
            let error = null;
            const rpcRes = await supabaseClient.rpc('place_bet', {
                p_user_id: currentUser.id, p_season: currentSeason, p_match_id: match.id,
                p_amount: amount, p_predicted_winner: selectedTeam
            });
            if (rpcRes.error && /could not find the function|PGRST202/i.test(rpcRes.error.message || '')) {
                const ins = await supabaseClient.from(betsTable()).insert([{ user_id: currentUser.id, match_id: match.id, amount, predicted_winner: selectedTeam }]);
                error = ins.error;
            } else if (rpcRes.error) {
                error = rpcRes.error;
            } else if (rpcRes.data && rpcRes.data.error) {
                error = { message: rpcRes.data.error };
            }
            betConfirmBtn.disabled = false; betConfirmBtn.textContent = '确 认 预 测';

            if (error) {
                HWLayout.toast("预测失败: " + error.message);
                return;
            }
            /* 赔率走势快照（best effort，失败不挡下注） */
            try {
                const mb = allBetsData.filter(b => b.match_id === match.id);
                const pA = mb.filter(b => b.predicted_winner === match.team_a).reduce((t, b) => t + b.amount, 0) + (selectedTeam === match.team_a ? amount : 0);
                const pB = mb.filter(b => b.predicted_winner === match.team_b).reduce((t, b) => t + b.amount, 0) + (selectedTeam === match.team_b ? amount : 0);
                await supabaseClient.from('bet_odds_snapshots').insert([{
                    season: currentSeason, match_id: match.id, pool_a: pA, pool_b: pB,
                    rate_a: Math.round(((200 + pA + pB) / (100 + pA)) * 100) / 100,
                    rate_b: Math.round(((200 + pA + pB) / (100 + pB)) * 100) / 100
                }]);
            } catch (e) { /* snapshots 表未部署则跳过 */ }
            HWLayout.toast("预测成功!");
            betModal.classList.remove('visible');
            await initializePage();
        };

        betModal.classList.add('visible');
    }
    
    function showTeamRoster(teamName, groupName) {
        const rosterModal = document.getElementById('roster-modal');
        const rosterContent = document.getElementById('roster-modal-content');
        
        const officialRoster = allPlayersData
            .filter(p => p.team === teamName && p.group === groupName)
            .map(p => ({ id: p.id, name: p.name, isSub: false }));

        const rosterHTML = `
            <button class="modal-close" type="button" aria-label="关闭" onclick="document.getElementById('roster-modal').classList.remove('visible')">&times;</button>
            <span class="modal-eyebrow">Roster</span>
            <div class="modal-header">${teamName} (${groupName}) 成员列表</div>
            <ul class="roster-list">
                ${officialRoster.length > 0 ? officialRoster.map(player => `
                    <li>
                        <span style="color:var(--mist); font-weight:700;">${player.name}</span> <span style="font-size: 13px; color:var(--smoke);">(${player.id})</span>
                    </li>
                `).join('') : '<li><span style="color:var(--smoke);">暂无该队伍成员信息</span></li>'}
            </ul>
        `;
        rosterContent.innerHTML = rosterHTML;
        rosterModal.classList.add('visible');
    }

    async function loadAndRenderExistingBets(matchId, groupName) {
        const listContainer = document.getElementById('existing-bets-list');
        listContainer.innerHTML = HWLayout.loader({ rows: 2 });
        
        // 1. 查本场预测记录
        const { data: bets, error } = await supabaseClient
            .from(betsTable())
            .select(BET_COLUMNS)
            .eq('match_id', matchId)
            .order('created_at', { ascending: false });

        if (error) {
            listContainer.innerHTML = `<p style="color:var(--ash)">加载失败：${error.message} (code: ${error.code})</p>`;
            console.error('获取bets出错:', error);
            return;
        }
        if (!bets || bets.length === 0) {
            listContainer.innerHTML = '<p style="text-align:center; color:var(--smoke);">暂无预测记录</p>';
            return;
        }

        // 2. 收集用户ID并查询用户名
        const userIds = [...new Set(bets.map(b => b.user_id))];
        const { data: users, error: userError } = await supabaseClient
            .from(HWAuth.accountTable())
            .select('id, username')
            .in('id', userIds);

        if (userError) {
            listContainer.innerHTML = `<p style="color:var(--ash)">加载用户信息失败：${userError.message} (code: ${userError.code})</p>`;
            console.error('获取users出错:', userError);
            return;
        }

        // 3. 构建映射并渲染
        const userMap = {};
        (users || []).forEach(u => { userMap[u.id] = u.username; });
        const mRef = bets.length ? allMatchesData.find(m => m.id === bets[0].match_id) : null;
        const canCancel = mRef ? matchBetState(mRef) === 'bettable' : false;

        listContainer.innerHTML = bets.map(bet => `
            <div class="bet-record">
                <span>${userMap[bet.user_id] || '匿名'}</span>
                <span style="color:var(--mist);">支持 ${bet.predicted_winner} <strong>${bet.amount}</strong> 分</span>
                ${(currentUser && bet.user_id === currentUser.id && canCancel) ? `<button class="cancel-bet-btn" data-bet-id="${bet.id}">撤销</button>` : '<span></span>'}
            </div>`).join('');

        document.querySelectorAll('.cancel-bet-btn').forEach(btn => btn.addEventListener('click', handleCancelBet));
    }

    async function handleCancelBet(event) {
        const betId = parseInt(event.target.dataset.betId);
        
        const betToCancel = allBetsData.find(b => b.id === betId);
        if (!betToCancel) {
            HWLayout.toast('找不到该预测记录。');
            return;
        }
        const matchOfBet = allMatchesData.find(m => m.id === betToCancel.match_id);
        if (!matchOfBet) {
             HWLayout.toast('找不到该预测对应的比赛。');
             return;
        }

        if (matchBetState(matchOfBet) !== 'bettable') {
            HWLayout.toast('比赛已开始或已结算，无法撤销预测', 'err');
            betModal.classList.remove('visible');
            await initializePage();
            return;
        }
        
        /* 两段式确认：第一次点变「再点一次确认」，3 秒内再点才真正撤销；
           不弹原生 confirm，不打断手上的操作 */
        const btn = event.target;
        if (btn.dataset.confirming !== '1') {
            btn.dataset.confirming = '1';
            btn.dataset.origText = btn.textContent;
            btn.textContent = '再点一次确认';
            btn.classList.add('confirming');
            setTimeout(function () {
                if (!btn.isConnected) return;
                btn.dataset.confirming = '0';
                btn.textContent = btn.dataset.origText || '撤销';
                btn.classList.remove('confirming');
            }, 3000);
            return;
        }

        /* 锁定后不可撤注（与下注同一道状态校验） */
        const myBet = allBetsData.find(b => b.id === betId);
        const myMatch = myBet ? allMatchesData.find(m => m.id === myBet.match_id) : null;
        if (myMatch && matchBetState(myMatch) !== 'bettable') {
            HWLayout.toast('比赛已锁定或已结算，预测不可撤销', 'err');
            return;
        }
        const { error } = await supabaseClient.from(betsTable()).delete().eq('id', betId);
        if (error) { HWLayout.toast('撤销失败: ' + error.message); return; }
        
        HWLayout.toast('撤销成功！');
        await initializePage();
        
        if (betModal.classList.contains('visible')) {
            const betModalHeader = document.getElementById('bet-modal-header');
            const matchIdFromModal = allMatchesData.find(m => `${m.team_a} vs ${m.team_b}` === betModalHeader.textContent)?.id;
            if (matchIdFromModal) {
                 const match = allMatchesData.find(m => m.id === matchIdFromModal);
                 loadAndRenderExistingBets(matchIdFromModal, match.group);
            }
        }
    }
    

    function showHistory(userId, username) {
        const historyModal = document.getElementById('history-modal');
        document.getElementById('history-modal-header').textContent = `${username}的预测记录`;
        const historyBody = document.getElementById('history-table-body');
        historyBody.innerHTML = '<tr><td colspan="6" style="color:var(--smoke);">计算中...</td></tr>';
        
        const userBets = allBetsData.filter(b => b.user_id === userId).sort((a,b) => new Date(b.created_at) - new Date(a,b));
        
        if (userBets.length === 0) { historyBody.innerHTML = '<tr><td colspan="6" style="color:var(--smoke);">暂无记录</td></tr>'; historyModal.classList.add('visible'); return; }

        historyBody.innerHTML = userBets.map(bet => {
            const match = allMatchesData.find(m => m.id === bet.match_id);
            let status = '待结算', settlement = 'N/A', odds = 'N/A', color = 'var(--mist)';
            if (match && match.score_a !== null && match.score_b !== null && match.score_a !== match.score_b) {
                const winner = match.score_a > match.score_b ? match.team_a : match.team_b;
                const betsForMatch = allBetsData.filter(b => b.match_id === match.id);
                const betsOnA = betsForMatch.filter(b => b.predicted_winner === match.team_a).reduce((s, b) => s + b.amount, 0);
                const betsOnB = betsForMatch.filter(b => b.predicted_winner === match.team_b).reduce((s, b) => s + b.amount, 0);
                const poolA = 100 + betsOnA, poolB = 100 + betsOnB;

                if (bet.predicted_winner === winner) {
                    status = '胜利';
                    const winnerPool = winner === match.team_a ? poolA : poolB;
                    const loserPool = winner === match.team_a ? poolB : poolA;
                    const profit = Math.ceil((bet.amount / winnerPool) * loserPool);
                    odds = ((bet.amount + profit) / bet.amount).toFixed(2);
                    settlement = `+${profit}`;
                    color = 'var(--success-green)';
                } else {
                    status = '失败';
                    odds = (bet.predicted_winner === match.team_a ? (poolA+poolB)/poolA : (poolA+poolB)/poolB).toFixed(2);
                    settlement = `-${bet.amount}`;
                    color = 'var(--ash)';
                }
            }
            return `<tr>
                <td>${match ? `${match.team_a} vs ${match.team_b}`: '未知比赛'}</td>
                <td style="color:var(--mist); font-weight:700;">${bet.predicted_winner}</td><td>${bet.amount}</td><td>${odds}</td>
                <td>${status}</td><td style="color:${color}; font-weight:700;">${settlement}</td>
            </tr>`;
        }).join('');
        historyModal.classList.add('visible');
    }

    function showLeaderboard() {
        const leaderboardBody = document.getElementById('leaderboard-table-body');
        const sortedUsers = [...allUsersData].sort((a,b) => b.balance - a.balance);

        const usersWithStats = sortedUsers.map(user => {
            const userBets = allBetsData.filter(b => b.user_id === user.id);
            const totalPredictions = userBets.length;
            let correctPredictions = 0;
            let settledPredictions = 0;

            userBets.forEach(bet => {
                const match = allMatchesData.find(m => m.id === bet.match_id);
                if (match && match.score_a !== null && match.score_b !== null && match.score_a !== match.score_b) {
                    settledPredictions++;
                    const winner = match.score_a > match.score_b ? match.team_a : match.team_b;
                    if (bet.predicted_winner === winner) {
                        correctPredictions++;
                    }
                }
            });

            const accuracy = settledPredictions > 0 ? ((correctPredictions / settledPredictions) * 100) : 0;
            return { ...user, predictionCount: totalPredictions, accuracy };
        });

        leaderboardBody.innerHTML = usersWithStats.map((user, index) => `
            <tr>
                <td style="color:var(--smoke); font-weight:700;">${index + 1}</td>
                <td class="username-cell" data-user-id="${user.id}" data-username="${user.username}">${user.username}</td>
                <td style="color:var(--mist); font-weight:700;">${Math.round(user.balance)}</td>
                <td>${user.predictionCount}</td>
                <td style="color:var(--success-green); font-weight:700;">${user.accuracy.toFixed(1)}%</td>
            </tr>
        `).join('');

        document.querySelectorAll('.username-cell').forEach(cell => {
            cell.addEventListener('click', (e) => {
                const userId = parseInt(e.target.dataset.userId);
                const username = e.target.dataset.username;
                showHistory(userId, username);
            });
        });
    }

    function toggleView() {
        const isShowingLeaderboard = leaderboardSection.style.display === 'block';
        if (isShowingLeaderboard) {
            leaderboardSection.style.display = 'none';
            mainContent.style.display = 'flex';
            mainTitle.textContent = '赛事预测';
            toggleViewBtn.textContent = '查 看 预 测 排 名';
        } else {
            showLeaderboard();
            leaderboardSection.style.display = 'block';
            mainContent.style.display = 'none';
            mainTitle.textContent = '预测积分排名';
            toggleViewBtn.textContent = '返 回 比 赛 列 表';
        }
    }


    // 统一账号：初始化会话并探测账号表（升级前用旧表，升级后自动切新表）
    HWAuth.init();
    HWAuth.detectAccountSource().catch(() => {}).finally(() => {
        // 活动上下文：先于首屏加载解析（赛季随之锁定），再初始化页面
        HWLayout.resolveEvent().then(function (ev) {
            boundEv = ev;
            if (ev) {
                var key = HWLayout.seasonKey(ev);
                currentSeason = key;
                HWLayout.access(key, ev).then(function (perms) {
                    HWLayout.eventBar({ event: ev, perms: perms });
                });
            } else {
                HWLayout.eventBar({ event: null });
            }
            return initializePage();
        });
    });
});
</script>
