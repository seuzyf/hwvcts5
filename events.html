<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HWVCTS — 活动大厅</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <style>
        .tabs { display: flex; gap: 6px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
        .tab-btn {
            padding: 10px 16px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            color: var(--ash);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease;
        }
        .tab-btn:hover { color: var(--pure-white); }
        .tab-btn.active { color: var(--pure-white); border-bottom-color: var(--coral-pulse); }
        .tab-badge {
            display: inline-block; min-width: 17px; padding: 0 5px; margin-left: 6px;
            border-radius: 9px; background: var(--graphite); color: var(--mist);
            font-family: var(--font-mono); font-size: 11px; line-height: 17px; text-align: center;
        }

        /* 小红书式错位信息流（CSS columns 瀑布流 + 混合比例封面） */
        .events-grid { column-count: 3; column-gap: 16px; }
        @media (max-width: 1080px) { .events-grid { column-count: 2; } }
        @media (max-width: 620px) { .events-grid { column-count: 1; } }

        .event-card {
            display: inline-block; width: 100%;
            break-inside: avoid; -webkit-column-break-inside: avoid;
            margin: 0 0 16px;
            background: var(--ink);
            border-radius: var(--r-card);
            box-shadow: var(--key-shadow);
            cursor: pointer;
            overflow: hidden;
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        .event-card:hover { box-shadow: var(--key-shadow-hover); transform: translateY(-3px); }

        .ev-cover { position: relative; width: 100%; overflow: hidden; }
        .ev-cover.r34 { aspect-ratio: 3 / 4; }
        .ev-cover.r11 { aspect-ratio: 1 / 1; }
        .ev-cover.r43 { aspect-ratio: 4 / 3; }
        .ev-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.35s ease; }
        .event-card:hover .ev-cover img { transform: scale(1.05); }
        .ev-cover .ev-emoji-fb {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 56px;
            background:
                radial-gradient(120% 90% at 20% 0%, rgba(255, 99, 99, 0.16), transparent 55%),
                linear-gradient(150deg, var(--graphite), var(--obsidian));
        }
        .ev-cover .ev-cover-tags {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; gap: 6px; flex-wrap: wrap; z-index: 1;
        }
        .ev-cover .ev-cover-tags .badge { box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35); }
        .ev-body { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 16px; }
        .ev-title { margin: 0; font-size: 16px; font-weight: 600; color: var(--pure-white); letter-spacing: 0.2px; line-height: 1.4; }
        .ev-desc {
            font-size: 14px; color: var(--ash); line-height: 1.6; margin: 0;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .ev-meta { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--smoke); }
        .ev-foot {
            display: flex; align-items: center; gap: 14px;
            padding-top: 10px; border-top: 1px solid rgba(54, 55, 57, 0.6);
        }
        .slot-bar { flex: 1; }
        .slot-text { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; color: var(--smoke); margin-bottom: 5px; text-transform: uppercase; }
        .slot-track { height: 4px; background: var(--obsidian); border-radius: 2px; overflow: hidden; }
        .slot-fill { height: 100%; background: var(--mist); border-radius: 2px; transition: width 0.4s ease; }
        .slot-fill.full { background: var(--coral-pulse); }

        /* 详情弹窗封面横幅 */
        .detail-cover { margin: -28px -28px 16px; overflow: hidden; border-radius: var(--r-card-lg) var(--r-card-lg) 0 0; }
        .detail-cover img { width: 100%; height: 190px; object-fit: cover; display: block; }

        /* 活动空间 tiles（工作区：图标 + 文字 + 权限徽章留白） */
        #ev-workspace { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
        #ev-workspace .tile {
            display: flex; align-items: center; gap: 10px;
            min-width: 130px; padding: 10px 14px;
            background: var(--ink); border-radius: var(--r-card); box-shadow: var(--key-shadow);
            text-decoration: none; color: var(--mist);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        #ev-workspace .tile:hover { transform: translateY(-2px); box-shadow: var(--key-shadow-hover); }
        #ev-workspace .t-name { font-size: 15px; font-weight: 600; color: var(--pure-white); }
        #ev-workspace .badge { align-self: center; margin-left: 4px; }

        /* Mine list */
        .mine-list { display: flex; flex-direction: column; gap: 10px; }
        .mine-item {
            display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
            padding: 16px 18px;
            background: var(--ink);
            border-radius: var(--r-card);
            box-shadow: var(--key-shadow);
        }
        .mine-info { flex: 1; min-width: 200px; }
        .mine-info .t { font-size: 15px; font-weight: 500; color: var(--pure-white); }
        .mine-info .s { font-size: 13px; color: var(--smoke); margin-top: 3px; }
        .mine-ops { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        /* Detail modal bits */
        .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 16px 0; }
        .meta-cell { background: var(--obsidian); border: 1px solid var(--border); border-radius: var(--r-btn); padding: 9px 11px; }
        .meta-cell .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--smoke); }
        .meta-cell .v { font-size: 14px; font-weight: 500; color: var(--mist); margin-top: 3px; }
        .desc-block {
            font-size: 14px; color: var(--ash); white-space: pre-line; line-height: 1.7;
            background: var(--obsidian); border: 1px solid var(--border);
            border-radius: var(--r-btn); padding: 13px 15px;
        }
        .roster-list { list-style: none; margin: 0; padding: 0; max-height: 230px; overflow-y: auto; }
        .roster-list li {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 4px; border-bottom: 1px solid rgba(54, 55, 57, 0.5);
            font-size: 14px;
        }
        .roster-list li:last-child { border-bottom: none; }
        .roster-list .team { font-weight: 500; color: var(--pure-white); flex: 1; }
        .roster-list .who { color: var(--smoke); font-size: 13px; }
        .mini-btn {
            font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
            padding: 4px 9px; border-radius: var(--r-badge);
            border: 1px solid var(--border); background: transparent;
            color: var(--ash); cursor: pointer;
        }
        .mini-btn:hover { background: var(--graphite); color: var(--pure-white); }
        .mini-btn.ok { border-color: rgba(89, 212, 153, 0.4); color: var(--success-green); }
        .mini-btn.no { border-color: rgba(255, 99, 99, 0.4); color: #ff8f8f; }

        .my-reg-box {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding: 13px 15px; margin-top: 16px;
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: var(--r-btn);
            font-size: 14px; color: var(--ash);
        }
        .section-label {
            font-family: var(--font-mono); font-size: 12px; font-weight: 500;
            letter-spacing: 0.06em; text-transform: uppercase; color: var(--smoke);
            margin: 20px 0 8px;
        }
        .modal-note { font-family: var(--font-mono); font-size: 11px; color: var(--smoke); text-align: center; margin-top: 16px; letter-spacing: 0.03em; }
        .admin-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .admin-row .select { width: auto; flex: 1; min-width: 150px; }
    
        /* 创建活动 · 参赛队伍勾选 */
        .team-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .team-chips label { cursor: pointer; position: relative; }
        .team-chips input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .team-chips span {
            display: inline-flex; align-items: center; padding: 6px 13px;
            border: 1px solid var(--border); border-radius: 999px;
            font-size: 13px; color: var(--ash); background: var(--obsidian); transition: 0.15s;
        }
        .team-chips label:hover span { border-color: var(--smoke); color: var(--pure-white); }
        .team-chips input:checked + span {
            border-color: var(--coral-pulse); color: var(--coral-pulse);
            background: var(--ember-hush); font-weight: 600;
        }
        .team-chips input:focus-visible + span { outline: 2px solid var(--info-blue); outline-offset: 2px; }
        .team-chips .empty-hint { font-size: 13px; color: var(--smoke); }
</style>
</head>
<body data-page="events">
    <main class="page">
        <div class="container">
            <header class="page-header">
                <span class="eyebrow">Events</span>
                <h1 class="page-title">活动大厅</h1>
            </header>

            <div class="tabs">
                <button class="tab-btn active" data-tab="hall" type="button">活动大厅</button>
                <button class="tab-btn" data-tab="mine" type="button">我的报名<span class="tab-badge" id="mine-badge" style="display:none;">0</span></button>
            </div>

            <div class="filter-bar" id="filter-bar">
                <div class="seg" id="status-filter">
                    <button class="active" data-status="all" type="button">全部</button>
                    <button data-status="registration" type="button">报名中</button>
                    <button data-status="ongoing" type="button">进行中</button>
                    <button data-status="finished" type="button">已结束</button>
                </div>
                <div style="flex:1"></div>
                <button class="btn btn-ghost" id="apply-ev-btn" style="display:none;" type="button">申请举办活动</button>
                <button class="btn btn-primary" id="create-ev-btn" style="display:none;" type="button">＋ 创建活动</button>
            </div>

            <div id="main-content"><div class="empty-state">正在加载活动…</div></div>
        </div>
    </main>

    <!-- 活动详情 -->
    <div class="modal-backdrop" id="detail-modal">
        <div class="modal-panel wide" id="detail-panel" role="dialog" aria-modal="true"></div>
    </div>

    <!-- 申请举办活动 -->
    <div class="modal-backdrop" id="apply-modal">
        <div class="modal-panel">
            <button class="modal-close" data-close="apply-modal" type="button" aria-label="关闭">&times;</button>
            <span class="eyebrow">Organizer</span>
            <h3 class="modal-title" style="margin-top:8px;">申请举办活动</h3>
            <p class="muted" style="font-size:13px; margin:8px 0 14px;">提交申请，管理员审核通过后你将获得「活动组织者」身份，可创建并管理自己的活动。</p>
            <label class="form-label" for="apply-reason">申请理由（可选）</label>
            <textarea class="textarea" id="apply-reason" rows="4" maxlength="300" placeholder="想举办什么样的活动？"></textarea>
            <div class="modal-actions">
                <button class="btn btn-ghost" type="button" data-close="apply-modal">取消</button>
                <button class="btn btn-primary" id="apply-submit" type="button">提交申请</button>
            </div>
        </div>
    </div>

    <!-- 创建活动 -->
    <div class="modal-backdrop" id="create-modal">
        <div class="modal-panel wide">
            <button class="modal-close" data-close="create-modal" type="button" aria-label="关闭">&times;</button>
            <span class="eyebrow">Admin</span>
            <h3 class="modal-title" style="margin-top:8px;">创建活动</h3>
            <form id="create-form">
                <div class="form-row">
                    <div class="full">
                        <label class="form-label" for="cf-title">活动标题 *</label>
                        <input class="input" id="cf-title" required maxlength="40" placeholder="例如：S6 冬季杯">
                    </div>
                    <div>
                        <label class="form-label" for="cf-type">类型</label>
                        <select class="select" id="cf-type">
                            <option value="tournament">赛事 tournament</option>
                            <option value="scrim">训练赛 scrim</option>
                            <option value="showmatch">表演赛 showmatch</option>
                            <option value="activity">活动 activity</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label" for="cf-season">赛季</label>
                        <input class="input" id="cf-season" value="S6" maxlength="10">
                    </div>
                    <div>
                        <label class="form-label" for="cf-status">状态</label>
                        <select class="select" id="cf-status">
                            <option value="registration">报名中</option>
                            <option value="draft">草稿（先不公开）</option>
                            <option value="ongoing">进行中</option>
                            <option value="finished">已结束</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label" for="cf-slots">名额上限（空 = 不限）</label>
                        <input class="input" id="cf-slots" type="number" min="1" placeholder="16">
                    </div>
                    <div>
                        <label class="form-label" for="cf-start">开始时间</label>
                        <input class="input" id="cf-start" type="datetime-local">
                    </div>
                    <div>
                        <label class="form-label" for="cf-end">结束时间</label>
                        <input class="input" id="cf-end" type="datetime-local">
                    </div>
                    <div class="full">
                        <label class="form-label" for="cf-deadline">报名截止</label>
                        <input class="input" id="cf-deadline" type="datetime-local">
                    </div>
                    <div>
                        <label class="form-label" for="cf-format">赛制</label>
                        <select class="select" id="cf-format">
                            <option value="单循环 · BO1">单循环 · BO1</option>
                            <option value="单循环 · BO3" selected>单循环 · BO3</option>
                            <option value="单循环 · BO5">单循环 · BO5</option>
                            <option value="双循环 · BO3">双循环 · BO3</option>
                            <option value="分组循环 · BO3">分组循环 · BO3</option>
                            <option value="双败淘汰 · BO3">双败淘汰 · BO3</option>
                            <option value="单败淘汰 · BO1">单败淘汰 · BO1</option>
                            <option value="单败淘汰 · BO3">单败淘汰 · BO3</option>
                            <option value="单败淘汰 · BO5">单败淘汰 · BO5</option>
                            <option value="分组+淘汰 · BO3">分组+淘汰 · BO3</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label" for="cf-groups">分组数量</label>
                        <select class="select" id="cf-groups">
                            <option value="1">1 组（不分组）</option>
                            <option value="2">2 组</option>
                            <option value="3" selected>3 组（传奇 / 中坚 / 挑战）</option>
                            <option value="4">4 组</option>
                            <option value="5">5 组</option>
                            <option value="6">6 组</option>
                        </select>
                    </div>
                    <div class="full">
                        <label class="form-label" for="cf-venue">地点 / 房间说明</label>
                        <input class="input" id="cf-venue" maxlength="60" placeholder="自定义房间：HWVCT-XXX">
                    </div>
                    <div class="full">
                        <label class="form-label" for="cf-desc">活动简介</label>
                        <textarea class="textarea" id="cf-desc" rows="3" maxlength="400" placeholder="这场活动是做什么的？"></textarea>
                    </div>
                    <div class="full">
                        <label class="form-label" for="cf-rules">赛制 / 规则</label>
                        <textarea class="textarea" id="cf-rules" rows="3" maxlength="400" placeholder="BO3 单败、迟到判负……"></textarea>
                    </div>
                </div>
                <div class="form-row">
                    <div class="full">
                        <label class="form-label" for="cf-stream">直播链接（选填）</label>
                        <input class="input" id="cf-stream" type="url" maxlength="300" placeholder="https://live.example.com/…">
                    </div>
                </div>
                <div class="form-row">
                    <div class="full">
                        <label class="form-label" for="cf-cover">封面图片（选填 · 用作卡片封面）</label>
                        <input class="input" id="cf-cover" type="file" accept="image/*" style="height:auto; padding:9px 12px;">
                        <img id="cf-cover-preview" alt="" style="display:none; width:100%; max-height:150px; object-fit:cover; border-radius:10px; margin-top:8px;">
                        <div style="font-size: 13px; color:var(--smoke); margin-top:6px;">jpg / png / webp，≤ 2MB；不上传则卡片显示封面图标（emoji）</div>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-ghost" type="button" data-close="create-modal">取消</button>
                    <button class="btn btn-primary" id="cf-submit" type="submit">创建</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 管理员验证 -->
    <div class="modal-backdrop" id="admin-modal">
        <div class="modal-panel" style="max-width:400px;">
            <button class="modal-close" data-close="admin-modal" type="button" aria-label="关闭">&times;</button>
            <span class="eyebrow">Admin Gate</span>
            <h3 class="modal-title" style="margin-top:8px;">管理员验证</h3>
            <label class="form-label" for="admin-pwd">管理口令</label>
            <input class="input" id="admin-pwd" type="password" placeholder="输入管理口令以创建 / 审核活动">
            <div class="modal-actions">
                <button class="btn btn-ghost" type="button" data-close="admin-modal">取消</button>
                <button class="btn btn-primary" id="admin-verify-btn" type="button">验证</button>
            </div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        var EV_STATUS = { draft: '草稿', registration: '报名中', ongoing: '进行中', finished: '已结束', cancelled: '已取消' };
        var REG_STATUS = { pending: '待审核', approved: '已通过', rejected: '未通过', cancelled: '已撤回', waitlist: '候补中' };
        var TYPE_LABEL = { tournament: '赛事', scrim: '训练赛', showmatch: '表演赛', activity: '活动' };
        var EV_BADGE = { draft: 'badge-quiet', registration: 'badge-coral', ongoing: 'badge-green', finished: 'badge-quiet', cancelled: 'badge-quiet' };
        var REG_BADGE = { pending: 'badge-gold', approved: 'badge-green', rejected: 'badge-quiet', cancelled: 'badge-quiet', waitlist: 'badge-coral' };

        var allEvents = [], allRegs = [], userMap = {};
        var currentTab = 'hall', currentFilter = 'all', tableMissing = false;
        var ADMIN_TTL = 15 * 60 * 1000;
        var main = document.getElementById('main-content');
        var createBtn = document.getElementById('create-ev-btn');

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        function fmtTime(t) {
            if (!t) return '待定';
            var d = new Date(t);
            if (isNaN(d)) return '待定';
            return d.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }
        function isAdmin() {
            var t = parseInt(sessionStorage.getItem('hw_admin_verified_at') || '0', 10);
            return (t > 0 && (Date.now() - t) < ADMIN_TTL) ||
                   (typeof HWLayout !== 'undefined' && HWLayout.isAdminNow());
        }

        function isOrganizerRole() {
            var u = (typeof HWAuth !== 'undefined') ? HWAuth.getSession() : null;
            return !!(u && u.role === 'organizer');
        }
        function evOrganizer(ev) {
            var u = (typeof HWAuth !== 'undefined') ? HWAuth.getSession() : null;
            return !!(ev && u && ev.organizer_id != null && String(ev.organizer_id) === String(u.id));
        }
        function canManageEv(ev) { return isAdmin() || evOrganizer(ev); }

        /* 活动空间入口（权限感知：分队=队长/管理员，管理=管理员） */
        function renderWorkspace(ev) {
            var host = document.getElementById('ev-workspace');
            if (!host || typeof HWLayout === 'undefined') return;
            function paint(perms) {
                perms = perms || {};
                var entries = [
                    ['register.html?event=' + ev.id, 'clipboard-list', '报名'],
                    ['schedule.html?event=' + ev.id, 'calendar', '赛程'],
                    ['matches.html?event=' + ev.id, 'gamepad', '比赛'],
                    ['summary.html?event=' + ev.id, 'chart-column', '数据'],
                    ['betting.html?event=' + ev.id, 'target', '竞猜'],
                    ['lottery.html?event=' + ev.id, 'gift', '抽奖']
                ];
                if (perms.isCaptain || perms.isAdmin) entries.push(['draft.html?event=' + ev.id, 'users', '分队']);
                if (perms.isAdmin || perms.isEventCaptain) entries.push(['manage.html?event=' + ev.id, 'shield-check', '管理']);
                host.innerHTML = entries.map(function (t) {
                    return '<a class="tile" href="' + t[0] + '">' +
                        '<span class="icon-circle" style="width:34px;height:34px;">' + HWLayout.ico(t[1], 17) + '</span>' +
                        '<span class="t-name">' + t[2] + '</span></a>';
                }).join('') +
                (perms.isAdmin ? '<span class="badge badge-coral">ADMIN</span>'
                 : (perms.isCaptain || perms.isEventCaptain) ? '<span class="badge badge-blue">CAPTAIN</span>' : '');
            }
            paint({}); // 先渲染基础四块：权限查询慢/失败也绝不卡「加载中」
            HWLayout.access(HWLayout.seasonKey(ev), ev).then(paint)
                .catch(function () { /* 基础块已在，保持即可 */ });
        }

        /* ---------- data ---------- */
        function loadData() {
            var sb = HWAuth.getClient();
            return Promise.all([
                sb.from('events').select('*').order('start_time', { ascending: true, nullsFirst: false }),
                sb.from('event_registrations').select('*').order('created_at', { ascending: false }),
                sb.from('site_users').select('id, username, nickname')
            ]).then(function (rs) {
                var errs = [rs[0].error, rs[1].error, rs[2].error];
                if (errs.some(function (e) { return e && HWAuth.isMissingTable(e); })) { tableMissing = true; return; }
                if (errs[0] || errs[1]) throw errs[0] || errs[1];
                tableMissing = false;
                allEvents = rs[0].data || [];
                allRegs = rs[1].data || [];
                userMap = {};
                (rs[2].data || []).forEach(function (u) { userMap[u.id] = u; });
            });
        }

        function activeRegsOf(eventId) {
            return allRegs.filter(function (r) {
                return r.event_id === eventId && (r.status === 'pending' || r.status === 'approved');
            });
        }
        function myRegOf(eventId) {
            var u = HWAuth.getSession();
            if (!u) return null;
            return allRegs.find(function (r) {
                return r.event_id === eventId && r.user_id === u.id && r.status !== 'cancelled';
            }) || null;
        }

        /* ---------- render ---------- */
        function render() {
            if (typeof HWLayout !== 'undefined') HWLayout.renderAuth();
            updateTabs();
            updateAdminUI();
            if (currentTab === 'mine') renderMine();
            else renderHall();
        }

        function updateTabs() {
            var u = HWAuth.getSession();
            var badge = document.getElementById('mine-badge');
            if (u) {
                var n = allRegs.filter(function (r) { return r.user_id === u.id && r.status !== 'cancelled'; }).length;
                badge.textContent = n;
                badge.style.display = n > 0 ? 'inline-block' : 'none';
            } else badge.style.display = 'none';
        }

        function updateAdminUI() {
            var u = (typeof HWAuth !== 'undefined') ? HWAuth.getSession() : null;
            createBtn.style.display = (isAdmin() || isOrganizerRole()) ? 'inline-flex' : 'none';
            var applyBtn = document.getElementById('apply-ev-btn');
            if (applyBtn) {
                applyBtn.style.display = (u && !isAdmin() && !isOrganizerRole()) ? 'inline-flex' : 'none';
            }
        }

        function renderMissing() {
            main.innerHTML =
                '<div class="card" style="text-align:center; padding:48px 24px;">' +
                '<span class="eyebrow">Setup Required</span>' +
                '<h2 style="font-weight:400; color:var(--pure-white); margin:12px 0 10px;">数据库尚未升级</h2>' +
                '<p class="muted" style="font-size: 15px; max-width:540px; margin:0 auto 20px; line-height:1.8;">' +
                '活动大厅依赖新表 <span class="mono" style="color:var(--mist)">events / event_registrations / site_users</span>。<br>' +
                '请在 Supabase SQL Editor 整段执行 <span class="mono" style="color:var(--mist)">supabase/schema.sql</span> 后刷新。' +
                '执行前可先使用旧版入口：</p>' +
                '<div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">' +
                '  <a class="btn btn-ghost" href="matches.html">比赛中心</a>' +
                '  <a class="btn btn-ghost" href="summary.html">选手数据</a>' +
                '  <a class="btn btn-ghost" href="betting.html">赛事预测</a>' +
                '  <a class="btn btn-ghost" href="schedule.html">赛程中心</a>' +
                '</div><br>' +
                '<button class="btn btn-primary" id="reload-btn" type="button">已执行，刷新</button>' +
                '</div>';
            document.getElementById('reload-btn').addEventListener('click', function () { location.reload(); });
        }

        function renderHall() {
            if (tableMissing) { renderMissing(); return; }
            var list = allEvents.filter(function (ev) {
                /* 草稿 / 已取消：任何人在赛事中心都不展示（管理入口在管理后台） */
                if (ev.status === 'draft' || ev.status === 'cancelled') return false;
                return currentFilter === 'all' || ev.status === currentFilter;
            });
            if (list.length === 0) {
                main.innerHTML = '<div class="empty-state">该筛选条件下暂无活动。</div>';
                return;
            }
            main.innerHTML = '<div class="events-grid">' + list.map(function (ev) {
                var regs = activeRegsOf(ev.id);
                var slots = ev.max_slots;
                var pct = slots ? Math.min(100, Math.round(regs.length / slots * 100)) : 0;
                var full = slots && regs.length >= slots;
                var mine = myRegOf(ev.id);

                var mineBadge = '';
                if (mine) {
                    mineBadge = mine.status === 'approved'
                        ? '<span class="badge badge-green">✓ 已报名</span>'
                        : '<span class="badge badge-gold">已提交报名</span>';
                }

                var ratio = ['r34', 'r11', 'r43'][(ev.id || 0) % 3];
                var coverInner = ev.cover_image
                    ? '<img src="' + esc(ev.cover_image) + '" alt="" loading="lazy">'
                    : '<span class="ev-emoji-fb">' + HWLayout.ico('trophy', 30) + '</span>';
                var tags =
                    '<span class="badge badge-quiet">' + esc(TYPE_LABEL[ev.event_type] || ev.event_type) + '</span>' +
                    '<span class="badge ' + (EV_BADGE[ev.status] || '') + '">' + (EV_STATUS[ev.status] || ev.status) + '</span>' +
                    mineBadge;

                return '<article class="event-card" data-id="' + ev.id + '" tabindex="0">' +
                    '<div class="ev-cover ' + ratio + '">' + coverInner +
                    '  <div class="ev-cover-tags">' + tags + '</div>' +
                    '</div>' +
                    '<div class="ev-body">' +
                    '  <h3 class="ev-title">' + esc(ev.title) + '</h3>' +
                    '  <p class="ev-desc">' + esc(ev.description || '暂无简介') + '</p>' +
                    '  <div class="ev-meta">' +
                    '    <span>' + fmtTime(ev.start_time) + (ev.season ? ' · ' + esc(ev.season) : '') + '</span>' +
                    (ev.reg_deadline ? '<span>报名截止 ' + fmtTime(ev.reg_deadline) + '</span>' : '') +
                    (ev.venue ? '<span>' + esc(ev.venue) + '</span>' : '') +
                    '  </div>' +
                    '  <div class="ev-foot">' +
                    '    <div class="slot-bar">' +
                    '      <div class="slot-text">' + (slots ? (full ? '名额已满' : regs.length + ' / ' + slots + ' 已报名') : regs.length + ' 已报名 · 不限') + '</div>' +
                    '      <div class="slot-track"><div class="slot-fill' + (full ? ' full' : '') + '" style="width:' + (slots ? pct : Math.min(100, regs.length * 8)) + '%"></div></div>' +
                    '    </div>' +
                    '    <span class="btn btn-ghost btn-sm" style="pointer-events:none;">详情</span>' +
                    '  </div>' +
                    '</div>' +
                '</article>';
            }).join('') + '</div>';

            main.querySelectorAll('.event-card').forEach(function (card) {
                var open = function () { openDetail(parseInt(card.dataset.id, 10)); };
                card.addEventListener('click', open);
                card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
            });
        }

        function renderMine() {
            if (tableMissing) { renderMissing(); return; }
            var u = HWAuth.getSession();
            if (!u) {
                main.innerHTML = '<div class="empty-state">登录后查看我的报名。<br><br>' +
                    '<button class="btn btn-primary" id="mine-login" type="button">登录 / 注册</button></div>';
                document.getElementById('mine-login').addEventListener('click', function () {
                    HWAuth.openModal({ stay: true }).then(render).catch(function () {});
                });
                return;
            }
            var mine = allRegs.filter(function (r) { return r.user_id === u.id; });
            if (mine.length === 0) {
                main.innerHTML = '<div class="empty-state">你还没有报名任何活动。<br><br>' +
                    '<button class="btn btn-primary" id="go-hall" type="button">去活动大厅看看</button></div>';
                document.getElementById('go-hall').addEventListener('click', function () { switchTab('hall'); });
                return;
            }
            main.innerHTML = '<div class="mine-list">' + mine.map(function (r) {
                var ev = allEvents.find(function (e) { return e.id === r.event_id; }) || {};
                var canCancel = r.status === 'pending' || r.status === 'approved' || r.status === 'waitlist';
                return '<div class="mine-item">' +
                    '<span class="icon-circle">' + (ev.cover_image ? '<img src="' + esc(ev.cover_image) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">' : HWLayout.ico('clipboard-list', 16)) + '</span>' +
                    '<div class="mine-info">' +
                    '  <div class="t">' + esc(ev.title || '（活动已删除）') + '</div>' +
                    '  <div class="s">报名于 ' + fmtTime(r.created_at) +
                    (r.team_name ? ' · 战队「' + esc(r.team_name) + '」' : ' · 待分队') +
                    (ev.start_time ? ' · 活动 ' + fmtTime(ev.start_time) : '') + '</div>' +
                    '</div>' +
                    '<div class="mine-ops">' +
                    '  <span class="badge ' + (REG_BADGE[r.status] || '') + '">' + (REG_STATUS[r.status] || r.status) + '</span>' +
                    (ev.id ? '<button class="btn btn-ghost btn-sm" data-detail="' + ev.id + '" type="button">活动详情</button>' : '') +
                    (canCancel ? '<button class="btn btn-danger-ghost btn-sm" data-cancel="' + r.id + '" type="button">撤回</button>' : '') +
                    '</div>' +
                '</div>';
            }).join('') + '</div>';

            main.querySelectorAll('[data-detail]').forEach(function (b) {
                b.addEventListener('click', function () { openDetail(parseInt(b.dataset.detail, 10)); });
            });
            main.querySelectorAll('[data-cancel]').forEach(function (b) {
                b.addEventListener('click', function () { cancelReg(parseInt(b.dataset.cancel, 10)); });
            });
        }

        /* ---------- detail ---------- */
        function openDetail(eventId) {
            var ev = allEvents.find(function (e) { return e.id === eventId; });
            if (!ev) return;
            var panel = document.getElementById('detail-panel');
            var u = HWAuth.getSession();
            var regs = activeRegsOf(ev.id);
            var mine = myRegOf(ev.id);
            var slots = ev.max_slots;
            var full = slots && regs.length >= slots;
            var deadlinePassed = ev.reg_deadline && new Date(ev.reg_deadline) < new Date();
            var canRegister = ev.status === 'registration' && !deadlinePassed && !full && !mine;

            var rosterHtml = regs.length === 0
                ? '<div class="empty-state" style="padding:20px 0;">暂无报名</div>'
                : '<ul class="roster-list">' + regs.slice().sort(function (a, b) {
                    return (a.status === 'approved' ? 0 : 1) - (b.status === 'approved' ? 0 : 1);
                }).map(function (r) {
                    var who = userMap[r.user_id] || {};
                    return '<li>' +
                        '<span class="badge ' + (REG_BADGE[r.status] || '') + '" style="min-width:62px; justify-content:center;">' + (REG_STATUS[r.status] || r.status) + '</span>' +
                        '<span class="team">' + esc(r.team_name || '待分队') + '</span>' +
                        '<span class="who">' + esc(who.username ? '@' + who.username : '') + (r.members && r.members.length ? ' · ' + r.members.length + ' 人' : '') + '</span>' +
                        '</li>';
                }).join('') + '</ul>';

            var myRegHtml = mine
                ? '<div class="my-reg-box">' +
                  '<span>我的报名：<strong style="color:' +
                  (mine.status === 'approved' ? 'var(--success-green)' : mine.status === 'pending' ? '#ffd700' : '#ff8f8f') +
                  '">' + (REG_STATUS[mine.status] || mine.status) + '</strong></span>' +
                  '<span class="smoke">战队 ' + esc(mine.team_name || '待分队') + '</span>' +
                  '<a class="mini-btn" href="register.html?event=' + ev.id + '">报名页 / 资料</a>' +
                  ((mine.status === 'pending' || mine.status === 'approved' || mine.status === 'waitlist')
                      ? '<button class="mini-btn no" data-cancel="' + mine.id + '" style="margin-left:auto;" type="button">撤回报名</button>' : '') +
                  '</div>'
                : '';

            var registerHtml;
            if (canRegister) {
                registerHtml = '<a class="btn btn-primary" href="register.html?event=' + ev.id + '" style="width:100%;">' +
                    (u ? '填写并报名 →' : '登录并报名 →') + '</a>';
            } else if (!mine) {
                registerHtml = '<div class="notice">' +
                    (ev.status !== 'registration' ? '当前状态（' + (EV_STATUS[ev.status] || ev.status) + '）不可报名。'
                     : deadlinePassed ? ('报名已于 ' + fmtTime(ev.reg_deadline) + ' 截止。')
                     : full ? '名额已满。' : '暂不可报名。') + '</div>';
            } else registerHtml = '';

            var adminHtml = canManageEv(ev)
                ? '<div class="section-label">管理（' + (isAdmin() ? '管理员' : '活动组织者') + '）</div>' +
                  '<div class="admin-row">' +
                  '  <select class="select" id="adm-status">' +
                       ['draft', 'registration', 'ongoing', 'finished', 'cancelled'].map(function (s) {
                           return '<option value="' + s + '"' + (ev.status === s ? ' selected' : '') + '>' + EV_STATUS[s] + '</option>';
                       }).join('') +
                  '  </select>' +
                  '  <button class="btn btn-ghost" id="adm-save-status" type="button">更新活动状态</button>' +
                  '  <a class="btn btn-ghost" href="review.html?event=' + ev.id + '">审核报名</a>' +
                  '  <input class="input" id="adm-stream" style="flex:1; min-width:180px;" placeholder="直播链接 URL" value="' + esc(ev.stream_url || '') + '">' +
                  '  <button class="btn btn-ghost" id="adm-stream-save" type="button">保存直播链接</button>' +
                  '  <button class="btn btn-ghost" id="adm-cover-btn" type="button">更换封面图</button>' +
                  (ev.cover_image ? '  <button class="btn btn-ghost" id="adm-cover-clear" type="button">移除封面</button>' : '') +
                  '  <input type="file" id="adm-cover-file" accept="image/*" style="display:none;">' +
                  '</div>' +
                  '<div class="admin-row" style="display:block; margin-top:14px; border-top:1px solid rgba(255,255,255,0.1); padding-top:14px;">' +
                  '  <span class="form-label">活动队长（数据台权限）</span>' +
                  '  <p class="muted" style="font-size:13px; margin:4px 0 10px;">队长登录后可在本活动页签进入「管理 · 数据台」录入赛程赛果；与本活动绑定，换活动需重新设置。</p>' +
                  '  <div id="captains-list" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;"><span class="muted">加载中…</span></div>' +
                  '  <div class="admin-row">' +
                  '    <select class="select" id="captain-player" style="flex:1; min-width:200px;"><option value="">选择选手（本活动赛季花名册）</option></select>' +
                  '    <button class="btn btn-ghost" id="captain-add" type="button">设为队长</button>' +
                  '    <a class="btn btn-ghost" id="captain-open-manage" href="#" style="display:none;">打开数据台 →</a>' +
                  '  </div>' +
                  '</div>'
                : '';

            var coverBanner = ev.cover_image
                ? '<div class="detail-cover"><img src="' + esc(ev.cover_image) + '" alt=""></div>'
                : '';
            panel.innerHTML =
                '<button class="modal-close" id="detail-close" type="button" aria-label="关闭">&times;</button>' +
                coverBanner +
                '<div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:6px;">' +
                (ev.cover_image ? '' : '  <span class="icon-circle" style="width:52px;height:52px;">' + HWLayout.ico('trophy', 24) + '</span>') +
                '  <div><span class="eyebrow">' + esc(TYPE_LABEL[ev.event_type] || ev.event_type) + (ev.season ? ' · ' + esc(ev.season) : '') + '</span>' +
                '  <h3 class="modal-title" style="font-size:20px; margin-top:4px;">' + esc(ev.title) + '</h3></div>' +
                '  <span class="badge ' + (EV_BADGE[ev.status] || '') + '" style="margin-left:auto;">' + (EV_STATUS[ev.status] || ev.status) + '</span>' +
                '</div>' +
                '<div class="meta-grid">' +
                '  <div class="meta-cell"><div class="k">开始时间</div><div class="v">' + fmtTime(ev.start_time) + '</div></div>' +
                '  <div class="meta-cell"><div class="k">报名截止</div><div class="v">' + (ev.reg_deadline ? fmtTime(ev.reg_deadline) : '不限') + '</div></div>' +
                '  <div class="meta-cell"><div class="k">赛制</div><div class="v">' + esc(ev.format || '—') + '</div></div>' +
                '  <div class="meta-cell"><div class="k">分组</div><div class="v">' + ((ev.group_count || 1) + ' 组') + '</div></div>' +
                (ev.stream_url ? '  <div class="meta-cell" style="grid-column:1/-1;"><div class="k">直播</div><div class="v"><a href="' + esc(ev.stream_url) + '" target="_blank" rel="noopener" style="color:var(--info-blue);">进入直播间 →</a></div></div>' : '') +
                (ev.teams ? '<div class="meta-cell" style="grid-column:1/-1;"><div class="k">参赛队伍</div><div class="v">' + esc(ev.teams) + '</div></div>' : '') +
                '  <div class="meta-cell"><div class="k">名额</div><div class="v">' + (slots ? regs.length + ' / ' + slots : regs.length + '（不限）') + '</div></div>' +
                (ev.venue ? '<div class="meta-cell" style="grid-column:1/-1;"><div class="k">地点 / 房间</div><div class="v">' + esc(ev.venue) + '</div></div>' : '') +
                '</div>' +
                (ev.description ? '<div class="desc-block">' + esc(ev.description) + '</div>' : '') +
                (ev.rules ? '<div class="section-label">赛制 / 规则</div><div class="desc-block">' + esc(ev.rules) + '</div>' : '') +
                '<div class="section-label">活动空间</div>' +
                '<div id="ev-workspace" class="tiles" style="margin-bottom:4px;">加载中…</div>' +
                '<div class="section-label" style="display:flex; align-items:center; gap:10px;">报名名单（' + regs.length + '）' +
                (isAdmin() ? '<a href="review.html?event=' + ev.id + '" style="font-size:12px; color:var(--info-blue);">审核报名 →</a>' : '') +
                '</div>' + rosterHtml +
                myRegHtml +
                (registerHtml ? '<div style="margin-top:18px;">' + registerHtml + '</div>' : '') +
                (ev.start_time ? '<div style="margin-top:14px;"><button class="btn btn-ghost btn-sm" id="ev-ics" type="button">导出 .ics 日历</button></div>' : '') +
                adminHtml;

            document.getElementById('detail-modal').classList.add('visible');
            document.getElementById('detail-close').addEventListener('click', closeDetail);
            var icsBtn = document.getElementById('ev-ics');
            if (icsBtn) icsBtn.addEventListener('click', function () {
                HWLayout.exportIcs('event-' + ev.id + '.ics', [{
                    title: ev.title,
                    start: ev.start_time || ev.reg_deadline,
                    end: ev.end_time || ev.start_time || ev.reg_deadline,
                    desc: (ev.format || '') + (ev.venue ? ' · ' + ev.venue : ''),
                    loc: ev.venue || ''
                }]);
            });
            renderWorkspace(ev);

            panel.querySelectorAll('[data-cancel]').forEach(function (b) {
                b.addEventListener('click', function () { cancelReg(parseInt(b.dataset.cancel, 10), eventId); });
            });

            var admStreamSave = document.getElementById('adm-stream-save');
            if (admStreamSave) admStreamSave.addEventListener('click', function () {
                var url = (document.getElementById('adm-stream').value || '').trim();
                HWAuth.getClient().from('events').update({ stream_url: url }).eq('id', ev.id)
                    .then(function (res) {
                        if (res.error) { HWLayout.toast('保存失败: ' + res.error.message, 'err'); return; }
                        ev.stream_url = url;
                        HWLayout.toast('直播链接已保存');
                        closeDetail();
                        refresh();
                    }).catch(function (e) { HWLayout.toast('保存失败', 'err'); });
            });
            var admSave = document.getElementById('adm-save-status');
            if (admSave) admSave.addEventListener('click', function () {
                var newStatus = document.getElementById('adm-status').value;
                HWAuth.getClient().from('events').update({ status: newStatus }).eq('id', ev.id)
                    .then(function (res) {
                        if (res.error) { HWLayout.toast('更新失败: ' + res.error.message); return; }
                        closeDetail();
                        refresh();
                    });
            });

            /* 管理员：活动队长设置（→ 该活动数据台权限） */
            var capList = document.getElementById('captains-list');
            if (capList) {
                var capIdTable = HWLayout.seasonKey(ev) + '_player_ids';
                var capRefresh = function () {
                    HWAuth.getClient().from('event_captains').select('*').eq('event_id', ev.id).order('created_at')
                        .then(function (res) {
                            var rows = (res && res.data) || [];
                            var openBtn = document.getElementById('captain-open-manage');
                            if (openBtn) { openBtn.style.display = rows.length ? 'inline-flex' : 'none'; openBtn.setAttribute('href', 'manage.html?event=' + ev.id); }
                            capList.innerHTML = rows.length ? rows.map(function (c) {
                                return '<span class="badge badge-blue" style="display:inline-flex; align-items:center; gap:6px; padding:6px 10px;">' +
                                    esc(c.player_name) +
                                    '<button type="button" data-cap="' + c.id + '" aria-label="移除队长" style="border:none;background:transparent;color:inherit;cursor:pointer;font-size:14px;line-height:1;">×</button></span>';
                            }).join('') : '<span class="muted">尚未设置队长。</span>';
                            Array.prototype.forEach.call(capList.querySelectorAll('button[data-cap]'), function (b) {
                                b.addEventListener('click', function () {
                                    HWLayout.confirmDialog({
                                        title: '移除队长',
                                        message: '确定移除该活动队长？移除后对方在分队页不再拥有队长权限。',
                                        okText: '移除', danger: true
                                    }).then(function (ok) {
                                        if (!ok) return;
                                        HWAuth.getClient().from('event_captains').delete().eq('id', b.dataset.cap)
                                            .then(function (r) { if (r && r.error) { HWLayout.toast(r.error.message); return; } capRefresh(); });
                                    });
                                });
                            });
                        }).catch(function () { capList.innerHTML = '<span class="muted">队长列表加载失败</span>'; });
                };
                var capSel = document.getElementById('captain-player');
                HWAuth.getClient().from(capIdTable).select('name').order('name')
                    .then(function (res) {
                        var names = ((res && res.data) || []).map(function (x) { return x.name; }).filter(Boolean);
                        capSel.innerHTML = '<option value="">选择选手（本活动赛季花名册）</option>' +
                            names.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('');
                    }).catch(function () {});
                var capAdd = document.getElementById('captain-add');
                if (capAdd) capAdd.addEventListener('click', function () {
                    var name = capSel.value;
                    if (!name) { HWLayout.toast('请先从花名册选择选手。'); return; }
                    HWAuth.getClient().from(capIdTable).select('id').eq('name', name).maybeSingle()
                        .then(function (r) {
                            var gid = (r && r.data && r.data.id) ? String(r.data.id) : '';
                            return HWAuth.getClient().from('event_captains').insert([{
                                event_id: ev.id, player_name: name, game_id: gid, added_by: 'admin'
                            }]);
                        })
                        .then(function (r2) {
                            if (r2 && r2.error) { HWLayout.toast('设置失败: ' + r2.error.message); return; }
                            capSel.value = ''; capRefresh();
                        })
                        .catch(function (e) { HWLayout.toast('设置失败: ' + (e && e.message ? e.message : e)); });
                });
                capRefresh();
            }

            /* 管理员：更换 / 移除封面图（Storage: event-covers） */
            var admCoverBtn = document.getElementById('adm-cover-btn');
            if (admCoverBtn) {
                var admCoverFile = document.getElementById('adm-cover-file');
                admCoverBtn.addEventListener('click', function () { admCoverFile.click(); });
                admCoverFile.addEventListener('change', function () {
                    var f = admCoverFile.files && admCoverFile.files[0];
                    if (!f) return;
                    if (!validateCover(f)) { admCoverFile.value = ''; return; }
                    uploadCover(f).then(function (url) {
                        return HWAuth.getClient().from('events').update({ cover_image: url }).eq('id', ev.id);
                    }).then(function (res) {
                        if (res.error) { HWLayout.toast('更新失败: ' + res.error.message); return; }
                        openDetail(ev.id);
                        refresh();
                    }).catch(function (e) { HWLayout.toast('封面上传失败: ' + (e.message || e)); });
                });
            }
            var admCoverClear = document.getElementById('adm-cover-clear');
            if (admCoverClear) admCoverClear.addEventListener('click', function () {
                HWAuth.getClient().from('events').update({ cover_image: '' }).eq('id', ev.id)
                    .then(function (res) {
                        if (res.error) { HWLayout.toast('更新失败: ' + res.error.message); return; }
                        openDetail(ev.id);
                        refresh();
                    });
            });
        }

        function closeDetail() { document.getElementById('detail-modal').classList.remove('visible'); }
        /* Phase 11：弹框不点空白关闭，仅手动 ×（closeDetail 由 × 绑定） */

        /* ---------- registration ops ---------- */
        function cancelReg(regId, keepDetailEventId) {
            HWLayout.confirmDialog({
                title: '撤回报名',
                message: '确定撤回这条报名？撤回后名额会释放给候补，且需要重新报名才能再次参赛。',
                okText: '撤回报名', danger: true
            }).then(function (ok) {
                if (!ok) return;
                doCancelReg(regId, keepDetailEventId);
            });
        }
        function doCancelReg(regId, keepDetailEventId) {
            HWAuth.getClient().from('event_registrations')
                .update({ status: 'cancelled', updated_at: new Date().toISOString() })
                .eq('id', regId)
                .select('event_id')
                .then(function (res) {
                    if (res.error) { HWLayout.toast('撤回失败: ' + res.error.message, 'err'); return; }
                    HWLayout.toast('报名已撤回');
                    /* P13h：撤销后候补递补 */
                    var row = res.data && res.data[0];
                    if (row && row.event_id) {
                        HWAuth.getClient().from('events').select('id, title, max_slots').eq('id', row.event_id).maybeSingle()
                            .then(function (er) {
                                if (er && !er.error && er.data) HWLayout.promoteWaitlist(er.data);
                            }).catch(function () {});
                    }
                    if (keepDetailEventId != null) closeDetail();
                    refresh();
                });
        }

        function requestAdminThen(fn) {
            if (isAdmin() || isOrganizerRole()) { fn(); return; }
            document.getElementById('admin-pwd').value = '';
            document.getElementById('admin-modal').classList.add('visible');
            pendingAdminAction = fn;
        }
        document.getElementById('admin-verify-btn').addEventListener('click', function () {
            var pwd = document.getElementById('admin-pwd').value;
            if (!pwd) return;
            var btn = document.getElementById('admin-verify-btn');
            btn.disabled = true; btn.textContent = '验证中…';
            HWAuth.getClient().rpc('check_admin_password', { input_pwd: pwd })
                .then(function (res) {
                    btn.disabled = false; btn.textContent = '验证';
                    if (res.error || res.data !== true) { HWLayout.toast('管理口令错误！'); return; }
                    sessionStorage.setItem('hw_admin_verified_at', String(Date.now()));
                    // 口令正确 → 全站管理会话（15 分钟）+ 尝试把当前账号升级为 admin 角色
                    HWLayout.markAdmin(15);
                    HWLayout.promoteRole(pwd);
                    document.dispatchEvent(new CustomEvent('hw:admin'));
                    document.getElementById('admin-modal').classList.remove('visible');
                    updateAdminUI();
                    if (pendingAdminAction) { var f = pendingAdminAction; pendingAdminAction = null; f(); }
                }).catch(function (e) {
                    btn.disabled = false; btn.textContent = '验证';
                    HWLayout.toast('验证失败: ' + (e.message || e));
                });
        });

        var applyBtn = document.getElementById('apply-ev-btn');
        if (applyBtn) applyBtn.addEventListener('click', function () {
            document.getElementById('apply-reason').value = '';
            document.getElementById('apply-modal').classList.add('visible');
        });
        var applySubmit = document.getElementById('apply-submit');
        if (applySubmit) applySubmit.addEventListener('click', function () {
            var u = (typeof HWAuth !== 'undefined') ? HWAuth.getSession() : null;
            if (!u) { HWLayout.toast('请先登录', 'err'); return; }
            var reason = document.getElementById('apply-reason').value.trim();
            var btn = applySubmit;
            btn.disabled = true; btn.textContent = '提交中…';
            HWAuth.getClient().from('organizer_requests').select('id').eq('user_id', u.id).eq('status', 'pending').limit(1)
                .then(function (ex) {
                    if (ex.error) throw new Error(ex.error.message);
                    if (ex.data && ex.data.length) { return { dup: true }; }
                    return HWAuth.getClient().from('organizer_requests').insert([{ user_id: u.id, reason: reason }]).select();
                })
                .then(function (r) {
                    btn.disabled = false; btn.textContent = '提交申请';
                    if (r && r.dup) { HWLayout.toast('已有待审核的申请，请耐心等待', 'info'); return; }
                    if (r && r.error) throw new Error(r.error.message);
                    document.getElementById('apply-modal').classList.remove('visible');
                    HWLayout.toast('申请已提交，等待管理员审核');
                    HWLayout.notifyAdmins('新的举办活动申请', (u.nickname || u.username) + ' 申请举办活动', 'admin.html');
                })
                .catch(function (e) {
                    btn.disabled = false; btn.textContent = '提交申请';
                    HWLayout.toast('提交失败: ' + (e.message || e), 'err');
                });
        });

        createBtn.addEventListener('click', function () {
            requestAdminThen(function () {
                document.getElementById('create-modal').classList.add('visible');
                resetCoverField();
            });
        });

        /* ---------- 封面图上传（Storage: event-covers，公开读） ---------- */
        function validateCover(f) {
            if (!f.type || f.type.indexOf('image/') !== 0) { HWLayout.toast('请选择图片文件（jpg / png / webp…）'); return false; }
            if (f.size > 2 * 1024 * 1024) { HWLayout.toast('封面图片需 ≤ 2MB'); return false; }
            return true;
        }
        function uploadCover(f) {
            var sb = HWAuth.getClient();
            var safe = String(Date.now()) + '-' + String(f.name || 'cover').replace(/[^a-zA-Z0-9._-]/g, '').slice(-40);
            return sb.storage.from('event-covers').upload('covers/' + safe, f, { contentType: f.type, upsert: false })
                .then(function (r) {
                    if (r.error) throw new Error(r.error.message);
                    return sb.storage.from('event-covers').getPublicUrl(r.data.path).data.publicUrl;
                });
        }
        function resetCoverField() {
            var fi = document.getElementById('cf-cover');
            var pv = document.getElementById('cf-cover-preview');
            if (fi) fi.value = '';
            if (pv) { pv.removeAttribute('src'); pv.style.display = 'none'; }
        }
        document.getElementById('cf-cover').addEventListener('change', function (e) {
            var f = e.target.files && e.target.files[0];
            var pv = document.getElementById('cf-cover-preview');
            if (!f) { resetCoverField(); return; }
            if (!validateCover(f)) { resetCoverField(); return; }
            var rd = new FileReader();
            rd.onload = function () { pv.src = rd.result; pv.style.display = 'block'; };
            rd.readAsDataURL(f);
        });


        document.getElementById('create-form').addEventListener('submit', function (e) {
            e.preventDefault();
            var title = document.getElementById('cf-title').value.trim();
            if (!title) return;
            var _dl = document.getElementById('cf-deadline').value;
            if (_dl && new Date(_dl).getTime() < Date.now()) {
                HWLayout.toast('报名截止时间不能早于现在', 'err');
                return;
            }
            var row = {
                title: title,
                event_type: document.getElementById('cf-type').value,
                season: document.getElementById('cf-season').value.trim() || 'S6',
                status: document.getElementById('cf-status').value,
                max_slots: document.getElementById('cf-slots').value ? parseInt(document.getElementById('cf-slots').value, 10) : null,
                start_time: document.getElementById('cf-start').value ? new Date(document.getElementById('cf-start').value).toISOString() : null,
                end_time: document.getElementById('cf-end').value ? new Date(document.getElementById('cf-end').value).toISOString() : null,
                reg_deadline: document.getElementById('cf-deadline').value
                    ? new Date(document.getElementById('cf-deadline').value).toISOString() : null,
                format: document.getElementById('cf-format').value.trim(),
                group_count: parseInt(document.getElementById('cf-groups').value, 10) || 1,
                venue: document.getElementById('cf-venue').value.trim(),
                description: document.getElementById('cf-desc').value.trim(),
                rules: document.getElementById('cf-rules').value.trim(),
                stream_url: document.getElementById('cf-stream').value.trim(),
                created_by: 'admin',
                cover_image: ''
            };
            var rowSess = (typeof HWAuth !== 'undefined') ? HWAuth.getSession() : null;
            if (rowSess && rowSess.role === 'organizer' && !isAdmin()) row.organizer_id = rowSess.id;
            var btn = document.getElementById('cf-submit');
            var coverInput = document.getElementById('cf-cover');
            var coverFile = coverInput && coverInput.files ? coverInput.files[0] : null;
            if (coverFile && !validateCover(coverFile)) return;
            btn.disabled = true;
            btn.textContent = coverFile ? '上传封面…' : '创建中…';
            var insertRow = function () {
                btn.textContent = '创建中…';
                return HWAuth.getClient().from('events').insert([row]).then(function (res) {
                    btn.disabled = false; btn.textContent = '创建';
                    if (res.error) { HWLayout.toast('创建失败: ' + res.error.message); return; }
                    document.getElementById('create-modal').classList.remove('visible');
                    document.getElementById('create-form').reset();
                    document.getElementById('cf-season').value = 'S6';
                    resetCoverField();
                    refresh();
                });
            };
            if (coverFile) {
                uploadCover(coverFile).then(function (url) {
                    row.cover_image = url;
                    return insertRow();
                }).catch(function (e) {
                    btn.disabled = false; btn.textContent = '创建';
                    HWLayout.toast('封面上传失败: ' + (e.message || e));
                });
            } else insertRow();
        });

        /* ---------- tabs / filters ---------- */
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(function (b) {
                b.classList.toggle('active', b.dataset.tab === tab);
            });
            document.getElementById('filter-bar').style.display = tab === 'hall' ? 'flex' : 'none';
            render();
        }
        document.querySelectorAll('.tab-btn').forEach(function (b) {
            b.addEventListener('click', function () {
                switchTab(b.dataset.tab);
                location.hash = b.dataset.tab === 'mine' ? 'mine' : '';
            });
        });
        document.getElementById('status-filter').addEventListener('click', function (e) {
            var btn = e.target.closest('button');
            if (!btn) return;
            document.querySelectorAll('#status-filter button').forEach(function (x) { x.classList.remove('active'); });
            btn.classList.add('active');
            currentFilter = btn.dataset.status;
            renderHall();
        });

        /* ---------- global ---------- */
        document.querySelectorAll('[data-close]').forEach(function (b) {
            b.addEventListener('click', function () {
                document.getElementById(b.dataset.close).classList.remove('visible');
            });
        });

        function refresh() {
            return loadData().then(render).catch(function (err) {
                console.error(err);
                main.innerHTML = '<div class="empty-state"><strong>加载失败</strong><br>' + esc(err.message || err) + '</div>';
            });
        }

        HWAuth.on(function (evt) { if (evt === 'login' || evt === 'logout') refresh(); });

        HWAuth.init();
        HWAuth.detectAccountSource().catch(function () {}).finally(function () {
            if (location.hash === '#mine') switchTab('mine');
            Promise.resolve(refresh()).then(function () {
                // ?open=<id>：从活动空间/管理枢纽深链进来时自动打开详情
                // ?create=1：管理后台「＋创建活动」直达创建表单（仅管理员）
                var qp = null;
                try { qp = new URLSearchParams(window.location.search); } catch (e) {}
                if (!qp) return;
                var openId = qp.get('open');
                if (openId && /^\d+$/.test(openId)) openDetail(parseInt(openId, 10));
                if (qp.get('create') === '1' && isAdmin()) {
                    document.getElementById('create-modal').classList.add('visible');
                    resetCoverField();
                }
            }).catch(function () {});
        });
    })();
    </script>
</body>
</html>
