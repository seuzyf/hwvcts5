                        });
                    }).catch(function () { listEl.innerHTML = '<span class="muted">加载失败。</span>'; });
            };
            renderList();
            document.getElementById('honor-award').addEventListener('click', function () {
                var playerName = document.getElementById('honor-player').value.trim();
                var title = titleSel.value === '__custom'
                    ? document.getElementById('honor-title-custom').value.trim() : titleSel.value;
                var desc = document.getElementById('honor-desc').value.trim();
                var date = dateEl.value || new Date().toISOString().slice(0, 10);
                if (!playerName) { HWLayout.toast('请填写选手真名', 'err'); return; }
                if (!title) { HWLayout.toast('请填写荣誉名称', 'err'); return; }
                sb.from('player_honors').select('id').eq('event_id', ev.id)
                    .eq('player_name', playerName).eq('title', title).limit(1)
                    .then(function (dup) {
                        if (dup && !dup.error && dup.data && dup.data.length) {
                            HWLayout.toast('该选手在本活动已有同名荣誉，已拦截重复发放', 'err');
                            throw new Error('dup');
                        }
                        var me = HWAuth.getSession();
                        return sb.from(season + '_player_ids').select('id').eq('name', playerName).maybeSingle()
                            .then(function (pr) {
                                var gid = (pr && pr.data && pr.data.id) || '';
                                return sb.from('player_honors').insert([{
                                    player_name: playerName, game_id: String(gid || ''), event_id: ev.id,
                                    title: title, description: desc, awarded_at: date,
                                    awarded_by: me ? me.id : null
                                }]);
                            });
                    })
                    .then(function (r) {
                        if (r && r.error) throw new Error(r.error.message);
                        HWLayout.toast('荣誉已发放：' + title);
                        renderList();
                        /* 通知本人（按真名找已绑定账号，找不到等绑定后由选手页展示） */
                        var target = Object.keys(userMap).map(function (k) { return userMap[k]; })
                            .find(function (x) { return x && x.nickname === playerName; });
                        if (target && target.id) {
                            HWLayout.notifyUser(target.id, '你获得了新荣誉', '「' + title + '」· ' + (ev.title || ''), 'player.html?name=' + encodeURIComponent(playerName));
                        }
                        try {
                            sb.from('audit_log').insert([{ actor_id: (HWAuth.getSession() || {}).id, actor_role: (HWAuth.getSession() || {}).role || '', action: 'honor.award', target_type: 'event', target_id: String(ev.id), detail: { player: playerName, title: title } }]).then(function () {}, function () {});
                        } catch (e) { /* 审计表未就绪不阻断 */ }
                    })
                    .catch(function (e) { if (e.message !== 'dup') HWLayout.toast('发放失败: ' + (e.message || e), 'err'); });
            });
        }
        function regsOfEvent(eventId) {
            return allRegs.filter(function (r) { return r.event_id === eventId; });
        }

        /* ---------- detail ---------- */
        function openDetail(eventId) {
            var ev = allEvents.find(function (e) { return e.id === eventId; });
            if (!ev) return;
            var panel = document.getElementById('detail-panel');
            var u = HWAuth.getSession();
            var regs = activeRegsOf(ev.id);
            var mine = myRegOf(ev.id);
            var slots = ev.max_slots;
            var full = slots && regs.length >= slots;
            var st = HWLayout.evState(ev, { regs: allRegs });
            var deadlinePassed = st.phase === 'closed';
            var canRegister = st.joinable && !mine;

            var rosterHtml = regs.length === 0
                ? '<div class="empty-state" style="padding:20px 0;">暂无报名</div>'
                : '<ul class="roster-list">' + regs.slice().sort(function (a, b) {
                    return (a.status === 'approved' ? 0 : 1) - (b.status === 'approved' ? 0 : 1);
                }).map(function (r) {
                    var who = userMap[r.user_id] || {};
                    return '<li>' +
                        '<span class="badge ' + (REG_BADGE[r.status] || '') + '" style="min-width:62px; justify-content:center;">' + (REG_STATUS[r.status] || r.status) + '</span>' +
                        '<span class="team">' + esc(r.team_name || '待分队') + '</span>' +
                        '<span class="who">' + esc(who.username ? '@' + who.username : '') + (r.members && r.members.length ? ' · ' + r.members.length + ' 人' : '') + '</span>' +
                        '</li>';
                }).join('') + '</ul>';

            var myRegHtml = mine
                ? '<div class="my-reg-box">' +
                  '<span>我的报名：<strong style="color:' +
                  (mine.status === 'approved' ? 'var(--success-green)' : mine.status === 'pending' ? '#ffd700' : '#ff8f8f') +
                  '">' + (REG_STATUS[mine.status] || mine.status) + '</strong></span>' +
                  '<span class="smoke">战队 ' + esc(mine.team_name || '待分队') + '</span>' +
                  '<a class="mini-btn" href="register.html?event=' + ev.id + '">报名页 / 资料</a>' +
                  ((mine.status === 'pending' || mine.status === 'approved' || mine.status === 'waitlist')
                      ? '<button class="mini-btn no" data-cancel="' + mine.id + '" style="margin-left:auto;" type="button">撤回报名</button>' : '') +
                  '</div>'
                : '';

            var registerHtml;
            if (canRegister) {
                registerHtml = '<a class="btn btn-primary" href="register.html?event=' + ev.id + '" style="width:100%;">' +
                    (st.phase === 'full' ? (u ? '名额已满 · 加入候补 →' : '登录并加入候补 →')
                                        : (u ? '填写并报名 →' : '登录并报名 →')) + '</a>';
            } else if (!mine) {
                /* 界面自己说明自己：一律给「为什么 + 什么时候 + 还能做什么」 */
                registerHtml = '<div class="notice">' + esc(st.blockedReason || '暂不可报名。') +
                    (st.phase === 'closed' && ev.start_time ? '<span class="notice-sub">开赛时间 ' + fmtTime(ev.start_time) + '</span>' : '') +
                    (st.phase === 'full' ? '<a class="mini-btn" href="register.html?event=' + ev.id + '">加入候补 →</a>' : '') +
                    '</div>';
            } else registerHtml = '';

            var adminHtml = canManageEv(ev)
                ? '<div class="section-label">管理（' + (isAdmin() ? '管理员' : '活动组织者') + '）</div>' +
                  '<div class="admin-row">' +
                  '  <select class="select" id="adm-status">' +
                       ['draft', 'registration', 'ongoing', 'finished', 'cancelled'].map(function (s) {
                           return '<option value="' + s + '"' + (ev.status === s ? ' selected' : '') + '>' + EV_STATUS[s] + '</option>';
                       }).join('') +
                  '  </select>' +
                  '  <button class="btn btn-ghost" id="adm-save-status" type="button">更新活动状态</button>' +
                  '  <a class="btn btn-ghost" href="review.html?event=' + ev.id + '">审核报名</a>' +
                  '  <input class="input" id="adm-stream" style="flex:1; min-width:180px;" placeholder="直播链接 URL" value="' + esc(ev.stream_url || '') + '">' +
                  '  <button class="btn btn-ghost" id="adm-stream-save" type="button">保存直播链接</button>' +
                  '  <button class="btn btn-ghost" id="adm-cover-btn" type="button">更换封面图</button>' +
                  (ev.cover_image ? '  <button class="btn btn-ghost" id="adm-cover-clear" type="button">移除封面</button>' : '') +
                  '  <input type="file" id="adm-cover-file" accept="image/*" aria-label="上传活动封面" style="display:none;">' +
                  '</div>' +
                  '<div class="admin-row" style="display:block; margin-top:14px; border-top:1px solid rgba(255,255,255,0.1); padding-top:14px;">' +
                  '  <span class="form-label">活动队长（数据台权限）</span>' +
                  '  <p class="muted" style="font-size:13px; margin:4px 0 10px;">队长登录后可在本活动页签进入「管理 · 数据台」录入赛程赛果；与本活动绑定，换活动需重新设置。</p>' +
                  '  <div id="captains-list" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;">' + HWLayout.loader({ inline: true, label: '正在加载队长' }) + '</div>' +
                  '  <div class="admin-row">' +
                  '    <select class="select" id="captain-player" style="flex:1; min-width:200px;"><option value="">选择选手（本活动赛季花名册）</option></select>' +
                  '    <button class="btn btn-ghost" id="captain-add" type="button">设为队长</button>' +
                  '    <a class="btn btn-ghost" id="captain-open-manage" href="#" style="display:none;">打开数据台 →</a>' +
                  '  </div>' +
                  '</div>'
                : '';

            var coverBanner = ev.cover_image
                ? '<div class="detail-cover"><img src="' + esc(ev.cover_image) + '" alt=""></div>'
                : '';
            var teamsChips = ev.teams
                ? '<div class="teams-chips">' + String(ev.teams).split(/[,，、]/).map(function (t) { return t.trim(); }).filter(Boolean)
                    .map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('') + '</div>'
                : '';
            var slotPct = slots ? Math.min(100, Math.round(regs.length / slots * 100)) : 0;
            var managePane = canManageEv(ev);
            panel.innerHTML =
                '<button class="modal-close" id="detail-close" type="button" aria-label="关闭">&times;</button>' +
                coverBanner +
                '<div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:6px;">' +
                (ev.cover_image ? '' : '  <span class="icon-circle" style="width:52px;height:52px;">' + HWLayout.ico('trophy', 24) + '</span>') +
                '  <div><span class="eyebrow">' + esc(TYPE_LABEL[ev.event_type] || ev.event_type) + (ev.season ? ' · ' + esc(ev.season) : '') + '</span>' +
                '  <h3 class="modal-title" style="font-size:20px; margin-top:4px;">' + esc(ev.title) + '</h3></div>' +
                '  <span class="badge badge-' + st.tone + '" style="margin-left:auto;" data-ev-phase="' + st.phase + '">' + esc(st.label) + '</span>' +
                '</div>' +
                '<div class="detail-info">' +
                '  <span>开始 <b>' + fmtTime(ev.start_time) + '</b></span>' +
                '  <span data-deadline' + (st.phase === 'closed' ? ' class="ev-past"' : '') + '>报名截止 <b>' + (ev.reg_deadline ? fmtTime(ev.reg_deadline) : '不限') + '</b></span>' +
                '  <span>赛制 <b>' + esc(ev.format || '—') + '</b> · <b>' + ((ev.group_count || 1) + ' 组') + '</b></span>' +
                '  <span class="slot-mini">名额 <b>' + (slots ? regs.length + ' / ' + slots : regs.length + '（不限）') + '</b>' +
                (slots ? '<span class="slot-track"><span class="slot-fill' + (full ? ' full' : '') + '" style="display:block; height:100%; width:100%; transform:scaleX(' + (slotPct / 100) + ');"></span></span>' : '') + '</span>' +
                (ev.venue ? '  <span>' + HWLayout.ico('map-pin', 13) + ' <b>' + esc(ev.venue) + '</b></span>' : '') +
                (ev.stream_url ? '  <span><a href="' + esc(ev.stream_url) + '" target="_blank" rel="noopener" style="color:var(--info-blue);">进入直播间 →</a></span>' : '') +
                '</div>' +
                (teamsChips ? '<div style="margin-top:10px;">' + teamsChips + '</div>' : '') +
                '<div class="detail-tabs" role="tablist">' +
                '  <button type="button" class="active" data-dtab="overview">概览</button>' +
                '  <button type="button" data-dtab="roster">报名名单（' + regs.length + '）</button>' +
                '  <button type="button" data-dtab="space">活动空间</button>' +
                (managePane ? '  <button type="button" data-dtab="manage">管理</button>' : '') +
                '</div>' +
                '<div class="dt-pane" data-pane="overview">' +
                (ev.description ? '<div class="desc-block">' + esc(ev.description) + '</div>' : '<div class="empty-state" style="padding:16px 0;">暂无活动简介。</div>') +
                (ev.rules ? '<div class="section-label">赛制 / 规则</div><div class="desc-block">' + esc(ev.rules) + '</div>' : '') +
                (ev.start_time ? '<div style="margin-top:14px;"><button class="btn btn-ghost btn-sm" id="ev-ics" type="button">导出 .ics 日历</button></div>' : '') +
                '</div>' +
                '<div class="dt-pane" data-pane="roster" hidden>' +
                (isAdmin() || evOrganizer(ev) ? '<div style="margin-bottom:8px;"><a href="review.html?event=' + ev.id + '" style="font-size:12px; color:var(--info-blue);">审核报名 →</a></div>' : '') +
                rosterHtml +
                '</div>' +
                '<div class="dt-pane" data-pane="space" hidden>' +
                '<div id="ev-workspace" class="tiles" style="margin-bottom:4px;">' + HWLayout.loader({ rows: 3, label: '正在加载活动工作区' }) + '</div>' +
                '</div>' +
                (managePane ? '<div class="dt-pane" data-pane="manage" hidden>' + adminHtml + honorHtml(ev) +
                  '<div class="section-label">活动复制</div>' +
                  '<p class="muted" style="font-size:13px;">复制为新草稿（只复制活动设置，不带报名与赛程数据）。</p>' +
                  '<button class="btn btn-ghost" id="adm-copy-ev" type="button">复制为草稿</button>' +
                  (isAdmin() ? '<div class="section-label" style="color:#ff8f8f;">危险操作</div>' +
                    '<p class="muted" style="font-size:13px;">删除后活动对所有人不可见（软删除，数据保留，超管可恢复）。</p>' +
                    '<button class="btn btn-danger" id="adm-delete-ev" type="button">删除活动</button>' : '') +
                  '</div>' : '') +
                '<div class="detail-foot">' + myRegHtml + registerHtml + '</div>';

            /* 页签指示条：初始对齐 active，后续切换只移动它 */
            (function () {
                var tabsEl = panel.querySelector('.detail-tabs');
                if (!tabsEl || tabsEl.querySelector('.dt-ink')) return;
                var ink = document.createElement('span');
                ink.className = 'dt-ink';
                tabsEl.appendChild(ink);
                var moveInk = function () {
                    var act = tabsEl.querySelector('button.active');
                    if (!act) return;
                    ink.style.width = act.offsetWidth + 'px';
                    ink.style.transform = 'translateX(' + act.offsetLeft + 'px)';
                };
                requestAnimationFrame(moveInk);
                window.addEventListener('resize', moveInk, { passive: true });
            })();
            panel.dataset.evId = String(ev.id);
            panel.dataset.joinable = canRegister ? '1' : '0';
            document.getElementById('detail-modal').classList.add('visible');
            /* 详情面板整体进入用统一曲线（theme.css 的 .modal-panel 已定义，这里只补 stagger） */
            if (typeof HWLayout !== 'undefined' && HWLayout.stagger) {
                var pane = panel.querySelector('.dt-pane[data-pane="overview"]');
                if (pane) HWLayout.stagger(pane, ':scope > *');
            }
            document.getElementById('detail-close').addEventListener('click', closeDetail);
            var icsBtn = document.getElementById('ev-ics');
            if (icsBtn) icsBtn.addEventListener('click', function () {
                HWLayout.exportIcs('event-' + ev.id + '.ics', [{
                    title: ev.title,
                    start: ev.start_time || ev.reg_deadline,
                    end: ev.end_time || ev.start_time || ev.reg_deadline,
                    desc: (ev.format || '') + (ev.venue ? ' · ' + ev.venue : ''),
                    loc: ev.venue || ''
                }]);
            });
            renderWorkspace(ev);
            wireHonors(ev);
            var copyBtn = document.getElementById('adm-copy-ev');
            if (copyBtn) copyBtn.addEventListener('click', function () {
                copyBtn.disabled = true; copyBtn.textContent = '复制中…';
                var copy = {
                    title: (ev.title || '未命名活动') + '（副本）', event_type: ev.event_type, season: ev.season,
                    status: 'draft', description: ev.description || '', rules: ev.rules || '', format: ev.format || '',
                    start_time: ev.start_time, end_time: ev.end_time, reg_deadline: ev.reg_deadline,
                    max_slots: ev.max_slots, venue: ev.venue || '', cover_emoji: ev.cover_emoji || '',
                    cover_image: ev.cover_image || '', group_count: ev.group_count || 1,
                    stream_url: ev.stream_url || '', organizer_id: ev.organizer_id || null, created_by: 'admin'
                };
                HWAuth.getClient().from('events').insert([copy]).then(function (r) {
                    copyBtn.disabled = false; copyBtn.textContent = '复制为草稿';
                    if (r.error) { HWLayout.toast('复制失败: ' + r.error.message, 'err'); return; }
                    HWLayout.toast('已复制为草稿（不含报名与赛程）');
                    closeDetail(); refresh();
                });
            });

            /* 详情页签切换 */
            var tabOrder = [];
            panel.querySelectorAll('[data-dtab]').forEach(function (b) { tabOrder.push(b.dataset.dtab); });
            panel.querySelectorAll('[data-dtab]').forEach(function (b) {
                b.setAttribute('role', 'tab');
                b.addEventListener('click', function () {
                    var from = panel.querySelector('[data-dtab].active');
                    var dir = from ? (tabOrder.indexOf(b.dataset.dtab) > tabOrder.indexOf(from.dataset.dtab) ? 1 : -1) : 1;
                    panel.querySelectorAll('[data-dtab]').forEach(function (x) {
                        x.classList.toggle('active', x === b);
                        x.setAttribute('aria-selected', x === b ? 'true' : 'false');
                    });
                    var ink = panel.querySelector('.dt-ink');
                    if (ink) {
                        ink.style.width = b.offsetWidth + 'px';
                        ink.style.transform = 'translateX(' + b.offsetLeft + 'px)';
                    }
                    panel.querySelectorAll('.dt-pane').forEach(function (p) {
                        var on = p.dataset.pane === b.dataset.dtab;
                        p.hidden = !on;
                        if (on) {
                            /* 方向感：从右边来的页签从右进，反之从左进 */
                            p.classList.remove('pane-in-l', 'pane-in-r');
                            void p.offsetWidth;
                            p.classList.add(dir > 0 ? 'pane-in-r' : 'pane-in-l');
                        }
                    });
                });
            });

            /* 删除活动（管理员：软删除，审计 + 通知组织者） */
            var delBtn = document.getElementById('adm-delete-ev');
            if (delBtn) delBtn.addEventListener('click', function () {
                HWLayout.confirmDialog({
                    title: '删除活动',
                    message: '确定删除活动「' + (ev.title || '') + '」？删除后活动对所有人不可见，数据保留，超级管理员可恢复。',
                    okText: '删除活动', danger: true
                }).then(function (ok) {
                    if (!ok) return;
                    var sb = HWAuth.getClient();
                    var me = HWAuth.getSession();
                    var patch = { status: 'deleted' };
                    var done = function () {
                        try { sb.from('audit_log').insert([{ actor_id: me ? me.id : null, actor_role: me ? me.role : '', action: 'event.delete', target_type: 'event', target_id: String(ev.id), detail: { title: ev.title || '' } }]).then(function () {}, function () {}); } catch (e) {}
                        if (ev.organizer_id && (!me || String(ev.organizer_id) !== String(me.id))) {
                            HWLayout.notifyUser(ev.organizer_id, '活动已被管理员删除', '「' + (ev.title || '') + '」已被删除，如有疑问请联系管理员。', 'events.html');
                        }
                        HWLayout.toast('活动已删除');
                        closeDetail();
                        refresh();
                    };
                    sb.from('events').update(Object.assign({}, patch, {
                        deleted_at: new Date().toISOString(), deleted_by: me ? me.id : null
                    })).eq('id', ev.id).then(function (r) {
                        if (r && r.error) {
                            /* deleted_* 列未就绪时只回退写状态 */
                            return sb.from('events').update(patch).eq('id', ev.id).then(function (r2) {
                                if (r2 && r2.error) { HWLayout.toast('删除失败: ' + r2.error.message, 'err'); return; }
                                done();
                            });
                        }
                        done();
                    }).catch(function () { HWLayout.toast('删除失败', 'err'); });
                });
            });

            panel.querySelectorAll('[data-cancel]').forEach(function (b) {
                b.addEventListener('click', function () { cancelReg(parseInt(b.dataset.cancel, 10), eventId); });
            });

            var admStreamSave = document.getElementById('adm-stream-save');
            if (admStreamSave) admStreamSave.addEventListener('click', function () {
                var url = (document.getElementById('adm-stream').value || '').trim();
                HWAuth.getClient().from('events').update({ stream_url: url }).eq('id', ev.id)
                    .then(function (res) {
                        if (res.error) { HWLayout.toast('保存失败: ' + res.error.message, 'err'); return; }
                        ev.stream_url = url;
                        HWLayout.toast('直播链接已保存');
                        closeDetail();
                        refresh();
                    }).catch(function (e) { HWLayout.toast('保存失败', 'err'); });
            });
            var admSave = document.getElementById('adm-save-status');
            if (admSave) admSave.addEventListener('click', function () {
                var newStatus = document.getElementById('adm-status').value;
                HWAuth.getClient().from('events').update({ status: newStatus }).eq('id', ev.id)
                    .then(function (res) {
                        if (res.error) { HWLayout.toast('更新失败: ' + res.error.message); return; }
                        closeDetail();
                        refresh();
                    });
            });

            /* 管理员：活动队长设置（→ 该活动数据台权限） */
            var capList = document.getElementById('captains-list');
            if (capList) {
                var capIdTable = HWLayout.seasonKey(ev) + '_player_ids';
                var capRefresh = function () {
                    HWAuth.getClient().from('event_captains').select('*').eq('event_id', ev.id).order('created_at')
                        .then(function (res) {
                            var rows = (res && res.data) || [];
                            var openBtn = document.getElementById('captain-open-manage');
                            if (openBtn) { openBtn.style.display = rows.length ? 'inline-flex' : 'none'; openBtn.setAttribute('href', 'manage.html?event=' + ev.id); }
                            capList.innerHTML = rows.length ? rows.map(function (c) {
                                return '<span class="badge badge-blue" style="display:inline-flex; align-items:center; gap:6px; padding:6px 10px;">' +
                                    esc(c.player_name) +
                                    '<button type="button" data-cap="' + c.id + '" aria-label="移除队长" style="border:none;background:transparent;color:inherit;cursor:pointer;font-size:14px;line-height:1;">×</button></span>';
                            }).join('') : '<span class="muted">尚未设置队长。</span>';
                            Array.prototype.forEach.call(capList.querySelectorAll('button[data-cap]'), function (b) {
                                b.addEventListener('click', function () {
                                    HWLayout.confirmDialog({
                                        title: '移除队长',
                                        message: '确定移除该活动队长？移除后对方在分队页不再拥有队长权限。',
                                        okText: '移除', danger: true
                                    }).then(function (ok) {
                                        if (!ok) return;
                                        HWAuth.getClient().from('event_captains').delete().eq('id', b.dataset.cap)
                                            .then(function (r) { if (r && r.error) { HWLayout.toast(r.error.message); return; } capRefresh(); });
                                    });
                                });
                            });
                        }).catch(function () { capList.innerHTML = '<span class="muted">队长列表加载失败</span>'; });
                };
                var capSel = document.getElementById('captain-player');
                HWAuth.getClient().from(capIdTable).select('name').order('name')
                    .then(function (res) {
                        var names = ((res && res.data) || []).map(function (x) { return x.name; }).filter(Boolean);
                        capSel.innerHTML = '<option value="">选择选手（本活动赛季花名册）</option>' +
                            names.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('');
                    }).catch(function () {});
                var capAdd = document.getElementById('captain-add');
                if (capAdd) capAdd.addEventListener('click', function () {
                    var name = capSel.value;
                    if (!name) { HWLayout.toast('请先从花名册选择选手。'); return; }
                    HWAuth.getClient().from(capIdTable).select('id').eq('name', name).maybeSingle()
                        .then(function (r) {
                            var gid = (r && r.data && r.data.id) ? String(r.data.id) : '';
                            return HWAuth.getClient().from('event_captains').insert([{
                                event_id: ev.id, player_name: name, game_id: gid, added_by: 'admin'
                            }]);
                        })
                        .then(function (r2) {
                            if (r2 && r2.error) { HWLayout.toast('设置失败: ' + r2.error.message); return; }
                            capSel.value = ''; capRefresh();
                        })
                        .catch(function (e) { HWLayout.toast('设置失败: ' + (e && e.message ? e.message : e)); });
                });
                capRefresh();
            }

            /* 管理员：更换 / 移除封面图（Storage: event-covers） */
            var admCoverBtn = document.getElementById('adm-cover-btn');
            if (admCoverBtn) {
                var admCoverFile = document.getElementById('adm-cover-file');
                admCoverBtn.addEventListener('click', function () { admCoverFile.click(); });
                admCoverFile.addEventListener('change', function () {
                    var f = admCoverFile.files && admCoverFile.files[0];
                    if (!f) return;
                    if (!validateCover(f)) { admCoverFile.value = ''; return; }
                    uploadCover(f).then(function (url) {
                        return HWAuth.getClient().from('events').update({ cover_image: url }).eq('id', ev.id);
                    }).then(function (res) {
                        if (res.error) { HWLayout.toast('更新失败: ' + res.error.message); return; }
                        openDetail(ev.id);
                        refresh();
                    }).catch(function (e) { HWLayout.toast('封面上传失败: ' + (e.message || e)); });
                });
            }
            var admCoverClear = document.getElementById('adm-cover-clear');
            if (admCoverClear) admCoverClear.addEventListener('click', function () {
                HWAuth.getClient().from('events').update({ cover_image: '' }).eq('id', ev.id)
                    .then(function (res) {
                        if (res.error) { HWLayout.toast('更新失败: ' + res.error.message); return; }
                        openDetail(ev.id);
                        refresh();
                    });
            });
        }

        function closeDetail() { document.getElementById('detail-modal').classList.remove('visible'); }
        /* Phase 11：弹框不点空白关闭，仅手动 ×（closeDetail 由 × 绑定） */

        /* ---------- registration ops ---------- */
        function cancelReg(regId, keepDetailEventId) {
            HWLayout.confirmDialog({
                title: '撤回报名',
                message: '确定撤回这条报名？撤回后名额会释放给候补，且需要重新报名才能再次参赛。',
                okText: '撤回报名', danger: true
            }).then(function (ok) {
                if (!ok) return;
                doCancelReg(regId, keepDetailEventId);
            });
        }
        function doCancelReg(regId, keepDetailEventId) {
            HWAuth.getClient().from('event_registrations')
                .update({ status: 'cancelled', updated_at: new Date().toISOString() })
                .eq('id', regId)
                .select('event_id')
                .then(function (res) {
                    if (res.error) { HWLayout.toast('撤回失败: ' + res.error.message, 'err'); return; }
                    HWLayout.toast('报名已撤回');
                    /* P13h：撤销后候补递补 */
                    var row = res.data && res.data[0];
                    if (row && row.event_id) {
                        HWAuth.getClient().from('events').select('id, title, max_slots').eq('id', row.event_id).maybeSingle()
                            .then(function (er) {
                                if (er && !er.error && er.data) HWLayout.promoteWaitlist(er.data);
                            }).catch(function () {});
                    }
                    if (keepDetailEventId != null) closeDetail();
                    refresh();
                });
        }

        function requestAdminThen(fn) {
            if (isAdmin() || isOrganizerRole()) { fn(); return; }
            document.getElementById('admin-pwd').value = '';
            document.getElementById('admin-modal').classList.add('visible');
            pendingAdminAction = fn;
        }
        document.getElementById('admin-verify-btn').addEventListener('click', function () {
            var pwd = document.getElementById('admin-pwd').value;
            if (!pwd) return;
            var btn = document.getElementById('admin-verify-btn');
            btn.disabled = true; btn.textContent = '验证中…';
            HWLayout.redeemAdminCode(pwd)
                .then(function (res) {
                    btn.disabled = false; btn.textContent = '验证';
                    if (!res.ok) { HWLayout.toast(res.error || '口令无效或已失效', 'err'); return; }
                    sessionStorage.setItem('hw_admin_verified_at', String(Date.now()));
                    // 一次性口令兑换成功 → 15 分钟管理员会话（不改变账号角色）
                    document.dispatchEvent(new CustomEvent('hw:admin'));
                    document.getElementById('admin-modal').classList.remove('visible');
                    updateAdminUI();
                    if (pendingAdminAction) { var f = pendingAdminAction; pendingAdminAction = null; f(); }
                }).catch(function (e) {
                    btn.disabled = false; btn.textContent = '验证';
                    HWLayout.toast('验证失败: ' + (e.message || e));
                });
        });

        var applyBtn = document.getElementById('apply-ev-btn');
        if (applyBtn) applyBtn.addEventListener('click', function () {
            document.getElementById('apply-reason').value = '';
            document.getElementById('apply-modal').classList.add('visible');
        });
        var applySubmit = document.getElementById('apply-submit');
        if (applySubmit) applySubmit.addEventListener('click', function () {
            var u = (typeof HWAuth !== 'undefined') ? HWAuth.getSession() : null;
            if (!u) { HWLayout.toast('请先登录', 'err'); return; }
            var reason = document.getElementById('apply-reason').value.trim();
            var btn = applySubmit;
            btn.disabled = true; btn.textContent = '提交中…';
            HWAuth.getClient().from('organizer_requests').select('id').eq('user_id', u.id).eq('status', 'pending').limit(1)
                .then(function (ex) {
                    if (ex.error) throw new Error(ex.error.message);
                    if (ex.data && ex.data.length) { return { dup: true }; }
                    return HWAuth.getClient().from('organizer_requests').insert([{ user_id: u.id, reason: reason }]).select();
                })
                .then(function (r) {
                    btn.disabled = false; btn.textContent = '提交申请';
                    if (r && r.dup) { HWLayout.toast('已有待审核的申请，请耐心等待', 'info'); return; }
                    if (r && r.error) throw new Error(r.error.message);
                    document.getElementById('apply-modal').classList.remove('visible');
                    HWLayout.toast('申请已提交，等待管理员审核');
                    HWLayout.notifyAdmins('新的举办活动申请', (u.nickname || u.username) + ' 申请举办活动', 'admin.html');
                })
                .catch(function (e) {
                    btn.disabled = false; btn.textContent = '提交申请';
                    HWLayout.toast('提交失败: ' + (e.message || e), 'err');
                });
        });

        createBtn.addEventListener('click', function () {
            requestAdminThen(function () {
                document.getElementById('create-modal').classList.add('visible');
                resetCoverField();
            });
        });

        /* ---------- 封面图上传（Storage: event-covers，公开读） ---------- */
        function validateCover(f) {
            if (!f.type || f.type.indexOf('image/') !== 0) { HWLayout.toast('请选择图片文件（jpg / png / webp…）'); return false; }
            if (f.size > 2 * 1024 * 1024) { HWLayout.toast('封面图片需 ≤ 2MB'); return false; }
            return true;
        }
        function uploadCover(f) {
            var sb = HWAuth.getClient();
            var safe = String(Date.now()) + '-' + String(f.name || 'cover').replace(/[^a-zA-Z0-9._-]/g, '').slice(-40);
            return sb.storage.from('event-covers').upload('covers/' + safe, f, { contentType: f.type, upsert: false })
                .then(function (r) {
                    if (r.error) throw new Error(r.error.message);
                    return sb.storage.from('event-covers').getPublicUrl(r.data.path).data.publicUrl;
                });
        }
        function resetCoverField() {
            var fi = document.getElementById('cf-cover');
            var pv = document.getElementById('cf-cover-preview');
            if (fi) fi.value = '';
            if (pv) { pv.removeAttribute('src'); pv.style.display = 'none'; }
        }
        document.getElementById('cf-cover').addEventListener('change', function (e) {
            var f = e.target.files && e.target.files[0];
            var pv = document.getElementById('cf-cover-preview');
            if (!f) { resetCoverField(); return; }
            if (!validateCover(f)) { resetCoverField(); return; }
            var rd = new FileReader();
            rd.onload = function () { pv.src = rd.result; pv.style.display = 'block'; };
            rd.readAsDataURL(f);
        });


        /* 赛季下拉：来自 seasons 注册表（已归档赛季不可选新建活动） */
        function populateSeasonSelect() {
            var sel = document.getElementById('cf-season');
            if (!sel) return;
            HWLayout.getSeasons().then(function (list) {
                var act = list.filter(function (x) { return x.status !== 'archived'; });
                if (!act.length) act = list;
                sel.innerHTML = act.map(function (x) {
                    return '<option value="' + esc(String(x.season_key).toUpperCase()) + '"' +
                        (x.is_current ? ' selected' : '') + '>' + esc(x.name || x.season_key) + '</option>';
                }).join('');
            });
        }
        populateSeasonSelect();

        /* 活动模板：event_templates（表未部署时静默不可用） */
        function loadTemplates() {
            var sel = document.getElementById('cf-template');
            if (!sel) return;
            HWAuth.getClient().from('event_templates').select('*').order('created_at', { ascending: false })
                .then(function (r) {
                    if (r.error || !r.data) return;
                    sel.innerHTML = '<option value="">不使用模板</option>' + r.data.map(function (t) {
                        return '<option value="' + t.id + '" data-payload="' + esc(JSON.stringify(t.payload || {})) + '">' + esc(t.name) + '</option>';
                    }).join('');
                }, function () {});
        }
        loadTemplates();
        function formPayload() {
            return {
                title: document.getElementById('cf-title').value, event_type: document.getElementById('cf-type').value,
                season: document.getElementById('cf-season').value, format: document.getElementById('cf-format').value,
                group_count: document.getElementById('cf-groups').value, venue: document.getElementById('cf-venue').value,
                description: document.getElementById('cf-desc').value, rules: document.getElementById('cf-rules').value,
                stream_url: document.getElementById('cf-stream').value, max_slots: document.getElementById('cf-slots').value
            };
        }
        var tplApply = document.getElementById('cf-tpl-apply');
        if (tplApply) tplApply.addEventListener('click', function () {
            var sel = document.getElementById('cf-template');
            var opt = sel.options[sel.selectedIndex];
            if (!opt || !opt.dataset.payload) { HWLayout.toast('先选择一个模板', 'info'); return; }
            var pl = {};
            try { pl = JSON.parse(opt.dataset.payload); } catch (e) {}
            var set = function (id, v) { var el = document.getElementById(id); if (el && v != null) el.value = v; };
            set('cf-title', pl.title); set('cf-type', pl.event_type); set('cf-season', pl.season);
            set('cf-format', pl.format); set('cf-groups', pl.group_count); set('cf-venue', pl.venue);
            set('cf-desc', pl.description); set('cf-rules', pl.rules); set('cf-stream', pl.stream_url);
            set('cf-slots', pl.max_slots);
            HWLayout.toast('已套用模板');
        });
        var tplSave = document.getElementById('cf-tpl-save');
        if (tplSave) tplSave.addEventListener('click', function () {
            var u = HWAuth.getSession();
            var name = window.prompt('模板名称：', document.getElementById('cf-title').value || '常用活动模板');
            if (!name) return;
            HWAuth.getClient().from('event_templates').insert([{ owner_id: u ? u.id : null, name: name, payload: formPayload() }])
                .then(function (r) {
                    if (r.error) { HWLayout.toast('保存模板失败（请先执行 install.sql）：' + r.error.message, 'err'); return; }
                    HWLayout.toast('模板已保存'); loadTemplates();
                });
        });
        var tplDel = document.getElementById('cf-tpl-del');
        if (tplDel) tplDel.addEventListener('click', function () {
            var sel = document.getElementById('cf-template');
            if (!sel.value) { HWLayout.toast('先选择一个模板', 'info'); return; }
            HWAuth.getClient().from('event_templates').delete().eq('id', sel.value).then(function (r) {
                if (r.error) { HWLayout.toast('删除失败: ' + r.error.message, 'err'); return; }
                HWLayout.toast('模板已删除'); loadTemplates();
            });
        });

        document.getElementById('create-form').addEventListener('submit', function (e) {
            e.preventDefault();
            var title = document.getElementById('cf-title').value.trim();
            if (!title) return;
            var _dl = document.getElementById('cf-deadline').value;
            if (_dl && new Date(_dl).getTime() < Date.now()) {
                HWLayout.toast('报名截止时间不能早于现在', 'err');
                return;
            }
            var row = {
                title: title,
                event_type: document.getElementById('cf-type').value,
                season: document.getElementById('cf-season').value.trim() || 'S6',
                status: document.getElementById('cf-status').value,
                max_slots: document.getElementById('cf-slots').value ? parseInt(document.getElementById('cf-slots').value, 10) : null,
                start_time: document.getElementById('cf-start').value ? new Date(document.getElementById('cf-start').value).toISOString() : null,
                end_time: document.getElementById('cf-end').value ? new Date(document.getElementById('cf-end').value).toISOString() : null,
                reg_deadline: document.getElementById('cf-deadline').value
                    ? new Date(document.getElementById('cf-deadline').value).toISOString() : null,
                format: document.getElementById('cf-format').value.trim(),
                group_count: parseInt(document.getElementById('cf-groups').value, 10) || 1,
                venue: document.getElementById('cf-venue').value.trim(),
                description: document.getElementById('cf-desc').value.trim(),
                rules: document.getElementById('cf-rules').value.trim(),
                stream_url: document.getElementById('cf-stream').value.trim(),
                created_by: 'admin',
                cover_image: ''
            };
            var rowSess = (typeof HWAuth !== 'undefined') ? HWAuth.getSession() : null;
            if (rowSess && rowSess.role === 'organizer' && !isAdmin()) row.organizer_id = rowSess.id;
            var btn = document.getElementById('cf-submit');
            var coverInput = document.getElementById('cf-cover');
            var coverFile = coverInput && coverInput.files ? coverInput.files[0] : null;
            if (coverFile && !validateCover(coverFile)) return;
            btn.disabled = true;
            btn.textContent = coverFile ? '上传封面…' : '创建中…';
            var insertRow = function () {
                btn.textContent = '创建中…';
                return HWAuth.getClient().from('events').insert([row]).then(function (res) {
                    btn.disabled = false; btn.textContent = '创建';
                    if (res.error) { HWLayout.toast('创建失败: ' + res.error.message); return; }
                    document.getElementById('create-modal').classList.remove('visible');
                    document.getElementById('create-form').reset();
                    populateSeasonSelect();
                    resetCoverField();
                    refresh();
                });
            };
            if (coverFile) {
                uploadCover(coverFile).then(function (url) {
                    row.cover_image = url;
                    return insertRow();
                }).catch(function (e) {
                    btn.disabled = false; btn.textContent = '创建';
                    HWLayout.toast('封面上传失败: ' + (e.message || e));
                });
            } else insertRow();
        });

        /* ---------- tabs / filters ---------- */
        function switchTab(tab) {
            if (tab === currentTab && !document.getElementById('main-content').innerHTML) tab = currentTab;
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(function (b) {
                b.classList.toggle('active', b.dataset.tab === tab);
            });
            document.getElementById('filter-bar').style.display = tab === 'hall' ? 'flex' : 'none';
            /* 大厅 ⇄ 我的报名：退场→入场，用户看得出「换了一屏」而不是内容跳变 */
            if (typeof HWLayout !== 'undefined' && HWLayout.viewSwap) HWLayout.viewSwap(main, render);
            else render();
        }
        document.querySelectorAll('.tab-btn').forEach(function (b) {
            b.addEventListener('click', function () {
                switchTab(b.dataset.tab);
                location.hash = b.dataset.tab === 'mine' ? 'mine' : '';
            });
        });
        document.getElementById('status-filter').addEventListener('click', function (e) {
            var btn = e.target.closest('button');
            if (!btn) return;
            document.querySelectorAll('#status-filter button').forEach(function (x) { x.classList.remove('active'); });
            btn.classList.add('active');
            currentFilter = btn.dataset.status;
            renderHall();
        });

        /* ---------- global ---------- */
        document.querySelectorAll('[data-close]').forEach(function (b) {
            b.addEventListener('click', function () {
                document.getElementById(b.dataset.close).classList.remove('visible');
            });
        });

        function refresh() {
            /* 方案 B：把「时间已推进但没人改 status」的活动静默落库（幂等 + 10 分钟节流）。
               展示早已由 evState 修正，这一步只让导出的数据与页面一致。 */
            if (typeof HWLayout !== 'undefined' && HWLayout.syncEventStatuses) {
                HWLayout.syncEventStatuses().then(function () {}, function () {});
            }
            return loadData().then(render).catch(function (err) {
                console.error(err);
                main.innerHTML = '<div class="empty-state"><strong>加载失败</strong><br>' + esc(err.message || err) + '</div>';
            });
        }

        /* ---------- 时钟：状态是时间的函数，时间在走，界面就得跟着走 ----------
           只改"会过期的那几处"，不重排列表（重排会闪、会丢焦点、会打断人手上的事）：
           · 卡片：徽章 + 「报名截止」那行的弱化
           · 详情：徽章；若"能不能报名"的答案变了，只在没人操作时整体重画一次
           每 30 秒对齐；页面回到前台 / 窗口获得焦点时立刻对齐。 */
        function tickStatuses() {
            var now = Date.now();
            var changed = 0;
            document.querySelectorAll('.event-card[data-id]').forEach(function (card) {
                var id = Number(card.dataset.id);
                var ev = allEvents.find(function (x) { return x.id === id; });
                if (!ev) return;
                var st = HWLayout.evState(ev, { regs: allRegs, now: now });
                var badge = card.querySelector('[data-ev-phase]');
                if (badge && badge.dataset.evPhase !== st.phase) {
                    badge.className = 'badge badge-' + st.tone;
                    badge.dataset.evPhase = st.phase;
                    badge.textContent = st.label;
                    if (HWLayout.reveal) HWLayout.reveal(badge); /* 变的那一刻给一次回应 */
                    changed++;
                }
                var dl = card.querySelector('[data-deadline]');
                if (dl) dl.classList.toggle('ev-past', !!(st.phase === 'closed' || st.phase === 'ended' || st.phase === 'live'));
            });

            var panel = document.getElementById('detail-panel');
            var openId = panel && panel.dataset.evId ? Number(panel.dataset.evId) : 0;
            if (!openId || !document.getElementById('detail-modal').classList.contains('visible')) return;
            var dev = allEvents.find(function (x) { return x.id === openId; });
            if (!dev) return;
            var dst = HWLayout.evState(dev, { regs: allRegs, now: now });
            var dbadge = panel.querySelector('[data-ev-phase]');
            var joinableNow = !!(dst.joinable && !myRegOf(dev.id));
            var answerChanged = panel.dataset.joinable !== (joinableNow ? '1' : '0');
            if (answerChanged && panel.contains(document.activeElement)) {
                /* 用户正在面板里操作：只更新徽章，不打断他；答案等他松手或下次对齐再刷新 */
                if (dbadge && dbadge.dataset.evPhase !== dst.phase) {
                    dbadge.className = 'badge badge-' + dst.tone;
                    dbadge.dataset.evPhase = dst.phase;
                    dbadge.textContent = dst.label;
                }
                return;
            }
            if (answerChanged) {
                panel.dataset.joinable = joinableNow ? '1' : '0';
                openDetail(openId); /* 答案变了：整个详情重画（边界事件，一次而已） */
                return;
            }
            if (dbadge && dbadge.dataset.evPhase !== dst.phase) {
                dbadge.className = 'badge badge-' + dst.tone;
                dbadge.dataset.evPhase = dst.phase;
                dbadge.textContent = dst.label;
                if (HWLayout.reveal) HWLayout.reveal(dbadge);
            }
        }
        window.__tick = tickStatuses; /* 测试钩子：手动推进时钟（无副作用） */
        if (HWLayout.clock) HWLayout.clock(tickStatuses);

        HWAuth.on(function (evt) { if (evt === 'login' || evt === 'logout') refresh(); });

        HWAuth.init();
        HWAuth.detectAccountSource().catch(function () {}).finally(function () {
            if (location.hash === '#mine') switchTab('mine');
            Promise.resolve(refresh()).then(function () {
                // ?open=<id>：从活动空间/管理枢纽深链进来时自动打开详情
                // ?create=1：管理后台「＋创建活动」直达创建表单（仅管理员）
                var qp = null;
                try { qp = new URLSearchParams(window.location.search); } catch (e) {}
                if (!qp) return;
                var openId = qp.get('open');
                if (openId && /^\d+$/.test(openId)) openDetail(parseInt(openId, 10));
                if (qp.get('create') === '1' && isAdmin()) {
                    document.getElementById('create-modal').classList.add('visible');
                    resetCoverField();
                }
            }).catch(function () {});
        });
    })();
    </script>
</body>
