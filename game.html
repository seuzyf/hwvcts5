<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HWVCT S5 - 无畏契约</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

:root{
  --val-red:#ff4655;--val-dark:#0f1923;--val-darker:#0a1018;
  --val-cyan:#00d4aa;--val-blue:#1a73e8;--val-gold:#ecb731;
  --val-white:#ece8e1;--val-gray:#768079;
}

body{
  font-family:'Noto Sans SC',sans-serif;
  background:var(--val-darker);color:var(--val-white);
  overflow:hidden;width:100vw;height:100vh;user-select:none;
}

#game-container{width:100%;height:100%;position:relative;overflow:hidden}

/* PRELOADER */
#preloader{
  position:absolute;top:0;left:0;width:100%;height:100%;z-index:200;
  background:var(--val-darker);display:flex;flex-direction:column;
  align-items:center;justify-content:center;transition:opacity .8s;
}
#preloader.done{opacity:0;pointer-events:none}
.loader-text{font-size:14px;color:var(--val-gray);letter-spacing:4px;margin-bottom:20px}
.loader-bar-bg{width:300px;height:3px;background:rgba(255,255,255,.1);overflow:hidden}
.loader-bar{height:100%;background:var(--val-red);width:0%;transition:width .3s}

/* BACKGROUNDS */
.bg-layer{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background-size:cover;background-position:center;
  transition:all 1s ease;z-index:1;
}
.bg-lobby{background:linear-gradient(135deg,#0f1923,#1a2a3a 30%,#0f1923 70%,#1a1a2e)}
.bg-lobby::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle at 20% 30%,rgba(255,70,85,.15),transparent 50%),
  radial-gradient(circle at 80% 70%,rgba(0,212,170,.1),transparent 50%),
  repeating-linear-gradient(90deg,transparent,transparent 100px,rgba(255,255,255,.02) 100px,rgba(255,255,255,.02) 101px),
  repeating-linear-gradient(0deg,transparent,transparent 100px,rgba(255,255,255,.02) 100px,rgba(255,255,255,.02) 101px)}
.bg-range{background:linear-gradient(135deg,#1a1a2e,#16213e 50%,#0f3460)}
.bg-range::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle at 50% 50%,rgba(0,212,170,.08),transparent 60%),
  linear-gradient(to bottom,rgba(0,0,0,.3),transparent 30%,transparent 70%,rgba(0,0,0,.5))}
.bg-match{background:linear-gradient(135deg,#1a0a0a,#2a1520 30%,#0f1923 70%,#1a2a3a)}
.bg-match::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle at 30% 40%,rgba(255,70,85,.2),transparent 50%),
  radial-gradient(circle at 70% 60%,rgba(236,183,49,.1),transparent 40%)}
.bg-victory{background:linear-gradient(135deg,#0a1a0a,#1a3a1a 30%,#0f2f1f 70%,#0a2a2a)}
.bg-victory::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle at 50% 40%,rgba(0,212,170,.25),transparent 60%),
  radial-gradient(circle at 50% 60%,rgba(236,183,49,.15),transparent 50%)}
.bg-defeat{background:linear-gradient(135deg,#1a0a0a,#2a0a0a 30%,#1a0f15 70%,#0f0a1a)}
.bg-defeat::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle at 50% 50%,rgba(255,70,85,.2),transparent 60%)}
.bg-tension{background:linear-gradient(135deg,#1a0a1a,#2a1030 30%,#0f1930 70%,#1a1a3a)}
.bg-tension::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle at 50% 30%,rgba(180,77,189,.2),transparent 50%),
  radial-gradient(circle at 30% 70%,rgba(255,70,85,.15),transparent 40%)}

/* TITLE SCREEN */
#title-screen{
  position:absolute;top:0;left:0;width:100%;height:100%;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0a1018,#0f1923 50%,#1a1a2e);
}
#title-screen::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle at 50% 30%,rgba(255,70,85,.2),transparent 50%),
  radial-gradient(circle at 30% 70%,rgba(0,212,170,.1),transparent 40%);
  animation:pulse-bg 4s ease-in-out infinite}
@keyframes pulse-bg{0%,100%{opacity:.8}50%{opacity:1}}

.title-chars{
  position:absolute;bottom:0;left:0;width:100%;height:75%;
  display:flex;justify-content:center;align-items:flex-end;
  opacity:.12;pointer-events:none;overflow:hidden;
}
.title-chars img{height:85%;object-fit:contain;filter:grayscale(1) brightness(.4);margin:0 -20px}

.title-logo{position:relative;z-index:2;text-align:center;margin-bottom:20px}
.title-logo .val-mark{
  font-size:72px;font-weight:900;color:var(--val-red);letter-spacing:8px;
  text-shadow:0 0 40px rgba(255,70,85,.5),0 0 80px rgba(255,70,85,.2);
  animation:glow-text 3s ease-in-out infinite;
}
@keyframes glow-text{
  0%,100%{text-shadow:0 0 40px rgba(255,70,85,.5),0 0 80px rgba(255,70,85,.2)}
  50%{text-shadow:0 0 60px rgba(255,70,85,.7),0 0 120px rgba(255,70,85,.3)}
}
.title-logo .sub-title{font-size:26px;font-weight:300;letter-spacing:12px;margin-top:5px}
.title-logo .season{font-size:16px;color:var(--val-cyan);letter-spacing:6px;margin-top:10px;font-weight:500}

.title-divider{width:200px;height:2px;background:linear-gradient(90deg,transparent,var(--val-red),transparent);margin:30px 0;position:relative;z-index:2}

.start-btn,.confirm-btn,.restart-btn{
  position:relative;z-index:2;padding:16px 60px;font-size:18px;font-weight:700;
  letter-spacing:4px;color:var(--val-white);
  background:linear-gradient(135deg,var(--val-red),#cc3344);border:none;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
  transition:all .3s ease;text-transform:uppercase;font-family:'Noto Sans SC',sans-serif;
}
.start-btn:hover,.confirm-btn:hover,.restart-btn:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(255,70,85,.5)}
.confirm-btn{padding:14px 50px;font-size:16px;letter-spacing:3px}

.particle{
  position:absolute;width:2px;height:2px;background:var(--val-red);border-radius:50%;
  opacity:0;animation:float-particle 6s linear infinite;
}
@keyframes float-particle{
  0%{opacity:0;transform:translateY(100vh) scale(0)}
  10%{opacity:1}90%{opacity:1}
  100%{opacity:0;transform:translateY(-20px) scale(1)}
}

/* NAME SCREEN */
#name-screen{
  position:absolute;top:0;left:0;width:100%;height:100%;z-index:99;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0a1018,#0f1923 50%,#1a1a2e);
}
#name-screen::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:radial-gradient(circle at 50% 50%,rgba(0,212,170,.1),transparent 60%)}
.name-prompt{position:relative;z-index:2;text-align:center}
.name-prompt h2{font-size:24px;font-weight:300;margin-bottom:8px;letter-spacing:4px}
.name-prompt p{font-size:14px;color:var(--val-gray);margin-bottom:30px}
.name-input{
  width:350px;padding:14px 20px;font-size:20px;font-family:'Noto Sans SC',sans-serif;
  color:var(--val-white);background:rgba(255,255,255,.05);
  border:2px solid rgba(255,70,85,.3);outline:none;text-align:center;letter-spacing:2px;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
  transition:border-color .3s;margin-bottom:30px;display:block;margin-left:auto;margin-right:auto;
}
.name-input:focus{border-color:var(--val-red);box-shadow:0 0 20px rgba(255,70,85,.2)}
.name-input::placeholder{color:rgba(255,255,255,.2)}

/* GAME SCENE */
#game-scene{
  position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;
  display:none;opacity:0;transition:opacity .8s ease;
}
#game-scene.active{display:block;opacity:1}

/* CHARACTERS */
.character-layer{position:absolute;bottom:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none}
.character{
  position:absolute;bottom:-30px;
  transition:all .7s cubic-bezier(.22,.61,.36,1);
  opacity:0;transform:translateY(60px);
  filter:brightness(.45) saturate(.5);
}
.character.active{filter:brightness(1) saturate(1) drop-shadow(0 0 25px rgba(255,70,85,.12))}
.character.visible{opacity:1;transform:translateY(0)}
.character img{height:100%;width:auto;object-fit:contain;pointer-events:none}
.character.pos-right{right:2%;height:88%}
.character.pos-center{left:50%;height:88%;transform:translateX(-50%) translateY(60px)}
.character.pos-center.visible{transform:translateX(-50%) translateY(0)}
.character.pos-left{left:2%;height:80%}
.character.pos-far-left{left:-2%;height:72%}
.character.pos-center-left{left:20%;height:78%}
.character.pos-center-right{right:20%;height:78%}
.character.pos-far-right{right:-2%;height:72%}
.char-nametag{
  position:absolute;bottom:35px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.75);padding:4px 16px;font-size:11px;font-weight:700;
  letter-spacing:3px;white-space:nowrap;border-bottom:2px solid var(--val-red);
  backdrop-filter:blur(4px);opacity:0;transition:opacity .5s .3s;
}
.character.visible .char-nametag{opacity:1}

/* DIALOGUE */
.dialogue-container{
  position:absolute;bottom:0;left:0;width:100%;z-index:20;padding:0 20px 20px;
}
.dialogue-box{
  width:100%;max-width:1100px;margin:0 auto;
  background:linear-gradient(180deg,rgba(15,25,35,.93),rgba(10,16,24,.97));
  border:1px solid rgba(255,70,85,.25);border-top:3px solid var(--val-red);
  padding:20px 30px 25px;position:relative;
  clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px));
  backdrop-filter:blur(12px);cursor:pointer;
}
.dialogue-box::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(90deg,rgba(255,70,85,.05),transparent 30%);pointer-events:none}
.speaker-name{
  font-size:16px;font-weight:700;color:var(--val-red);letter-spacing:3px;
  margin-bottom:10px;text-transform:uppercase;display:flex;align-items:center;gap:10px;
}
.speaker-name .role-tag{
  font-size:10px;padding:2px 8px;background:rgba(255,70,85,.2);
  border:1px solid rgba(255,70,85,.3);border-radius:2px;color:var(--val-red);
  letter-spacing:1px;font-weight:500;
}
.dialogue-text{font-size:16px;line-height:1.9;min-height:55px;font-weight:300}
.click-indicator{
  position:absolute;bottom:12px;right:20px;font-size:12px;color:var(--val-gray);
  animation:blink 1.5s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

/* CHOICES */
.choices-container{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;
  display:none;flex-direction:column;gap:12px;width:520px;max-width:92%;
}
.choices-container.active{display:flex;animation:fadeSlideUp .5s ease}
@keyframes fadeSlideUp{from{opacity:0;transform:translate(-50%,-40%)}to{opacity:1;transform:translate(-50%,-50%)}}
.choice-btn{
  padding:16px 24px;font-size:15px;font-family:'Noto Sans SC',sans-serif;font-weight:500;
  color:var(--val-white);background:rgba(15,25,35,.92);
  border:1px solid rgba(255,70,85,.3);border-left:4px solid var(--val-red);
  cursor:pointer;text-align:left;transition:all .3s ease;position:relative;overflow:hidden;
  backdrop-filter:blur(8px);
}
.choice-btn::before{content:'';position:absolute;top:0;left:0;width:0;height:100%;
  background:linear-gradient(90deg,rgba(255,70,85,.15),transparent);transition:width .3s}
.choice-btn:hover{border-color:var(--val-red);transform:translateX(8px);box-shadow:0 0 20px rgba(255,70,85,.2)}
.choice-btn:hover::before{width:100%}
.choice-btn .choice-key{
  display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;
  background:var(--val-red);color:white;font-size:12px;font-weight:700;margin-right:12px;
  clip-path:polygon(0 0,calc(100% - 4px) 0,100% 4px,100% 100%,4px 100%,0 calc(100% - 4px));
  vertical-align:middle;
}

/* HUD */
.hud-top{
  position:absolute;top:0;left:0;width:100%;padding:15px 25px;
  display:flex;justify-content:space-between;align-items:center;z-index:25;
  background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);pointer-events:none;
}
.hud-logo{font-size:14px;font-weight:700;color:var(--val-red);letter-spacing:3px}
.hud-chapter{font-size:12px;color:var(--val-gray);letter-spacing:2px}

/* SCOREBOARD */
.scoreboard{
  position:absolute;top:55px;left:50%;transform:translateX(-50%);z-index:25;
  display:none;align-items:center;gap:30px;background:rgba(15,25,35,.92);
  padding:12px 40px;border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
}
.scoreboard.visible{display:flex;animation:fadeIn .5s ease}
.score-team{text-align:center}
.score-team .team-name{font-size:11px;color:var(--val-gray);letter-spacing:2px;margin-bottom:4px}
.score-team .score-num{font-size:36px;font-weight:900;transition:transform .3s}
.score-team.ally .score-num{color:var(--val-cyan)}
.score-team.enemy .score-num{color:var(--val-red)}
.score-divider{width:2px;height:40px;background:rgba(255,255,255,.2)}
.score-map{font-size:11px;color:var(--val-gray);letter-spacing:2px;text-align:center}

/* MINI GAMES */
.minigame-overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;z-index:32;
  display:none;align-items:center;justify-content:center;flex-direction:column;
  background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
}
.minigame-overlay.active{display:flex;animation:fadeIn .4s ease}

/* Aim Trainer */
.aim-game{
  width:600px;height:400px;max-width:90vw;max-height:50vh;
  background:rgba(15,25,35,.95);border:2px solid rgba(255,70,85,.3);
  position:relative;overflow:hidden;cursor:crosshair;
  border-top:3px solid var(--val-red);
}
.aim-game .crosshair{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;z-index:5;font-size:24px;color:rgba(255,255,255,.5);
}
.aim-target{
  position:absolute;width:50px;height:50px;border-radius:50%;
  background:radial-gradient(circle,var(--val-red),#cc3344);
  cursor:crosshair;transition:transform .1s;
  box-shadow:0 0 20px rgba(255,70,85,.5);
  animation:targetPulse 1s ease-in-out infinite;
}
@keyframes targetPulse{0%,100%{box-shadow:0 0 20px rgba(255,70,85,.5)}50%{box-shadow:0 0 35px rgba(255,70,85,.8)}}
.aim-target::after{
  content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:12px;height:12px;border-radius:50%;background:white;
}
.aim-target:active{transform:scale(.8)}

.mg-header{
  text-align:center;margin-bottom:20px;z-index:2;position:relative;
}
.mg-title{font-size:22px;font-weight:700;color:var(--val-red);letter-spacing:4px;margin-bottom:6px}
.mg-desc{font-size:13px;color:var(--val-gray);letter-spacing:1px}

.mg-stats{
  position:absolute;top:10px;left:0;width:100%;display:flex;justify-content:space-between;
  padding:0 15px;z-index:3;pointer-events:none;
}
.mg-stat{font-size:14px;font-weight:700;letter-spacing:2px}
.mg-timer{color:var(--val-gold)}
.mg-score-display{color:var(--val-cyan)}

/* Timing Game */
.timing-game{
  width:500px;max-width:90vw;text-align:center;
  background:rgba(15,25,35,.95);border:2px solid rgba(255,70,85,.3);
  border-top:3px solid var(--val-red);padding:40px 30px;
}
.timing-bar-container{
  width:100%;height:40px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);position:relative;margin:25px 0;
  overflow:hidden;
}
.timing-bar-fill{
  position:absolute;top:0;left:0;height:100%;width:0%;
  background:linear-gradient(90deg,var(--val-cyan),var(--val-red));
  transition:none;
}
.timing-zone{
  position:absolute;top:0;height:100%;
  background:rgba(0,212,170,.25);border-left:2px solid var(--val-cyan);
  border-right:2px solid var(--val-cyan);
}
.timing-btn{
  padding:16px 50px;font-size:18px;font-weight:700;letter-spacing:3px;
  color:var(--val-white);background:linear-gradient(135deg,var(--val-red),#cc3344);
  border:none;cursor:pointer;font-family:'Noto Sans SC',sans-serif;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
  transition:all .2s;
}
.timing-btn:hover{transform:scale(1.05)}
.timing-btn:active{transform:scale(.95)}

/* Reaction Game */
.reaction-game{
  width:400px;max-width:90vw;text-align:center;
  background:rgba(15,25,35,.95);border:2px solid rgba(255,70,85,.3);
  border-top:3px solid var(--val-red);padding:40px 30px;
}
.reaction-circle{
  width:200px;height:200px;border-radius:50%;margin:20px auto;
  background:rgba(255,255,255,.05);border:3px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--val-gray);letter-spacing:2px;cursor:pointer;
  transition:all .15s;
}
.reaction-circle.waiting{background:rgba(255,70,85,.15);border-color:rgba(255,70,85,.4)}
.reaction-circle.go{background:rgba(0,212,170,.3);border-color:var(--val-cyan);color:var(--val-cyan);font-size:24px;font-weight:700}
.reaction-circle.result-good{background:rgba(0,212,170,.2);border-color:var(--val-cyan)}
.reaction-circle.result-bad{background:rgba(255,70,85,.2);border-color:var(--val-red)}

/* TRANSITIONS */
.screen-flash{
  position:absolute;top:0;left:0;width:100%;height:100%;background:white;
  z-index:50;opacity:0;pointer-events:none;transition:opacity .1s;
}
.screen-flash.active{opacity:.7}
.fade-overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;background:black;
  z-index:40;opacity:0;pointer-events:none;transition:opacity .8s ease;
}
.fade-overlay.active{opacity:1;pointer-events:all}

/* RESULT */
.result-overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;z-index:35;
  display:none;align-items:center;justify-content:center;flex-direction:column;
}
.result-overlay.active{display:flex;animation:fadeIn 1s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.result-text{
  font-size:76px;font-weight:900;letter-spacing:20px;margin-bottom:20px;
  animation:resultSlam .8s cubic-bezier(.22,.61,.36,1);
}
@keyframes resultSlam{0%{transform:scale(3);opacity:0}60%{transform:scale(.9)}100%{transform:scale(1);opacity:1}}
.result-victory{color:var(--val-cyan);text-shadow:0 0 60px rgba(0,212,170,.5)}
.result-defeat{color:var(--val-red);text-shadow:0 0 60px rgba(255,70,85,.5)}
.result-sub{font-size:18px;color:var(--val-gray);letter-spacing:4px;font-weight:300}
.restart-btn{margin-top:40px;padding:14px 40px;font-size:15px;letter-spacing:3px}

/* NOTIFICATION */
.notification{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:36;
  background:rgba(15,25,35,.95);border:1px solid rgba(255,70,85,.4);
  padding:24px 50px;text-align:center;display:none;backdrop-filter:blur(10px);
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
}
.notification.active{display:block;animation:notifIn .5s ease}
@keyframes notifIn{from{opacity:0;transform:translate(-50%,-50%) scale(.8)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.notification .notif-title{font-size:26px;font-weight:700;color:var(--val-red);letter-spacing:6px;margin-bottom:8px}
.notification .notif-desc{font-size:14px;color:var(--val-gray);letter-spacing:2px}

/* GROUP CHAT */
.group-chat-overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;z-index:20;
  display:none;align-items:center;justify-content:center;
}
.group-chat-overlay.active{display:flex}
.group-chat-box{
  width:520px;max-width:92%;max-height:72vh;
  background:rgba(10,16,24,.96);border:1px solid rgba(255,70,85,.2);
  border-top:3px solid var(--val-red);overflow-y:auto;padding:20px;
  backdrop-filter:blur(12px);
}
.chat-header{
  font-size:12px;color:var(--val-gray);letter-spacing:3px;text-align:center;
  margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.05);
}
.chat-message{
  display:flex;gap:12px;margin-bottom:16px;opacity:0;transform:translateY(10px);transition:all .4s ease;
}
.chat-message.visible{opacity:1;transform:translateY(0)}
.chat-avatar{
  width:40px;height:40px;border-radius:6px;overflow:hidden;flex-shrink:0;
  background:rgba(255,255,255,.05);
}
.chat-avatar img{width:100%;height:100%;object-fit:cover;object-position:top center}
.chat-avatar.player-avatar{
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(0,212,170,.3),rgba(0,212,170,.1));
  border:1px solid rgba(0,212,170,.3);font-size:18px;
}
.chat-content{flex:1}
.chat-author{font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:4px}
.chat-text{font-size:14px;line-height:1.6;font-weight:300}
.chat-continue{text-align:center;margin-top:18px;padding-top:15px;border-top:1px solid rgba(255,255,255,.05)}
.chat-continue-btn{
  padding:12px 35px;font-size:13px;font-family:'Noto Sans SC',sans-serif;
  color:var(--val-white);background:rgba(255,70,85,.2);border:1px solid rgba(255,70,85,.4);
  cursor:pointer;letter-spacing:2px;transition:all .3s;
  clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px));
}
.chat-continue-btn:hover{background:rgba(255,70,85,.4)}

/* MG RESULT FLASH */
.mg-result-flash{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:48px;font-weight:900;letter-spacing:8px;
  animation:mgFlash .8s ease forwards;z-index:10;
}
@keyframes mgFlash{
  0%{opacity:0;transform:scale(2)}
  30%{opacity:1;transform:scale(1)}
  70%{opacity:1}
  100%{opacity:0}
}
.mg-result-flash.success{color:var(--val-cyan);text-shadow:0 0 40px rgba(0,212,170,.5)}
.mg-result-flash.fail{color:var(--val-red);text-shadow:0 0 40px rgba(255,70,85,.5)}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,70,85,.3);border-radius:2px}

@media(max-width:768px){
  .title-logo .val-mark{font-size:38px;letter-spacing:3px}
  .title-logo .sub-title{font-size:14px;letter-spacing:5px}
  .character{height:52%!important}
  .dialogue-box{padding:14px 18px 18px}
  .dialogue-text{font-size:13px;min-height:40px}
  .speaker-name{font-size:13px}
  .choices-container{width:95%}
  .choice-btn{font-size:12px;padding:12px 16px}
  .result-text{font-size:42px;letter-spacing:8px}
  .name-input{width:280px;font-size:16px}
  .aim-game{width:95vw;height:45vh}
  .timing-game,.reaction-game{width:95vw}
}
</style>
</head>
<body>
<div id="game-container">
  <div id="preloader">
    <div class="loader-text">加载角色资源中...</div>
    <div class="loader-bar-bg"><div class="loader-bar" id="loader-bar"></div></div>
  </div>

  <div id="title-screen" style="display:none">
    <div class="title-chars">
      <img src="https://storage.moegirl.org.cn/moegirl/commons/c/c7/VALORANT_Sova.png" alt="">
      <img src="https://storage.moegirl.org.cn/moegirl/commons/f/f5/VALORANT_Jett.png" alt="">
      <img src="https://storage.moegirl.org.cn/moegirl/commons/4/46/VALORANT_Reyna.png" alt="">
      <img src="https://storage.moegirl.org.cn/moegirl/commons/8/8b/VALORANT_Sage.png" alt="">
      <img src="https://storage.moegirl.org.cn/moegirl/commons/f/f7/VALORANT_Neon.png" alt="">
    </div>
    <div class="title-logo">
      <div class="val-mark">VALORANT</div>
      <div class="sub-title">无 畏 契 约</div>
      <div class="season">HWVCT SEASON 5</div>
    </div>
    <div class="title-divider"></div>
    <button class="start-btn" onclick="startGame()">开 始 游 戏</button>
  </div>

  <div id="name-screen">
    <div class="name-prompt">
      <h2>请输入你的代号</h2>
      <p>这将是你在 HWVCT S5 中的战队ID</p>
      <input type="text" class="name-input" id="player-name" placeholder="输入代号..." maxlength="12" onkeydown="if(event.key==='Enter')confirmName()">
      <button class="confirm-btn" onclick="confirmName()">确 认</button>
    </div>
  </div>

  <div id="game-scene">
    <div class="bg-layer bg-lobby" id="bg-layer"></div>
    <div class="hud-top">
      <div class="hud-logo">HWVCT S5</div>
      <div class="hud-chapter" id="hud-chapter">序章</div>
    </div>
    <div class="scoreboard" id="scoreboard">
      <div class="score-team ally"><div class="team-name">我方</div><div class="score-num" id="score-ally">0</div></div>
      <div><div class="score-map" id="score-map">HAVEN</div><div class="score-divider" style="margin:8px auto"></div></div>
      <div class="score-team enemy"><div class="team-name">敌方</div><div class="score-num" id="score-enemy">0</div></div>
    </div>
    <div class="character-layer" id="char-layer"></div>
    <div class="dialogue-container" id="dialogue-container" style="display:none">
      <div class="dialogue-box" id="dialogue-box" onclick="advanceDialogue()">
        <div class="speaker-name" id="speaker-name"></div>
        <div class="dialogue-text" id="dialogue-text"></div>
        <div class="click-indicator" id="click-indicator">▼ 点击继续</div>
      </div>
    </div>
    <div class="choices-container" id="choices-container"></div>
    <div class="group-chat-overlay" id="group-chat"></div>
    <div class="minigame-overlay" id="minigame-overlay"></div>
    <div class="notification" id="notification">
      <div class="notif-title" id="notif-title"></div>
      <div class="notif-desc" id="notif-desc"></div>
    </div>
    <div class="result-overlay" id="result-overlay"></div>
    <div class="screen-flash" id="screen-flash"></div>
    <div class="fade-overlay" id="fade-overlay"></div>
  </div>
</div>

<script>
const CHAR_IMAGES={
  jett:'https://storage.moegirl.org.cn/moegirl/commons/f/f5/VALORANT_Jett.png',
  reyna:'https://storage.moegirl.org.cn/moegirl/commons/4/46/VALORANT_Reyna.png',
  sage:'https://storage.moegirl.org.cn/moegirl/commons/8/8b/VALORANT_Sage.png',
  sova:'https://storage.moegirl.org.cn/moegirl/commons/c/c7/VALORANT_Sova.png',
  clove:'https://storage.moegirl.org.cn/moegirl/commons/2/2b/VALORANT_Clove.png',
  neon:'https://storage.moegirl.org.cn/moegirl/commons/f/f7/VALORANT_Neon.png',
  brimstone:'https://storage.moegirl.org.cn/moegirl/commons/3/3d/VALORANT_Brimstone.png',
  killjoy:'https://storage.moegirl.org.cn/moegirl/commons/6/64/VALORANT_Killjoy.png',
};

const CHARS={
  jett:{name:'JETT',color:'#5eb5f7',role:'决斗者'},
  reyna:{name:'REYNA',color:'#b44dbd',role:'决斗者'},
  sova:{name:'SOVA',color:'#2a7ae8',role:'先锋'},
  sage:{name:'SAGE',color:'#4adbc4',role:'哨位'},
  clove:{name:'CLOVE',color:'#d46ab8',role:'控场'},
  neon:{name:'NEON',color:'#1ce0d9',role:'决斗者'},
  brimstone:{name:'BRIMSTONE',color:'#e67e22',role:'控场'},
  killjoy:{name:'KILLJOY',color:'#f1c40f',role:'哨位'},
  player:{name:'',color:'#00d4aa',role:''},
};

const G={
  playerName:'',role:'',partnerAgent:'',
  score:{ally:0,enemy:0},
  matchChoices:[],
  mgWins:0,mgTotal:0,
  currentNode:null,dialogueQueue:[],dialogueIndex:0,
  isTyping:false,typeTimer:null,canAdvance:false,
};

// PRELOAD
function preloadImages(){
  const urls=Object.values(CHAR_IMAGES);
  let loaded=0;const total=urls.length;
  const bar=document.getElementById('loader-bar');
  return new Promise(resolve=>{
    urls.forEach(url=>{
      const img=new Image();
      img.onload=img.onerror=()=>{loaded++;bar.style.width=(loaded/total*100)+'%';if(loaded>=total)resolve()};
      img.src=url;
    });
    setTimeout(resolve,10000);
  });
}

async function init(){
  await preloadImages();
  const p=document.getElementById('preloader');
  p.classList.add('done');
  setTimeout(()=>{p.style.display='none';document.getElementById('title-screen').style.display='flex';createParticles()},800);
}

function startGame(){
  const ts=document.getElementById('title-screen');
  ts.style.opacity='0';ts.style.transition='opacity .8s';
  setTimeout(()=>{ts.style.display='none';
    const ns=document.getElementById('name-screen');ns.style.display='flex';ns.style.opacity='0';
    requestAnimationFrame(()=>{ns.style.transition='opacity .8s';ns.style.opacity='1'});
    document.getElementById('player-name').focus();
  },800);
}

function confirmName(){
  const name=document.getElementById('player-name').value.trim();
  if(!name){document.getElementById('player-name').style.borderColor='#ff4655';return}
  G.playerName=name;CHARS.player.name=name.toUpperCase();
  const ns=document.getElementById('name-screen');ns.style.opacity='0';
  setTimeout(()=>{ns.style.display='none';beginStory()},800);
}

function beginStory(){
  const gs=document.getElementById('game-scene');gs.style.display='block';
  requestAnimationFrame(()=>gs.classList.add('active'));
  setTimeout(()=>playNode('intro_1'),600);
}

function restartGame(){
  G.role='';G.partnerAgent='';G.score={ally:0,enemy:0};
  G.matchChoices=[];G.mgWins=0;G.mgTotal=0;
  hideResult();showScoreboard(false);clearCharacters();hideDialogue();
  document.getElementById('choices-container').classList.remove('active');
  document.getElementById('choices-container').innerHTML='';
  document.getElementById('group-chat').classList.remove('active');
  document.getElementById('group-chat').innerHTML='';
  fadeTransition(()=>playNode('intro_1'));
}

// ===== STORY NODES =====
function getStoryNodes(){
  const P=G.playerName;
  return {
    'intro_1':{
      bg:'bg-lobby',chapter:'第一章 · 初遇',
      chars:[{id:'jett',pos:'pos-right',active:true}],
      dialogue:[
        {speaker:'jett',text:`嘿！你就是今天来报名 HWVCT S5 的新选手吧？`},
        {speaker:'jett',text:`我是 Jett。让我看看……"${P}"，对吧？名单上确实有你的名字。`},
        {speaker:'jett',text:`欢迎来到无畏契约的世界。不过在此之前，我需要了解一下你——`},
        {speaker:'jett',text:`告诉我，你在比赛中最擅长打什么位置？`},
      ],
      choices:[
        {text:'一突 · Entry —— 我喜欢第一个冲进去',next:'role_duelist1'},
        {text:'二突 · Follow Up —— 我擅长跟进补枪',next:'role_duelist2'},
        {text:'先锋 · Initiator —— 收集情报为队伍开路',next:'role_initiator'},
        {text:'哨位 · Sentinel —— 守护防线给队友安全感',next:'role_sentinel'},
        {text:'烟位 · Controller —— 掌控战场节奏',next:'role_smoker'},
        {text:'补位 · Flex —— 我什么都能打',next:'role_flex'},
      ]
    },

    'role_duelist1':{
      bg:'bg-lobby',chapter:'第一章 · 决斗者之路',
      chars:[{id:'jett',pos:'pos-right',active:true}],
      onEnter:()=>{G.role='duelist1';G.partnerAgent='jett'},
      dialogue:[
        {speaker:'jett',text:`哦？一突？！`},
        {speaker:'jett',text:`哈哈，我们是同一类人！喜欢风驰电掣的感觉，对吧？`},
        {speaker:'jett',text:`${P}，我们队伍正好缺一个有胆量的一突选手。`},
        {speaker:'jett',text:`你的眼神告诉我，你不怕死。这在战场上很重要。`},
        {speaker:'player',text:`放心，进点的事情交给我。`},
        {speaker:'jett',text:`${P}，你就是我们一直在找的最后一块拼图！欢迎加入！`},
      ],next:'team_gather'
    },

    'role_duelist2':{
      bg:'bg-lobby',chapter:'第一章 · 暗影猎手',
      chars:[{id:'jett',pos:'pos-left',active:false},{id:'reyna',pos:'pos-right',active:true}],
      onEnter:()=>{G.role='duelist2';G.partnerAgent='reyna'},
      dialogue:[
        {speaker:'jett',text:`二突吗？需要冷静和精准……Reyna，过来！这位是 ${P}。`},
        {speaker:'reyna',text:`嗯？让我看看……二突选手。`},
        {speaker:'reyna',text:`跟在别人身后，等待最佳时机出手……需要比一突更强的心理素质。`},
        {speaker:'player',text:`我更喜欢在暗处等待猎物露出破绽。`},
        {speaker:'reyna',text:`哦？我喜欢你的说话方式。我们队伍正缺你这样的人。别让我失望。`},
      ],next:'team_gather'
    },

    'role_initiator':{
      bg:'bg-lobby',chapter:'第一章 · 情报先锋',
      chars:[{id:'jett',pos:'pos-left',active:false},{id:'sova',pos:'pos-right',active:true}],
      onEnter:()=>{G.role='initiator';G.partnerAgent='sova'},
      dialogue:[
        {speaker:'jett',text:`先锋？太好了！Sova 一直在找搭档。`},
        {speaker:'sova',text:`你好，${P}。先锋是队伍的眼睛。不需要最强的枪法，但需要最清晰的头脑。`},
        {speaker:'player',text:`情报就是胜利的基础。`},
        {speaker:'sova',text:`说得好。${P}，欢迎加入。你就是我们缺少的那个人。`},
      ],next:'team_gather'
    },

    'role_sentinel':{
      bg:'bg-lobby',chapter:'第一章 · 守护之壁',
      chars:[{id:'jett',pos:'pos-left',active:false},{id:'sage',pos:'pos-right',active:true}],
      onEnter:()=>{G.role='sentinel';G.partnerAgent='sage'},
      dialogue:[
        {speaker:'jett',text:`哨位！我去叫 Sage。我们的防线一直缺个可靠的人。`},
        {speaker:'sage',text:`你好，${P}。哨位选手是队伍的脊梁。不那么耀眼，但不可或缺。`},
        {speaker:'player',text:`我愿意做在背后默默守护的人。`},
        {speaker:'sage',text:`"真正的强大，是让身边的人感到安心。" ${P}，欢迎加入。`},
      ],next:'team_gather'
    },

    'role_smoker':{
      bg:'bg-lobby',chapter:'第一章 · 迷雾主宰',
      chars:[{id:'jett',pos:'pos-left',active:false},{id:'clove',pos:'pos-right',active:true}],
      onEnter:()=>{G.role='smoker';G.partnerAgent='clove'},
      dialogue:[
        {speaker:'jett',text:`烟位！Clove 一直想找个能交流的同行。`},
        {speaker:'clove',text:`嘿嘿，${P}！烟位可不只是丢烟雾弹哦~我们掌控着进攻节奏！`},
        {speaker:'player',text:`战场的节奏，就应该掌握在我们手中。`},
        {speaker:'clove',text:`说得好酷！${P}，你就是我们缺少的最后那个人！欢迎~`},
      ],next:'team_gather'
    },

    'role_flex':{
      bg:'bg-lobby',chapter:'第一章 · 万能战士',
      chars:[{id:'jett',pos:'pos-left',active:false},{id:'neon',pos:'pos-right',active:true}],
      onEnter:()=>{G.role='flex';G.partnerAgent='neon'},
      dialogue:[
        {speaker:'jett',text:`补位？通才型选手！Neon，你来！`},
        {speaker:'neon',text:`新队友！${P}？补位选手！最难也最灵活的位置！`},
        {speaker:'player',text:`不管需要什么，我都能胜任。`},
        {speaker:'neon',text:`这就是我想听的！欢迎加入！有你在，我们无敌了！`},
      ],next:'team_gather'
    },

    'team_gather':{
      bg:'bg-lobby',chapter:'第二章 · 集结',
      onEnter:()=>{showNotification('全员集结','队伍成员已到齐',2200)},
      groupChat:{messages:[
        {author:'jett',text:`@所有人 新队友 ${P} 加入了！`},
        {author:'sova',text:`欢迎。终于凑齐五个人了。`},
        {author:'sage',text:`你好，${P}。期待与你并肩作战。`},
        {author:'clove',text:`耶~新朋友！🎉`},
        {author:'neon',text:`太棒了！！！可以开始训练赛了！！⚡`},
        {author:'reyna',text:`嗯。希望你能跟上节奏。`},
        {author:'killjoy',text:`新人？数据看起来还不错。欢迎。`},
        {author:'player',text:`大家好，我是 ${P}。请多指教！`},
        {author:'brimstone',text:`我是教练 Brimstone。人齐了——明天有训练赛，对手是上赛季四强。`},
        {author:'brimstone',text:`地图 Haven。所有人今晚早点休息。明天见。`},
      ],next:'pre_match'}
    },

    'pre_match':{
      bg:'bg-range',chapter:'第三章 · 赛前热身',
      chars:[{id:G.partnerAgent||'jett',pos:'pos-right',active:true}],
      dialogue:[
        {speaker:G.partnerAgent||'jett',text:`${P}，比赛前先热身一下吧。来射击训练场试试手感。`},
        {speaker:'player',text:`好。让我找找状态。`},
        {speaker:G.partnerAgent||'jett',text:`来吧！打中靶心越多越好。这是检验你枪法的好机会。`},
      ],next:'minigame_aim'
    },

    'minigame_aim':{
      bg:'bg-range',chapter:'第三章 · 射击训练',
      onEnter:()=>startAimGame(),
    },

    'aim_result_good':{
      bg:'bg-range',chapter:'第三章 · 手感火热',
      chars:[{id:G.partnerAgent||'jett',pos:'pos-right',active:true}],
      onEnter:()=>{G.mgWins++},
      dialogue:[
        {speaker:G.partnerAgent||'jett',text:`不错！${P}，你的枪法相当可以！`},
        {speaker:G.partnerAgent||'jett',text:`看来今天状态很好。带着这个手感上场吧！`},
        {speaker:'player',text:`嗯，感觉找到节奏了。`},
      ],next:'match_start'
    },

    'aim_result_bad':{
      bg:'bg-range',chapter:'第三章 · 还需练习',
      chars:[{id:'killjoy',pos:'pos-left',active:false},{id:G.partnerAgent||'jett',pos:'pos-right',active:true}],
      dialogue:[
        {speaker:G.partnerAgent||'jett',text:`嗯……手感还没到位。不过没关系，比赛和练习不一样。`},
        {speaker:'killjoy',text:`根据我的分析，${P} 的反应速度没问题。只是需要更多实战经验。`},
        {speaker:'player',text:`我会在比赛中找回状态的。`},
        {speaker:G.partnerAgent||'jett',text:`这就对了。相信自己！`},
      ],next:'match_start'
    },

    'match_start':{
      bg:'bg-match',chapter:'第四章 · 训练赛开始',
      onEnter:()=>{showScoreboard(true);updateScore(0,0);showNotification('比赛开始','HAVEN · 攻方先手',2500)},
      chars:[{id:'brimstone',pos:'pos-left',active:true},{id:'jett',pos:'pos-right',active:false}],
      dialogue:[
        {speaker:'narrator',text:`—— HAVEN · 攻方先手 ——`},
        {speaker:'brimstone',text:`手枪局。所有人听指挥。${P}，你觉得我们怎么开局？`},
      ],
      choices:[
        {text:'Rush B！闪光全交，打他们措手不及',next:'round1_rush'},
        {text:'做默认布局，三路分散收集信息后再做决定',next:'round1_default'},
        {text:'直接干中路，拿到中路控制权后看情况',next:'round1_mid'},
      ]
    },

    'round1_rush':{
      bg:'bg-match',chapter:'第四章 · 第一局',
      onEnter:()=>{G.matchChoices.push('rush')},
      chars:[{id:'neon',pos:'pos-left',active:true},{id:'jett',pos:'pos-right',active:true}],
      dialogue:[
        {speaker:'neon',text:`Rush B！！冲啊！！`},
        {speaker:'narrator',text:`—— 全队迅速压向 B 点 ——`},
        {speaker:'jett',text:`他们有两个人守！${P}，你先进！`},
        {speaker:'narrator',text:`拐角处，你和对手正面相遇——`},
      ],next:'minigame_reaction_r1'
    },

    'minigame_reaction_r1':{
      bg:'bg-match',chapter:'第四章 · 对枪！',
      onEnter:()=>startReactionGame('r1'),
    },

    'r1_reaction_win':{
      bg:'bg-match',chapter:'第四章 · 首局',
      chars:[{id:'neon',pos:'pos-left',active:true},{id:'jett',pos:'pos-right',active:true}],
      onEnter:()=>{G.mgWins++;updateScore(1,0)},
      dialogue:[
        {speaker:'narrator',text:`你反应极快！一枪爆头，对手应声倒地。队友跟进拿下首局！`},
        {speaker:'neon',text:`漂亮！！${P} 太猛了！！`},
        {speaker:'jett',text:`这个Entry太帅了！`},
      ],next:'round_mid_1'
    },

    'r1_reaction_lose':{
      bg:'bg-match',chapter:'第四章 · 首局',
      chars:[{id:'sage',pos:'pos-left',active:true},{id:'jett',pos:'pos-right',active:true}],
      onEnter:()=>{updateScore(0,1)},

// 1. AIM GAME - 射击训练
function startAimGame(){
  hideDialogue();clearCharacters();
  const overlay=document.getElementById('minigame-overlay');
  overlay.innerHTML=`
    <div class="mg-header">
      <div class="mg-title">射 击 训 练</div>
      <div class="mg-desc">在限时内点击尽可能多的目标 · 目标：5个以上过关</div>
    </div>
    <div class="aim-game" id="aim-arena">
      <div class="mg-stats">
        <div class="mg-stat mg-timer" id="aim-timer">10s</div>
        <div class="mg-stat mg-score-display" id="aim-score">击中: 0</div>
      </div>
    </div>
  `;
  overlay.classList.add('active');

  let score=0,timeLeft=10,gameActive=true;
  const arena=document.getElementById('aim-arena');
  const timerEl=document.getElementById('aim-timer');
  const scoreEl=document.getElementById('aim-score');

  function spawnTarget(){
    if(!gameActive)return;
    const t=document.createElement('div');
    t.className='aim-target';
    const maxW=arena.clientWidth-60,maxH=arena.clientHeight-80;
    t.style.left=Math.random()*maxW+'px';
    t.style.top=(30+Math.random()*(maxH-30))+'px';
    const size=30+Math.random()*30;
    t.style.width=size+'px';t.style.height=size+'px';
    t.onclick=(e)=>{
      e.stopPropagation();
      if(!gameActive)return;
      score++;scoreEl.textContent='击中: '+score;
      flash();t.remove();
      setTimeout(spawnTarget,200);
    };
    arena.appendChild(t);
    setTimeout(()=>{if(t.parentNode&&gameActive)t.remove();spawnTarget()},1500);
  }

  const timer=setInterval(()=>{
    timeLeft--;timerEl.textContent=timeLeft+'s';
    if(timeLeft<=3)timerEl.style.color='var(--val-red)';
    if(timeLeft<=0){
      clearInterval(timer);gameActive=false;
      arena.querySelectorAll('.aim-target').forEach(t=>t.remove());
      showMGResult(score>=5,overlay,score>=5?'aim_result_good':'aim_result_bad',`击中 ${score} 个`);
    }
  },1000);

  setTimeout(spawnTarget,500);
  setTimeout(()=>{if(gameActive)spawnTarget()},800);
}

  const overlay=document.getElementById('minigame-overlay');
  overlay.innerHTML=`
    <div class="mg-header">
      <div class="mg-title">进 攻 作 战</div>
      <div class="mg-desc">快速消灭出现的敌人！目标：6个以上过关</div>
    </div>
    <div class="aim-game" id="aim-arena2">
      <div class="mg-stats">
        <div class="mg-stat mg-timer" id="aim-timer2">12s</div>
        <div class="mg-stat mg-score-display" id="aim-score2">击杀: 0</div>
      </div>
    </div>
  `;
  overlay.classList.add('active');

  let score=0,timeLeft=12,gameActive=true;
  const arena=document.getElementById('aim-arena2');
  const timerEl=document.getElementById('aim-timer2');
  const scoreEl=document.getElementById('aim-score2');

  function spawnTarget(){
    if(!gameActive)return;
    const t=document.createElement('div');
    t.className='aim-target';
    const maxW=arena.clientWidth-60,maxH=arena.clientHeight-80;
    t.style.left=Math.random()*maxW+'px';
    t.style.top=(30+Math.random()*(maxH-30))+'px';
    const size=25+Math.random()*25;
    t.style.width=size+'px';t.style.height=size+'px';
    t.onclick=(e)=>{
      e.stopPropagation();if(!gameActive)return;
      score++;scoreEl.textContent='击杀: '+score;flash();t.remove();
      setTimeout(spawnTarget,150);
    };
    arena.appendChild(t);
    setTimeout(()=>{if(t.parentNode&&gameActive)t.remove();spawnTarget()},1200);
  }

  const timer=setInterval(()=>{
    timeLeft--;timerEl.textContent=timeLeft+'s';
    if(timeLeft<=3)timerEl.style.color='var(--val-red)';
    if(timeLeft<=0){
      clearInterval(timer);gameActive=false;
      arena.querySelectorAll('.aim-target').forEach(t=>t.remove());
      showMGResult(score>=6,overlay,score>=6?'aim2_good':'aim2_bad',`击杀 ${score} 个`);
    }
  },1000);

  setTimeout(spawnTarget,500);
  setTimeout(()=>{if(gameActive)spawnTarget()},700);
  setTimeout(()=>{if(gameActive)spawnTarget()},1100);
}

// 2. REACTION GAME - 反应速度测试
function startReactionGame(ctx){
  hideDialogue();clearCharacters();
  const overlay=document.getElementById('minigame-overlay');
  overlay.innerHTML=`
    <div class="mg-header">
      <div class="mg-title">反 应 测 试</div>
      <div class="mg-desc">等待屏幕变绿后立刻点击！反应时间 < 400ms 过关</div>
    </div>
    <div class="reaction-game">
      <div class="reaction-circle waiting" id="react-circle">
        等 待 ...
      </div>
      <div id="react-result" style="margin-top:15px;font-size:14px;color:var(--val-gray);min-height:24px"></div>
    </div>
  `;
  overlay.classList.add('active');

  const circle=document.getElementById('react-circle');
  const resultEl=document.getElementById('react-result');
  let canClick=false,startTime=0,clicked=false;

  const delay=1500+Math.random()*3000;

  const goTimeout=setTimeout(()=>{
    circle.className='reaction-circle go';
    circle.textContent='点 击！';
    canClick=true;startTime=Date.now();
    // Auto-fail after 1s
    setTimeout(()=>{
      if(!clicked){
        clicked=true;
        const rt=999;
        circle.className='reaction-circle result-bad';
        circle.textContent=rt+'ms';
        resultEl.textContent='太慢了……';
        setTimeout(()=>showMGResult(false,overlay,ctx+'_reaction_lose','反应超时'),1200);
      }
    },1000);
  },delay);

  circle.onclick=()=>{
    if(clicked)return;
    if(!canClick){
      // Clicked too early
      clicked=true;
      clearTimeout(goTimeout);
      circle.className='reaction-circle result-bad';
      circle.textContent='太早了！';
      resultEl.textContent='还没变绿就点了...';
      setTimeout(()=>showMGResult(false,overlay,ctx+'_reaction_lose','点击过早'),1200);
      return;
    }
    clicked=true;
    const rt=Date.now()-startTime;
    const success=rt<400;
    circle.className=success?'reaction-circle result-good':'reaction-circle result-bad';
    circle.textContent=rt+'ms';
    resultEl.textContent=success?'完美反应！':'反应稍慢...';

    // Map context to node names
    const winMap={
      'r1':`r1_reaction_win`,'def':`def_stack_win`,
      'aggro':`aggro_win`,'clutch':`clutch_rush_win`,
      'final':`clutch_final_fight_win`,
    };
    const loseMap={
      'r1':`r1_reaction_lose`,'def':`def_stack_lose`,
      'aggro':`aggro_lose`,'clutch':`clutch_rush_lose`,
      'final':`clutch_final_fight_lose`,
    };
    setTimeout(()=>showMGResult(success,overlay,success?winMap[ctx]:loseMap[ctx],rt+'ms'),1200);
  };
}

// 3. TIMING GAME - 节奏条
function startTimingGame(ctx){
  hideDialogue();clearCharacters();
  const overlay=document.getElementById('minigame-overlay');

  // Zone position varies
  const zoneStart=55+Math.random()*20;
  const zoneWidth=15;

  overlay.innerHTML=`
    <div class="mg-header">
      <div class="mg-title">节 奏 掌 控</div>
      <div class="mg-desc">在高亮区域内按下按钮！掌握完美的时机</div>
    </div>
    <div class="timing-game">
      <div class="timing-bar-container">
        <div class="timing-zone" style="left:${zoneStart}%;width:${zoneWidth}%"></div>
        <div class="timing-bar-fill" id="timing-fill"></div>
      </div>
      <button class="timing-btn" id="timing-btn">开 枪 ！</button>
      <div id="timing-result" style="margin-top:15px;font-size:14px;color:var(--val-gray);min-height:24px"></div>
    </div>
  `;
  overlay.classList.add('active');

  const fill=document.getElementById('timing-fill');
  const btn=document.getElementById('timing-btn');
  const resultEl=document.getElementById('timing-result');
  let pos=0,speed=1.2+Math.random()*0.6,direction=1,active=true;

  function animate(){
    if(!active)return;
    pos+=speed*direction;
    if(pos>=100){pos=100;direction=-1}
    if(pos<=0){pos=0;direction=1}
    fill.style.width=pos+'%';
    requestAnimationFrame(animate);
  }
  animate();

  btn.onclick=()=>{
    if(!active)return;
    active=false;
    const inZone=pos>=zoneStart&&pos<=zoneStart+zoneWidth;
    fill.style.background=inZone?'var(--val-cyan)':'var(--val-red)';
    resultEl.textContent=inZone?'完美时机！':'时机不对...';
    btn.disabled=true;

    const winMap={
      'r1mid':'r1_mid_push_win','eco':'eco_force_win',
      'rotate':'def_rotate_win','clutch':'clutch_outplay_win',
      'final_safe':'clutch_safe_win',
    };
    const loseMap={
      'r1mid':'r1_mid_push_lose','eco':'eco_force_lose',
      'rotate':'def_rotate_lose','clutch':'clutch_outplay_lose',
      'final_safe':'clutch_safe_lose',
    };
    setTimeout(()=>showMGResult(inZone,overlay,inZone?winMap[ctx]:loseMap[ctx],inZone?'完美':'失误'),1200);
  };
}

function showMGResult(success,overlay,nextNode,detail){
  const rf=document.createElement('div');
  rf.className='mg-result-flash '+(success?'success':'fail');
  rf.textContent=success?'SUCCESS':'FAILED';
  overlay.appendChild(rf);
  G.mgTotal++;

  setTimeout(()=>{
    overlay.classList.remove('active');
    overlay.innerHTML='';
    fadeTransition(()=>playNode(nextNode));
  },1200);
}

// ===== ENGINE =====
function playNode(nodeId){
  const nodes=getStoryNodes();
  const node=nodes[nodeId];
  if(!node){console.error('Node not found:',nodeId);return}
  G.currentNode={id:nodeId,...node};

  if(node.onEnter)node.onEnter();
  if(node.chapter!==undefined)document.getElementById('hud-chapter').textContent=node.chapter;
  if(node.bg)changeBackground(node.bg);

  if(node.groupChat){
    hideDialogue();clearCharacters();
    const msgs=node.groupChat.messages.map(m=>{
      if(typeof m.text==='function')return{...m,text:m.text()};return m;
    });
    showGroupChat(msgs,()=>{if(node.groupChat.next)playNode(node.groupChat.next)});
    return;
  }

  if(node.chars)setupCharacters(node.chars);

  let dl=node.dialogue||[];
  if(typeof dl==='string')dl=[];
  G.dialogueQueue=dl;G.dialogueIndex=0;

  if(dl.length>0){showDialogue();displayDialogueLine(0)}
  else if(!node.onEnter){
    // Node has no dialogue and no special handler
  }

  G.currentNode.dialogueList=dl;
  G.currentNode.choices=node.choices;
  G.currentNode.nextNode=node.next;
  G.currentNode.onExit=node.onExit;
  G.currentNode.isEnd=node.isEnd;
}

function advanceDialogue(){
  if(G.isTyping){finishTyping();return}
  if(!G.canAdvance)return;
  G.dialogueIndex++;
  if(G.dialogueIndex<G.dialogueQueue.length){displayDialogueLine(G.dialogueIndex)}
  else{
    if(G.currentNode.onExit)G.currentNode.onExit();
    if(G.currentNode.choices)showChoices(G.currentNode.choices);
    else if(G.currentNode.isEnd){
      hideDialogue();
      // Show restart
      const ro=document.getElementById('result-overlay');
      ro.innerHTML=`<button class="restart-btn" onclick="restartGame()">再 来 一 次</button>`;
      ro.classList.add('active');
    }
    else if(G.currentNode.nextNode)fadeTransition(()=>playNode(G.currentNode.nextNode));
  }
}

function displayDialogueLine(i){
  const line=G.dialogueQueue[i];if(!line)return;
  const sEl=document.getElementById('speaker-name');
  const tEl=document.getElementById('dialogue-text');
  const ind=document.getElementById('click-indicator');

  if(line.speaker==='narrator'){
    sEl.innerHTML='<span style="color:#768079">旁白</span>';
  }else if(line.speaker==='player'){
    sEl.innerHTML=`<span style="color:${CHARS.player.color}">${CHARS.player.name}</span>`;
  }else{
    const c=CHARS[line.speaker];
    if(c)sEl.innerHTML=`<span style="color:${c.color}">${c.name}</span><span class="role-tag">${c.role}</span>`;
  }
  if(line.speaker!=='narrator'&&line.speaker!=='player')highlightCharacter(line.speaker);
  typeText(tEl,line.text,ind);
}

let fullText='',typeIndex=0,typeEl=null;
function typeText(el,text,ind){
  G.isTyping=true;G.canAdvance=false;ind.style.display='none';
  fullText=text;typeIndex=0;typeEl=el;el.innerHTML='';
  clearInterval(G.typeTimer);
  G.typeTimer=setInterval(()=>{
    if(typeIndex<fullText.length){
      el.innerHTML+=(fullText[typeIndex]==='\n')?'<br>':fullText[typeIndex];
      typeIndex++;
    }else finishTyping();
  },25);
}
function finishTyping(){
  clearInterval(G.typeTimer);
  if(typeEl&&fullText)typeEl.innerHTML=fullText.replace(/\n/g,'<br>');
  G.isTyping=false;G.canAdvance=true;
  document.getElementById('click-indicator').style.display='block';
}

// CHARACTER
function setupCharacters(defs){
  const layer=document.getElementById('char-layer');
  layer.querySelectorAll('.character').forEach(c=>c.classList.remove('visible'));
  setTimeout(()=>{
    layer.innerHTML='';
    defs.forEach((d,i)=>{
      const c=CHARS[d.id];if(!c)return;
      const el=document.createElement('div');
      el.className=`character ${d.pos} ${d.active?'active':''}`;
      el.dataset.charId=d.id;
      const img=CHAR_IMAGES[d.id];
      el.innerHTML=img
        ?`<img src="${img}" alt="${c.name}" draggable="false"><div class="char-nametag" style="border-color:${c.color}">${c.name}</div>`
        :`<div style="width:200px;height:400px;display:flex;align-items:center;justify-content:center"><div style="text-align:center"><div style="font-size:60px;margin-bottom:15px">👤</div><div style="font-size:13px;font-weight:700;letter-spacing:2px;color:${c.color}">${c.name}</div></div></div><div class="char-nametag" style="border-color:${c.color}">${c.name}</div>`;
      layer.appendChild(el);
      setTimeout(()=>el.classList.add('visible'),100+i*200);
    });
  },300);
}

function clearCharacters(){
  const l=document.getElementById('char-layer');
  l.querySelectorAll('.character').forEach(c=>c.classList.remove('visible'));
  setTimeout(()=>l.innerHTML='',600);
}

function highlightCharacter(id){
  document.querySelectorAll('.character').forEach(c=>{
    c.classList.toggle('active',c.dataset.charId===id);
  });
}

// UI
function changeBackground(bg){document.getElementById('bg-layer').className='bg-layer '+bg}
function showDialogue(){document.getElementById('dialogue-container').style.display='block'}
function hideDialogue(){document.getElementById('dialogue-container').style.display='none'}

function showChoices(choices){
  hideDialogue();
  const c=document.getElementById('choices-container');c.innerHTML='';
  choices.forEach((ch,i)=>{
    const b=document.createElement('button');b.className='choice-btn';
    b.innerHTML=`<span class="choice-key">${String.fromCharCode(65+i)}</span>${ch.text}`;
    b.onclick=()=>{c.classList.remove('active');c.innerHTML='';fadeTransition(()=>playNode(ch.next))};
    c.appendChild(b);
  });
  c.classList.add('active');
}

function showGroupChat(msgs,onDone){
  const o=document.getElementById('group-chat');o.innerHTML='';
  const box=document.createElement('div');box.className='group-chat-box';
  box.innerHTML=`<div class="chat-header">队 伍 频 道</div>`;
  const mc=document.createElement('div');box.appendChild(mc);
  o.appendChild(box);o.classList.add('active');

  let idx=0;
  function next(){
    if(idx>=msgs.length){
      const ct=document.createElement('div');ct.className='chat-continue';
      ct.innerHTML=`<button class="chat-continue-btn" id="cc-btn">继 续 ▶</button>`;
      box.appendChild(ct);
      document.getElementById('cc-btn').onclick=()=>{o.classList.remove('active');o.innerHTML='';fadeTransition(onDone)};
      return;
    }
    const m=msgs[idx];const ch=CHARS[m.author]||CHARS.player;
    const img=CHAR_IMAGES[m.author];const isP=m.author==='player';
    const el=document.createElement('div');el.className='chat-message';
    let av;
    if(isP)av=`<div class="chat-avatar player-avatar">🎮</div>`;
    else if(img)av=`<div class="chat-avatar"><img src="${img}" alt="${ch.name}"></div>`;
    else av=`<div class="chat-avatar" style="display:flex;align-items:center;justify-content:center;font-size:16px">💬</div>`;
    el.innerHTML=`${av}<div class="chat-content"><div class="chat-author" style="color:${ch.color}">${isP?G.playerName.toUpperCase():ch.name}</div><div class="chat-text">${m.text}</div></div>`;
    mc.appendChild(el);
    requestAnimationFrame(()=>el.classList.add('visible'));
    box.scrollTop=box.scrollHeight;
    idx++;setTimeout(next,800);
  }
  setTimeout(next,500);
}

function showScoreboard(v){document.getElementById('scoreboard').classList.toggle('visible',v)}
function updateScore(a,e){
  G.score.ally=a;G.score.enemy=e;
  const ae=document.getElementById('score-ally'),ee=document.getElementById('score-enemy');
  ae.style.transform='scale(1.3)';ee.style.transform='scale(1.3)';
  ae.textContent=a;ee.textContent=e;
  setTimeout(()=>{ae.style.transform='scale(1)';ee.style.transform='scale(1)'},300);
}
function showNotification(t,d,dur){
  const n=document.getElementById('notification');
  document.getElementById('notif-title').textContent=t;
  document.getElementById('notif-desc').textContent=d;
  n.classList.add('active');setTimeout(()=>n.classList.remove('active'),dur||2200);
}
function flash(){
  const f=document.getElementById('screen-flash');
  f.classList.add('active');setTimeout(()=>f.classList.remove('active'),150);
}
function fadeTransition(cb){
  const f=document.getElementById('fade-overlay');f.classList.add('active');
  setTimeout(()=>{if(cb)cb();setTimeout(()=>f.classList.remove('active'),400)},500);
}
function showResult(type){
  const o=document.getElementById('result-overlay');
  o.innerHTML=type==='victory'
    ?`<div class="result-text result-victory">VICTORY</div><div class="result-sub">训练赛 · 胜利</div>`
    :`<div class="result-text result-defeat">DEFEAT</div><div class="result-sub">训练赛 · 惜败</div>`;
  o.classList.add('active');
}
function hideResult(){document.getElementById('result-overlay').classList.remove('active');document.getElementById('result-overlay').innerHTML=''}
function createParticles(){
  const s=document.getElementById('title-screen');
  for(let i=0;i<30;i++){
    const p=document.createElement('div');p.className='particle';
    p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*6+'s';
    p.style.animationDuration=(4+Math.random()*4)+'s';
    if(Math.random()>.5)p.style.background='#00d4aa';
    s.appendChild(p);
  }
}

document.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='Enter'){e.preventDefault();advanceDialogue()}
});

init();
</script>
