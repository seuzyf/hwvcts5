<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HWVCT S5 - 无畏契约</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --val-red: #ff4655;
  --val-dark: #0f1923;
  --val-darker: #0a1018;
  --val-cyan: #00d4aa;
  --val-blue: #1a73e8;
  --val-gold: #ecb731;
  --val-white: #ece8e1;
  --val-gray: #768079;
}

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--val-darker);
  color: var(--val-white);
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  user-select: none;
}

#game-container {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* ===== PRELOADER ===== */
#preloader {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 200;
  background: var(--val-darker);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.8s;
}

#preloader.done {
  opacity: 0;
  pointer-events: none;
}

.loader-text {
  font-size: 14px;
  color: var(--val-gray);
  letter-spacing: 4px;
  margin-bottom: 20px;
}

.loader-bar-bg {
  width: 300px;
  height: 3px;
  background: rgba(255,255,255,0.1);
  position: relative;
  overflow: hidden;
}

.loader-bar {
  height: 100%;
  background: var(--val-red);
  width: 0%;
  transition: width 0.3s;
}

/* ===== BACKGROUNDS ===== */
.bg-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-size: cover;
  background-position: center;
  transition: opacity 1s ease;
  z-index: 1;
}

.bg-lobby {
  background: linear-gradient(135deg, #0f1923 0%, #1a2a3a 30%, #0f1923 70%, #1a1a2e 100%);
}
.bg-lobby::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,70,85,0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0,212,170,0.1) 0%, transparent 50%),
    repeating-linear-gradient(90deg, transparent, transparent 100px, rgba(255,255,255,0.02) 100px, rgba(255,255,255,0.02) 101px),
    repeating-linear-gradient(0deg, transparent, transparent 100px, rgba(255,255,255,0.02) 100px, rgba(255,255,255,0.02) 101px);
}

.bg-range {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
}
.bg-range::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background:
    radial-gradient(circle at 50% 50%, rgba(0,212,170,0.08) 0%, transparent 60%),
    linear-gradient(to bottom, rgba(0,0,0,0.3), transparent 30%, transparent 70%, rgba(0,0,0,0.5));
}

.bg-match {
  background: linear-gradient(135deg, #1a0a0a 0%, #2a1520 30%, #0f1923 70%, #1a2a3a 100%);
}
.bg-match::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background:
    radial-gradient(circle at 30% 40%, rgba(255,70,85,0.2) 0%, transparent 50%),
    radial-gradient(circle at 70% 60%, rgba(236,183,49,0.1) 0%, transparent 40%);
}

.bg-victory {
  background: linear-gradient(135deg, #0a1a0a 0%, #1a3a1a 30%, #0f2f1f 70%, #0a2a2a 100%);
}
.bg-victory::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background:
    radial-gradient(circle at 50% 40%, rgba(0,212,170,0.25) 0%, transparent 60%),
    radial-gradient(circle at 50% 60%, rgba(236,183,49,0.15) 0%, transparent 50%);
}

.bg-defeat {
  background: linear-gradient(135deg, #1a0a0a 0%, #2a0a0a 30%, #1a0f15 70%, #0f0a1a 100%);
}
.bg-defeat::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,70,85,0.2) 0%, transparent 60%);
}

/* ===== TITLE SCREEN ===== */
#title-screen {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0a1018 0%, #0f1923 50%, #1a1a2e 100%);
  animation: fadeIn 1s ease;
}

#title-screen::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background:
    radial-gradient(circle at 50% 30%, rgba(255,70,85,0.2) 0%, transparent 50%),
    radial-gradient(circle at 30% 70%, rgba(0,212,170,0.1) 0%, transparent 40%),
    radial-gradient(circle at 70% 80%, rgba(236,183,49,0.08) 0%, transparent 40%);
  animation: pulse-bg 4s ease-in-out infinite;
}

@keyframes pulse-bg {
  0%, 100% { opacity: 0.8; }
  50% { opacity: 1; }
}

/* Title character silhouettes */
.title-chars {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 70%;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 0;
  opacity: 0.15;
  pointer-events: none;
}

.title-chars img {
  height: 90%;
  object-fit: contain;
  filter: grayscale(1) brightness(0.5);
}

.title-logo {
  position: relative;
  z-index: 2;
  text-align: center;
  margin-bottom: 20px;
}

.title-logo .val-mark {
  font-size: 80px;
  font-weight: 900;
  color: var(--val-red);
  letter-spacing: 8px;
  text-shadow: 0 0 40px rgba(255,70,85,0.5), 0 0 80px rgba(255,70,85,0.2);
  animation: glow-text 3s ease-in-out infinite;
}

@keyframes glow-text {
  0%, 100% { text-shadow: 0 0 40px rgba(255,70,85,0.5), 0 0 80px rgba(255,70,85,0.2); }
  50% { text-shadow: 0 0 60px rgba(255,70,85,0.7), 0 0 120px rgba(255,70,85,0.3); }
}

.title-logo .sub-title {
  font-size: 28px;
  font-weight: 300;
  color: var(--val-white);
  letter-spacing: 12px;
  margin-top: 5px;
}

.title-logo .season {
  font-size: 18px;
  color: var(--val-cyan);
  letter-spacing: 6px;
  margin-top: 10px;
  font-weight: 500;
}

.title-divider {
  width: 200px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--val-red), transparent);
  margin: 30px 0;
  position: relative;
  z-index: 2;
}

.start-btn {
  position: relative;
  z-index: 2;
  padding: 16px 60px;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--val-white);
  background: linear-gradient(135deg, var(--val-red), #cc3344);
  border: none;
  cursor: pointer;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  transition: all 0.3s ease;
  text-transform: uppercase;
}

.start-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 30px rgba(255,70,85,0.5);
}

.particle {
  position: absolute;
  width: 2px;
  height: 2px;
  background: var(--val-red);
  border-radius: 50%;
  opacity: 0;
  animation: float-particle 6s linear infinite;
}

@keyframes float-particle {
  0% { opacity: 0; transform: translateY(100vh) scale(0); }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-20px) scale(1); }
}

/* ===== NAME INPUT SCREEN ===== */
#name-screen {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 99;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0a1018 0%, #0f1923 50%, #1a1a2e 100%);
}

#name-screen::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(circle at 50% 50%, rgba(0,212,170,0.1) 0%, transparent 60%);
}

.name-prompt {
  position: relative;
  z-index: 2;
  text-align: center;
}

.name-prompt h2 {
  font-size: 24px;
  font-weight: 300;
  color: var(--val-white);
  margin-bottom: 8px;
  letter-spacing: 4px;
}

.name-prompt p {
  font-size: 14px;
  color: var(--val-gray);
  margin-bottom: 30px;
}

.name-input {
  width: 350px;
  padding: 14px 20px;
  font-size: 20px;
  font-family: 'Noto Sans SC', sans-serif;
  color: var(--val-white);
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,70,85,0.3);
  outline: none;
  text-align: center;
  letter-spacing: 2px;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  transition: border-color 0.3s;
  margin-bottom: 30px;
  display: block;
  margin-left: auto;
  margin-right: auto;
}

.name-input:focus {
  border-color: var(--val-red);
  box-shadow: 0 0 20px rgba(255,70,85,0.2);
}

.name-input::placeholder {
  color: rgba(255,255,255,0.2);
}

.confirm-btn {
  padding: 14px 50px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--val-white);
  background: linear-gradient(135deg, var(--val-red), #cc3344);
  border: none;
  cursor: pointer;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  transition: all 0.3s ease;
}

.confirm-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(255,70,85,0.4);
}

/* ===== GAME SCENE ===== */
#game-scene {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 10;
  display: none;
  opacity: 0;
  transition: opacity 0.8s ease;
}

#game-scene.active {
  display: block;
  opacity: 1;
}

/* ===== CHARACTER SPRITES ===== */
.character-layer {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 5;
  pointer-events: none;
}

.character {
  position: absolute;
  bottom: -30px;
  transition: all 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
  opacity: 0;
  transform: translateY(60px);
  filter: brightness(0.5) saturate(0.6);
}

.character.active {
  filter: brightness(1) saturate(1) drop-shadow(0 0 30px rgba(255,70,85,0.15));
}

.character.visible {
  opacity: 1;
  transform: translateY(0);
}

.character img {
  height: 100%;
  width: auto;
  object-fit: contain;
  pointer-events: none;
}

/* Single character right */
.character.pos-right {
  right: 2%;
  height: 88%;
}

.character.pos-center {
  left: 50%;
  height: 88%;
  transform: translateX(-50%) translateY(60px);
}
.character.pos-center.visible {
  transform: translateX(-50%) translateY(0);
}

.character.pos-left {
  left: 2%;
  height: 80%;
}

/* Multi character positions */
.character.pos-far-left {
  left: -2%;
  height: 72%;
}

.character.pos-center-left {
  left: 22%;
  height: 78%;
}

.character.pos-center-right {
  right: 22%;
  height: 78%;
}

.character.pos-far-right {
  right: -2%;
  height: 72%;
}

/* Character name tag */
.char-nametag {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  padding: 4px 16px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  white-space: nowrap;
  border-bottom: 2px solid var(--val-red);
  backdrop-filter: blur(4px);
  opacity: 0;
  transition: opacity 0.5s 0.3s;
}

.character.visible .char-nametag {
  opacity: 1;
}

/* ===== DIALOGUE BOX ===== */
.dialogue-container {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  z-index: 20;
  padding: 0 20px 20px;
}

.dialogue-box {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  background: linear-gradient(180deg, rgba(15,25,35,0.92) 0%, rgba(10,16,24,0.97) 100%);
  border: 1px solid rgba(255,70,85,0.25);
  border-top: 3px solid var(--val-red);
  padding: 20px 30px 25px;
  position: relative;
  clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
  backdrop-filter: blur(12px);
  cursor: pointer;
}

.dialogue-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, rgba(255,70,85,0.05) 0%, transparent 30%);
  pointer-events: none;
}

.speaker-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--val-red);
  letter-spacing: 3px;
  margin-bottom: 10px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 10px;
}

.speaker-name .role-tag {
  font-size: 10px;
  padding: 2px 8px;
  background: rgba(255,70,85,0.2);
  border: 1px solid rgba(255,70,85,0.3);
  border-radius: 2px;
  color: var(--val-red);
  letter-spacing: 1px;
  font-weight: 500;
}

.dialogue-text {
  font-size: 16px;
  line-height: 1.9;
  color: var(--val-white);
  min-height: 55px;
  font-weight: 300;
}

.click-indicator {
  position: absolute;
  bottom: 12px;
  right: 20px;
  font-size: 12px;
  color: var(--val-gray);
  animation: blink 1.5s ease-in-out infinite;
}

@keyframes blink {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* ===== CHOICES ===== */
.choices-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 30;
  display: none;
  flex-direction: column;
  gap: 12px;
  width: 520px;
  max-width: 92%;
  animation: fadeSlideUp 0.5s ease;
}

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translate(-50%, -40%); }
  to { opacity: 1; transform: translate(-50%, -50%); }
}

.choices-container.active {
  display: flex;
}

.choice-btn {
  padding: 16px 24px;
  font-size: 15px;
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 500;
  color: var(--val-white);
  background: rgba(15,25,35,0.92);
  border: 1px solid rgba(255,70,85,0.3);
  border-left: 4px solid var(--val-red);
  cursor: pointer;
  text-align: left;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(8px);
}

.choice-btn::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 0; height: 100%;
  background: linear-gradient(90deg, rgba(255,70,85,0.15), transparent);
  transition: width 0.3s ease;
}

.choice-btn:hover {
  border-color: var(--val-red);
  transform: translateX(8px);
  box-shadow: 0 0 20px rgba(255,70,85,0.2);
}

.choice-btn:hover::before {
  width: 100%;
}

.choice-btn .choice-key {
  display: inline-block;
  width: 28px;
  height: 28px;
  line-height: 28px;
  text-align: center;
  background: var(--val-red);
  color: white;
  font-size: 12px;
  font-weight: 700;
  margin-right: 12px;
  clip-path: polygon(0 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 4px 100%, 0 calc(100% - 4px));
  vertical-align: middle;
}

/* ===== HUD ===== */
.hud-top {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 25;
  background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
  pointer-events: none;
}

.hud-logo {
  font-size: 14px;
  font-weight: 700;
  color: var(--val-red);
  letter-spacing: 3px;
}

.hud-chapter {
  font-size: 12px;
  color: var(--val-gray);
  letter-spacing: 2px;
}

/* ===== SCOREBOARD ===== */
.scoreboard {
  position: absolute;
  top: 55px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 25;
  display: none;
  align-items: center;
  gap: 30px;
  background: rgba(15,25,35,0.92);
  padding: 12px 40px;
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
}

.scoreboard.visible {
  display: flex;
  animation: fadeIn 0.5s ease;
}

.score-team { text-align: center; }
.score-team .team-name {
  font-size: 11px;
  color: var(--val-gray);
  letter-spacing: 2px;
  margin-bottom: 4px;
}
.score-team .score-num { font-size: 36px; font-weight: 900; }
.score-team.ally .score-num { color: var(--val-cyan); }
.score-team.enemy .score-num { color: var(--val-red); }

.score-divider {
  width: 2px;
  height: 40px;
  background: rgba(255,255,255,0.2);
}

.score-map {
  font-size: 11px;
  color: var(--val-gray);
  letter-spacing: 2px;
  text-align: center;
}

/* ===== TRANSITIONS ===== */
.screen-flash {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: white;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.1s;
}
.screen-flash.active { opacity: 0.7; }

.fade-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: black;
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
}
.fade-overlay.active {
  opacity: 1;
  pointer-events: all;
}

/* ===== RESULT SCREEN ===== */
.result-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 35;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.result-overlay.active {
  display: flex;
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.result-text {
  font-size: 80px;
  font-weight: 900;
  letter-spacing: 20px;
  margin-bottom: 20px;
  animation: resultSlam 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
}

@keyframes resultSlam {
  0% { transform: scale(3); opacity: 0; }
  60% { transform: scale(0.9); }
  100% { transform: scale(1); opacity: 1; }
}

.result-victory { color: var(--val-cyan); text-shadow: 0 0 60px rgba(0,212,170,0.5); }
.result-defeat { color: var(--val-red); text-shadow: 0 0 60px rgba(255,70,85,0.5); }

.result-sub {
  font-size: 18px;
  color: var(--val-gray);
  letter-spacing: 4px;
  font-weight: 300;
}

/* ===== NOTIFICATION ===== */
.notification {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 36;
  background: rgba(15,25,35,0.95);
  border: 1px solid rgba(255,70,85,0.4);
  padding: 24px 50px;
  text-align: center;
  display: none;
  animation: notifIn 0.5s ease;
  backdrop-filter: blur(10px);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
}

@keyframes notifIn {
  from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

.notification.active { display: block; }

.notification .notif-title {
  font-size: 26px;
  font-weight: 700;
  color: var(--val-red);
  letter-spacing: 6px;
  margin-bottom: 8px;
}

.notification .notif-desc {
  font-size: 14px;
  color: var(--val-gray);
  letter-spacing: 2px;
}

/* ===== GROUP CHAT ===== */
.group-chat-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 20;
  display: none;
  align-items: center;
  justify-content: center;
}

.group-chat-overlay.active { display: flex; }

.group-chat-box {
  width: 520px;
  max-width: 92%;
  max-height: 72vh;
  background: rgba(10,16,24,0.96);
  border: 1px solid rgba(255,70,85,0.2);
  border-top: 3px solid var(--val-red);
  overflow-y: auto;
  padding: 20px;
  backdrop-filter: blur(12px);
}

.chat-header {
  font-size: 12px;
  color: var(--val-gray);
  letter-spacing: 3px;
  text-align: center;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

<script>

// ===== PRELOAD IMAGES =====
function preloadImages() {
  const urls = Object.values(CHAR_IMAGES);
  let loaded = 0;
  const total = urls.length;
  const bar = document.getElementById('loader-bar');

  return new Promise(resolve => {
    if (total === 0) { resolve(); return; }
    urls.forEach(url => {
      const img = new Image();
      img.onload = img.onerror = () => {
        loaded++;
        bar.style.width = (loaded / total * 100) + '%';
        if (loaded >= total) resolve();
      };
      img.src = url;
    });
    // Safety timeout
    setTimeout(resolve, 8000);
  });
}

async function init() {
  await preloadImages();
  const preloader = document.getElementById('preloader');
  preloader.classList.add('done');
  setTimeout(() => {
    preloader.style.display = 'none';
    document.getElementById('title-screen').style.display = 'flex';
    createParticles();
  }, 800);
}

// ===== TITLE & NAME =====
function startGame() {
  const ts = document.getElementById('title-screen');
  ts.style.opacity = '0';
  ts.style.transition = 'opacity 0.8s';
  setTimeout(() => {
    ts.style.display = 'none';
    const ns = document.getElementById('name-screen');
    ns.style.display = 'flex';
    ns.style.opacity = '0';
    requestAnimationFrame(() => {
      ns.style.transition = 'opacity 0.8s';
      ns.style.opacity = '1';
    });
    document.getElementById('player-name').focus();
  }, 800);
}

function confirmName() {
  const name = document.getElementById('player-name').value.trim();
  if (!name) {
    const inp = document.getElementById('player-name');
    inp.style.borderColor = '#ff4655';
    inp.setAttribute('placeholder', '请输入代号！');
    return;
  }
  G.playerName = name;
  CHARS.player.name = name.toUpperCase();

  const ns = document.getElementById('name-screen');
  ns.style.opacity = '0';
  setTimeout(() => {
    ns.style.display = 'none';
    beginStory();
  }, 800);
}

function beginStory() {
  const gs = document.getElementById('game-scene');
  gs.style.display = 'block';
  requestAnimationFrame(() => gs.classList.add('active'));
  setTimeout(() => playNode('intro_1'), 600);

  return lines[context]?.[G.role] || lines[context]?.duelist1 || '';
}

// ===== RENDERING ENGINE =====
function playNode(nodeId) {
  const nodes = getStoryNodes();
  const node = nodes[nodeId];
  if (!node) return;

  G.currentNode = { id: nodeId, ...node };

  if (node.onEnter) node.onEnter();
  if (node.chapter !== undefined) {
    document.getElementById('hud-chapter').textContent = node.chapter;
  }
  if (node.bg) changeBackground(node.bg);

  // Group chat
  if (node.groupChat) {
    hideDialogue();
    clearCharacters();
    showGroupChat(node.groupChat.messages, () => {
      if (node.groupChat.next) playNode(node.groupChat.next);
    });
    return;
  }

  // Characters
  if (node.chars) setupCharacters(node.chars);

  // Dialogue
  let dialogueList;
  if (typeof node.dialogue === 'string') {
    dialogueList = getDynamicDialogue(node.dialogue);
  } else {
    dialogueList = node.dialogue || [];
  }

  G.dialogueQueue = dialogueList;
  G.dialogueIndex = 0;

  if (dialogueList.length > 0) {
    showDialogue();
    displayDialogueLine(0);
  }

  G.currentNode.dialogueList = dialogueList;
  G.currentNode.choices = node.choices;
  G.currentNode.nextNode = node.next;
  G.currentNode.onExit = node.onExit;
  G.currentNode.isEnd = node.isEnd;
}

function advanceDialogue() {
  if (G.isTyping) { finishTyping(); return; }
  if (!G.canAdvance) return;

  G.dialogueIndex++;

  if (G.dialogueIndex < G.dialogueQueue.length) {
    displayDialogueLine(G.dialogueIndex);
  } else {
    if (G.currentNode.onExit) G.currentNode.onExit();

    if (G.currentNode.choices) {
      showChoices(G.currentNode.choices);
    } else if (G.currentNode.isEnd) {
      hideDialogue();
    } else if (G.currentNode.nextNode) {
      fadeTransition(() => playNode(G.currentNode.nextNode));
    }
  }
}

function displayDialogueLine(index) {
  const line = G.dialogueQueue[index];
  if (!line) return;

  const speakerEl = document.getElementById('speaker-name');
  const textEl = document.getElementById('dialogue-text');
  const indicator = document.getElementById('click-indicator');

  if (line.speaker === 'narrator') {
    speakerEl.innerHTML = '<span style="color:#768079">旁白</span>';
  } else if (line.speaker === 'player') {
    speakerEl.innerHTML = `<span style="color:${CHARS.player.color}">${CHARS.player.name}</span>`;
  } else {
    const char = CHARS[line.speaker];
    if (char) {
      speakerEl.innerHTML = `<span style="color:${char.color}">${char.name}</span><span class="role-tag">${char.role}</span>`;
    }
  }

  if (line.speaker !== 'narrator' && line.speaker !== 'player') {
    highlightCharacter(line.speaker);
  }

  typeText(textEl, line.text, indicator);
}

let fullText = '';
let typeIndex = 0;
let typeEl = null;

function typeText(el, text, indicator) {
  G.isTyping = true;
  G.canAdvance = false;
  indicator.style.display = 'none';
  fullText = text;
  typeIndex = 0;
  typeEl = el;
  el.innerHTML = '';

  clearInterval(G.typeTimer);
  G.typeTimer = setInterval(() => {
    if (typeIndex < fullText.length) {
      let char = fullText[typeIndex];
      el.innerHTML += (char === '\n') ? '<br>' : char;
      typeIndex++;
    } else {
      finishTyping();
    }
  }, 28);
}

function finishTyping() {
  clearInterval(G.typeTimer);
  if (typeEl && fullText) {
    typeEl.innerHTML = fullText.replace(/\n/g, '<br>');
  }
  G.isTyping = false;
  G.canAdvance = true;
  document.getElementById('click-indicator').style.display = 'block';
}

// ===== CHARACTER MANAGEMENT =====
function setupCharacters(charDefs) {
  const layer = document.getElementById('char-layer');
  // Fade out existing
  const existing = layer.querySelectorAll('.character');
  existing.forEach(c => c.classList.remove('visible'));

  setTimeout(() => {
    layer.innerHTML = '';

    charDefs.forEach((def, i) => {
      const char = CHARS[def.id];
      if (!char) return;

      const el = document.createElement('div');
      el.className = `character ${def.pos} ${def.active ? 'active' : ''}`;
      el.dataset.charId = def.id;

      const imgSrc = CHAR_IMAGES[def.id];
      if (imgSrc) {
        el.innerHTML = `
          <img src="${imgSrc}" alt="${char.name}" draggable="false">
          <div class="char-nametag" style="border-color:${char.color}">${char.name}</div>
        `;
      } else {
        // Fallback for characters without images (brimstone, killjoy, player)
        el.innerHTML = `
          <div style="width:200px;height:400px;display:flex;align-items:center;justify-content:center;">
            <div style="text-align:center;">
              <div style="font-size:80px;margin-bottom:20px;">👤</div>
              <div style="font-size:14px;font-weight:700;letter-spacing:3px;color:${char.color}">${char.name}</div>
            </div>
          </div>
          <div class="char-nametag" style="border-color:${char.color}">${char.name}</div>
        `;
      }

      layer.appendChild(el);

      setTimeout(() => el.classList.add('visible'), 100 + i * 200);
    });
  }, 300);
}

function clearCharacters() {
  const layer = document.getElementById('char-layer');
  const chars = layer.querySelectorAll('.character');
  chars.forEach(c => c.classList.remove('visible'));
  setTimeout(() => { layer.innerHTML = ''; }, 600);
}

function highlightCharacter(charId) {
  const chars = document.querySelectorAll('.character');
  chars.forEach(c => {
    if (c.dataset.charId === charId) {
      c.classList.add('active');
    } else {
      c.classList.remove('active');
    }
  });
}

// ===== UI HELPERS =====
function changeBackground(bgClass) {
  document.getElementById('bg-layer').className = 'bg-layer ' + bgClass;
}

function showDialogue() {
  document.getElementById('dialogue-container').style.display = 'block';
}

function hideDialogue() {
  document.getElementById('dialogue-container').style.display = 'none';
}

function showChoices(choices) {
  hideDialogue();
  const container = document.getElementById('choices-container');
  container.innerHTML = '';

  choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-key">${String.fromCharCode(65 + i)}</span>${choice.text}`;
    btn.onclick = () => {
      container.classList.remove('active');
      container.innerHTML = '';
      fadeTransition(() => playNode(choice.next));
    };
    container.appendChild(btn);
  });

  container.classList.add('active');
}

function showGroupChat(messages, onDone) {
  const overlay = document.getElementById('group-chat');
  overlay.innerHTML = '';

  const box = document.createElement('div');
  box.className = 'group-chat-box';
  box.innerHTML = `<div class="chat-header">队 伍 频 道</div>`;

  const msgContainer = document.createElement('div');
  box.appendChild(msgContainer);
  overlay.appendChild(box);
  overlay.classList.add('active');

  let msgIndex = 0;
  function showNextMsg() {
    if (msgIndex >= messages.length) {
      const cont = document.createElement('div');
      cont.className = 'chat-continue';
      cont.innerHTML = `<button class="chat-continue-btn" id="chat-cont-btn">继 续 ▶</button>`;
      box.appendChild(cont);
      document.getElementById('chat-cont-btn').onclick = () => {
        overlay.classList.remove('active');
        overlay.innerHTML = '';
        fadeTransition(onDone);
      };
      return;
    }

    const msg = messages[msgIndex];
    const char = CHARS[msg.author] || CHARS.player;
    const imgSrc = CHAR_IMAGES[msg.author];
    const isPlayer = msg.author === 'player';

    const msgEl = document.createElement('div');
    msgEl.className = 'chat-message';

    let avatarHtml;
    if (isPlayer) {
      avatarHtml = `<div class="chat-avatar player-avatar">🎮</div>`;
    } else if (imgSrc) {
      avatarHtml = `<div class="chat-avatar"><img src="${imgSrc}" alt="${char.name}"></div>`;
    } else {
      avatarHtml = `<div class="chat-avatar" style="display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.05);font-size:16px;">🔥</div>`;
    }

    msgEl.innerHTML = `
      ${avatarHtml}
      <div class="chat-content">
        <div class="chat-author" style="color:${char.color}">${isPlayer ? G.playerName.toUpperCase() : char.name}</div>
        <div class="chat-text">${msg.text}</div>
      </div>
    `;
    msgContainer.appendChild(msgEl);
    requestAnimationFrame(() => msgEl.classList.add('visible'));
    box.scrollTop = box.scrollHeight;

    msgIndex++;
    setTimeout(showNextMsg, 900);
  }

  setTimeout(showNextMsg, 500);
}

function showScoreboard(visible) {
  document.getElementById('scoreboard').classList.toggle('visible', visible);
}

function updateScore(ally, enemy) {
  G.score.ally = ally;
  G.score.enemy = enemy;

  const allyEl = document.getElementById('score-ally');
  const enemyEl = document.getElementById('score-enemy');

  allyEl.style.transform = 'scale(1.3)';
  enemyEl.style.transform = 'scale(1.3)';
  allyEl.style.transition = 'transform 0.3s';
  enemyEl.style.transition = 'transform 0.3s';

  allyEl.textContent = ally;
  enemyEl.textContent = enemy;

  setTimeout(() => {
    allyEl.style.transform = 'scale(1)';
    enemyEl.style.transform = 'scale(1)';
  }, 300);
}

function showNotification(title, desc, duration) {
  const notif = document.getElementById('notification');
  document.getElementById('notif-title').textContent = title;
  document.getElementById('notif-desc').textContent = desc;
  notif.classList.add('active');
  setTimeout(() => notif.classList.remove('active'), duration || 2200);
}

function flash() {
  const f = document.getElementById('screen-flash');
  f.classList.add('active');
  setTimeout(() => f.classList.remove('active'), 150);
}

function fadeTransition(callback) {
  const f = document.getElementById('fade-overlay');
  f.classList.add('active');
  setTimeout(() => {
    if (callback) callback();
    setTimeout(() => f.classList.remove('active'), 400);
  }, 500);
}

function showResult(type) {
  const overlay = document.getElementById('result-overlay');
  overlay.innerHTML = type === 'victory'
    ? `<div class="result-text result-victory">VICTORY</div><div class="result-sub">训练赛 · 胜利</div>`
    : `<div class="result-text result-defeat">DEFEAT</div><div class="result-sub">训练赛 · 惜败</div>`;
  overlay.classList.add('active');
}

function hideResult() {
  document.getElementById('result-overlay').classList.remove('active');
}

// ===== PARTICLES =====
function createParticles() {
  const screen = document.getElementById('title-screen');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 6 + 's';
    p.style.animationDuration = (4 + Math.random() * 4) + 's';
    if (Math.random() > 0.5) p.style.background = '#00d4aa';
    screen.appendChild(p);
  }
}

// ===== KEYBOARD =====
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    advanceDialogue();
  }
});

// ===== START =====
init();
</script>
