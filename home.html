<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HWVCTS - 个人主页</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #ff4655;
            --bg-color: #0a0a0f;
            --bg-gradient-mid: #1a0a0a;
            --text-color: #fff;
            --card-bg-color: rgba(21, 21, 32, 0.85);
            --border-color: rgba(255, 70, 85, 0.2);
            --border-highlight: rgba(255, 70, 85, 0.5);
            --gold-color: #ffd700;
            --shadow-color: rgba(0,0,0,0.5);
            --control-height: 42px;
            --win-color: #81c784;
            --loss-color: #ff8a80;
            --text-muted: rgba(255, 255, 255, 0.5);
        }
        body.light-theme {
            --primary-color: #e53935;
            --bg-color: #f4f5f7;
            --bg-gradient-mid: #e9ecef;
            --text-color: #1c1e21;
            --card-bg-color: rgba(255, 255, 255, 0.9);
            --border-color: rgba(229, 57, 53, 0.3);
            --border-highlight: rgba(229, 57, 53, 0.6);
            --shadow-color: rgba(229, 57, 53, 0.15);
            --win-color: #4CAF50;
            --loss-color: #F44336;
            --text-muted: rgba(0, 0, 0, 0.5);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, var(--bg-color) 0%, var(--bg-gradient-mid) 50%, var(--bg-color) 100%);
            color: var(--text-color);
            margin: 0; padding: 20px 0;
            line-height: 1.6; min-height: 100vh;
            transition: background .3s, color .3s;
        }
        .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .particle { position: absolute; width: 2px; height: 2px; background: rgba(255,70,85,.6); border-radius: 50%; animation: float linear infinite; }
        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; } 90% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(100px); opacity: 0; }
        }
        .container { width: 92%; max-width: 1200px; margin: 0 auto; position: relative; z-index: 10; }

        .main-header-block { text-align: center; padding: 25px 0 10px; margin-bottom: 30px; position: relative; }
        .title-badge {
            display: inline-block; padding: 6px 20px; background: rgba(255,70,85,.15);
            border: 1px solid var(--border-highlight); border-radius: 20px;
            font-size: 14px; color: var(--primary-color); letter-spacing: 3px; margin-bottom: 18px;
        }
        .main-header-block h1 {
            font-size: 52px; font-weight: 900; letter-spacing: 8px; margin: 0 0 8px;
            background: linear-gradient(135deg, var(--primary-color), #ff8a80, var(--primary-color));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(255,70,85,.3));
        }
        .header-sub { color: var(--text-muted); letter-spacing: 4px; font-size: 14px; font-weight: 300; margin: 0; }
        .theme-switch-wrapper { position: absolute; top: 0; right: 0; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-muted); }
        .theme-switch { display: inline-block; height: 20px; width: 40px; position: relative; }
        .theme-switch input { display: none; }
        .slider-theme { background-color: rgba(255,255,255,.1); border: 1px solid var(--border-color); position: absolute; inset: 0; cursor: pointer; transition: .4s; border-radius: 20px; }
        body.light-theme .slider-theme { background-color: rgba(0,0,0,.1); }
        .slider-theme:before { content: ""; position: absolute; height: 14px; width: 14px; left: 3px; bottom: 2px; background-color: var(--text-color); transition: .4s; border-radius: 50%; }
        input:checked + .slider-theme { background-color: var(--primary-color) !important; border-color: var(--primary-color); }
        input:checked + .slider-theme:before { transform: translateX(18px); background-color: #fff; }

        .controls-container { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
        .nav-button {
            height: var(--control-height); padding: 0 22px; display: inline-flex; align-items: center;
            border: 1px solid var(--border-color); color: var(--primary-color); text-decoration: none;
            background: rgba(255,70,85,.08); border-radius: 6px; font-size: 14px; font-weight: 600;
            letter-spacing: 1px; transition: all .3s; cursor: pointer; font-family: inherit;
        }
        .nav-button:hover { background: rgba(255,70,85,.2); border-color: var(--primary-color); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,70,85,.2); }
        .nav-button.ghost { background: transparent; color: var(--text-muted); }
        .nav-button.ghost:hover { color: var(--primary-color); }

        .content-block {
            background: var(--card-bg-color); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: 8px;
            padding: 26px 30px; box-shadow: 0 10px 40px var(--shadow-color);
            margin-bottom: 26px; position: relative;
        }
        .content-block::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: linear-gradient(to bottom, var(--primary-color), transparent); border-radius: 8px 0 0 8px;
        }
        .block-title { font-size: 18px; font-weight: 900; color: var(--primary-color); letter-spacing: 2px; margin: 0 0 18px; display: flex; justify-content: space-between; align-items: center; }
        .block-title a { font-size: 13px; color: var(--text-muted); text-decoration: none; font-weight: 500; }
        .block-title a:hover { color: var(--primary-color); }

        /* 未登录 */
        .auth-hero { text-align: center; padding: 50px 30px; }
        .auth-hero .hero-icon { font-size: 64px; margin-bottom: 10px; }
        .auth-hero h2 { font-size: 26px; letter-spacing: 4px; margin: 10px 0; }
        .auth-hero p { color: var(--text-muted); max-width: 560px; margin: 0 auto 26px; font-size: 14px; }
        .feature-chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }
        .feature-chips span { font-size: 12px; padding: 5px 14px; border: 1px solid var(--border-color); border-radius: 14px; color: var(--text-muted); }

        /* 个人资料 */
        .profile-row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
        .avatar {
            width: 84px; height: 84px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, var(--primary-color), #a01828);
            display: flex; align-items: center; justify-content: center;
            font-size: 38px; font-weight: 900; color: #fff;
            border: 3px solid var(--border-highlight); box-shadow: 0 0 24px rgba(255,70,85,.35);
        }
        .profile-main { flex: 1; min-width: 220px; }
        .profile-name { font-size: 26px; font-weight: 900; letter-spacing: 2px; margin: 0; }
        .profile-name small { font-size: 13px; color: var(--text-muted); font-weight: 400; margin-left: 10px; letter-spacing: 1px; }
        .profile-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .chip { font-size: 12px; padding: 3px 12px; border-radius: 12px; border: 1px solid var(--border-color); color: var(--text-muted); }
        .chip.gold { color: var(--gold-color); border-color: rgba(255,215,0,.4); }
        .chip.red { color: var(--primary-color); border-color: var(--border-highlight); }
        .profile-bio { margin-top: 8px; font-size: 13px; color: var(--text-muted); }
        .profile-actions { display: flex; gap: 10px; flex-shrink: 0; }
        .profile-actions .nav-button { height: 36px; padding: 0 16px; font-size: 13px; }

        /* 统计卡片 */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
        .stat-card {
            background: rgba(255,70,85,.05); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 18px 16px; text-align: center;
        }
        .stat-card .num { font-size: 32px; font-weight: 900; color: var(--primary-color); line-height: 1.2; }
        .stat-card .num.gold { color: var(--gold-color); }
        .stat-card .label { font-size: 12px; color: var(--text-muted); letter-spacing: 2px; margin-top: 4px; }

        /* 列表 */
        .item-list { display: flex; flex-direction: column; gap: 10px; }
        .list-item {
            display: flex; align-items: center; gap: 14px; padding: 13px 16px;
            background: rgba(255,255,255,.03); border: 1px solid var(--border-color);
            border-radius: 6px; text-decoration: none; color: var(--text-color);
            transition: .25s; cursor: pointer;
        }
        body.light-theme .list-item { background: rgba(0,0,0,.02); }
        .list-item:hover { border-color: var(--border-highlight); transform: translateX(4px); }
        .list-item .emoji { font-size: 24px; }
        .list-item .li-main { flex: 1; min-width: 0; }
        .list-item .li-title { font-weight: 700; font-size: 15px; letter-spacing: 1px; }
        .list-item .li-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .status-chip { font-size: 11px; padding: 3px 10px; border-radius: 10px; white-space: nowrap; font-weight: 600; letter-spacing: 1px; }
        .st-pending  { background: rgba(255,215,0,.12); color: var(--gold-color); border: 1px solid rgba(255,215,0,.35); }
        .st-approved { background: rgba(129,199,132,.12); color: var(--win-color); border: 1px solid rgba(129,199,132,.4); }
        .st-rejected, .st-cancelled { background: rgba(255,138,128,.1); color: var(--loss-color); border: 1px solid rgba(255,138,128,.35); }
        .st-registration { background: rgba(255,70,85,.14); color: var(--primary-color); border: 1px solid var(--border-highlight); }
        .st-ongoing { background: rgba(129,199,132,.14); color: var(--win-color); border: 1px solid rgba(129,199,132,.4); }
        .st-finished, .st-draft, .st-cancelled-ev { background: rgba(255,255,255,.07); color: var(--text-muted); border: 1px solid var(--border-color); }

        /* 功能入口 */
        .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
        .tile {
            display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
            padding: 18px; border: 1px solid var(--border-color); border-radius: 8px;
            background: rgba(255,70,85,.04); text-decoration: none; color: var(--text-color);
            transition: .25s;
        }
        .tile:hover { border-color: var(--border-highlight); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.3); }
        .tile .t-icon { font-size: 26px; }
        .tile .t-name { font-weight: 700; font-size: 15px; letter-spacing: 1px; }
        .tile .t-desc { font-size: 11px; color: var(--text-muted); }

        .empty-hint { text-align: center; color: var(--text-muted); font-size: 13px; padding: 18px 0; }

        /* 弹窗 */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(5,5,10,.8); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-backdrop.visible { display: flex; }
        .modal-panel { background: #151520; border: 1px solid var(--border-highlight); border-radius: 10px; width: 100%; max-width: 440px; padding: 28px; position: relative; color: #fff; }
        .modal-panel h3 { margin: 0 0 18px; letter-spacing: 3px; font-size: 18px; text-align: center; }
        .modal-panel label { display: block; font-size: 12px; color: rgba(255,255,255,.5); margin: 12px 0 4px; letter-spacing: 1px; }
        .modal-panel input, .modal-panel textarea {
            width: 100%; padding: 10px 12px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.15);
            border-radius: 6px; color: #fff; font-size: 14px; outline: none; font-family: inherit; resize: vertical;
        }
        .modal-panel input:focus, .modal-panel textarea:focus { border-color: var(--primary-color); }
        .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .btn { height: 38px; padding: 0 18px; border-radius: 6px; cursor: pointer; font-size: 13px; letter-spacing: 2px; border: 1px solid var(--border-color); background: transparent; color: var(--text-muted); font-family: inherit; }
        .btn.primary { background: rgba(255,70,85,.18); border-color: var(--primary-color); color: var(--primary-color); font-weight: 700; }
        .btn.primary:hover { background: var(--primary-color); color: #fff; }
        .modal-close-x { position: absolute; top: 10px; right: 16px; font-size: 24px; color: rgba(255,255,255,.4); cursor: pointer; background: none; border: none; }

        @media (max-width: 640px) {
            .main-header-block h1 { font-size: 36px; letter-spacing: 4px; }
            .theme-switch-wrapper { position: static; justify-content: center; margin-bottom: 10px; }
            .profile-actions { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="container">
        <div class="main-header-block">
            <div class="theme-switch-wrapper">
                <span id="theme-text">切换为亮色模式</span>
                <label class="theme-switch">
                    <input type="checkbox" id="theme-toggle-checkbox">
                    <span class="slider-theme"></span>
                </label>
            </div>
            <div class="title-badge">HWVCTS · PERSONAL</div>
            <h1>个人主页</h1>
            <p class="header-sub">以 个 人 账 户 为 维 度 管 理 你 的 赛 事 参 与</p>
            <div class="controls-container">
                <a href="events.html" class="nav-button">活 动 大 厅</a>
                <a href="index.html" class="nav-button">比 赛 中 心</a>
                <a href="betting.html" class="nav-button">赛 事 竞 猜</a>
                <button id="header-auth-btn" class="nav-button ghost" style="display:none;">登 录 / 注 册</button>
            </div>
        </div>

        <main id="main-content">
            <div class="content-block"><p class="empty-hint">正在加载...</p></div>
        </main>
    </div>

    <!-- 编辑资料弹窗 -->
    <div class="modal-backdrop" id="profile-modal">
        <div class="modal-panel">
            <button class="modal-close-x" onclick="document.getElementById('profile-modal').classList.remove('visible')">&times;</button>
            <h3>编 辑 资 料</h3>
            <form id="profile-form">
                <label>昵称</label>
                <input type="text" id="pf-nickname" placeholder="展示用昵称" maxlength="20">
                <label>无畏契约游戏 ID</label>
                <input type="text" id="pf-game-id" placeholder="例如：Player#CN1" maxlength="30">
                <label>个人简介</label>
                <textarea id="pf-bio" rows="3" placeholder="介绍一下自己（常玩位置 / 段位 / 想组队的队友…）" maxlength="120"></textarea>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="document.getElementById('profile-modal').classList.remove('visible')">取 消</button>
                    <button type="submit" class="btn primary">保 存</button>
                </div>
            </form>
            <hr style="border:none;border-top:1px solid rgba(255,255,255,.08);margin:18px 0 4px">
            <form id="pwd-form">
                <label>修改密码 · 原密码</label>
                <input type="password" id="pf-old-pwd" placeholder="原密码（首次设置可留空不行，需原密码）">
                <label>新密码</label>
                <input type="password" id="pf-new-pwd" placeholder="新密码（至少 4 位）">
                <div class="modal-footer">
                    <button type="submit" class="btn">修 改 密 码</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        (function () {
            'use strict';

            /* ---------- 粒子背景 ---------- */
            var pContainer = document.getElementById('particles');
            for (var i = 0; i < 40; i++) {
                var p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 6 + 4) + 's';
                p.style.animationDelay = (Math.random() * 8) + 's';
                pContainer.appendChild(p);
            }

            /* ---------- 主题 ---------- */
            var themeToggle = document.getElementById('theme-toggle-checkbox');
            var themeText = document.getElementById('theme-text');
            function setTheme(isLight) {
                document.body.classList.toggle('light-theme', isLight);
                themeToggle.checked = isLight;
                themeText.textContent = isLight ? '切换为暗色模式' : '切换为亮色模式';
                localStorage.setItem('theme', isLight ? 'light' : 'dark');
            }
            setTheme(localStorage.getItem('theme') === 'light');
            themeToggle.addEventListener('change', function (e) { setTheme(e.target.checked); });

            var main = document.getElementById('main-content');
            var headerAuthBtn = document.getElementById('header-auth-btn');

            var REG_STATUS = { pending: '待审核', approved: '已通过', rejected: '未通过', cancelled: '已撤回' };
            var EV_STATUS  = { draft: '草稿', registration: '报名中', ongoing: '进行中', finished: '已结束', cancelled: '已取消' };

            function esc(s) {
                return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }
            function fmtTime(t) {
                if (!t) return '待定';
                var d = new Date(t);
                if (isNaN(d)) return '待定';
                return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
            }

            /* ---------- 渲染 ---------- */

            function renderGuest() {
                headerAuthBtn.style.display = 'inline-flex';
                main.innerHTML =
                    '<div class="content-block auth-hero">' +
                    '  <div class="hero-icon">🪪</div>' +
                    '  <h2>欢迎来到 HWVCTS 个人中心</h2>' +
                    '  <p>登录后即可：报名参加赛事活动、随时查看我的报名状态与审核结果、管理个人资料、同步竞猜分数。一个账号，贯穿全站。</p>' +
                    '  <div class="feature-chips"><span>📋 活动报名</span><span>👤 个人资料</span><span>🏅 竞猜余额</span><span>📊 参赛记录</span></div>' +
                    '  <button class="nav-button" id="hero-login-btn" style="margin: 0 6px;">登 录 / 注 册</button>' +
                    '  <a href="events.html" class="nav-button ghost" style="margin: 0 6px;">先 看 看 活 动</a>' +
                    '</div>';
                document.getElementById('hero-login-btn').addEventListener('click', function () {
                    HWAuth.openModal({ stay: true }).then(function () { render(); }).catch(function () {});
                });
            }

            function renderLoggedIn(user, data) {
                headerAuthBtn.style.display = 'none';
                var initial = esc((user.nickname || user.username || '?').charAt(0).toUpperCase());
                var myRegs = data.myRegs || [];
                var upcoming = data.upcoming || [];
                var balance = data.balance;

                var pendingCount = myRegs.filter(function (r) { return r.status === 'pending'; }).length;
                var activeCount = myRegs.filter(function (r) { return r.status === 'pending' || r.status === 'approved'; }).length;
                var soonCount = myRegs.filter(function (r) {
                    return (r.status === 'approved' || r.status === 'pending') && r.events &&
                           (r.events.status === 'registration' || r.events.status === 'ongoing');
                }).length;

                var regsHtml = myRegs.length === 0
                    ? '<p class="empty-hint">还没有报名任何活动 —— 去 <a href="events.html" style="color:var(--primary-color)">活动大厅</a> 看看吧</p>'
                    : '<div class="item-list">' + myRegs.slice(0, 6).map(function (r) {
                        var ev = r.events || {};
                        return '<a class="list-item" href="events.html#mine">' +
                            '<span class="emoji">' + esc(ev.cover_emoji || '📋') + '</span>' +
                            '<span class="li-main">' +
                            '  <span class="li-title">' + esc(ev.title || '（活动已删除）') + '</span>' +
                            '  <span class="li-sub">' + esc(ev.season || '') + ' · 报名于 ' + fmtTime(r.created_at) +
                            (r.team_name ? ' · 战队 ' + esc(r.team_name) : '') + '</span>' +
                            '</span>' +
                            '<span class="status-chip ' + (r.status === 'pending' ? 'st-pending' : r.status === 'approved' ? 'st-approved' : r.status === 'rejected' ? 'st-rejected' : 'st-cancelled') + '">' +
                            (REG_STATUS[r.status] || r.status) + '</span></a>';
                    }).join('') + '</div>';

                var upcomingHtml = upcoming.length === 0
                    ? '<p class="empty-hint">近期暂无进行中的活动</p>'
                    : '<div class="item-list">' + upcoming.map(function (ev) {
                        return '<a class="list-item" href="events.html">' +
                            '<span class="emoji">' + esc(ev.cover_emoji || '🏆') + '</span>' +
                            '<span class="li-main">' +
                            '  <span class="li-title">' + esc(ev.title) + '</span>' +
                            '  <span class="li-sub">' + fmtTime(ev.start_time) + (ev.venue ? ' · ' + esc(ev.venue) : '') + '</span>' +
                            '</span>' +
                            '<span class="status-chip st-' + esc(ev.status) + '">' + (EV_STATUS[ev.status] || ev.status) + '</span></a>';
                    }).join('') + '</div>';

                var tiles = [
                    ['events.html', '🎟️', '活动大厅', '浏览并报名赛事活动'],
                    ['index.html', '⚔️', '比赛中心', '积分榜与比赛结果'],
                    ['schedule.html', '🗓️', '赛程中心', '对阵表与赛程管理'],
                    ['summary.html', '📊', '选手数据', '生涯数据汇总与对比'],
                    ['betting.html', '💰', '赛事竞猜', '预测比分赢取积分'],
                    ['draft.html', '🪪', '分队系统', '选手分队与导出'],
                    ['admin.html', '🛠️', '管理后台', '录入比赛与赛程（管理员）'],
                    ['player.html', '🔍', '选手主页', '按选手查看数据与评论']
                ].map(function (t) {
                    return '<a class="tile" href="' + t[0] + '">' +
                        '<span class="t-icon">' + t[1] + '</span>' +
                        '<span class="t-name">' + t[2] + '</span>' +
                        '<span class="t-desc">' + t[3] + '</span></a>';
                }).join('');

                main.innerHTML =
                    /* 资料卡 */
                    '<div class="content-block">' +
                    '  <div class="profile-row">' +
                    '    <div class="avatar">' + initial + '</div>' +
                    '    <div class="profile-main">' +
                    '      <h2 class="profile-name">' + esc(user.nickname || user.username) +
                    '        <small>@' + esc(user.username) + '</small></h2>' +
                    '      <div class="profile-meta">' +
                    '        <span class="chip red">ID ' + user.id + '</span>' +
                    (user.game_id ? '<span class="chip">🎮 ' + esc(user.game_id) + '</span>' : '') +
                    '        <span class="chip gold">💰 竞猜积分 ' + (balance === null ? '—' : balance) + '</span>' +
                    '        <span class="chip">注册于 ' + fmtTime(user.created_at) + '</span>' +
                    '      </div>' +
                    (user.bio ? '<div class="profile-bio">' + esc(user.bio) + '</div>' : '<div class="profile-bio" style="opacity:.5">还没有简介，点右侧编辑资料补充吧</div>') +
                    '    </div>' +
                    '    <div class="profile-actions">' +
                    '      <button class="nav-button" id="edit-profile-btn">编 辑 资 料</button>' +
                    '      <button class="nav-button ghost" id="logout-btn">退 出 登 录</button>' +
                    '    </div>' +
                    '  </div>' +
                    '</div>' +

                    /* 统计 */
                    '<div class="stats-grid" style="margin-bottom:26px;">' +
                    '  <div class="stat-card"><div class="num">' + activeCount + '</div><div class="label">有效报名</div></div>' +
                    '  <div class="stat-card"><div class="num">' + pendingCount + '</div><div class="label">待审核</div></div>' +
                    '  <div class="stat-card"><div class="num">' + soonCount + '</div><div class="label">进行中 / 报名中</div></div>' +
                    '  <div class="stat-card"><div class="num gold">' + (balance === null ? '—' : balance) + '</div><div class="label">竞猜积分</div></div>' +
                    '</div>' +

                    /* 两列：我的报名 / 近期活动 */
                    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:26px;">' +
                    '  <div class="content-block" style="margin-bottom:0;">' +
                    '    <h2 class="block-title">我 的 报 名 <a href="events.html#mine">全部 →</a></h2>' + regsHtml +
                    '  </div>' +
                    '  <div class="content-block" style="margin-bottom:0;">' +
                    '    <h2 class="block-title">近 期 活 动 <a href="events.html">活动大厅 →</a></h2>' + upcomingHtml +
                    '  </div>' +
                    '</div>' +

                    /* 功能入口 */
                    '<div class="content-block" style="margin-top:26px;">' +
                    '  <h2 class="block-title">功 能 入 口</h2>' +
                    '  <div class="tiles">' + tiles + '</div>' +
                    '</div>';

                document.getElementById('logout-btn').addEventListener('click', function () {
                    HWAuth.logout();
                    render();
                });
                document.getElementById('edit-profile-btn').addEventListener('click', openProfileModal);
            }

            /* ---------- 资料编辑 ---------- */
            function openProfileModal() {
                var u = HWAuth.getSession();
                if (!u) return;
                document.getElementById('pf-nickname').value = u.nickname || '';
                document.getElementById('pf-game-id').value = u.game_id || '';
                document.getElementById('pf-bio').value = u.bio || '';
                document.getElementById('profile-modal').classList.add('visible');
            }

            document.getElementById('profile-form').addEventListener('submit', function (e) {
                e.preventDefault();
                HWAuth.updateProfile({
                    nickname: document.getElementById('pf-nickname').value.trim(),
                    game_id: document.getElementById('pf-game-id').value.trim(),
                    bio: document.getElementById('pf-bio').value.trim()
                }).then(function () {
                    alert('资料已保存');
                    document.getElementById('profile-modal').classList.remove('visible');
                    render();
                }).catch(function (err) { alert(err.message); });
            });

            document.getElementById('pwd-form').addEventListener('submit', function (e) {
                e.preventDefault();
                var oldPwd = document.getElementById('pf-old-pwd').value;
                var newPwd = document.getElementById('pf-new-pwd').value;
                HWAuth.changePassword(oldPwd, newPwd).then(function () {
                    alert('密码修改成功');
                    document.getElementById('pf-old-pwd').value = '';
                    document.getElementById('pf-new-pwd').value = '';
                }).catch(function (err) { alert(err.message); });
            });

            headerAuthBtn.addEventListener('click', function () {
                HWAuth.openModal({ stay: true }).then(function () { render(); }).catch(function () {});
            });

            /* ---------- 数据加载 ---------- */
            function loadMyRegs(userId) {
                var sb = HWAuth.getClient();
                return sb.from('event_registrations')
                    .select('*, events(*)')
                    .eq('user_id', userId)
                    .order('created_at', { ascending: false })
                    .then(function (res) {
                        if (res.error) {
                            if (HWAuth.isMissingTable(res.error)) return { rows: [], missing: true };
                            throw res.error;
                        }
                        return { rows: res.data || [], missing: false };
                    });
            }

            function loadUpcoming() {
                var sb = HWAuth.getClient();
                return sb.from('events')
                    .select('*')
                    .in('status', ['registration', 'ongoing'])
                    .order('start_time', { ascending: true })
                    .limit(5)
                    .then(function (res) {
                        if (res.error) {
                            if (HWAuth.isMissingTable(res.error)) return [];
                            throw res.error;
                        }
                        return res.data || [];
                    });
            }

            /** 竞猜余额：与竞猜页同口径（100 - 投入 + 派彩 + 低保） */
            function loadBalance(userId) {
                var sb = HWAuth.getClient();
                return Promise.all([
                    sb.from('s6_bet_bets').select('*'),
                    sb.from('s6_bet_welfare_claims').select('user_id'),
                    sb.from('s6_match_schedule').select('id, team_a, team_b, score_a, score_b')
                ]).then(function (rs) {
                    if (rs.some(function (r) { return r.error; })) return null;
                    var bets = rs[0].data || [];
                    var welfare = (rs[1].data || []).filter(function (c) { return c.user_id === userId; }).length;
                    var matches = rs[2].data || [];
                    var matchMap = {};
                    matches.forEach(function (m) { matchMap[m.id] = m; });

                    var pools = {};
                    bets.forEach(function (b) {
                        if (!pools[b.match_id]) pools[b.match_id] = { a: 0, b: 0 };
                        var m = matchMap[b.match_id];
                        if (!m) return;
                        if (b.predicted_winner === m.team_a) pools[b.match_id].a += b.amount;
                        else pools[b.match_id].b += b.amount;
                    });

                    var staked = 0, winnings = 0;
                    bets.filter(function (b) { return b.user_id === userId; }).forEach(function (b) {
                        staked += b.amount;
                        var m = matchMap[b.match_id];
                        if (m && m.score_a != null && m.score_b != null && m.score_a !== m.score_b) {
                            var winner = m.score_a > m.score_b ? m.team_a : m.team_b;
                            if (b.predicted_winner === winner) {
                                var pool = pools[b.match_id];
                                var winnerPool = winner === m.team_a ? 100 + pool.a : 100 + pool.b;
                                var loserPool = winner === m.team_a ? 100 + pool.b : 100 + pool.a;
                                winnings += b.amount + Math.ceil((b.amount / winnerPool) * loserPool);
                            }
                        }
                    });
                    return Math.round(100 - staked + winnings + welfare * 5);
                }).catch(function () { return null; });
            }

            /* ---------- 主渲染 ---------- */
            function render() {
                var user = HWAuth.getSession();
                if (!user) { renderGuest(); return; }

                main.innerHTML = '<div class="content-block"><p class="empty-hint">正在加载我的数据...</p></div>';

                Promise.all([
                    HWAuth.refresh().catch(function () { return user; }),
                    loadMyRegs(user.id),
                    loadUpcoming(),
                    loadBalance(user.id)
                ]).then(function (results) {
                    var fresh = results[0] || user;
                    if (!fresh) { renderGuest(); return; } // refresh 发现账号已注销
                    var regs = results[1];
                    var data = {
                        myRegs: regs.rows,
                        upcoming: results[2],
                        balance: results[3]
                    };
                    if (regs.missing) {
                        main.innerHTML =
                            '<div class="content-block" style="text-align:center;">' +
                            '<h2 class="block-title" style="justify-content:center;">数 据 库 尚 未 升 级</h2>' +
                            '<p style="color:var(--text-muted);font-size:14px;max-width:560px;margin:0 auto 16px;">' +
                            '个人主页与活动报名依赖新表 <code>site_users / events / event_registrations</code>。<br>' +
                            '请在 Supabase Dashboard → SQL Editor 中执行 <code>supabase/schema.sql</code>，然后刷新本页。</p>' +
                            '<a class="nav-button" href="DESIGN.md">查看升级说明</a> ' +
                            '<button class="nav-button ghost" onclick="location.reload()">已执行，刷新</button>' +
                            '</div>';
                        return;
                    }
                    renderLoggedIn(fresh, data);
                }).catch(function (err) {
                    console.error(err);
                    main.innerHTML = '<div class="content-block"><p class="empty-hint" style="color:var(--loss-color)">加载失败：' + esc(err.message || err) + '，请刷新重试</p></div>';
                });
            }

            HWAuth.init();
            HWAuth.detectAccountSource().catch(function () { /* 离线也能看本地会话 */ }).finally(function () {
                render();
            });
        })();
    </script>
</body>
</html>
