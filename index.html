<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HWVCTS — 主页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <style>
        /* Hero */
        .hero { padding: 56px 0 48px; }
        .hero .eyebrow { display: block; margin-bottom: 14px; }
        .hero h1 {
            margin: 0 0 14px;
            font-size: 56px;
            font-weight: 400;
            line-height: 1.17;
            letter-spacing: 0.22px;
            color: var(--pure-white);
        }
        .hero h1 .accent-name { color: var(--coral-pulse); }
        .hero .lead { margin: 0; font-size: 16px; color: var(--ash); max-width: 520px; line-height: 1.6; }
        .hero-actions { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
        .hero-meta {
            margin-top: 26px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--smoke);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .hero-meta .pipe { color: var(--slate); }

        /* Stats */
        .stats-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--ink); border-radius: var(--r-card); padding: 20px 22px; box-shadow: var(--key-shadow); }

        /* Lists */
        .list { display: flex; flex-direction: column; gap: 8px; }
        .list-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            text-decoration: none;
            color: var(--mist);
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        .list-item:hover { border-color: var(--border); background: rgba(255, 255, 255, 0.04); }
        .list-item .li-icon {
            width: 36px; height: 36px; border-radius: var(--r-circle);
            background: var(--obsidian); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0;
        }
        .list-item .li-main { flex: 1; min-width: 0; }
        .list-item .li-title { font-size: 15px; font-weight: 500; color: var(--pure-white); }
        .list-item .li-sub { font-size: 13px; color: var(--smoke); margin-top: 2px; }
        .list-item .li-end { flex-shrink: 0; }

        .empty-line { padding: 22px 8px; text-align: center; font-size: 14px; color: var(--smoke); line-height: 1.8; }
        .empty-line a { color: var(--ash); }

        /* Profile card */
        .profile-card { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
        .profile-avatar {
            width: 72px; height: 72px; border-radius: var(--r-circle);
            background: var(--ember-hush);
            border: 1px solid rgba(255, 99, 99, 0.4);
            color: var(--coral-pulse);
            font-family: var(--font-sf);
            font-size: 28px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .profile-main { flex: 1; min-width: 220px; }
        .profile-name { margin: 0; font-size: 24px; font-weight: 500; color: var(--pure-white); letter-spacing: 0.2px; }
        .profile-handle { font-family: var(--font-mono); font-size: 13px; color: var(--smoke); margin-left: 8px; }
        .profile-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .profile-bio { margin-top: 12px; font-size: 15px; color: var(--ash); line-height: 1.6; }
        .profile-actions { display: flex; gap: 8px; flex-shrink: 0; }

        /* Feature tiles */
        .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .tile {
            display: flex; align-items: center; gap: 14px;
            padding: 16px;
            border-radius: var(--r-card);
            background: var(--ink);
            box-shadow: var(--key-shadow);
            text-decoration: none;
            color: var(--mist);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        .tile:hover { box-shadow: var(--key-shadow-hover); transform: translateY(-2px); }
        .tile .t-name { font-size: 15px; font-weight: 500; color: var(--pure-white); }
        .tile .t-desc { font-size: 13px; color: var(--smoke); margin-top: 2px; }

        .block-head {
            display: flex; align-items: baseline; justify-content: space-between;
            gap: 12px; margin-bottom: 14px;
        }
        .block-head h2 { margin: 0; font-size: 16px; font-weight: 500; color: var(--pure-white); letter-spacing: 0.2px; }
        .block-head a { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--smoke); text-decoration: none; }
        .block-head a:hover { color: var(--mist); }

        @media (max-width: 720px) {
            .hero h1 { font-size: 36px; }
            .profile-actions { width: 100%; }
        }
    </style>
</head>
<body data-page="index">
    <main class="page">
        <div class="container">
            <section class="hero hero-atmosphere" id="hero"></section>
            <div id="dashboard"></div>
        </div>
    </main>

    <!-- 编辑资料 -->
    <div class="modal-backdrop" id="profile-modal">
        <div class="modal-panel">
            <button class="modal-close" id="pm-close" type="button">&times;</button>
            <span class="eyebrow">Account</span>
            <h3 class="modal-title" style="margin-top:8px;">编辑资料</h3>
            <form id="profile-form">
                <label class="form-label" for="pf-nickname">昵称</label>
                <input class="input" id="pf-nickname" maxlength="20" placeholder="展示用昵称">
                <label class="form-label" for="pf-game-id">无畏契约游戏 ID</label>
                <input class="input" id="pf-game-id" maxlength="30" placeholder="例如 Player#CN1">
                <label class="form-label" for="pf-bio">个人简介</label>
                <textarea class="textarea" id="pf-bio" rows="3" maxlength="120" placeholder="常玩位置 / 段位 / 想组队的队友…"></textarea>
                <div class="modal-actions">
                    <button class="btn btn-ghost" type="button" id="pm-cancel">取消</button>
                    <button class="btn btn-primary" type="submit">保存</button>
                </div>
            </form>
            <div style="border-top:1px solid var(--border); margin-top:22px; padding-top:6px;">
                <form id="pwd-form">
                    <label class="form-label" for="pf-old-pwd">修改密码 · 原密码</label>
                    <input class="input" id="pf-old-pwd" type="password" placeholder="原密码">
                    <label class="form-label" for="pf-new-pwd">新密码</label>
                    <input class="input" id="pf-new-pwd" type="password" placeholder="至少 4 位">
                    <div class="modal-actions">
                        <button class="btn btn-ghost" type="submit">修改密码</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        var REG_STATUS = { pending: '待审核', approved: '已通过', rejected: '未通过', cancelled: '已撤回' };
        var EV_STATUS  = { draft: '草稿', registration: '报名中', ongoing: '进行中', finished: '已结束', cancelled: '已取消' };
        var EV_BADGE   = { draft: '', registration: 'badge-coral', ongoing: 'badge-green', finished: '', cancelled: '' };

        var hero = document.getElementById('hero');
        var dash = document.getElementById('dashboard');

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        function fmtDate(t) {
            if (!t) return '待定';
            var d = new Date(t);
            if (isNaN(d)) return '待定';
            return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        /* ---------- Guest ---------- */
        function renderGuest() {
            hero.innerHTML =
                '<span class="eyebrow">Personal Home</span>' +
                '<h1>你的赛事<span class="accent-name">指挥中心</span></h1>' +
                '<p class="lead">登录后这里就是你的主页。</p>' +
                '<div class="hero-actions">' +
                '  <button class="btn btn-primary btn-lg" id="hero-login" type="button">登录 / 注册</button>' +
                '  <a class="btn btn-ghost btn-lg" href="events.html">先看看活动</a>' +
                '</div>' +
                '<div class="hero-meta"><span>EVENTS</span><span class="pipe">|</span><span>MATCHES</span><span class="pipe">|</span><span>STATS</span><span class="pipe">|</span><span>BETTING</span></div>';
            dash.innerHTML = '';
            document.getElementById('hero-login').addEventListener('click', function () {
                HWAuth.openModal({ stay: true }).then(render).catch(function () {});
            });
        }

        /* ---------- Data ---------- */
        function loadMyRegs(userId) {
            return HWAuth.getClient().from('event_registrations')
                .select('*, events(*)')
                .eq('user_id', userId)
                .order('created_at', { ascending: false })
                .then(function (res) {
                    if (res.error) {
                        if (HWAuth.isMissingTable(res.error)) return { rows: [], missing: true };
                        throw res.error;
                    }
                    return { rows: res.data || [], missing: false };
                });
        }

        function loadUpcoming() {
            return HWAuth.getClient().from('events')
                .select('*')
                .in('status', ['registration', 'ongoing'])
                .order('start_time', { ascending: true })
                .limit(5)
                .then(function (res) {
                    if (res.error) {
                        if (HWAuth.isMissingTable(res.error)) return [];
                        throw res.error;
                    }
                    return res.data || [];
                });
        }

        /** 与竞猜页同口径：100 - 投入 + 派彩 + 低保 */
        function loadBalance(userId) {
            var sb = HWAuth.getClient();
            return Promise.all([
                sb.from('s6_bet_bets').select('*'),
                sb.from('s6_bet_welfare_claims').select('user_id'),
                sb.from('s6_match_schedule').select('id, team_a, team_b, score_a, score_b')
            ]).then(function (rs) {
                if (rs.some(function (r) { return r.error; })) return null;
                var bets = rs[0].data || [];
                var welfare = (rs[1].data || []).filter(function (c) { return c.user_id === userId; }).length;
                var matchMap = {};
                (rs[2].data || []).forEach(function (m) { matchMap[m.id] = m; });

                var pools = {};
                bets.forEach(function (b) {
                    if (!pools[b.match_id]) pools[b.match_id] = { a: 0, b: 0 };
                    var m = matchMap[b.match_id];
                    if (!m) return;
                    if (b.predicted_winner === m.team_a) pools[b.match_id].a += b.amount;
                    else pools[b.match_id].b += b.amount;
                });

                var staked = 0, winnings = 0;
                bets.filter(function (b) { return b.user_id === userId; }).forEach(function (b) {
                    staked += b.amount;
                    var m = matchMap[b.match_id];
                    if (m && m.score_a != null && m.score_b != null && m.score_a !== m.score_b) {
                        var winner = m.score_a > m.score_b ? m.team_a : m.team_b;
                        if (b.predicted_winner === winner) {
                            var pool = pools[b.match_id];
                            var winnerPool = winner === m.team_a ? 100 + pool.a : 100 + pool.b;
                            var loserPool = winner === m.team_a ? 100 + pool.b : 100 + pool.a;
                            winnings += b.amount + Math.ceil((b.amount / winnerPool) * loserPool);
                        }
                    }
                });
                return Math.round(100 - staked + winnings + welfare * 5);
            }).catch(function () { return null; });
        }

        /* ---------- Dashboard ---------- */
        function renderDashboard(user, data) {
            var regs = data.myRegs;
            var upcoming = data.upcoming;
            var balance = data.balance;

            hero.innerHTML =
                '<span class="eyebrow">Personal Home</span>' +
                '<h1>你好，<span class="accent-name">' + esc(user.nickname || user.username) + '</span></h1>' +
                '<p class="lead">管理你的报名与赛事参与，随时掌握审核状态与竞猜积分。</p>';

            var active = regs.filter(function (r) { return r.status === 'pending' || r.status === 'approved'; });
            var pending = regs.filter(function (r) { return r.status === 'pending'; });
            var soon = regs.filter(function (r) {
                return (r.status === 'approved' || r.status === 'pending') && r.events &&
                    (r.events.status === 'registration' || r.events.status === 'ongoing');
            });

            var statsHtml =
                '<div class="stats-strip">' +
                statCard(active.length, '有效报名', false) +
                statCard(pending.length, '待审核', false) +
                statCard(soon.length, '进行中 / 报名中', false) +
                statCard(balance === null ? '—' : balance, '竞猜积分', true) +
                '</div>';

            var regsHtml = regs.length === 0
                ? '<div class="empty-line">还没有报名任何活动<br><a href="events.html">去活动大厅看看 →</a></div>'
                : '<div class="list">' + regs.slice(0, 6).map(function (r) {
                    var ev = r.events || {};
                    return '<a class="list-item" href="events.html#mine">' +
                        '<span class="li-icon">' + esc(ev.cover_emoji || '📋') + '</span>' +
                        '<span class="li-main">' +
                        '  <span class="li-title">' + esc(ev.title || '（活动已删除）') + '</span>' +
                        '  <span class="li-sub">' + esc(ev.season || '') + ' · ' + fmtDate(r.created_at) +
                        (r.team_name ? ' · ' + esc(r.team_name) : '') + '</span>' +
                        '</span>' +
                        '<span class="li-end"><span class="badge ' + regBadge(r.status) + '">' + (REG_STATUS[r.status] || r.status) + '</span></span>' +
                        '</a>';
                }).join('') + '</div>';

            var upcomingHtml = upcoming.length === 0
                ? '<div class="empty-line">近期暂无进行中的活动</div>'
                : '<div class="list">' + upcoming.map(function (ev) {
                    return '<a class="list-item" href="events.html?open=' + ev.id + '">' +
                        '<span class="li-icon">' + esc(ev.cover_emoji || '🏆') + '</span>' +
                        '<span class="li-main">' +
                        '  <span class="li-title">' + esc(ev.title) + '</span>' +
                        '  <span class="li-sub">' + fmtDate(ev.start_time) + (ev.venue ? ' · ' + esc(ev.venue) : '') + '</span>' +
                        '</span>' +
                        '<span class="li-end"><span class="badge ' + (EV_BADGE[ev.status] || '') + '">' + (EV_STATUS[ev.status] || ev.status) + '</span></span>' +
                        '</a>';
                }).join('') + '</div>';

            /* 功能入口：赛程/比赛/数据/竞猜/分队/管理全部绑定在活动下，
               从活动大厅进入；剧情模式独立于赛事体系，保留直入口。 */
            var tiles = [
                ['events.html', '🗓️', '活动大厅', '报名参赛与审核'],
                ['events.html#mine', '📋', '我的报名', '报名与参赛记录'],
                ['game.html', '🎮', '剧情模式', '沉浸式训练赛故事']
            ].map(function (t) {
                return '<a class="tile" href="' + t[0] + '">' +
                    '<span class="icon-circle">' + t[1] + '</span>' +
                    '<span><span class="t-name">' + t[2] + '</span><br><span class="t-desc">' + t[3] + '</span></span>' +
                    '</a>';
            }).join('');

            dash.innerHTML =
                statsHtml +
                '<div class="grid-2">' +
                '  <section class="card">' +
                '    <div class="block-head"><h2>我的报名</h2><a href="events.html#mine">全部 →</a></div>' +
                     regsHtml +
                '  </section>' +
                '  <section class="card">' +
                '    <div class="block-head"><h2>近期活动</h2><a href="events.html">活动大厅 →</a></div>' +
                     upcomingHtml +
                '  </section>' +
                '</div>' +
                '<section class="card mt-24">' +
                '  <div class="block-head"><h2>个人资料</h2></div>' +
                '  <div class="profile-card">' +
                '    <div class="profile-avatar">' + esc((user.nickname || user.username || '?').charAt(0).toUpperCase()) + '</div>' +
                '    <div class="profile-main">' +
                '      <h3 class="profile-name">' + esc(user.nickname || user.username) + '<span class="profile-handle">@' + esc(user.username) + '</span></h3>' +
                '      <div class="profile-chips">' +
                '        <span class="chip mono">ID ' + user.id + '</span>' +
                (user.game_id ? '<span class="chip">🎮 ' + esc(user.game_id) + '</span>' : '') +
                '        <span class="chip">注册于 ' + fmtDate(user.created_at) + '</span>' +
                '      </div>' +
                (user.bio
                    ? '<p class="profile-bio">' + esc(user.bio) + '</p>'
                    : '<p class="profile-bio smoke">还没有简介，点右侧「编辑资料」补充吧。</p>') +
                '    </div>' +
                '    <div class="profile-actions">' +
                '      <button class="btn btn-ghost" id="edit-profile" type="button">编辑资料</button>' +
                '      <button class="btn btn-ghost" id="logout-btn" type="button">退出登录</button>' +
                '    </div>' +
                '  </div>' +
                '</section>' +
                '<section class="mt-32">' +
                '  <div class="block-head"><h2>功能入口</h2></div>' +
                '  <div class="tiles">' + tiles + '</div>' +
                '</section>';

            document.getElementById('edit-profile').addEventListener('click', openProfileModal);
            document.getElementById('logout-btn').addEventListener('click', function () {
                HWAuth.logout();
                render();
            });
        }

        function statCard(num, label, coral) {
            return '<div class="stat-card"><div class="stat-num' + (coral ? ' coral' : '') + '">' + num + '</div>' +
                '<div class="stat-label">' + label + '</div></div>';
        }

        function regBadge(status) {
            if (status === 'pending') return 'badge-gold';
            if (status === 'approved') return 'badge-green';
            if (status === 'rejected' || status === 'cancelled') return 'badge-quiet';
            return '';
        }

        /* ---------- Profile modal ---------- */
        function openProfileModal() {
            var u = HWAuth.getSession();
            if (!u) return;
            document.getElementById('pf-nickname').value = u.nickname || '';
            document.getElementById('pf-game-id').value = u.game_id || '';
            document.getElementById('pf-bio').value = u.bio || '';
            document.getElementById('profile-modal').classList.add('visible');
        }
        function closeProfileModal() {
            document.getElementById('profile-modal').classList.remove('visible');
        }
        document.getElementById('pm-close').addEventListener('click', closeProfileModal);
        document.getElementById('pm-cancel').addEventListener('click', closeProfileModal);
        document.getElementById('profile-modal').addEventListener('click', function (e) {
            if (e.target.id === 'profile-modal') closeProfileModal();
        });

        document.getElementById('profile-form').addEventListener('submit', function (e) {
            e.preventDefault();
            HWAuth.updateProfile({
                nickname: document.getElementById('pf-nickname').value.trim(),
                game_id: document.getElementById('pf-game-id').value.trim(),
                bio: document.getElementById('pf-bio').value.trim()
            }).then(function () {
                closeProfileModal();
                render();
            }).catch(function (err) { HWLayout.toast(err.message); });
        });

        document.getElementById('pwd-form').addEventListener('submit', function (e) {
            e.preventDefault();
            HWAuth.changePassword(
                document.getElementById('pf-old-pwd').value,
                document.getElementById('pf-new-pwd').value
            ).then(function () {
                HWLayout.toast('密码修改成功');
                document.getElementById('pf-old-pwd').value = '';
                document.getElementById('pf-new-pwd').value = '';
            }).catch(function (err) { HWLayout.toast(err.message); });
        });

        /* ---------- Render ---------- */
        function render() {
            if (typeof HWLayout !== 'undefined') HWLayout.renderAuth();
            var user = HWAuth.getSession();
            if (!user) { renderGuest(); return; }

            hero.innerHTML = '<span class="eyebrow">Personal Home</span><h1>加载中…</h1>';
            dash.innerHTML = '<div class="empty-state">正在读取你的数据…</div>';

            Promise.all([
                HWAuth.refresh().catch(function () { return user; }),
                loadMyRegs(user.id),
                loadUpcoming(),
                loadBalance(user.id)
            ]).then(function (rs) {
                var fresh = rs[0] || user;
                if (!fresh) { renderGuest(); return; }
                if (rs[1].missing) {
                    hero.innerHTML =
                        '<span class="eyebrow">Setup Required</span>' +
                        '<h1>数据库尚未升级</h1>' +
                        '<p class="lead">个人主页依赖新表 <span class="mono" style="color:var(--mist)">site_users / events / event_registrations</span>。' +
                        '请在 Supabase SQL Editor 执行 <span class="mono" style="color:var(--mist)">supabase/schema.sql</span> 后刷新本页。旧功能不受影响。</p>' +
                        '<div class="hero-actions">' +
                        '  <a class="btn btn-ghost btn-lg" href="DESIGN.md">升级说明</a>' +
                        '  <button class="btn btn-primary btn-lg" id="reload-btn" type="button">已执行，刷新</button>' +
                        '</div>';
                    dash.innerHTML = '';
                    document.getElementById('reload-btn').addEventListener('click', function () { location.reload(); });
                    return;
                }
                renderDashboard(fresh, { myRegs: rs[1].rows, upcoming: rs[2], balance: rs[3] });
            }).catch(function (err) {
                console.error(err);
                hero.innerHTML = '<span class="eyebrow">Error</span><h1>加载失败</h1>';
                dash.innerHTML = '<div class="empty-state"><strong>' + esc(err.message || err) + '</strong><br>请刷新重试</div>';
            });
        }

        HWAuth.init();
        render();
        document.addEventListener('hw:login', render);
    })();
    </script>
</body>
</html>
