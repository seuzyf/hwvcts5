<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HWVCTS — 主页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <style>
        /* Hero */
        .hero { padding: 56px 0 48px; }
        .hero .eyebrow { display: block; margin-bottom: 14px; }
        .hero h1 {
            margin: 0 0 14px;
            font-size: 56px;
            font-weight: 400;
            line-height: 1.17;
            letter-spacing: 0.22px;
            color: var(--pure-white);
        }
        .hero h1 .accent-name { color: var(--coral-pulse); }
        .hero .lead { margin: 0; font-size: 16px; color: var(--ash); max-width: 520px; line-height: 1.6; }
        .hero-actions { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
        .hero-meta {
            margin-top: 26px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--smoke);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .hero-meta .pipe { color: var(--slate); }

        /* Stats */
        .stats-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--ink); border-radius: var(--r-card); padding: 20px 22px; box-shadow: var(--key-shadow); }

        /* Lists */
        .list { display: flex; flex-direction: column; gap: 8px; }
        .list-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            text-decoration: none;
            color: var(--mist);
            transition: border-color var(--t-hover) var(--ease-out), background var(--t-hover) var(--ease-out);
        }
        .list-item:hover { border-color: var(--border); background: rgba(255, 255, 255, 0.04); }
        .list-item .li-icon {
            width: 36px; height: 36px; border-radius: var(--r-circle);
            background: var(--obsidian); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0;
        }
        .list-item .li-main { flex: 1; min-width: 0; }
        .list-item .li-title { font-size: 15px; font-weight: 500; color: var(--pure-white); }
        .list-item .li-sub { font-size: 13px; color: var(--smoke); margin-top: 2px; }
        .list-item .li-end { flex-shrink: 0; }

        .empty-line { padding: 22px 8px; text-align: center; font-size: 14px; color: var(--smoke); line-height: 1.8; }
        .empty-line a { color: var(--ash); }

        /* Profile card */
        .profile-card { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
        .profile-avatar {
            width: 72px; height: 72px; border-radius: var(--r-circle);
            background: var(--ember-hush);
            border: 1px solid rgba(255, 99, 99, 0.4);
            color: var(--coral-pulse);
            font-family: var(--font-sf);
            font-size: 28px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .profile-main { flex: 1; min-width: 220px; }
        .profile-name { margin: 0; font-size: 24px; font-weight: 500; color: var(--pure-white); letter-spacing: 0.2px; }
        .profile-handle { font-family: var(--font-mono); font-size: 13px; color: var(--smoke); margin-left: 8px; }
        .profile-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .profile-bio { margin-top: 12px; font-size: 15px; color: var(--ash); line-height: 1.6; }
        .profile-actions { display: flex; gap: 8px; flex-shrink: 0; }

        /* Feature tiles */
        .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .tile {
            display: flex; align-items: center; gap: 14px;
            padding: 16px;
            border-radius: var(--r-card);
            background: var(--ink);
            box-shadow: var(--key-shadow);
            text-decoration: none;
            color: var(--mist);
            transition: box-shadow var(--t-hover) var(--ease-out), transform var(--t-hover) var(--ease-out);
        }
        .tile:hover { box-shadow: var(--key-shadow-hover); transform: translateY(-2px); }
        .tile .t-name { font-size: 15px; font-weight: 500; color: var(--pure-white); }
        .tile .t-desc { font-size: 13px; color: var(--smoke); margin-top: 2px; }

        .block-head {
            display: flex; align-items: baseline; justify-content: space-between;
            gap: 12px; margin-bottom: 14px;
        }
        .block-head h2 { margin: 0; font-size: 16px; font-weight: 500; color: var(--pure-white); letter-spacing: 0.2px; }
        .block-head a { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--smoke); text-decoration: none; }
        .block-head a:hover { color: var(--mist); }

        @media (max-width: 720px) {
            .hero h1 { font-size: 36px; }
            .profile-actions { width: 100%; }
        }
    </style>
</head>
<body data-page="index">
    <main class="page">
        <div class="container">
            <section class="hero hero-atmosphere" id="hero"></section>
            <div id="dashboard"></div>
        </div>
    </main>


    <script>
    (function () {
        'use strict';

        var REG_STATUS = { pending: '待审核', approved: '已通过', rejected: '未通过', cancelled: '已撤回' };
        /* 活动状态一律走 HWLayout.evState / evBadge（本项目曾因这里另存一份字典导致
           截止时间已过却仍显示「报名中」）。EV_STATUS / EV_BADGE 已删除，勿再引入。 */

        var hero = document.getElementById('hero');
        var dash = document.getElementById('dashboard');

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        function fmtDate(t) {
            if (!t) return '待定';
            var d = new Date(t);
            if (isNaN(d)) return '待定';
            return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        /* ---------- Guest ---------- */
        function renderGuest() {
            hero.innerHTML =
                '<span class="eyebrow">Personal Home</span>' +
                '<h1>你的赛事<span class="accent-name">指挥中心</span></h1>' +
                '<p class="lead">登录后这里就是你的主页。</p>' +
                '<div class="hero-actions">' +
                '  <button class="btn btn-primary btn-lg" id="hero-login" type="button">登录 / 注册</button>' +
                '  <a class="btn btn-ghost btn-lg" href="events.html">先看看活动</a>' +
                '</div>' +
                '<div class="hero-meta"><span>EVENTS</span><span class="pipe">|</span><span>MATCHES</span><span class="pipe">|</span><span>STATS</span><span class="pipe">|</span><span>BETTING</span></div>';
            dash.innerHTML = '';
            document.getElementById('hero-login').addEventListener('click', function () {
                HWAuth.openModal({ stay: true }).then(render).catch(function () {});
            });
        }

        /* ---------- Data ---------- */
        function loadMyRegs(userId) {
            return HWAuth.getClient().from('event_registrations')
                .select('*, events(*)')
                .eq('user_id', userId)
                .order('created_at', { ascending: false })
                .then(function (res) {
                    if (res.error) {
                        if (HWAuth.isMissingTable(res.error)) return { rows: [], missing: true };
                        throw res.error;
                    }
                    return { rows: res.data || [], missing: false };
                });
        }

        function loadUpcoming() {
            return HWAuth.getClient().from('events')
                .select('*')
                /* closed 也要进来：报名截止但还没开赛的活动，用户仍然需要看到「快开赛了」 */
                .in('status', ['registration', 'closed', 'ongoing'])
                .order('start_time', { ascending: true })
                .limit(5)
                .then(function (res) {
                    if (res.error) {
                        if (HWAuth.isMissingTable(res.error)) return [];
                        throw res.error;
                    }
                    return res.data || [];
                });
        }

        /** 与竞猜页同口径：100 - 投入 + 派彩 + 低保 */
        function loadNotifications(userId) {
            return HWAuth.getClient().from('notifications')
                .select('id, title, body, link, read, created_at')
                .eq('user_id', userId)
                .order('created_at', { ascending: false })
                .limit(50)
                .then(function (res) { return (res && !res.error && res.data) || []; })
                .catch(function () { return []; });
        }

        function loadBalance(userId) {
            /* P13e：权威余额（比赛推导 + 流水净额）优先；失败回退旧推导 */
            return HWLayout.recalcBalance(userId).then(function (bal) {
                if (bal != null) return bal;
                return loadBalanceDerived(userId);
            }).catch(function () { return loadBalanceDerived(userId); });
        }

        function loadBalanceDerived(userId) {
            var sb = HWAuth.getClient();
            return Promise.all([
                sb.from('s6_bet_bets').select('*'),
                sb.from('s6_match_schedule').select('id, team_a, team_b, score_a, score_b')
            ]).then(function (rs) {
                if (rs.some(function (r) { return r.error; })) return null;
                var bets = rs[0].data || [];
                var matchMap = {};
                (rs[1].data || []).forEach(function (m) { matchMap[m.id] = m; });

                var pools = {};
                bets.forEach(function (b) {
                    if (!pools[b.match_id]) pools[b.match_id] = { a: 0, b: 0 };
                    var m = matchMap[b.match_id];
                    if (!m) return;
                    if (b.predicted_winner === m.team_a) pools[b.match_id].a += b.amount;
                    else pools[b.match_id].b += b.amount;
                });

                var staked = 0, winnings = 0;
                bets.filter(function (b) { return b.user_id === userId; }).forEach(function (b) {
                    staked += b.amount;
                    var m = matchMap[b.match_id];
                    if (m && m.score_a != null && m.score_b != null && m.score_a !== m.score_b) {
                        var winner = m.score_a > m.score_b ? m.team_a : m.team_b;
                        if (b.predicted_winner === winner) {
                            var pool = pools[b.match_id];
                            var winnerPool = winner === m.team_a ? 100 + pool.a : 100 + pool.b;
                            var loserPool = winner === m.team_a ? 100 + pool.b : 100 + pool.a;
                            winnings += b.amount + Math.ceil((b.amount / winnerPool) * loserPool);
                        }
                    }
                });
                return Math.round(100 - staked + winnings);
            }).catch(function () { return null; });
        }

        /* ---------- Dashboard ---------- */
        function renderDashboard(user, data) {
            var regs = data.myRegs;
            var upcoming = data.upcoming;
            var balance = data.balance;

            var isAdminUser = (typeof HWLayout !== 'undefined' && HWLayout.isAdminNow()) || user.role === 'admin';
            hero.innerHTML =
                '<span class="eyebrow">Personal Home</span>' +
                '<h1>你好，<span class="accent-name">' + esc(user.nickname || user.username) + '</span></h1>' +
                '<p class="lead">管理你的报名与赛事参与，随时掌握审核状态与竞猜积分。</p>';

            var active = regs.filter(function (r) { return r.status === 'pending' || r.status === 'approved'; });
            var pending = regs.filter(function (r) { return r.status === 'pending'; });
            var soon = regs.filter(function (r) {
                return (r.status === 'approved' || r.status === 'pending') && r.events &&
                    /* closed 也算"进行中的报名"：报名截止但还没开赛，用户仍要看到它 */
                    (r.events.status === 'registration' || r.events.status === 'closed' || r.events.status === 'ongoing');
            });

            var statsHtml =
                '<div class="stats-strip">' +
                statCard(active.length, '有效报名', false) +
                statCard(pending.length, '待审核', false) +
                statCard(soon.length, '进行中 / 报名中', false) +
                statCard(balance === null ? '—' : balance, '竞猜积分', true) +
                '</div>';

            var regsHtml = regs.length === 0
                ? '<div class="empty-line">还没有报名任何活动<br><a href="events.html">去活动大厅看看 →</a></div>'
                : '<div class="list">' + regs.slice(0, 6).map(function (r) {
                    var ev = r.events || {};
                    return '<a class="list-item" href="events.html#mine">' +
                        '<span class="li-icon">' + (ev.cover_image ? '<img src="' + esc(ev.cover_image) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">' : HWLayout.ico('clipboard-list', 15)) + '</span>' +
                        '<span class="li-main">' +
                        '  <span class="li-title">' + esc(ev.title || '（活动已删除）') + '</span>' +
                        '  <span class="li-sub">' + esc(ev.season || '') + ' · ' + fmtDate(r.created_at) +
                        (r.team_name ? ' · ' + esc(r.team_name) : '') + '</span>' +
                        '</span>' +
                        '<span class="li-end"><span class="badge ' + regBadge(r.status) + '">' + (REG_STATUS[r.status] || r.status) + '</span></span>' +
                        '</a>';
                }).join('') + '</div>';

            var upcomingHtml = upcoming.length === 0
                ? '<div class="empty-line">近期暂无进行中的活动</div>'
                : '<div class="list">' + upcoming.map(function (ev) {
                    return '<a class="list-item" href="events.html?open=' + ev.id + '">' +
                        '<span class="li-icon">' + (ev.cover_image ? '<img src="' + esc(ev.cover_image) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">' : HWLayout.ico('trophy', 15)) + '</span>' +
                        '<span class="li-main">' +
                        '  <span class="li-title">' + esc(ev.title) + '</span>' +
                        '  <span class="li-sub">' + fmtDate(ev.start_time) + (ev.venue ? ' · ' + esc(ev.venue) : '') + '</span>' +
                        '</span>' +
                        /* 全站唯一口径：状态由 evState 按时钟算，不用静态字典
                           （静态字典只认 ev.status，截止时间过了也不会变——这就是"还是显示报名中"的来源） */
                        '<span class="li-end">' + HWLayout.evBadge(ev) + '</span>' +
                        '</a>';
                }).join('') + '</div>';

            /* 消息：展示全部通知（含已读），未读高亮 */
            var notifs = data.notifications || [];
            var notifHtml = notifs.length === 0
                ? '<div class="empty-line">暂无通知<br><span class="smoke">报名、审核与竞猜动态会出现在这里</span></div>'
                : '<div class="list">' + notifs.slice(0, 30).map(function (n) {
                    return '<a class="list-item" data-nid="' + n.id + '" data-link="' + esc(n.link || '') + '" href="' + (n.link ? esc(n.link) : 'javascript:void(0)') + '">' +
                        '<span class="li-icon">' + HWLayout.ico('bell', 15) + '</span>' +
                        '<span class="li-main">' +
                        '  <span class="li-title">' + esc(n.title || '') + (n.read ? '' : ' <span class="badge badge-gold">未读</span>') + '</span>' +
                        '  <span class="li-sub">' + esc(n.body || '') + ' · ' + fmtDate(n.created_at) + '</span>' +
                        '</span></a>';
                }).join('') + '</div>';

            /* 功能入口：赛程/比赛/数据/竞猜/分队/管理全部绑定在活动下，
               从活动大厅进入；剧情模式独立于赛事体系，保留直入口。 */
            var tiles = [
                ['events.html', 'trophy', '活动大厅', '报名参赛与审核'],
                ['events.html#mine', 'clipboard-list', '我的报名', '报名与参赛记录'],
                ['game.html', 'gamepad', '剧情模式', '沉浸式训练赛故事']
            ];
            if (isAdminUser) tiles.push(['admin.html#perm-card', 'shield-check', '权限管理', '身份与密码管理']);
            tiles = tiles.map(function (t) {
                return '<a class="tile" href="' + t[0] + '">' +
                    '<span class="icon-circle">' + HWLayout.ico(t[1], 18) + '</span>' +
                    '<span><span class="t-name">' + t[2] + '</span><br><span class="t-desc">' + t[3] + '</span></span>' +
                    '</a>';
            }).join('');

            dash.innerHTML =
                statsHtml +
                '<div class="grid-2">' +
                '  <section class="card">' +
                '    <div class="block-head"><h2>我的报名</h2><a href="events.html#mine">全部 →</a></div>' +
                     regsHtml +
                '  </section>' +
                '  <section class="card">' +
                '    <div class="block-head"><h2>近期活动</h2><a href="events.html">活动大厅 →</a></div>' +
                     upcomingHtml +
                '  </section>' +
                '</div>' +
                '<section class="card mt-24" id="dash-brief">' +
                '  <div class="block-head"><h2>今明提醒</h2></div>' +
                '  <div id="dash-brief-body">' + HWLayout.loader({ rows: 2, label: '正在加载今明提醒' }) + '</div>' +
                '</section>' +
                '<section class="card mt-24" id="dash-notif">' +
                '  <div class="block-head"><h2>消息</h2><a href="javascript:void(0)" id="notif-read-all">全部已读</a></div>' +
                notifHtml +
                '</section>' +
                '<section class="mt-32">' +
                '  <div class="block-head"><h2>功能入口</h2></div>' +
                '  <div class="tiles">' + tiles + '</div>' +
                '</section>';

            /* P13h：今明活动 / 赛程 / 下注锁定 */
            loadTodayBrief().then(fillTodayBrief);
            /* 时钟：跨过零点、"即将开始→进行中"这类边界时静默重算（不重排整页） */
            if (HWLayout.clock) {
                HWLayout.clock(function () {
                    if (!document.getElementById('dash-brief-body')) return;
                    loadTodayBrief().then(fillTodayBrief).catch(function () {});
                });
            }

            /* 消息：点击 → 标记已读并跳转；全部已读 */
            var notifCard = document.getElementById('dash-notif');
            if (notifCard) {
                notifCard.addEventListener('click', function (e) {
                    var item = e.target.closest ? e.target.closest('.list-item[data-nid]') : null;
                    if (!item) return;
                    e.preventDefault();
                    var nid = item.dataset.nid;
                    var link = item.dataset.link || '';
                    var gone = false;
                    function go() { if (!gone && link) { gone = true; window.location.href = link; } }
                    try {
                        HWAuth.getClient().from('notifications').update({ read: true }).eq('id', nid)
                            .then(go).catch(go);
                    } catch (err) { go(); }
                    setTimeout(go, 400);
                });
                var ra = document.getElementById('notif-read-all');
                if (ra) ra.addEventListener('click', function (e) {
                    e.preventDefault();
                    HWAuth.getClient().from('notifications').update({ read: true })
                        .eq('user_id', user.id).eq('read', false)
                        .then(function () { HWLayout.toast('已全部标为已读'); render(); })
                        .catch(function () { HWLayout.toast('操作失败', 'err'); });
                });
            }
        }

        function loadTodayBrief() {
            var sb = HWAuth.getClient();
            var d0 = new Date(); d0.setHours(0, 0, 0, 0);
            var d2 = new Date(d0); d2.setDate(d2.getDate() + 2);
            return Promise.all([
                sb.from('events').select('id, title, status, start_time, end_time, reg_deadline')
                    .in('status', ['registration', 'closed', 'ongoing']),
                sb.from('s6_match_schedule').select('id, team_a, team_b, match_date, group').not('match_date', 'is', null),
                sb.from('s5_match_schedule').select('id, team_a, team_b, match_date, group').not('match_date', 'is', null),
                sb.from('s6_betting_groups').select('group_name, is_locked')
            ]).then(function (rs) {
                var inRange = function (v) {
                    if (!v) return false;
                    var t = new Date(v).getTime();
                    return !isNaN(t) && t >= d0.getTime() && t < d2.getTime();
                };
                var evs = ((rs[0] && !rs[0].error && rs[0].data) || []).filter(function (e) {
                    var ph = HWLayout.evState(e).phase;
                    if (ph === 'ended' || ph === 'cancelled' || ph === 'deleted' || ph === 'draft') return false;
                    return inRange(e.start_time) || inRange(e.reg_deadline) || inRange(e.end_time);
                });
                var matches = []
                    .concat((rs[1] && !rs[1].error && rs[1].data) || [])
                    .concat((rs[2] && !rs[2].error && rs[2].data) || [])
                    .filter(function (m) { return inRange(m.match_date); })
                    .sort(function (a, b) { return new Date(a.match_date) - new Date(b.match_date); })
                    .slice(0, 8);
                var locked = ((rs[3] && !rs[3].error && rs[3].data) || [])
                    .filter(function (g) { return g.is_locked; })
                    .map(function (g) { return g.group_name; });
                return { evs: evs, matches: matches, locked: locked, d0: d0 };
            }).catch(function () { return null; });
        }
        function fillTodayBrief(brief) {
            var body = document.getElementById('dash-brief-body');
            if (!body) return;
            if (!brief) { body.innerHTML = '<div class="empty-line">今明暂无活动或赛程</div>'; return; }
            var dayLabel = function (v) {
                var d = new Date(v);
                var t0 = new Date(); t0.setHours(0, 0, 0, 0);
                var day = new Date(d); day.setHours(0, 0, 0, 0);
                return day.getTime() === t0.getTime() ? '今日' : '明日';
            };
            var parts = [];
            if (brief.evs.length) {
                parts.push('<div class="list">' + brief.evs.slice(0, 4).map(function (e) {
                    var when = e.start_time ? dayLabel(e.start_time) : (e.reg_deadline ? dayLabel(e.reg_deadline) : '今明');
                    return '<a class="list-item" href="events.html?open=' + e.id + '">' +
                        '<span class="li-icon">' + HWLayout.ico('calendar', 15) + '</span>' +
                        '<span class="li-main"><span class="li-title">' + esc(e.title) + '</span>' +
                        '<span class="li-sub">' + when + ' · ' + esc(HWLayout.evState(e).label) + '</span></span></a>';
                }).join('') + '</div>');
            }
            if (brief.matches.length) {
                parts.push('<div class="list">' + brief.matches.map(function (m) {
                    return '<a class="list-item" href="matches.html">' +
                        '<span class="li-icon">' + HWLayout.ico('trophy', 15) + '</span>' +
                        '<span class="li-main"><span class="li-title">' + esc(m.team_a) + ' vs ' + esc(m.team_b) + '</span>' +
                        '<span class="li-sub">' + dayLabel(m.match_date) + ' ' +
                        new Date(m.match_date).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) +
                        ' · ' + esc(m.group || '') + '</span></span></a>';
                }).join('') + '</div>');
            }
            if (brief.locked.length) {
                parts.push('<div class="smoke" style="font-size:13px; margin-top:8px;">下注锁定：' + esc(brief.locked.join('、')) + '</div>');
            }
            body.innerHTML = parts.length ? parts.join('') : '<div class="empty-line">今明暂无活动或赛程</div>';
        }

        function statCard(num, label, coral) {
            return '<div class="stat-card"><div class="stat-num' + (coral ? ' coral' : '') + '">' + num + '</div>' +
                '<div class="stat-label">' + label + '</div></div>';
        }

        function regBadge(status) {
            if (status === 'pending') return 'badge-gold';
            if (status === 'approved') return 'badge-green';
            if (status === 'rejected' || status === 'cancelled') return 'badge-quiet';
            return '';
        }

        /* 资料/密码弹框已迁移至 js/layout.js（右上角头像菜单统一入口） */

        /* ---------- Render ---------- */
        function render() {
            if (typeof HWLayout !== 'undefined') HWLayout.renderAuth();
            var user = HWAuth.getSession();
            if (!user) { renderGuest(); return; }

            hero.innerHTML = '<span class="eyebrow">Personal Home</span><h1><span class="sk" style="width:220px;height:28px;display:inline-block;vertical-align:middle;"></span></h1>';
            dash.innerHTML = '<div class="empty-state">正在读取你的数据…</div>';

            Promise.all([
                HWAuth.refresh().catch(function () { return user; }),
                loadMyRegs(user.id),
                loadUpcoming(),
                loadBalance(user.id),
                loadNotifications(user.id)
            ]).then(function (rs) {
                var fresh = rs[0] || user;
                if (!fresh) { renderGuest(); return; }
                if (rs[1].missing) {
                    hero.innerHTML =
                        '<span class="eyebrow">Setup Required</span>' +
                        '<h1>数据库尚未升级</h1>' +
                        '<p class="lead">个人主页依赖新表 <span class="mono" style="color:var(--mist)">site_users / events / event_registrations</span>。' +
                        '请在 Supabase SQL Editor 执行 <span class="mono" style="color:var(--mist)">supabase/install.sql</span> 后刷新本页。旧功能不受影响。</p>' +
                        '<div class="hero-actions">' +
                        '  <a class="btn btn-ghost btn-lg" href="DESIGN.md">升级说明</a>' +
                        '  <button class="btn btn-primary btn-lg" id="reload-btn" type="button">已执行，刷新</button>' +
                        '</div>';
                    dash.innerHTML = '';
                    document.getElementById('reload-btn').addEventListener('click', function () { location.reload(); });
                    return;
                }
                renderDashboard(fresh, { myRegs: rs[1].rows, upcoming: rs[2], balance: rs[3], notifications: rs[4] });
            }).catch(function (err) {
                console.error(err);
                hero.innerHTML = '<span class="eyebrow">Error</span><h1>加载失败</h1>';
                dash.innerHTML = '<div class="empty-state"><strong>' + esc(err.message || err) + '</strong><br>请刷新重试</div>';
            });
        }

        HWAuth.init();
        render();
        document.addEventListener('hw:login', render);
        document.addEventListener('hw:profile', render);
    })();
    </script>
</body>
</html>
