<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛事数据台 · HWVCTS</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
<style>

        /* ═════════ 数据台 · 重构版（纯 theme 组件语言 · 无 legacy 别名 · 无旧装饰条） ═════════ */
        body { padding-top: 80px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.35s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        .data-section {
            background: var(--ink); border: 1px solid var(--border);
            border-radius: var(--r-card); padding: 24px; margin-top: 20px; box-sizing: border-box;
        }
        .data-section h3 {
            margin: 0 0 6px; font-size: 16px; font-weight: 600;
            color: var(--pure-white); letter-spacing: 0;
        }
        .admin-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
        .admin-row label { font-size: 13px; color: var(--smoke); font-weight: 500; }

        .warning-text {
            text-align: left; font-size: 14px; color: var(--ash); margin: 10px 0 18px;
            background: var(--obsidian); border: 1px solid var(--border);
            border-radius: 10px; padding: 14px; max-height: 200px;
            overflow-y: auto; line-height: 1.7; box-sizing: border-box;
        }

        /* tab 内动态表单控件（模板生成的裸 input/select 也获得统一外观） */
        .tab-content input:not([type="checkbox"]):not([type="radio"]),
        .tab-content select,
        .tab-content textarea {
            height: 36px; padding: 0 10px; background: var(--obsidian);
            border: 1px solid var(--border); color: var(--mist);
            border-radius: var(--r-input); font-family: inherit; font-size: 14px;
            outline: none; box-sizing: border-box; transition: border-color 0.15s;
        }
        .tab-content textarea { height: auto; padding: 8px 10px; resize: vertical; }
        .tab-content input:focus, .tab-content select:focus, .tab-content textarea:focus { border-color: var(--smoke); }
        .tab-content .input, .tab-content .select, .tab-content .textarea { background: var(--obsidian); }
        .team-selector, .player-id-input, .player-name-input { min-width: 90px; }

        /* 表格（成员维护 / 动态行） */
        .tab-content table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
        .tab-content th, .tab-content td {
            padding: 9px 6px; text-align: left; border-bottom: 1px solid var(--border);
        }
        .tab-content thead th {
            font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
            text-transform: uppercase; color: var(--smoke); font-weight: 500; white-space: nowrap;
        }
        .tab-content tbody tr:last-child td { border-bottom: none; }
        .tab-content tbody tr:hover { background: rgba(255, 255, 255, 0.02); }

        /* 模板按钮 */
        .add-row-btn {
            height: 34px; padding: 0 16px; border-radius: var(--r-btn);
            border: 1px dashed var(--border); background: transparent; color: var(--coral-pulse);
            font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.15s;
            margin-bottom: 16px; font-family: inherit;
        }
        .add-row-btn:hover { border-color: var(--coral-pulse); background: var(--ember-hush); }
        .delete-row-btn {
            height: 30px; padding: 0 12px; border-radius: var(--r-btn);
            border: 1px solid var(--border); background: transparent; color: var(--smoke);
            font-size: 12px; cursor: pointer; transition: 0.15s; font-family: inherit;
        }
        .delete-row-btn:hover { border-color: rgba(255, 99, 99, 0.5); color: #ff8f8f; background: rgba(255, 99, 99, 0.08); }
        button.success {
            height: 36px; padding: 0 18px; border-radius: var(--r-btn);
            border: 1px solid rgba(89, 212, 153, 0.5); background: rgba(89, 212, 153, 0.1);
            color: var(--success-green); font-size: 14px; font-weight: 600;
            cursor: pointer; transition: 0.15s; font-family: inherit;
        }
        button.success:hover { background: var(--success-green); color: #fff; }

/* ================= 数据台（manage）专用 ================= */
    .manage-gate { max-width: 720px; margin: 60px auto; }
    .manage-gate a { color: var(--coral-pulse); font-weight: 700; }
    .page-sub { color: var(--mist); font-weight: 600; margin-top: 8px; font-size: 15px; opacity: 0.8; }
    .merge-hint { color: var(--mist); opacity: 0.7; font-size: 14px; margin-bottom: 16px; }
    #merge-fixtures { display: flex; flex-direction: column; gap: 10px; }
    .mf-fixture { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
        background: var(--obsidian); border: 1px solid var(--border); border-radius: 12px;
        padding: 13px 16px; color: var(--mist); cursor: pointer; transition: transform var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); font-family: inherit; }
    .mf-fixture:hover { border-color: rgba(255,255,255,0.3); transform: translateX(3px); }
    .mf-fid { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; opacity: 0.6; min-width: 118px; }
    .mf-teams { flex: 1; font-size: 15px; font-weight: 600; }
    .mf-teams b { color: var(--coral-pulse); font-variant-numeric: tabular-nums; }
    .mf-date { font-size: 12px; opacity: 0.5; }
    .mf-map-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .mf-map-row select { flex: 1.4; }
    .mf-map-row input { width: 76px; text-align: center; }
    .mf-map-del { border: none; background: var(--graphite); color: var(--mist);
        width: 36px; height: 40px; border-radius: 9px; cursor: pointer; font-size: 15px; }
    .mf-map-del:hover { background: rgba(255,99,99,0.3); }
    .mf-big { display: flex; align-items: center; gap: 16px; margin-top: 18px; padding: 14px 18px;
        background: var(--graphite); border: 1px solid var(--border); border-radius: 12px;
        font-weight: 700; flex-wrap: wrap; }
    .mf-big .score { font-size: 26px; color: var(--coral-pulse); font-variant-numeric: tabular-nums; }
    .mf-big input { width: 66px; text-align: center; }
    .mf-teams-new { display: none; gap: 12px; margin-top: 6px; }
    .mf-teams-new.show { display: flex; }
    .mf-teams-new select { flex: 1; }
    .empty-hint { opacity: 0.6; font-size: 14px; padding: 16px 0; }

    /* toast 反馈 */
    #toast { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(16px);
        background: var(--ink); color: var(--pure-white);
        border: 1px solid var(--border); padding: 11px 18px; border-radius: 12px;
        font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: 0.22s;
        z-index: 999; max-width: 80vw; box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body data-page="manage">
    <script> if (localStorage.getItem('hw_theme') === 'light') document.body.setAttribute('data-theme', 'light');</script>
    <script> if (typeof HWAuth !== 'undefined') { try { HWAuth.init(); } catch (e) {} } </script>

    <datalist id="teams-datalist"></datalist>

<div id="validation-modal" class="modal-backdrop">
        <div class="modal-panel" style="max-width: 500px;" role="dialog" aria-modal="true" aria-labelledby="validation-title">
            <button class="modal-close" id="validation-x" type="button" aria-label="关闭">&times;</button>
            <span class="modal-eyebrow">Confirm</span>
            <h2 id="validation-title">提 交 提 醒</h2>
            <div id="validation-warnings" class="warning-text"></div>
            <p style="color:var(--mist); margin-bottom:20px; font-size: 15px; font-weight: 500;">是否确认继续提交并保存修改？</p>
            <div style="display:flex; justify-content:center; gap: 20px;">
                <button class="btn btn-primary" id="validation-confirm-btn">确 认 提 交</button>
                <button class="btn btn-ghost" id="validation-cancel-btn">返 回 修 改</button>
            </div>
        </div>
    </div>


    <main class="page">
    <div class="container">
        <div class="page-header">
            <span class="eyebrow">Console</span>
            <h1 class="page-title">赛事数据台</h1>
            <div class="page-sub" id="mf-event-title"></div>
        </div>
        <div id="event-bar" hidden></div>
    <div id="manage-gate" class="data-section manage-gate" style="display:none;"></div>

    <div id="manage-shell" style="display:none;">
        <div class="filter-bar">
            <div class="seg" id="group-filter-buttons">
                <button data-group="传奇组" class="active">传奇组</button>
                <button data-group="中坚组" class="">中坚组</button>
                <button data-group="挑战组" class="">挑战组</button>
            </div>
            <div class="seg" id="tab-filters">
                <button data-tab="merged-tab" class="active">结果录入</button>
                <button data-tab="ids-tab" class="">成员维护</button>
            </div>
        </div>

    <div id="merged-tab" class="tab-content active">
        <div class="data-section">
            <h3>结 果 录 入（赛程大比分 + 每图比分 + 选手数据）</h3>
            <p class="merge-hint">选择对阵 → 逐图录入比分 → 大比分由图胜自动识别，一次保存写入赛程与赛果；每图选手数据在本页下方编辑并提交。</p>
            <div class="admin-row" style="justify-content:space-between; margin-bottom:12px;">
                <div class="seg" id="mf-scope" style="display:none;">
                    <button data-scope="mine" class="active" type="button">我的比赛</button>
                    <button data-scope="all" type="button">全部比赛</button>
                </div>
                <span class="muted" id="mf-scope-note" style="font-size:13px;"></span>
            </div>
            <div id="merge-fixtures"></div>
            <div class="admin-row" style="margin-top: 16px;">
                <button class="btn btn-ghost" id="merge-new-fixture">+ 新建对阵</button>
            </div>
            <div id="merge-form" style="display:none; margin-top: 18px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 18px;">
                <div class="admin-row">
                    <label>阶段</label>
                    <select id="mf-stage">
                        <option value="小组赛">小组赛</option>
                        <option value="淘汰赛">淘汰赛</option>
                        <option value="决赛">决赛</option>
                    </select>
                    <label>开赛时间</label>
                    <input type="datetime-local" id="mf-date" style="max-width: 230px;">
                    <label>回放链接</label>
                    <input type="text" id="mf-link" placeholder="https://...">
                </div>
                <div class="admin-row mf-teams-new" id="mf-teams-new">
                    <label>队伍</label>
                    <select id="mf-team-a"></select>
                    <span style="opacity:.6; font-weight:700;">VS</span>
                    <select id="mf-team-b"></select>
                </div>
                <div class="admin-row"><label style="margin:0;">每图比分</label></div>
                <div id="mf-maps"></div>
                <div class="admin-row">
                    <button class="btn btn-ghost" id="mf-add-map">+ 加一图</button>
                </div>
                <div class="mf-big">
                    <span>大比分（自动识别）：</span>
                    <span class="score" id="mf-big">– : –</span>
                    <span style="opacity:.65; font-weight:600;">（无图数据时手动填）</span>
                    <input type="number" min="0" max="9" id="mf-big-a" placeholder="A">
                    <span>:</span>
                    <input type="number" min="0" max="9" id="mf-big-b" placeholder="B">
                </div>
                <div class="admin-row" style="margin-top: 18px;">
                    <button class="btn btn-primary" id="mf-save">保存（写入赛程 + 赛果）</button>
                    <button class="btn btn-ghost" id="mf-cancel">取消</button>
                </div>
            </div>
        </div>
            <div class="data-section">
                <h3>选手数据 · 新增（整场逐图）</h3>
                <button class="add-row-btn" data-table="matches-table-body">+ 新增对局记录 (默认3局)</button>
                <div id="matches-form-container"></div>
                <button class="success" style="margin-top: 15px;" id="submit-matches">提 交 新 赛 果</button>
            </div>
            
            <div class="data-section">
                <h3>选手数据 · 修改（按对阵）</h3>
                <select id="edit-match-selector" style="margin-bottom: 20px;"></select>
                <div id="edit-match-form-container"></div>
                <button class="success" style="margin-top: 15px; display: none;" id="update-match">更 新 此 赛 果</button>
            </div>

            </div>

<div id="ids-tab" class="tab-content">
             <div class="data-section">
                <h3>选 手 信 息 维 护</h3>
                <button class="add-row-btn" data-table="ids-table-body">+ 新增选手记录</button>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>选手真名 (主键)</th>
                                <th>选手 ID</th>
                                <th>所属队伍</th>
                                <th>头像链接</th>
                                <th>选手荣誉 (用"、"分割)</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="ids-table-body"></tbody>
                    </table>
                </div>
                <button class="success" style="margin-top: 20px;" id="update-ids">同 步 选 手 数 据</button>
            </div>
        </div>
    </div>
    </div>
    </main>
    <div id="toast"></div>
<script>
const SUPABASE_URL = 'https://odjmanvkhwiirswscrht.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LVXTUDdXTQ8vlRS0U0G1xQ_qMnEiylO';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    let allPlayersData = [];
    let groupData = { '传奇组': { teams: new Set(), rosters: {} }, '中坚组': { teams: new Set(), rosters: {} }, '挑战组': { teams: new Set(), rosters: {} } };
    let currentScheduleData = [];
    let currentMatchesForEdit = [];
    let currentSeason = 's6'; // 默认 S6 赛季

    const matchIdToName = {
        'S1-1': '0-0组-第1场', 'S1-2': '0-0组-第2场', 'S1-3': '0-0组-第3场', 'S1-4': '0-0组-第4场',
        'S2-1W': '1-0组-第1场', 'S2-2W': '1-0组-第2场', 'S2-1L': '0-1组-第1场', 'S2-2L': '0-1组-第2场',
        'S3-1M': '1-1组-第1场', 'S3-2M': '1-1组-第2场', 'S3-PROMO-A': '2-0晋级赛-A', 'S3-PROMO-B': '2-0晋级赛-B',
        'S3-ELIM-A': '0-2淘汰赛-A', 'S3-ELIM-B': '0-2淘汰赛-B', 'S5-PROMO-A': '2-1晋级赛-A', 'S5-PROMO-B': '2-1晋级赛-B',
        'S5-ELIM-A': '1-2淘汰赛-A', 'S5-ELIM-B': '1-2淘汰赛-B', 'S1-5': '0-0组-第5场', 'S1-6': '0-0组-第6场',
        'S2-3W': '1-0组-第3场', 'S2-3L': '0-1组-第3场', 'S3-3M': '1-1组-第3场',
        'S3-PROMO-1': '2-0晋级赛-第1场', 'S3-PROMO-2': '2-0晋级赛-第2场', 'S3-PROMO-3': '2-0晋级赛-第3场',
        'S3-ELIM-1': '0-2淘汰赛-第1场', 'S3-ELIM-2': '0-2淘汰赛-第2场', 'S3-ELIM-3': '0-2淘汰赛-第3场',
        'S4-PROMO-1': '2-1晋级赛-第1场', 'S4-PROMO-2': '2-1晋级赛-第2场', 'S4-PROMO-3': '2-1晋级赛-第3场',
        'S4-ELIM-1': '1-2淘汰赛-第1场', 'S4-ELIM-2': '1-2淘汰赛-第2场', 'S4-ELIM-3': '1-2淘汰赛-第3场',
        'P-WB1-1': '胜者组-第一轮-第1场', 'P-WB1-2': '胜者组-第一轮-第2场', 'P-WBF': '胜者组-决赛',
        'P-LB1': '败者组-第一轮', 'P-LB1-1': '败者组-第一轮-第1场', 'P-LB1-2': '败者组-第一轮-第2场',
        'P-LB2': '败者组-第二轮', 'P-LBF': '败者组-决赛', 'P-GF': '总决赛',
        
        // 传奇组单循环赛制映射追加
        'RR-1-1': '循环赛-第1轮-第1场', 'RR-1-2': '循环赛-第1轮-第2场', 'RR-1-3': '循环赛-第1轮-第3场',
        'RR-2-1': '循环赛-第2轮-第1场', 'RR-2-2': '循环赛-第2轮-第2场', 'RR-2-3': '循环赛-第2轮-第3场',
        'RR-3-1': '循环赛-第3轮-第1场', 'RR-3-2': '循环赛-第3轮-第2场', 'RR-3-3': '循环赛-第3轮-第3场',
        'RR-4-1': '循环赛-第4轮-第1场', 'RR-4-2': '循环赛-第4轮-第2场', 'RR-4-3': '循环赛-第4轮-第3场',
        'RR-5-1': '循环赛-第5轮-第1场', 'RR-5-2': '循环赛-第5轮-第2场', 'RR-5-3': '循环赛-第5轮-第3场',
        'RR-6-1': '循环赛-第6轮-第1场', 'RR-6-2': '循环赛-第6轮-第2场', 'RR-6-3': '循环赛-第6轮-第3场',
        'RR-7-1': '循环赛-第7轮-第1场', 'RR-7-2': '循环赛-第7轮-第2场', 'RR-7-3': '循环赛-第7轮-第3场'
    };

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    var boundEvent = null;
    async function initializeAdminPanel() {
        await loadInitialData();
        setupTabs(); setupDynamicRows(); setupGroupFilters();
        
        const currentGroup = getCurrentGroup();
        loadIdsData(currentGroup);
        await loadScheduleForGroup(currentGroup);
        await loadMatchesForEditing(currentGroup);

        document.getElementById('submit-matches').addEventListener('click', submitMatches);
        document.getElementById('update-match').addEventListener('click', updateMatch);
        document.getElementById('edit-match-selector').addEventListener('change', displayMatchForEditing);
        document.getElementById('update-ids').addEventListener('click', updateIds);
    }
    
    async function loadInitialData() {
        const tableName = currentSeason === 's5' ? 's5_player_ids' : 's6_player_ids';
        const { data, error } = await supabaseClient.from(tableName).select('id, name, team, "group", image, honor');
        if (error) { console.error('无法加载选手数据:', error); return; }
        
        allPlayersData = data;
        groupData = { '传奇组': { teams: new Set(), rosters: {} }, '中坚组': { teams: new Set(), rosters: {} }, '挑战组': { teams: new Set(), rosters: {} } };

        data.forEach(player => {
            const playerGroup = player.group;
            if (groupData[playerGroup]) {
                if (player.team) {
                    groupData[playerGroup].teams.add(player.team);
                    if (!groupData[playerGroup].rosters[player.team]) groupData[playerGroup].rosters[player.team] = [];
                    groupData[playerGroup].rosters[player.team].push({ id: player.id, name: player.name });
                }
            }
        });
        updateTeamDatalist();
    }

    async function loadScheduleForGroup(groupName) {
        const { data, error } = await supabaseClient.from('s6_match_schedule').select('*').eq('group', groupName).order('id');
        if (error) { console.error(`加载 ${groupName}赛程失败:`, error); currentScheduleData = []; } 
        else { currentScheduleData = data.filter(m => m.team_a && m.team_a !== 'TBD'); }
        if (document.getElementById('match-selector')) { populateMatchSelector(); document.getElementById('schedule-update-form').style.display = 'none'; }
        if (typeof renderMergeFixtures === 'function') renderMergeFixtures();
    }

    function populateMatchSelector() {
        const selector = document.getElementById('match-selector');
        selector.innerHTML = '<option value="">-- 请选择一场比赛 --</option>';
        /* 超时未录赛果 → 提醒双方队长（幂等，layout 内按标题查重） */
        if (boundEvent && typeof HWLayout !== 'undefined' && HWLayout.notifyMatchDue) {
            var nowT = Date.now();
            currentScheduleData.forEach(function (m) {
                var noScore = m.score_a == null || m.score_b == null || (m.score_a === 0 && m.score_b === 0);
                if (m.match_date && noScore && new Date(m.match_date).getTime() < nowT) {
                    HWLayout.notifyMatchDue(m, boundEvent.id);
                }
            });
        }
        if (currentScheduleData.length > 0) {
            currentScheduleData.forEach(match => {
                const option = document.createElement('option');
                option.value = match.id; 
                option.textContent = `${matchIdToName[match.match_id] || match.match_id}: ${match.team_a} vs ${match.team_b}`;
                selector.appendChild(option);
            });
        }
    }

    function getTeamOptionsHTML(teamName) { return `<option value="${teamName}" selected>${teamName}</option>`; }

    function loadSelectedMatch() {
        const selector = document.getElementById('match-selector');
        const matchId = selector.value;
        const form = document.getElementById('schedule-update-form');
        if (!matchId) { form.style.display = 'none'; return; }

        const matchData = currentScheduleData.find(m => m.id == matchId);
        if (matchData) {
            document.getElementById('schedule-team-a').innerHTML = getTeamOptionsHTML(matchData.team_a);

    // 提取表单内所有原生数据（包含name用于校验）
    function getRawMatchDataFromContainer(containerId) {
        const container = document.getElementById(containerId);

        rows.forEach(row => {

    function getSeasonTableName(baseName) {

    async function validateMatchData(dataArray, isEdit = false) {
        let warnings = [];
        let playerUpdatesMap = new Map();
        const matchesTable = getSeasonTableName('matches');
        const playerIdsTable = getSeasonTableName('player_ids');

        for (const row of dataArray) {
            // 基础校验
            if (!row.score) warnings.push(`[${row.team_a || '未知'} vs ${row.team_b || '未知'}] 未填写比分。`);
            if (!row.match_date) warnings.push(`[${row.team_a || '未知'} vs ${row.team_b || '未知'}] 未填写比赛日期/时间。`);

            // 判断同地图同时刻的比赛撞车
            if (!isEdit && row.team_a && row.team_b && row.match_date && row.map) {
                const { data: existing } = await supabaseClient.from(matchesTable).select('id')
                    .eq('team_a', row.team_a)
                    .eq('team_b', row.team_b)
                    .eq('match_date', row.match_date)
                    .eq('map', row.map);
                if (existing && existing.length > 0) {
                    warnings.push(`[${row.team_a} vs ${row.team_b}] 同一时间同一地图已存在相同的对局记录！`);
                }
            }

            // 队伍数据级校验
            ['a', 'b'].forEach(teamLabel => {
                const chars = new Set();
                const currentTeamName = row[`team_${teamLabel}`] || `队伍${teamLabel.toUpperCase()}`;
                
                for (let i = 1; i <= 5; i++) {
                    const prefix = `team_${teamLabel}_player${i}`;
                    const acs = row[`${prefix}_acs`];
                    const ch = row[`${prefix}_ch`];
                    const id = row[`${prefix}_id`];
                    const name = row[`${prefix}_name`];

                    if (id || name) {
                        // 校验ACS为0或未填
                        if (acs === 0 || acs === '' || acs === null || acs === undefined) {
                            warnings.push(`[${currentTeamName}] 选手 ${name || id} 的 ACS 为 0 或未填写。`);
                        }
                        
                        // 校验重复英雄
                        if (ch) {
                            if (chars.has(ch)) {
                                warnings.push(`[${currentTeamName}] 出现了重复的英雄: ${ch}。`);
                            }
                            chars.add(ch);
                        }

                        // 判断是否手动更新了选手ID
                        if (name && id) {
                            const playerEntry = allPlayersData.find(p => p.name === name);
                            if (playerEntry && playerEntry.id !== id) {
                                playerUpdatesMap.set(name, id);
                            }
                        }
                    }
                }
            });
        }
        
        return { 
            warnings, 
            playerUpdates: Array.from(playerUpdatesMap, ([name, newId]) => ({ name, newId })) 
        };
    }

    function formatMatchDataForDB(rawData) {
        return rawData.map(row => {
            const newRow = { ...row };
            ['a', 'b'].forEach(teamLabel => {
                for (let i = 1; i <= 5; i++) {
                    const prefix = `team_${teamLabel}_player${i}`;
                    const acs = newRow[`${prefix}_acs`]; const k = newRow[`${prefix}_k`]; const d = newRow[`${prefix}_d`]; const a = newRow[`${prefix}_a`];
                    if (newRow[`${prefix}_id`]) { newRow[`${prefix}_data`] = `${acs || 0}/${k || 0}/${d || 0}/${a || 0}`; }
                    
                    delete newRow[`${prefix}_acs`]; delete newRow[`${prefix}_k`]; delete newRow[`${prefix}_d`]; delete newRow[`${prefix}_a`];
                    delete newRow[`${prefix}_name`];
                }
            });
            return newRow;
        });
    }

    function triggerConfirmationDialog(warnings, proceedCallback) {
        if (warnings.length === 0) {
            proceedCallback();
            return;
        }
        const modal = document.getElementById('validation-modal');
        const warningDiv = document.getElementById('validation-warnings');
        warningDiv.innerHTML = warnings.map(w => `• ${w}`).join('<br>');
        
        const confirmBtn = document.getElementById('validation-confirm-btn');
        const cancelBtn = document.getElementById('validation-cancel-btn');
        const xBtn = document.getElementById('validation-x');

        const onConfirm = () => { modal.classList.remove('visible'); proceedCallback(); cleanUp(); };
        const onCancel = () => { modal.classList.remove('visible'); cleanUp(); };

        const cleanUp = () => {
            confirmBtn.removeEventListener('click', onConfirm);
            cancelBtn.removeEventListener('click', onCancel);
            xBtn.removeEventListener('click', onCancel);
        };

        confirmBtn.addEventListener('click', onConfirm);
        cancelBtn.addEventListener('click', onCancel);
        xBtn.addEventListener('click', onCancel);

        modal.classList.add('visible');
    }

    async function submitMatches() {
        const rawData = getRawMatchDataFromContainer('matches-form-container');
        if (rawData.length === 0) return toast('没有要提交的数据。', 'err');
        for (const row of rawData) { if (!row.group || !row.stage || !row.team_a || !row.team_b) return toast('请确保每条记录的赛段和队伍名都已填写！', 'err'); }
        
        const { warnings, playerUpdates } = await validateMatchData(rawData, false);
        
        triggerConfirmationDialog(warnings, async () => {
            if (playerUpdates.length > 0) {
                for (const update of playerUpdates) {
                    await supabaseClient.from(getSeasonTableName('player_ids')).update({ id: update.newId }).eq('name', update.name);
                    const p = allPlayersData.find(player => player.name === update.name);
                    if (p) p.id = update.newId; 
                }
            }

            const dbData = formatMatchDataForDB(rawData);
            const { error } = await supabaseClient.from(getSeasonTableName('matches')).insert(dbData);
            if (error) { toast('提交赛果失败: ' + error.message, 'err'); console.error(error); }
            else { toast('赛果提交成功！'); document.getElementById('matches-form-container').innerHTML = ''; await loadMatchesForEditing(getCurrentGroup()); }
        });
    }

                    const p = allPlayersData.find(player => player.name === update.name);
                    if (p) p.id = update.newId;

        tableBody.innerHTML = '<tr><td colspan="6" style="color:var(--smoke); text-align:center;">正在加载...</td></tr>';
        const filteredData = allPlayersData.filter(p => p.group === groupName);
        tableBody.innerHTML = '';
        if (filteredData.length === 0) { tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--smoke);">该组别下没有选手数据。</td></tr>`; } 
        else { filteredData.forEach(player => tableBody.appendChild(rowTemplates['ids-table-body'](false, player))); }
    }
    
    function getIdsTableData() {
        const rows = document.querySelectorAll(`#ids-table-body tr`);
        const data = []; const selectedGroup = getCurrentGroup();
        rows.forEach(row => {
            if (row.querySelector('td[colspan="6"]')) return;
            const rowData = {}; rowData.isNew = row.dataset.isNew === 'true'; rowData.group = selectedGroup;
            row.querySelectorAll('input, select').forEach(input => {
                if (input.dataset.col) { let value = input.value.trim(); if (value !== '' && value !== null) rowData[input.dataset.col] = value; }
            });
            if (Object.keys(rowData).length > 1) data.push(rowData);
        });
        return data;
    }

    async function updateIds() {
        const dataToUpsert = getIdsTableData();
        if (dataToUpsert.length === 0) return toast('没有要更新或添加的数据。', 'err');
        const existingNames = new Set(allPlayersData.map(p => p.name));
        for (const row of dataToUpsert) {
            if (row.isNew) {
                if (!row.name) return toast('新增选手的真名不能为空！', 'err');
                if (existingNames.has(row.name)) return toast(`提交失败：选手真名 "${row.name}" 已存在`, 'err');
            }
        }
        const dbData = dataToUpsert.map(row => { const { isNew, ...dbRow } = row; return dbRow; });
        const { error } = await supabaseClient.from(getSeasonTableName('player_ids')).upsert(dbData, { onConflict: 'name' });
        if (error) { toast('更新失败: ' + error.message, 'err'); console.error(error); } 
        else { toast('选手数据更新成功！'); await loadInitialData(); loadIdsData(getCurrentGroup()); }
    }
    
    async function handleDeleteId(deleteBtn) {
        const tr = deleteBtn.closest('tr');
        const playerName = tr.querySelector('input[data-col="name"]').value;
        const isNewRow = tr.dataset.isNew === 'true';
        if (isNewRow || !playerName) { tr.remove(); return; }
        const ok = await HWLayout.confirmDialog({
            title: '永久删除选手',
            message: `确定要从数据库中永久删除选手「${playerName}」吗？此操作不可撤销。`,
            okText: '永久删除', danger: true
        });
        if (!ok) return;
        const { error } = await supabaseClient.from(getSeasonTableName('player_ids')).delete().eq('name', playerName);
        if (error) { toast(`删除失败: ${error.message}`, 'err'); }
        else { toast(`选手 "${playerName}" 已删除`); tr.remove(); allPlayersData = allPlayersData.filter(p => p.name !== playerName); }
    }
    window.handleDeleteId = handleDeleteId;

    /* ================= 数据台 · 门禁 + 合并录入 ================= */
    function gateMsg(html) {
        var g = document.getElementById('manage-gate');
        g.innerHTML = html;
        g.style.display = 'block';
    }

    /* ---------- 合并录入（赛程 + 赛果 一次写入） ---------- */
    var mfState = { fixtureId: null, maps: [] };
    var mfScope = 'all';      // 队长默认只看/只录本队比赛
    var mfMyTeams = [];

    function mfSeasonMatches() { return currentSeason === 's5' ? 's5_matches' : 's6_matches'; }
    function mfSeasonSchedule() { return currentSeason === 's5' ? 's5_match_schedule' : 's6_match_schedule'; }

    function renderMergeFixtures() {
        var el = document.getElementById('merge-fixtures');
        if (!el) return;
        var list = currentScheduleData;
        if (mfScope === 'mine' && mfMyTeams.length) {
            list = list.filter(function (m) {
                return mfMyTeams.indexOf(m.team_a) !== -1 || mfMyTeams.indexOf(m.team_b) !== -1;
            });
        }
        if (!list.length) {
            el.innerHTML = mfScope === 'mine'
                ? '<p class="empty-hint">本队在当前分组暂无对阵 — 可切换「全部比赛」查看，或点「新建对阵」录入。</p>'
                : '<p class="empty-hint">当前分组暂无对阵 — 点下方「新建对阵」开始录入。</p>';
            return;
        }
        el.innerHTML = list.map(function (m) {
            var sa = (m.score_a == null) ? '-' : m.score_a;
            var sb2 = (m.score_b == null) ? '-' : m.score_b;
            return '<button class="mf-fixture" data-id="' + m.id + '">' +
                '<span class="mf-fid">' + esc(matchIdToName[m.match_id] || m.match_id) + '</span>' +
                '<span class="mf-teams">' + esc(m.team_a) + ' <b>' + sa + ' : ' + sb2 + '</b> ' + esc(m.team_b) + '</span>' +
                '<span class="mf-date">' + (m.match_date ? String(m.match_date).slice(0, 10) : '') + '</span>' +
                '</button>';
        }).join('');
        Array.prototype.forEach.call(el.querySelectorAll('.mf-fixture'), function (b) {
            b.addEventListener('click', function () { openMergeForm(Number(b.dataset.id)); });
        });
    }

    function mfParseScore(s) {
        if (!s) return null;
        var p = String(s).split(':');
        if (p.length !== 2) return null;
        var a = parseInt(p[0], 10), b = parseInt(p[1], 10);
        if (isNaN(a) || isNaN(b)) return null;
        return { a: a, b: b };
    }

    function openMergeForm(fixtureId) {
        mfState.fixtureId = fixtureId || null;
        mfState.maps = [];
        var form = document.getElementById('merge-form');
        form.style.display = 'block';
        var teamsNew = document.getElementById('mf-teams-new');
        var f = null;
        if (mfState.fixtureId) {
            f = currentScheduleData.find(function (m) { return m.id === mfState.fixtureId; }) || null;
            if (!f) { form.style.display = 'none'; return; }
            teamsNew.classList.remove('show');
            document.getElementById('mf-stage').value = '小组赛';
            var dv = f.match_date ? new Date(new Date(f.match_date).getTime() - (new Date().getTimezoneOffset() * 60000)).toISOString().slice(0, 16) : '';
            document.getElementById('mf-date').value = dv;
            document.getElementById('mf-link').value = f.link || '';
            document.getElementById('mf-big-a').value = (f.score_a == null) ? '' : f.score_a;
            document.getElementById('mf-big-b').value = (f.score_b == null) ? '' : f.score_b;
            /* 自动带入：选手数据录入区预填本对阵双方成员（系统替你做） */
            try {
                var mfc = document.getElementById('matches-form-container');
                if (mfc && !mfc.querySelector('.match-record')) {
                    var rec0 = rowTemplates['matches-table-body']();
                    mfc.appendChild(rec0);
                    [['a', f.team_a], ['b', f.team_b]].forEach(function (pair) {
                        var sel0 = rec0.querySelector('select[data-col="team_' + pair[0] + '"]');
                        if (sel0) {
                            var has = Array.prototype.some.call(sel0.options, function (o) { return o.value === pair[1]; });
                            if (has) sel0.value = pair[1];
                            fillTeamMembers(rec0, pair[0], sel0.value);
                        }
                    });
                }
            } catch (e0) { /* 带入失败不阻断录入 */ }
            // 已有赛图明细预载（重复保存时更新而非重复插入）
            supabaseClient.from(mfSeasonMatches())
                .select('id, map, score, stage, match_date')
                .eq('group', getCurrentGroup())
                .eq('team_a', f.team_a).eq('team_b', f.team_b)
                .then(function (r) {
                    var rows = (r && r.data) || [];
                    mfState.maps = rows.filter(function (x) { return x.map; }).map(function (x) {
                        var sc = mfParseScore(x.score);
                        return { id: x.id, map: x.map, a: sc ? sc.a : '', b: sc ? sc.b : '' };
                    });
                    renderMapRows(); updateBigScore();
                }).catch(function () { renderMapRows(); updateBigScore(); });
        } else {
            teamsNew.classList.add('show');
            document.getElementById('mf-stage').value = '小组赛';
            document.getElementById('mf-date').value = '';
            document.getElementById('mf-link').value = '';
            document.getElementById('mf-big-a').value = '';
            document.getElementById('mf-big-b').value = '';
            var teams = groupData[getCurrentGroup()] ? Array.from(groupData[getCurrentGroup()].teams).sort() : [];
            var opts = teams.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join('');
            document.getElementById('mf-team-a').innerHTML = opts;
            document.getElementById('mf-team-b').innerHTML = opts;
            if (teams.length >= 2) document.getElementById('mf-team-b').selectedIndex = 1;
            renderMapRows(); updateBigScore();
        }
        form.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function closeMergeForm() {
        mfState = { fixtureId: null, maps: [] };
        var form = document.getElementById('merge-form');
        if (form) form.style.display = 'none';
    }

    function renderMapRows() {
        var box = document.getElementById('mf-maps');
        if (!box) return;
        if (!mfState.maps.length) {
            box.innerHTML = '<p class="empty-hint">尚无图数据 — 点「+ 加一图」逐图录入（如 13:9）。</p>';
            return;
        }
        box.innerHTML = mfState.maps.map(function (m, i) {
            return '<div class="mf-map-row" data-i="' + i + '">' +
                '<span style="opacity:.6; font-size:13px; min-width:34px;">#' + (i + 1) + '</span>' +
                '<select data-k="map"><option value="">选择地图</option>' + mapOptions + '</select>' +
                '<input type="number" min="0" max="99" data-k="a" placeholder="A分" value="' + (m.a === '' ? '' : m.a) + '">' +
                '<span style="opacity:.6;">:</span>' +
                '<input type="number" min="0" max="99" data-k="b" placeholder="B分" value="' + (m.b === '' ? '' : m.b) + '">' +
                '<button class="mf-map-del" data-k="del" title="删除">×</button>' +
                '</div>';
        }).join('');
        Array.prototype.forEach.call(box.querySelectorAll('.mf-map-row'), function (row) {
            var i = Number(row.dataset.i);
            var sel = row.querySelector('select');
            sel.value = mfState.maps[i].map || '';
            sel.addEventListener('change', function () { mfState.maps[i].map = sel.value; });
            Array.prototype.forEach.call(row.querySelectorAll('input'), function (inp) {
                inp.addEventListener('input', function () {
                    mfState.maps[i][inp.dataset.k] = inp.value === '' ? '' : Number(inp.value);
                    updateBigScore();
                });
            });
            row.querySelector('[data-k="del"]').addEventListener('click', function () {
                mfState.maps.splice(i, 1); renderMapRows(); updateBigScore();
            });
        });
    }

    function addMergeMapRow() {
        mfState.maps.push({ id: null, map: '', a: '', b: '' });
        renderMapRows();
        var rows = document.querySelectorAll('#mf-maps .mf-map-row');
        if (rows.length) { var last = rows[rows.length - 1]; if (last) last.querySelector('select').focus(); }
    }

    function updateBigScore() {
        var wa = 0, wb = 0, complete = 0;
        mfState.maps.forEach(function (m) {
            if (m.a !== '' && m.b !== '' && m.map) {
                complete++;
                if (Number(m.a) > Number(m.b)) wa++; else if (Number(m.b) > Number(m.a)) wb++;
            }
        });
        var big = document.getElementById('mf-big');
        if (complete > 0) {
            big.textContent = wa + ' : ' + wb;
            document.getElementById('mf-big-a').value = wa;
            document.getElementById('mf-big-b').value = wb;
        } else {
            var a = document.getElementById('mf-big-a').value, b = document.getElementById('mf-big-b').value;
            big.textContent = (a === '' || b === '') ? '– : –' : (a + ' : ' + b);
        }
    }

    function mfCollectMaps() {
        return mfState.maps.filter(function (m) { return m.map && m.a !== '' && m.b !== ''; });
    }

    async function saveMerged() {
        var group = getCurrentGroup();
        var stage = document.getElementById('mf-stage').value;
        var dateVal = document.getElementById('mf-date').value;
        var link = document.getElementById('mf-link').value.trim();
        var matchDate = dateVal ? new Date(dateVal).toISOString() : null;
        var maps = mfCollectMaps();

        var wa = 0, wb = 0;
        maps.forEach(function (m) { if (Number(m.a) > Number(m.b)) wa++; else if (Number(m.b) > Number(m.a)) wb++; });
        var bigA = maps.length ? wa : parseInt(document.getElementById('mf-big-a').value, 10);
        var bigB = maps.length ? wb : parseInt(document.getElementById('mf-big-b').value, 10);
        if (isNaN(bigA) || isNaN(bigB)) { toast('请先录入每图比分（或手动填写大比分）。', 'err'); return; }

        var teamA, teamB, fixtureId = mfState.fixtureId;
        if (fixtureId) {
            var f = currentScheduleData.find(function (m) { return m.id === fixtureId; });
            if (!f) { toast('对阵不存在，请刷新后重试。', 'err'); return; }
            teamA = f.team_a; teamB = f.team_b;
        } else {
            teamA = document.getElementById('mf-team-a').value;
            teamB = document.getElementById('mf-team-b').value;
            if (!teamA || !teamB || teamA === teamB) { toast('请选择两支不同的队伍。', 'err'); return; }
        }

        try {
            // 1) 赛程：大比分 / 时间 / 回放（无则新建）
            if (fixtureId) {
                var r1 = await supabaseClient.from(mfSeasonSchedule()).update({
                    score_a: bigA, score_b: bigB, match_date: matchDate, link: link
                }).eq('id', fixtureId).select();
                if (r1 && r1.error) throw r1.error;
            } else {
                var mid = 'M' + Date.now().toString(36).toUpperCase();
                var r2 = await supabaseClient.from(mfSeasonSchedule()).insert([{
                    group: group, match_id: mid, team_a: teamA, team_b: teamB,
                    score_a: bigA, score_b: bigB, match_date: matchDate, link: link
                }]).select();
                if (r2 && r2.error) throw r2.error;
                if (r2 && r2.data && r2.data[0]) mfState.fixtureId = r2.data[0].id;
            }

            // 2) 赛果明细：逐图插入（已有图更新，不重复）
            var saved = 0, updated = 0;
            for (var i = 0; i < maps.length; i++) {
                var m = maps[i];
                if (m.id) {
                    var r3 = await supabaseClient.from(mfSeasonMatches()).update({
                        score: m.a + ':' + m.b, stage: stage, match_date: matchDate
                    }).eq('id', m.id);
                    if (r3 && r3.error) throw r3.error;
                    updated++;
                } else {
                    var r4 = await supabaseClient.from(mfSeasonMatches()).insert([{
                        group: group, stage: stage, match_date: matchDate, map: m.map,
                        score: m.a + ':' + m.b, team_a: teamA, team_b: teamB
                    }]);
                    if (r4 && r4.error) throw r4.error;
                    saved++;
                }
            }

            showToast('已保存：大比分 ' + bigA + ':' + bigB + '，新增 ' + saved + ' 图 / 更新 ' + updated + ' 图');
            if (typeof HWLayout !== 'undefined' && HWLayout.recalcAfterScoreChange) HWLayout.recalcAfterScoreChange();
            closeMergeForm();
            await loadScheduleForGroup(group);
            await loadMatchesForEditing(group);
        } catch (e) {
            console.error('合并保存失败:', e);
            toast('保存失败：' + (e && e.message ? e.message : e), 'err');
        }
    }

    /* ---------- toast ---------- */
    var _toastTimer = null;
    function showToast(msg) {
        var el = document.getElementById('toast');
        if (!el) { toast(msg, 'err'); return; }
        el.textContent = msg;
        el.classList.add('show');
        if (_toastTimer) clearTimeout(_toastTimer);
        _toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
    }

    /* ---------- 启动：活动绑定 + 权限门禁 ---------- */
    HWLayout.resolveEvent().then(function (ev) {
        boundEvent = ev;
        if (typeof HWAuth !== 'undefined') { try { HWAuth.init(); } catch (e) { /* offline */ } }
        if (!ev) {
            gateMsg('<h3>未绑定活动</h3><p style="margin-top:12px; color:var(--mist);">请先从 <a href="events.html">活动大厅</a> 进入某个活动，再打开该活动的数据台。</p>');
            return;
        }
        currentSeason = HWLayout.seasonKey(ev);
        var title = document.getElementById('mf-event-title');
        if (title) title.textContent = ev.title + (ev.start_date ? ' · ' + ev.start_date : '');

        HWLayout.access(currentSeason, ev).then(function (perms) {
            HWLayout.eventBar({ event: ev, perms: perms });
            var allowed = perms.isAdmin || perms.isEventCaptain;
            if (!allowed) {
                gateMsg('<h3>无访问权限</h3><p style="margin-top:12px; color:var(--mist);">数据台仅对本活动的 <b>管理员</b> 与 <b>活动队长</b> 开放。如需权限，请联系管理员在活动详情页授予。</p>');
                return;
            }
            startManageConsole(perms);
        });
    });

    async function startManageConsole(perms) {
        perms = perms || {};
        document.getElementById('manage-shell').style.display = 'block';
        try {
            await initializeAdminPanel();
        } catch (e) { console.error('数据台初始化失败:', e); }
        // 结果录入绑定
        document.getElementById('merge-new-fixture').addEventListener('click', function () { openMergeForm(null); });
        document.getElementById('mf-add-map').addEventListener('click', addMergeMapRow);
        document.getElementById('mf-save').addEventListener('click', saveMerged);
        document.getElementById('mf-cancel').addEventListener('click', closeMergeForm);
        ['mf-big-a', 'mf-big-b'].forEach(function (id) {
            document.getElementById(id).addEventListener('input', updateBigScore);
        });

        // 比赛范围切换（队长默认本队）
        var scopeSeg = document.getElementById('mf-scope');
        if (scopeSeg) {
            scopeSeg.addEventListener('click', function (e) {
                if (e.target.tagName !== 'BUTTON') return;
                var act = scopeSeg.querySelector('.active');
                if (act) act.classList.remove('active');
                e.target.classList.add('active');
                mfScope = e.target.dataset.scope;
                renderMergeFixtures();
            });
        }
        var note = document.getElementById('mf-scope-note');
        if (perms.isAdmin) {
            if (note) note.textContent = '管理员：可录入全部比赛';
        } else {
            resolveCaptainScope(perms).then(function (info) {
                if (!info || !info.teams.length) {
                    if (note) note.textContent = '';
                    renderMergeFixtures();
                    return;
                }
                mfMyTeams = info.teams;
                mfScope = 'mine';
                if (scopeSeg) scopeSeg.style.display = 'flex';
                var mine = scopeSeg && scopeSeg.querySelector('[data-scope="mine"]');
                var all = scopeSeg && scopeSeg.querySelector('[data-scope="all"]');
                if (mine) mine.classList.add('active');
                if (all) all.classList.remove('active');
                if (note) note.textContent = '队长默认录入本队比赛：' + mfMyTeams.join(' / ');
                // 默认切到本队所在分组
                if (info.group) {
                    var gbtn = document.querySelector('#group-filter-buttons button[data-group="' + info.group + '"]');
                    if (gbtn && !gbtn.classList.contains('active')) gbtn.click();
                }
                renderMergeFixtures();
            });
        }
        renderMergeFixtures();
    }

    /* 队长 → 本队队伍与分组（赛季队长用 captainTeams；活动队长用 event_captains 反查花名册） */
    function resolveCaptainScope(perms) {
        var out = { teams: [], group: '' };
        var findGroup = function (teams) {
            return supabaseClient.from(currentSeason + '_player_ids').select('team, group')
                .then(function (res) {
                    var rows = (res && res.data) || [];
                    for (var i = 0; i < rows.length; i++) {
                        if (rows[i].team && teams.indexOf(rows[i].team) !== -1 && rows[i].group) {
                            out.group = rows[i].group; break;
                        }
                    }
                    return out;
                }).catch(function () { return out; });
        };
        if (perms.captainTeams && perms.captainTeams.length) {
            out.teams = perms.captainTeams.slice();
            return findGroup(out.teams);
        }
        if (!boundEvent) return Promise.resolve(out);
        return supabaseClient.from('event_captains')
            .select('player_name, game_id').eq('event_id', boundEvent.id)
            .then(function (r) {
                var rows = (r && r.data) || [];
                if (!rows.length) return out;
                var names = [], gids = [];
                rows.forEach(function (c) {
                    if (c.player_name) names.push(c.player_name);
                    if (c.game_id) gids.push(String(c.game_id));
                });
                return supabaseClient.from(currentSeason + '_player_ids')
                    .select('name, id, team, group')
                    .then(function (res2) {
                        var roster = (res2 && res2.data) || [];
                        roster.forEach(function (p) {
                            var hit = (p.name && names.indexOf(p.name) !== -1) ||
                                      (p.id && gids.indexOf(String(p.id)) !== -1);
                            if (hit && p.team) {
                                if (out.teams.indexOf(p.team) === -1) out.teams.push(p.team);
                                if (!out.group && p.group) out.group = p.group;
                            }
                        });
                        return out;
                    });
            }).catch(function () { return out; });
    }
