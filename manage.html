<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛事数据台 · HWVCTS</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
<style>
    /* ═════════════════════════════════════════════════════════════════
       数据台 · 结果录入 v2（2026-11 重构）
       设计约束：
         · 一场比赛 = 一张可展开的工作卡（「按下去有回应，再按能收回」）
         · 所有状态走 HWLayout.evState / resultState，文案与配色全站同源
         · 所有动效只用 theme.css 统一层里的 token 与语义类，页面不自造曲线
       本文件只保留「本页独有的布局」，组件外观一律来自 theme.css。
       ═════════════════════════════════════════════════════════════════ */
    body { padding-top: 80px; }
    .mgr-page { max-width: 1080px; margin: 0 auto; padding: 0 20px 120px; }

    /* 顶部工具条：分组 + 视图 + 身份说明，一行说完 */
    .mgr-toolbar {
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        margin: 18px 0 6px; position: sticky; top: 64px; z-index: 20;
        padding: 8px 0; background: linear-gradient(var(--void-black) 72%, transparent);
    }
    .mgr-note { font-size: 13px; color: var(--smoke); }
    .mgr-count {
        display: inline-flex; align-items: center; gap: 6px;
        font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em;
        color: var(--ash); padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--r-pill);
    }
    .mgr-count b { color: var(--coral-pulse); font-weight: 700; }

    /* 队列：一行一场，展开即在原位（不跳页、不弹窗） */
    .mgr-queue { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .mgr-row {
        border: 1px solid var(--border); border-radius: var(--r-card); background: var(--ink);
        overflow: hidden; content-visibility: auto; contain-intrinsic-size: auto 74px;
        transition: border-color var(--t-hover) var(--ease-out), background var(--t-hover) var(--ease-out);
    }
    .mgr-row:hover { border-color: var(--slate); }
    .mgr-row.open { border-color: var(--smoke); background: var(--obsidian); }
    .mgr-row-head {
        display: grid; grid-template-columns: 88px 1fr auto auto; align-items: center; gap: 12px;
        width: 100%; padding: 13px 16px; background: none; border: 0; color: inherit;
        font: inherit; text-align: left; cursor: pointer; min-height: 52px;
    }
    .mgr-row-head:focus-visible { outline-offset: -3px; }
    .mgr-when { font-family: var(--font-mono); font-size: 12px; color: var(--smoke); letter-spacing: .02em; }
    .mgr-when.soon { color: var(--tone-gold); }
    .mgr-when.late { color: var(--tone-danger); }
    .mgr-teams { font-size: 15px; font-weight: 600; color: var(--pure-white); min-width: 0; }
    .mgr-teams .vs { color: var(--smoke); font-weight: 400; margin: 0 6px; }
    .mgr-teams .score { color: var(--coral-pulse); font-family: var(--font-mono); }
    .mgr-teams .meta { display: block; font-size: 12px; font-weight: 400; color: var(--smoke); margin-top: 3px; }
    .mgr-chev {
        width: 22px; height: 22px; display: grid; place-items: center; color: var(--smoke);
        transition: transform var(--t-swap) var(--ease-standard), color var(--t-hover) linear;
    }
    .mgr-row.open .mgr-chev { transform: rotate(180deg); color: var(--pure-white); }

    /* 编辑器：grid 0fr → 1fr，纯 CSS 自适应高度，展开/收起同一条曲线 */
    .mgr-editor { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--t-panel) var(--ease-standard); }
    .mgr-row.open .mgr-editor { grid-template-rows: 1fr; }
    .mgr-editor > .inner { overflow: hidden; min-height: 0; }
    .mgr-editor-body { padding: 4px 16px 18px; border-top: 1px solid var(--border); }

    .ev-head-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin: 14px 0 4px; }
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field > label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--smoke); font-family: var(--font-mono); }
    .field .hint { font-size: 12px; color: var(--smoke); }
    .field input, .field select { height: 36px; }

    /* 每图一张卡：地图 + 比分 + 选手数据 */
    .map-card {
        border: 1px solid var(--border); border-radius: 12px; margin-top: 12px;
        background: var(--ink); overflow: hidden;
        animation: m-enter var(--t-swap) var(--ease-standard) both;
    }
    .map-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; flex-wrap: wrap;
                border-bottom: 1px solid var(--border); background: var(--graphite); }
    .map-idx { font-family: var(--font-mono); font-size: 11px; color: var(--smoke); letter-spacing: .08em; }
    .map-head select { height: 32px; }
    .score-in { width: 56px; height: 32px; text-align: center; font-family: var(--font-mono);
                font-size: 15px; font-variant-numeric: tabular-nums; }
    .score-sep { color: var(--smoke); }
    .map-win { font-size: 12px; color: var(--success-green); font-weight: 600; }
    .map-head .spacer { flex: 1; }

    .ptable { width: 100%; border-collapse: collapse; font-size: 13px; }
    .ptable th {
        font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
        color: var(--smoke); font-weight: 500; text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border);
        white-space: nowrap;
    }
    .ptable td { padding: 3px 4px; border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent); }
    .ptable tr:last-child td { border-bottom: 0; }
    .ptable input, .ptable select { height: 30px; padding: 0 7px; font-size: 13px; width: 100%; min-width: 0; }
    .ptable input[type="number"] { text-align: center; font-variant-numeric: tabular-nums; }
    .ptable .num-col { width: 62px; }
    .ptable .role-col { width: 96px; }
    .ptable .name-col { min-width: 108px; }
    .ptable tr.temp input[data-k="name"] { border-color: color-mix(in srgb, var(--tone-gold) 60%, transparent); }
    .ptable tr.empty td { color: var(--smoke); padding: 12px 6px; }
    .ptable .side-a { color: var(--tone-coral); }
    .ptable .side-b { color: var(--info-blue); }

    /* 系列赛汇总 + 吸底操作条 */
    .series-bar {
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        margin-top: 14px; padding: 12px 16px; border-radius: 12px;
        background: var(--graphite); border: 1px solid var(--border);
    }
    .series-bar .big { font-family: var(--font-mono); font-size: 26px; font-weight: 700; color: var(--coral-pulse); font-variant-numeric: tabular-nums; }
    .series-bar .big-note { font-size: 12px; color: var(--smoke); }
    .mgr-actions {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        position: sticky; bottom: 0; margin: 16px -16px -18px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        background: color-mix(in srgb, var(--obsidian) 92%, transparent);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border-top: 1px solid var(--border);
    }
    .mgr-actions .auto-note { font-size: 12px; color: var(--smoke); margin-right: auto; }
    .btn[data-busy="1"] { pointer-events: none; opacity: .7; }
    .btn .spin { display: none; width: 13px; height: 13px; border: 2px solid currentColor;
                 border-right-color: transparent; border-radius: 50%; animation: spin var(--t-page) linear infinite; margin-right: 6px; vertical-align: -2px; }
    .btn[data-busy="1"] .spin { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 校验结果：软提示，列在操作条上方，不弹模态、不打断输入 */
    .mgr-warn {
        margin-top: 12px; padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.7;
        border: 1px solid color-mix(in srgb, var(--tone-gold) 45%, transparent);
        background: color-mix(in srgb, var(--tone-gold) 10%, transparent);
        color: var(--ash); animation: m-enter var(--t-swap) var(--ease-standard) both;
    }
    .mgr-warn strong { color: var(--tone-gold); }
    .mgr-warn ul { margin: 6px 0 0; padding-left: 18px; }

    /* 草稿恢复条 */
    .draft-banner {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        margin-top: 12px; padding: 10px 14px; border-radius: 10px; font-size: 13px;
        border: 1px solid color-mix(in srgb, var(--info-blue) 45%, transparent);
        background: color-mix(in srgb, var(--info-blue) 8%, transparent); color: var(--ash);
    }

    /* 空状态：说清「下一步做什么」，而不是「暂无数据」 */
    .mgr-empty { border: 1px dashed var(--border); border-radius: var(--r-card); padding: 28px 20px; text-align: center; color: var(--smoke); }
    .mgr-empty strong { display: block; color: var(--mist); font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .mgr-empty .btn { margin-top: 12px; }

    /* 看板 */
    .board { display: flex; flex-direction: column; gap: 18px; margin-top: 12px; }
    .board-group > h4 {
        margin: 0 0 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
        color: var(--smoke); font-family: var(--font-mono); font-weight: 500;
    }
    .board-list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .bcard {
        text-align: left; padding: 12px 14px; border-radius: 12px; cursor: pointer; font: inherit; color: inherit;
        background: var(--ink); border: 1px solid var(--border);
        transition: border-color var(--t-hover) var(--ease-out), transform var(--t-hover) var(--ease-out);
    }
    .bcard:hover { border-color: var(--slate); transform: translateY(-1px); }
    .bcard .t { font-weight: 600; font-size: 14px; color: var(--pure-white); }
    .bcard .s { font-size: 12px; color: var(--smoke); margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* 成员维护 / 工具 */
    .data-note { font-size: 13px; color: var(--smoke); line-height: 1.7; margin: 4px 0 14px; }
    #ids-table-body input { height: 32px; }
    .tool-block { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
    .tool-block:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
    #archived-banner { margin-bottom: 14px; }

    @media (max-width: 720px) {
        .mgr-page { padding: 0 14px 120px; }
        .mgr-row-head { grid-template-columns: 62px 1fr auto; gap: 8px; padding: 12px; }
        .mgr-row-head .badge { grid-column: 2; justify-self: start; margin-top: 2px; }
        .mgr-editor-body { padding: 2px 12px 14px; }
        .mgr-actions { margin: 14px -12px -14px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
        .ptable { font-size: 12px; }
        .ptable th { font-size: 9px; padding: 6px 3px; }
        .ptable .num-col { width: 46px; }
        .ptable .role-col { width: 78px; }
        .board-list { grid-template-columns: 1fr; }
        .mgr-toolbar { position: static; }
    }
</style>
</head>
<body data-page="manage">
    <script> if (localStorage.getItem('hw_theme') === 'light') document.body.setAttribute('data-theme', 'light'); </script>
    <script> if (typeof HWAuth !== 'undefined') { try { HWAuth.init(); } catch (e) {} } </script>

    <datalist id="teams-datalist"></datalist>

    <main class="page">
        <div class="container">
            <div class="page-header">
                <span class="eyebrow">Console</span>
                <h1 class="page-title">赛事数据台</h1>
                <div class="page-sub" id="mgr-event-title"></div>
            </div>
            <div id="event-bar" hidden></div>

            <!-- 无权限 / 缺表：一律给「怎么才能进来」，不空白 -->
            <div id="manage-gate" class="data-section" style="display:none;"></div>

            <div id="manage-shell" style="display:none;">
                <div class="mgr-toolbar">
                    <div class="seg" id="group-filter-buttons">
                        <button data-group="传奇组" class="active">传奇组</button>
                        <button data-group="中坚组">中坚组</button>
                        <button data-group="挑战组">挑战组</button>
                    </div>
                    <div class="seg" id="tab-filters">
                        <button data-tab="result-tab" class="active">结果录入</button>
                        <button data-tab="ids-tab">成员维护</button>
                        <button data-tab="tools-tab">导入 / 工具</button>
                    </div>
                    <span class="mgr-count" id="mgr-count" hidden></span>
                    <span class="mgr-note" id="mgr-note"></span>
                </div>

                <!-- ══════════ 结果录入 ══════════ -->
                <div id="result-tab" class="tab-content active">
                    <div class="mgr-toolbar" style="top:auto; position:static; padding-top:14px;">
                        <div class="seg" id="view-switch">
                            <button data-view="queue" class="active">我的待办</button>
                            <button data-view="board">按轮次看全部</button>
                        </div>
                        <button class="btn btn-ghost btn-sm" id="new-fixture-btn" type="button" hidden>+ 新建对阵</button>
                    </div>
                    <div id="result-body"></div>
                </div>

                <!-- ══════════ 成员维护 ══════════ -->
                <div id="ids-tab" class="tab-content">
                    <div class="data-section">
                        <h3>花名册维护</h3>
                        <p class="data-note">真名是主键（新增后不可改）。游戏 ID 变更会同步到选手页；荣誉用「、」分隔。</p>
                        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
                            <button class="btn btn-ghost btn-sm" id="add-id-row" type="button">+ 新增选手</button>
                            <button class="btn btn-primary btn-sm" id="update-ids" type="button">保存本次修改</button>
                            <button class="btn btn-ghost btn-sm" id="resync-player-pages" type="button">重新同步选手页</button>
                        </div>
                        <div style="overflow-x:auto;">
                            <table>
                                <thead><tr>
                                    <th>选手真名</th><th>游戏 ID</th><th>所属队伍</th><th>头像链接</th><th>荣誉</th><th></th>
                                </tr></thead>
                                <tbody id="ids-table-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- ══════════ 导入 / 工具 ══════════ -->
                <div id="tools-tab" class="tab-content">
                    <div class="data-section">
                        <h3>赛果 CSV 导入</h3>
                        <p class="data-note">
                            一图一行：组别、阶段、对战时间（北京时间，如 2026-12-01 19:00）、队伍A、队伍B、地图、图比分A、图比分B。
                            先「预检」逐行报错，确认后整批入库，可按批次撤销。队长仅能导入本队比赛。
                        </p>
                        <div class="admin-row">
                            <button class="btn btn-ghost" id="csv-template" type="button">下载模板</button>
                            <input type="file" id="csv-file" accept=".csv,text/csv" aria-label="选择赛果 CSV 文件" style="max-width:260px;">
                            <button class="btn btn-ghost" id="csv-precheck" type="button">预检</button>
                            <button class="btn btn-primary" id="csv-import" type="button" disabled>确认导入</button>
                        </div>
                        <div id="csv-report" style="margin-top:10px;"></div>
                        <div id="csv-batches" style="margin-top:14px;"></div>
                    </div>

                    <div class="data-section" style="margin-top:20px;">
                        <h3>队伍管理</h3>
                        <p class="data-note">改名会同步花名册与未开赛赛程，已结算比赛保留旧名快照；队长转让需对方确认。</p>
                        <div id="transfer-inbox" style="margin-bottom:12px;"></div>
                        <div class="admin-row">
                            <select class="select" id="tm-team" style="min-width:180px;"></select>
                            <input class="input" id="tm-newname" placeholder="新的队伍名称" style="min-width:180px;">
                            <button class="btn btn-ghost" id="tm-rename" type="button">改名</button>
                        </div>
                        <div class="admin-row">
                            <select class="select" id="tm-target" style="min-width:220px;"></select>
                            <button class="btn btn-ghost" id="tm-transfer" type="button">转让队长给此选手</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   数据台 · 结果录入 v2
   ───────────────────────────────────────────────────────────────────────
   动线（系统能判断的一律不问用户）：
     进来 → 自动定位到「你该录的那一场」→ 原位展开 → 逐图填 → 大比分自动算
          → 吸底条「保存并生效」→ 状态立即变为「已生效 / 待确认」，队列就地更新
   三件套取代旧的「合并表单 + 新增赛果 + 修改赛果」：
     ① 队列（我的待办，按紧急度排序，首条自动展开）
     ② 看板（按轮次/状态看全部，点谁展开谁）
     ③ 单场编辑器（双方锁定、逐图卡、选手预填、自动保存、软校验）
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
    'use strict';

    var sb = HWLayout.supa();
    var boundEvent = null;
    var currentSeason = 's6';
    var currentGroup = (document.querySelector('#group-filter-buttons button.active') || {}).dataset
        ? document.querySelector('#group-filter-buttons button.active').dataset.group : '传奇组';

    var allPlayersData = [];          // 花名册（成员维护 + 选手预填都读它）
    var groupData = {};              // { 组: { teams:Set, rosters:{队:[{id,name}]} } }
    var fixtures = [];               // 当前组赛程
    var mapsByFixture = {};          // fixture.id -> [图行]
    var perms = null;
    var canConfirm = false;          // 队长以上：提交即生效
    var canCreate = false;           // 可新建对阵
    var myTeams = [];                // 队长/选手所属队伍
    var view = 'queue';
    var openKey = null;              // 当前展开的 fixture id
    var dirty = false;
    var editorState = null;          // { fixture, maps:[...], stage, date, link, warnings:[] }

    var MAPS = ['源工重镇','隐世修所','霓虹町','亚海悬城','幽邃地库','森寒冬港','微风岛屿','莲华古城','日落之城','深海明珠','裂变峡谷','盐海矿镇','天枢云阙'];
    var CHARS = ['幻棱','钛狐','维斯','暮蝶','零','禁灭','迷核','K/O','壹决','不死鸟','捷风','蝰蛇','雷兹','炼狱','猎枭','奇乐','芮娜','铁臂','贤者','幽影','尚勃勒','斯凯','霓虹','夜露','海神','星礈','盖可','钢锁','黑梦'];
    var STAGES = ['小组赛','淘汰赛','决赛'];

    var matchIdToName = {
        'S1-1':'0-0组-第1场','S1-2':'0-0组-第2场','S1-3':'0-0组-第3场','S1-4':'0-0组-第4场',
        'S2-1W':'1-0组-第1场','S2-2W':'1-0组-第2场','S2-1L':'0-1组-第1场','S2-2L':'0-1组-第2场',
        'S3-1M':'1-1组-第1场','S3-2M':'1-1组-第2场','S3-PROMO-A':'2-0晋级赛-A','S3-PROMO-B':'2-0晋级赛-B',
        'S3-ELIM-A':'0-2淘汰赛-A','S3-ELIM-B':'0-2淘汰赛-B','S5-PROMO-A':'2-1晋级赛-A','S5-PROMO-B':'2-1晋级赛-B',
        'S5-ELIM-A':'1-2淘汰赛-A','S5-ELIM-B':'1-2淘汰赛-B','S1-5':'0-0组-第5场','S1-6':'0-0组-第6场',
        'S2-3W':'1-0组-第3场','S2-3L':'0-1组-第3场','S3-3M':'1-1组-第3场',
        'S3-PROMO-1':'2-0晋级赛-第1场','S3-PROMO-2':'2-0晋级赛-第2场','S3-PROMO-3':'2-0晋级赛-第3场',
        'S3-ELIM-1':'0-2淘汰赛-第1场','S3-ELIM-2':'0-2淘汰赛-第2场','S3-ELIM-3':'0-2淘汰赛-第3场',
        'S4-PROMO-1':'2-1晋级赛-第1场','S4-PROMO-2':'2-1晋级赛-第2场','S4-PROMO-3':'2-1晋级赛-第3场',
        'S4-ELIM-1':'1-2淘汰赛-第1场','S4-ELIM-2':'1-2淘汰赛-第2场','S4-ELIM-3':'1-2淘汰赛-第3场',
        'P-WB1-1':'胜者组-第一轮-第1场','P-WB1-2':'胜者组-第一轮-第2场','P-WBF':'胜者组-决赛',
        'P-LB1':'败者组-第一轮','P-LB1-1':'败者组-第一轮-第1场','P-LB1-2':'败者组-第一轮-第2场',
        'P-LB2':'败者组-第二轮','P-LBF':'败者组-决赛','P-GF':'总决赛'
    };

    /* ---------------- 小工具 ---------------- */
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    function toast(msg, type) { HWLayout.toast(msg, type); }
    function tbl(base) { return currentSeason === 's5' ? 's5_' + base : 's6_' + base; }
    function seasonIds() { return tbl('player_ids'); }
    function seasonStats() { return tbl('player_stats'); }
    function seasonMatches() { return tbl('matches'); }
    function seasonSchedule() { return tbl('match_schedule'); }
    function idOf(v) { return v == null ? '' : String(v); }

    function fmtDay(iso) {
        if (!iso) return '—';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '—';
        var now = new Date();
        var same = d.toDateString() === now.toDateString();
        var p = function (n) { return (n < 10 ? '0' : '') + n; };
        return (same ? '今天 ' : p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ') + p(d.getHours()) + ':' + p(d.getMinutes());
    }
    function toLocalInput(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        var p = function (n) { return (n < 10 ? '0' : '') + n; };
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
    }
    function fromLocalInput(v) {
        if (!v) return null;
        var d = new Date(v);
        return isNaN(d.getTime()) ? null : d.toISOString();
    }

    /* 结果状态：一处判定，三页（manage / schedule / matches）共用同一套文案 */
    var RS_ZH = { unrecorded: '未录入', pending: '待确认', confirmed: '已生效', locked: '已锁定', rejected: '已驳回' };
    var RS_TONE = { unrecorded: 'quiet', pending: 'gold', confirmed: 'green', locked: 'blue', rejected: 'danger' };
    function resultState(fx, maps) {
        if (!fx) return 'unrecorded';
        var hasScore = fx.score_a != null && fx.score_b != null;
        if (!hasScore) return (maps && maps.length) ? 'pending' : 'unrecorded';
        var rs = fx.result_status;
        if (rs === 'locked') return 'locked';
        if (rs === 'confirmed') return 'confirmed';
        if (rs === 'pending') return 'pending';
        if (rs === 'rejected') return 'rejected';
        return 'confirmed';   /* 无状态列的旧数据视为已生效（与选手页口径一致） */
    }
    function rsBadge(st) {
        return '<span class="badge badge-' + (RS_TONE[st] || 'quiet') + '" data-rs="' + st + '">' + (RS_ZH[st] || st) + '</span>';
    }

    /* 权限：能录哪几场 */
    function canEditFixture(fx) {
        if (!fx) return false;
        if (perms && (perms.isAdmin || perms.isOrganizer)) return true;
        if (!myTeams.length) return false;
        return myTeams.indexOf(fx.team_a) !== -1 || myTeams.indexOf(fx.team_b) !== -1;
    }

    /* ---------------- 数据加载 ---------------- */
    function loadRoster() {
        return sb.from(seasonIds()).select('id, name, team, "group", image, honor').then(function (r) {
            if (r.error) { console.error('花名册加载失败', r.error); return; }
            allPlayersData = r.data || [];
            groupData = {};
            allPlayersData.forEach(function (p) {
                var g = p.group || '未分组';
                groupData[g] = groupData[g] || { teams: new Set(), rosters: {} };
                if (p.team) {
                    groupData[g].teams.add(p.team);
                    groupData[g].rosters[p.team] = groupData[g].rosters[p.team] || [];
                    groupData[g].rosters[p.team].push({ id: p.id, name: p.name });
                }
            });
            var dl = document.getElementById('teams-datalist');
            if (dl) dl.innerHTML = allPlayersData.filter(function (x) { return x.team; })
                .map(function (x) { return '<option value="' + esc(x.team) + '"></option>'; })
                .filter(function (v, i, a) { return a.indexOf(v) === i; }).join('');
        });
    }

    function loadFixtures() {
        return sb.from(seasonSchedule()).select('*').eq('group', currentGroup).order('match_date', { ascending: true, nullsFirst: false })
            .then(function (r) {
                if (r.error) { fixtures = []; throw r.error; }
                fixtures = (r.data || []).filter(function (m) { return m.team_a && m.team_a !== 'TBD'; });
            });
    }

    function loadMapsFor(fx) {
        return sb.from(seasonMatches()).select('*')
            .eq('group', fx.group || currentGroup)
            .eq('team_a', fx.team_a).eq('team_b', fx.team_b)
            .then(function (r) {
                var rows = (r && !r.error && r.data) || [];
                mapsByFixture[fx.id] = rows.filter(function (x) { return x.map; })
                    .sort(function (a, b) { return (a.id || 0) - (b.id || 0); });
                return mapsByFixture[fx.id];
            });
    }

    /* ---------------- 队列排序：系统替你决定先录哪场 ---------------- */
    function fixtureRank(fx) {
        var st = resultState(fx, mapsByFixture[fx.id]);
        var t = fx.match_date ? new Date(fx.match_date).getTime() : NaN;
        var now = Date.now();
        var mine = myTeams.indexOf(fx.team_a) !== -1 || myTeams.indexOf(fx.team_b) !== -1;
        if (st === 'pending' && mine) return 0;                 // 对方提交，等我确认/改
        if (st === 'unrecorded' && !isNaN(t) && t <= now) return 1;   // 已到时间却没录：最急
        if (st === 'unrecorded') return 2;                      // 未开赛
        if (st === 'rejected') return 3;
        return 4;                                              // 已生效/已锁定
    }
    function queueFixtures() {
        var list = fixtures.filter(function (fx) { return canEditFixture(fx); });
        if (!list.length) list = fixtures;
        return list.slice().sort(function (a, b) {
            var d = fixtureRank(a) - fixtureRank(b);
            if (d) return d;
            var ta = a.match_date ? new Date(a.match_date).getTime() : Infinity;
            var tb = b.match_date ? new Date(b.match_date).getTime() : Infinity;
            return ta - tb;
        });
    }

    /* ---------------- 渲染：外壳 ---------------- */
    function renderShell() {
        var pending = fixtures.filter(function (fx) {
            var st = resultState(fx, mapsByFixture[fx.id]);
            return (st === 'unrecorded' || st === 'pending' || st === 'rejected') && canEditFixture(fx);
        }).length;
        var cEl = document.getElementById('mgr-count');
        if (cEl) {
            cEl.hidden = !pending;
            /* 数字变化才动（克制）：进来时给一次错峰上浮 */
            cEl.innerHTML = '待你处理 <b>' + pending + '</b> 场';
            if (pending) cEl.classList.add('m-enter');
        }
        var noteEl = document.getElementById('mgr-note');
        if (noteEl) {
            noteEl.textContent = perms && perms.isAdmin ? '管理员：可录入全部比赛'
                : (perms && perms.isOrganizer ? '组织者：可录入本活动全部比赛'
                : (myTeams.length ? '队长：可录入 ' + myTeams.join(' / ') + ' 的比赛'
                : '未匹配到你的队伍 — 先在报名页绑定游戏 ID 并完成分队'));
        }
        var newBtn = document.getElementById('new-fixture-btn');
        if (newBtn) newBtn.hidden = !canCreate;
        renderResultBody();
    }

    function renderResultBody() {
        var host = document.getElementById('result-body');
        if (!host) return;
        if (view === 'board') { host.innerHTML = boardHtml(); wireBoard(host); return; }
        if (!fixtures.length) {
            host.innerHTML = '<div class="mgr-empty"><strong>本组还没有对阵</strong>' +
                (canCreate ? '先建一场，系统会自动带出双方队伍与首发名单。' : '等组织者排好赛程后，这里会列出你要录的比赛。') +
                (canCreate ? '<br><button class="btn btn-primary btn-sm" data-new="1" type="button">+ 新建对阵</button>' : '') +
                '</div>';
            var nb = host.querySelector('[data-new]');
            if (nb) nb.addEventListener('click', function () { openEditor(null); });
            return;
        }
        var list = queueFixtures();
        host.innerHTML = '<div class="mgr-queue">' + list.map(rowHtml).join('') + '</div>' +
            (list.every(function (fx) { return !canEditFixture(fx); })
                ? '<p class="data-note" style="margin-top:12px;">本组比赛不在你名下，只读展示。需要录入请让队长或管理员处理。</p>' : '');
        wireQueue(host);

        /* 系统替你选：首条最急的自动展开（只在你没手动收起来时） */
        if (openKey === null) openKey = 'auto';
        if (openKey === 'auto' && list.length && canEditFixture(list[0])) {
            expand(list[0].id);
        } else if (openKey && openKey !== 'auto') {
            expand(openKey);
        }
    }

    function rowHtml(fx) {
        var maps = mapsByFixture[fx.id] || [];
        var st = resultState(fx, maps);
        var t = fx.match_date ? new Date(fx.match_date).getTime() : NaN;
        var now = Date.now();
        var whenCls = !isNaN(t) ? (t <= now && st === 'unrecorded' ? 'late' : (t - now < 6 * 3600 * 1000 ? 'soon' : '')) : '';
        var scoreTxt = (fx.score_a != null && fx.score_b != null)
            ? '<span class="score">' + fx.score_a + ' : ' + fx.score_b + '</span>' : '<span class="score">– : –</span>';
        var roundName = matchIdToName[fx.match_id] || fx.match_id || '';
        var meta = [roundName, maps.length ? maps.length + ' 图' : '', canEditFixture(fx) ? '' : '只读']
            .filter(Boolean).join(' · ');
        return '<article class="mgr-row" data-fx="' + fx.id + '">' +
            '<button class="mgr-row-head" type="button" aria-expanded="false" data-toggle="' + fx.id + '">' +
            '  <span class="mgr-when ' + whenCls + '">' + fmtDay(fx.match_date) + '</span>' +
            '  <span class="mgr-teams">' + esc(fx.team_a) + '<span class="vs">vs</span>' + esc(fx.team_b) + ' ' + scoreTxt +
                 (meta ? '<span class="meta">' + esc(meta) + '</span>' : '') + '</span>' +
            '  ' + rsBadge(st) +
            '  <span class="mgr-chev">' + HWLayout.ico('chevron-down', 16) + '</span>' +
            '</button>' +
            '<div class="mgr-editor"><div class="inner"><div class="mgr-editor-body" data-body="' + fx.id + '"></div></div></div>' +
            '</article>';
    }

    function wireQueue(host) {
        Array.prototype.forEach.call(host.querySelectorAll('[data-toggle]'), function (btn) {
            btn.addEventListener('click', function () {
                var id = Number(btn.dataset.toggle);
                if (openKey === id) collapse();
                else expand(id);
            });
        });
    }

    function boardHtml() {
        var groups = { '待处理': [], '待确认': [], '已生效': [], '已锁定': [] };
        fixtures.forEach(function (fx) {
            var st = resultState(fx, mapsByFixture[fx.id]);
            var k = st === 'unrecorded' ? '待处理' : st === 'pending' ? '待确认' : st === 'locked' ? '已锁定' : '已生效';
            groups[k].push(fx);
        });
        var out = [];
        Object.keys(groups).forEach(function (k) {
            if (!groups[k].length) return;
            out.push('<section class="board-group"><h4>' + k + ' · ' + groups[k].length + '</h4><div class="board-list">' +
                groups[k].map(function (fx) {
                    var maps = mapsByFixture[fx.id] || [];
                    return '<button class="bcard" type="button" data-jump="' + fx.id + '">' +
                        '<div class="t">' + esc(fx.team_a) + ' vs ' + esc(fx.team_b) + '</div>' +
                        '<div class="s">' + esc(fmtDay(fx.match_date)) + rsBadge(resultState(fx, maps)) +
                        (maps.length ? '<span>' + maps.length + ' 图</span>' : '') + '</div>' +
                        '</button>';
                }).join('') + '</div></section>');
        });
        return out.length ? '<div class="board">' + out.join('') + '</div>'
            : '<div class="mgr-empty"><strong>本组还没有对阵</strong>排好赛程后这里会出现全部比赛的状态。</div>';
    }
    function wireBoard(host) {
        Array.prototype.forEach.call(host.querySelectorAll('[data-jump]'), function (b) {
            b.addEventListener('click', function () {
                view = 'queue';
                syncViewSwitch();
                var id = Number(b.dataset.jump);
                openKey = id;
                renderResultBody();
                var row = document.querySelector('.mgr-row[data-fx="' + id + '"]');
                if (row) row.scrollIntoView({ block: 'center' });
            });
        });
    }

    function syncViewSwitch() {
        var seg = document.getElementById('view-switch');
        if (!seg) return;
        Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
            b.classList.toggle('active', b.dataset.view === view);
        });
    }

    /* ---------------- 展开 / 收起（同一按钮，按下去有回应，再按能收回） ---------------- */
    function collapse() {
        var open = document.querySelector('.mgr-row.open');
        if (open) {
            open.classList.remove('open');
            var h = open.querySelector('[data-toggle]');
            if (h) h.setAttribute('aria-expanded', 'false');
        }
        openKey = null;
        editorState = null;
        dirty = false;
    }

    function expand(id) {
        var row = document.querySelector('.mgr-row[data-fx="' + id + '"]');
        if (!row) return;
        var fx = fixtures.find(function (f) { return f.id === id; });
        if (!fx) return;
        /* 切场前：先把当前一场的输入落盘（系统替你做），再问一句要不要继续 */
        if (dirty && openKey && openKey !== id) {
            writeDraft();
            var keep = window.confirm('这一场还有未保存的内容，已自动存为草稿。继续切换？');
            if (!keep) return;
        }
        /* 同一时间只展开一场：收掉其他（视觉上「移动」而不是「长出来」） */
        Array.prototype.forEach.call(document.querySelectorAll('.mgr-row.open'), function (r) {
            if (r !== row) {
                r.classList.remove('open');
                var hh = r.querySelector('[data-toggle]');
                if (hh) hh.setAttribute('aria-expanded', 'false');
            }
        });
        if (!canEditFixture(fx)) {
            /* 只读展开：给结论，不给假的可点控件 */
            var bodyEl0 = row.querySelector('[data-body]');
            bodyEl0.innerHTML = '<p class="data-note" style="margin-top:14px;">这场不在你名下，仅可查看。' +
                '需要录入请联系队长或管理员。</p>';
            row.classList.add('open');
            row.querySelector('[data-toggle]').setAttribute('aria-expanded', 'true');
            openKey = id;
            return;
        }
        openKey = id;
        row.classList.add('open');
        row.querySelector('[data-toggle]').setAttribute('aria-expanded', 'true');
        loadMapsFor(fx).then(function (maps) {
            buildEditor(fx, maps);
        }).catch(function () {
            buildEditor(fx, []);
        });
    }

    /* ---------------- 编辑器 ---------------- */
    function emptyPlayers(team) {
        var roster = (groupData[fxGroup()] && groupData[fxGroup()].rosters[team]) || [];
        var arr = [];
        for (var i = 0; i < 5; i++) {
            arr.push({
                name: roster[i] ? roster[i].name : '',
                id: roster[i] ? idOf(roster[i].id) : '',
                ch: '', acs: '', k: '', d: '', a: '', fb: ''
            });
        }
        return arr;
    }
    function fxGroup() { return (editorState && editorState.fixture && editorState.fixture.group) || currentGroup; }

    function buildEditor(fx, mapRows) {
        var bodyEl = document.querySelector('[data-body="' + fx.id + '"]');
        if (!bodyEl) return;
        /* 同一场且还有未落盘的输入 → 优先保留内存值（切视图/看板不该丢东西） */
        var live = (editorState && editorState.fixture && editorState.fixture.id === fx.id && dirty) ? editorState : null;
        var draft = live || readDraft(fx);
        editorState = {
            fixture: fx,
            stage: fx.stage || (draft && draft.stage) || '小组赛',
            date: draft ? draft.date : toLocalInput(fx.match_date),
            link: draft ? draft.link : (fx.link || ''),
            maps: draft && draft.maps ? draft.maps : (mapRows.length ? mapRows.map(rowToMap) : [freshMap(fx)])
        };
        dirty = false;
        bodyEl.innerHTML = editorHtml(fx);
        wireEditor(bodyEl, fx);
        if (draft) {
            var banner = bodyEl.querySelector('[data-draft-banner]');
            if (banner) banner.hidden = false;
        }
        updateSeries(fx);
    }

    function rowToMap(r) {
        var sc = String(r.score || '').split(':');
        var map = { id: r.id, map: r.map || '', a: sc[0] === undefined ? '' : String(sc[0]).trim(), b: sc[1] === undefined ? '' : String(sc[1]).trim(), players: {} };
        ['a', 'b'].forEach(function (side) {
            var teamKey = 'team_' + side;
            var arr = [];
            for (var i = 1; i <= 5; i++) {
                var st = String(r[teamKey + '_player' + i + '_data'] || '').split('/');
                arr.push({
                    name: '',
                    id: idOf(r[teamKey + '_player' + i + '_id']),
                    ch: r[teamKey + '_player' + i + '_ch'] || '',
                    acs: st[0] || '', k: st[1] || '', d: st[2] || '', a: st[3] || '',
                    /* 第 5 段 = 首杀数（按图记）。老数据的 4 段没有这一项，留空不报错 */
                    fb: st[4] || ''
                });
            }
            map.players[side] = arr;
        });
        return map;
    }

    function freshMap(fx) {
        return { id: null, map: '', a: '', b: '', players: { a: emptyPlayers(fx.team_a), b: emptyPlayers(fx.team_b) } };
    }

    function editorHtml(fx) {
        var st = resultState(fx, mapsByFixture[fx.id] || []);
        return '' +
        '<div class="ev-head-row">' +
        '  <div class="field" style="flex:1; min-width:200px;">' +
        '    <label>对阵</label>' +
        '    <div style="font-size:15px; font-weight:600; color:var(--pure-white); height:36px; display:flex; align-items:center; gap:8px;">' +
             esc(fx.team_a) + '<span class="vs" style="color:var(--smoke); font-weight:400;">vs</span>' + esc(fx.team_b) +
             '<span style="margin-left:6px;">' + rsBadge(st) + '</span>' +
             '<span class="hint" style="font-weight:400;">队名锁定 · 来自赛程</span>' +
        '    </div>' +
        '  </div>' +
        '  <div class="field"><label>阶段</label>' +
        '    <select class="select" data-k="stage" style="min-width:110px;">' +
             STAGES.map(function (s) { return '<option value="' + s + '"' + (s === editorState.stage ? ' selected' : '') + '>' + s + '</option>'; }).join('') +
        '    </select></div>' +
        '  <div class="field"><label>开赛时间</label>' +
        '    <input class="input" type="datetime-local" data-k="date" value="' + esc(editorState.date) + '" style="min-width:180px;"></div>' +
        '  <div class="field" style="flex:1; min-width:150px;"><label>回放链接</label>' +
        '    <input class="input" type="text" data-k="link" value="' + esc(editorState.link) + '" placeholder="https://...（可留空）"></div>' +
        '</div>' +
        '<div class="draft-banner" data-draft-banner hidden>' +
        '  <span>发现上次没提交的内容，已自动恢复。</span>' +
        '  <button class="btn btn-ghost btn-sm" type="button" data-draft-discard>丢弃恢复</button>' +
        '  <button class="btn btn-ghost btn-sm" type="button" data-draft-forget>不再提示</button>' +
        '</div>' +
        '<div data-maps></div>' +
        '<div class="series-bar">' +
        '  <span class="big" data-series>– : –</span>' +
        '  <span class="big-note" data-series-note>录入每图比分后自动得出大比分，无需手填</span>' +
        '  <button class="btn btn-ghost btn-sm" type="button" data-add-map style="margin-left:auto;">+ 加一图</button>' +
        '</div>' +
        '<div data-warn></div>' +
        '<div class="mgr-actions">' +
        '  <span class="auto-note" data-auto>未保存</span>' +
        '  <button class="btn btn-ghost btn-sm" type="button" data-close>收起</button>' +
        '  <button class="btn btn-primary" type="button" data-save><span class="spin"></span>保存' + (canConfirm ? '并生效' : '待确认') + '</button>' +
        '</div>';
    }

    function renderMaps() {
        var box = document.querySelector('[data-maps]');
        if (!box || !editorState) return;
        var seen = {};
        box.innerHTML = editorState.maps.map(function (m, i) {
            /* 常驻节点：先填比分后选地图也不会「什么都没出现」 */
            var winTxt = '<span class="map-win"' + (m.a === '' || m.b === '' ? ' hidden' : '') + '>' + esc(mapWinText(m)) + '</span>';
            return '<section class="map-card" data-map="' + i + '">' +
              '<div class="map-head">' +
              '  <span class="map-idx">图 ' + (i + 1) + '</span>' +
              '  <select class="select" data-k="map" style="min-width:150px;">' +
                   '<option value="">选择地图</option>' +
                   MAPS.map(function (mp) { return '<option value="' + esc(mp) + '"' + (mp === m.map ? ' selected' : '') + '>' + esc(mp) + '</option>'; }).join('') +
              '  </select>' +
              '  <input class="input score-in" type="number" min="0" max="99" data-k="a" value="' + esc(m.a) + '" aria-label="A 队比分">' +
              '  <span class="score-sep">:</span>' +
              '  <input class="input score-in" type="number" min="0" max="99" data-k="b" value="' + esc(m.b) + '" aria-label="B 队比分">' +
              '  ' + winTxt +
              '  <span class="spacer"></span>' +
              '  <button class="btn btn-ghost btn-sm" type="button" data-del-map title="删除这一图">删除本图</button>' +
              '</div>' +
              '<div style="overflow-x:auto;">' + playerTable('a', m, editorState.fixture.team_a) + playerTable('b', m, editorState.fixture.team_b) + '</div>' +
              '</section>';
        }).join('') + (editorState.maps.length ? '' : '<p class="data-note" style="margin-top:12px;">还没有图。点「+ 加一图」开始。</p>');
        wireMaps();
    }

    function playerTable(side, m, teamName) {
        var rows = m.players[side] || [];
        var cls = side === 'a' ? 'side-a' : 'side-b';
        return '<table class="ptable">' +
            '<thead><tr>' +
            '<th class="' + cls + '">' + esc(teamName) + '（' + (side === 'a' ? 'A' : 'B') + '）</th>' +
            '<th>角色</th><th class="num-col">ACS</th><th class="num-col">K</th><th class="num-col">D</th><th class="num-col">A</th><th class="num-col">首杀</th>' +
            '</tr></thead><tbody>' +
            rows.map(function (p, i) {
                var temp = p.name && !allPlayersData.some(function (x) { return x.name === p.name; });
                return '<tr data-side="' + side + '" data-i="' + i + '"' + (temp ? ' class="temp"' : '') + '>' +
                    '<td class="name-col"><input class="input" data-k="name" list="roster-' + side + '-' + i + '" value="' + esc(p.name) + '" placeholder="姓名">' +
                    '<datalist id="roster-' + side + '-' + i + '">' +
                    ((groupData[fxGroup()] && groupData[fxGroup()].rosters[teamName]) || [])
                        .map(function (r) { return '<option value="' + esc(r.name) + '"></option>'; }).join('') +
                    '</datalist></td>' +
                    '<td class="role-col"><select class="select" data-k="ch"><option value="">—</option>' +
                    CHARS.map(function (c) { return '<option value="' + esc(c) + '"' + (c === p.ch ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') +
                    '</select></td>' +
                    ['acs', 'k', 'd', 'a'].map(function (k) {
                        return '<td class="num-col"><input class="input" type="number" min="0" data-k="' + k + '" value="' + esc(p[k]) + '" placeholder="' + k.toUpperCase() + '"></td>';
                    }).join('') +
                    '<td class="num-col"><input class="input" type="number" min="0" data-k="fb" value="' + esc(p.fb) + '" placeholder="FB" title="这张图的首杀次数"></td>' +
                    '</tr>';
            }).join('') +
            '</tbody></table>';
    }

    function wireMaps() {
        var box = document.querySelector('[data-maps]');
        if (!box) return;
        Array.prototype.forEach.call(box.querySelectorAll('[data-map]'), function (card) {
            var idx = Number(card.dataset.map);
            card.addEventListener('input', function (e) {
                var k = e.target.dataset.k;
                if (!k) return;
                var m = editorState.maps[idx];
                if (e.target.closest('.ptable')) {
                    var tr = e.target.closest('tr');
                    var side = tr.dataset.side, i = Number(tr.dataset.i);
                    if (k === 'name') {
                        m.players[side][i].name = e.target.value;
                        /* 姓名 ↔ ID 联动（系统替你做） */
                        var hit = allPlayersData.find(function (p) { return p.name === e.target.value.trim(); });
                        if (hit) m.players[side][i].id = idOf(hit.id);
                        tr.classList.toggle('temp', !!e.target.value && !hit);
                    } else m.players[side][i][k] = e.target.value;
                } else {
                    m[k] = e.target.value;
                }
                markDirty();
                if (k === 'a' || k === 'b') { updateSeries(); refreshMapWin(card, idx); }
                /* 输入时也要机会刷新单图胜负：a/b 已在上面处理 */
            });
            card.addEventListener('change', function (e) {
                if (e.target.dataset.k === 'map') {
                    editorState.maps[idx].map = e.target.value;
                    markDirty(); updateSeries(); refreshMapWin(card, idx);
                }
            });
            var del = card.querySelector('[data-del-map]');
            if (del) del.addEventListener('click', function () {
                if (editorState.maps.length === 1) { toast('至少保留一图；只想清空内容可把比分清掉。', 'info'); return; }
                var m = editorState.maps[idx];
                /* 会丢东西的操作：难误碰（删的是已入库的图才要确认） */
                if (m.id) {
                    HWLayout.confirmDialog({ title: '删除第 ' + (idx + 1) + ' 图', message: '这一图的数据已经入库，删除会在保存后同步移除。确定？', okText: '删除', danger: true })
                        .then(function (ok) { if (!ok) return; editorState.maps.splice(idx, 1); markDirty(); renderMaps(); updateSeries(); });
                } else {
                    editorState.maps.splice(idx, 1); markDirty(); renderMaps(); updateSeries();
                }
            });
        });
    }

    function mapWinText(m) {
        if (!m || m.a === '' || m.b === '') return '';
        var na = Number(m.a), nb = Number(m.b);
        if (na > nb) return editorState.fixture.team_a + ' 胜';
        if (nb > na) return editorState.fixture.team_b + ' 胜';
        return '平图（不计胜场）';
    }

    /* 只更新文字与颜色，不重建 DOM：避免打字时丢失焦点 */
    function refreshMapWin(card, idx) {
        var m = editorState.maps[idx];
        var el = card.querySelector('.map-win');
        if (!el) return;
        if (m.a === '' || m.b === '') {
            el.textContent = '';
            el.hidden = true;
            return;
        }
        el.hidden = false;
        el.textContent = mapWinText(m);
        el.style.color = Number(m.a) === Number(m.b) ? 'var(--tone-gold)' : 'var(--success-green)';
    }

    function seriesScore() {
        var wa = 0, wb = 0, done = 0, draw = 0;
        editorState.maps.forEach(function (m) {
            if (m.map && m.a !== '' && m.b !== '') {
                var na = Number(m.a), nb = Number(m.b);
                if (na === nb) { draw++; done++; return; }
                done++;
                if (na > nb) wa++; else wb++;
            }
        });
        return { a: wa, b: wb, done: done, draw: draw };
    }

    function updateSeries() {
        if (!editorState) return;
        var s = seriesScore();
        var big = document.querySelector('[data-series]');
        var note = document.querySelector('[data-series-note]');
        if (big) {
            var txt = s.done ? s.a + ' : ' + s.b : '– : –';
            if (big.textContent !== txt) HWLayout.setNum(big, s.done ? (s.a + ' : ' + s.b) : '– : –', { plain: true });
            big.textContent = txt;
        }
        if (note) {
            var need = seriesNeed();
            var left = Math.max(0, need.win - Math.max(s.a, s.b));
            note.textContent = !s.done ? '录入每图比分后自动得出大比分，无需手填'
                : 'BO' + need.bo + ' · ' + (Math.max(s.a, s.b) >= need.win ? '系列赛已结束' : '还需 ' + left + ' 胜')
                  + (s.draw ? '（' + s.draw + ' 张平图不计胜场）' : '');
        }
    }
    function seriesNeed() {
        var fmtStr = (boundEvent && boundEvent.format) || '';
        var m = String(fmtStr).match(/BO\s*([1357])/i);
        var bo = m ? Number(m[1]) : 3;
        return { bo: bo, win: Math.ceil(bo / 2) };
    }

    function markDirty() {
        dirty = true;
        var el = document.querySelector('[data-auto]');
        if (el) { el.textContent = '未保存'; el.style.color = 'var(--tone-gold)'; }
        scheduleAutosave();
    }

    var autosaveTimer = null;
    function scheduleAutosave() {
        if (autosaveTimer) clearTimeout(autosaveTimer);
        autosaveTimer = setTimeout(function () { writeDraft(); }, 800);
    }
    function draftKey(fx) {
        return 'hw_rdraft_' + currentSeason + '_' + (fx.group || currentGroup) + '_' + fx.team_a + '_' + fx.team_b;
    }
    function writeDraft() {
        if (!editorState || !dirty) return;
        try {
            localStorage.setItem(draftKey(editorState.fixture), JSON.stringify({
                stage: editorState.stage, date: editorState.date, link: editorState.link,
                maps: editorState.maps, at: new Date().toISOString()
            }));
            var el = document.querySelector('[data-auto]');
            if (el) {
                el.textContent = '已自动保存 ' + fmtDay(new Date().toISOString());
                el.style.color = 'var(--smoke)';
            }
        } catch (e) { /* 隐私模式：只是不自动保存，不打断 */ }
    }
    function readDraft(fx) {
        try {
            var raw = localStorage.getItem(draftKey(fx));
            if (!raw) return null;
            var d = JSON.parse(raw);
            if (!d || !d.maps) return null;
            return d;
        } catch (e) { return null; }
    }
    function clearDraft(fx) {
        try { localStorage.removeItem(draftKey(fx)); } catch (e) {}
    }

    function wireEditor(bodyEl, fx) {
        renderMaps();
        bodyEl.addEventListener('input', function (e) {
            var k = e.target.dataset.k;
            if (!k) return;
            if (k === 'date') editorState.date = e.target.value;
            else if (k === 'link') editorState.link = e.target.value;
            else if (k === 'stage') editorState.stage = e.target.value;
            markDirty();
        });
        bodyEl.addEventListener('change', function (e) {
            if (e.target.dataset.k === 'stage') { editorState.stage = e.target.value; markDirty(); }
        });
        bodyEl.addEventListener('click', function (e) {
            var t = e.target.closest('[data-close],[data-save],[data-add-map],[data-draft-discard],[data-draft-forget]');
            if (!t) return;
            if (t.hasAttribute('data-close')) { collapse(); renderResultBody(); }
            if (t.hasAttribute('data-add-map')) { editorState.maps.push(freshMap(fx)); markDirty(); renderMaps(); updateSeries(); }
            if (t.hasAttribute('data-draft-discard')) { clearDraft(fx); buildEditor(fx, mapsByFixture[fx.id] || []); }
            if (t.hasAttribute('data-draft-forget')) { var b = bodyEl.querySelector('[data-draft-banner]'); if (b) b.hidden = true; }
            if (t.hasAttribute('data-save')) save(fx, t);
        });
    }

    /* ---------------- 校验：软提示，不拦人 ---------------- */
    function validate() {
        var w = [];
        var s = seriesScore();
        if (!s.done) w.push('还没有任何一图的完整比分。');
        editorState.maps.forEach(function (m, i) {
            if (!m.map && (m.a !== '' || m.b !== '')) w.push('图 ' + (i + 1) + ' 填了比分但没选地图。');
            if (m.map && (m.a === '' || m.b === '')) w.push('图 ' + (i + 1) + ' 选了地图但比分不完整。');
            ['a', 'b'].forEach(function (side) {
                var chars = {};
                (m.players[side] || []).forEach(function (p) {
                    if (p.ch) {
                        if (chars[p.ch]) w.push('图 ' + (i + 1) + ' 同一队出现重复英雄：' + p.ch);
                        chars[p.ch] = 1;
                    }
                    if (p.name && (p.acs === '' || p.acs === null) && (p.k !== '' || p.d !== '')) {
                        w.push('图 ' + (i + 1) + ' 选手 ' + p.name + ' 有 K/D 但 ACS 为空。');
                    }
                    /* 一张图的首杀最多 1 次（按图记），且不可能超过击杀数 */
                    if (p.name && p.fb !== '' && p.fb != null) {
                        var fbN = Number(p.fb);
                        if (isNaN(fbN) || fbN < 0) w.push('图 ' + (i + 1) + ' 选手 ' + p.name + ' 的首杀数不是有效数字。');
                        else if (fbN > 1) w.push('图 ' + (i + 1) + ' 选手 ' + p.name + ' 的首杀数 ' + fbN + ' 超过 1 —— 一张图只有一个首杀。');
                    }
                });
            });
        });
        var need = seriesNeed();
        if (s.done && Math.max(s.a, s.b) > need.win) w.push('大比分超过 BO' + need.bo + ' 的胜场上限，请核对。');
        return w;
    }

    function renderWarn(list) {
        var box = document.querySelector('[data-warn]');
        if (!box) return;
        if (!list.length) { box.innerHTML = ''; return; }
        box.innerHTML = '<div class="mgr-warn"><strong>保存前请确认：</strong><ul>' +
            list.slice(0, 8).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') +
            (list.length > 8 ? '<li>…共 ' + list.length + ' 条</li>' : '') +
            '</ul></div>';
    }

    /* ---------------- 保存：一次写完（赛程大比分 + 逐图 + 选手数据） ---------------- */
    function setBusy(btn, busy, label) {
        if (!btn) return;
        if (busy) {
            btn.dataset.busy = '1';
            btn.dataset.label = btn.innerHTML;
            btn.innerHTML = '<span class="spin"></span>' + (label || '保存中…');
        } else {
            btn.removeAttribute('data-busy');
            if (btn.dataset.label) btn.innerHTML = btn.dataset.label;
        }
    }

    function save(fx, btn) {
        var warns = validate();
        if (warns.length && !window.__warnedOnce) {
            renderWarn(warns);
            window.__warnedOnce = true;
            toast('有 ' + warns.length + ' 处需要确认，再点一次「保存」即继续（仅提示，不拦截）。', 'info');
            return;
        }
        window.__warnedOnce = false;
        var s = seriesScore();
        if (!s.done) { toast('至少录入一图的完整比分（地图 + 双方比分）。', 'err'); return; }
        setBusy(btn, true);
        var group = fx.group || currentGroup;
        var matchDate = fromLocalInput(editorState.date);
        var payloadMaps = editorState.maps.filter(function (m) { return m.map && m.a !== '' && m.b !== ''; });

        /* 1) 赛程行：大比分 / 时间 / 回放 / 结果状态 */
        var patch = { score_a: s.a, score_b: s.b, match_date: matchDate, link: editorState.link || null };
        var statusPatch = canConfirm
            ? { result_status: 'confirmed', submitted_by: (HWAuth.getSession() || {}).id || null, confirmed_by: (HWAuth.getSession() || {}).id || null, confirmed_at: new Date().toISOString() }
            : { result_status: 'pending', submitted_by: (HWAuth.getSession() || {}).id || null };

        var chain = sb.from(seasonSchedule()).update(Object.assign({}, patch, statusPatch)).eq('id', fx.id);
        chain.then(function (r) {
            if (r.error && /result_status|column|schema/i.test(r.error.message || '')) {
                /* 老库没有结果状态列：退回只写比分，不阻断录入 */
                return sb.from(seasonSchedule()).update(patch).eq('id', fx.id);
            }
            return r;
        }).then(function (r) {
            if (r && r.error) throw r.error;
            /* 2) 逐图：有 id 更新，无 id 插入，移除的删除 */
            var ops = [];
            var keepIds = {};
            payloadMaps.forEach(function (m) {
                var row = {
                    'group': group, stage: editorState.stage, match_date: matchDate,
                    map: m.map, score: m.a + ':' + m.b, team_a: fx.team_a, team_b: fx.team_b
                };
                ['a', 'b'].forEach(function (side) {
                    var tk = 'team_' + side;
                    (m.players[side] || []).forEach(function (p, i) {
                        row[tk + '_player' + (i + 1) + '_id'] = p.id ? Number(p.id) : null;
                        row[tk + '_player' + (i + 1) + '_ch'] = p.ch || null;
                        /* 与既有格式一致：acs/k/d/a */
                        /* 末尾第 5 段是首杀；没有填就不写（保持老格式 4 段兼容） */
                        var parts = [p.acs || 0, p.k || 0, p.d || 0, p.a || 0];
                        if (p.fb !== '' && p.fb != null) parts.push(p.fb);
                        row[tk + '_player' + (i + 1) + '_data'] = (p.name || p.id) ? parts.join('/') : null;
                    });
                });
                if (m.id) { keepIds[m.id] = 1; ops.push(sb.from(seasonMatches()).update(row).eq('id', m.id)); }
                else ops.push(sb.from(seasonMatches()).insert([Object.assign({ event_id: boundEvent ? boundEvent.id : null }, row)]));
            });
            (mapsByFixture[fx.id] || []).forEach(function (old) {
                if (!keepIds[old.id]) ops.push(sb.from(seasonMatches()).delete().eq('id', old.id));
            });
            return Promise.all(ops);
        }).then(function (res) {
            var bad = (res || []).filter(function (x) { return x && x.error; })[0];
            if (bad) throw bad.error;
            clearDraft(fx);
            dirty = false;
            /* 3) 成功后：按钮反馈 → 重新拉数据 → 队列就地更新并保持展开 */
            if (btn) { btn.dataset.label = '✓ 已保存'; btn.innerHTML = '✓ 已保存'; }
            toast(canConfirm ? '已保存并生效' : '已提交，等待对方队长确认');
            return Promise.all([loadFixtures(), loadMapsFor(fx)]).then(function () {
                openKey = fx.id;
                renderShell();
                if (typeof HWLayout.recalcAfterScoreChange === 'function') HWLayout.recalcAfterScoreChange();
                /* 通知对方队长（仅非确认身份提交时） */
                if (!canConfirm) notifyCaptains(fx, s);
            });
        }).catch(function (e) {
            setBusy(btn, false);
            renderWarn(['保存失败：' + (e && e.message ? e.message : e) + '。已填内容已自动保存，刷新后可恢复。']);
            toast('保存失败：' + (e && e.message ? e.message : e), 'err');
        });
    }

    function notifyCaptains(fx, s) {
        try {
            if (!boundEvent || !HWLayout.notifyUser) return;
            sb.from('event_registrations').select('user_id, team_name')
                .eq('event_id', boundEvent.id).in('status', ['approved', 'pending'])
                .then(function (r) {
                    var rows = (r && r.data) || [];
                    var ids = {};
                    rows.forEach(function (x) {
                        if ((x.team_name === fx.team_a || x.team_name === fx.team_b) &&
                            String(x.user_id) !== String((HWAuth.getSession() || {}).id)) ids[x.user_id] = 1;
                    });
                    Object.keys(ids).forEach(function (uid) {
                        HWLayout.notifyUser(uid, '赛果待确认',
                            fx.team_a + ' vs ' + fx.team_b + '（' + s.a + ':' + s.b + '）由对方提交，确认后计入统计。',
                            'manage.html?event=' + boundEvent.id);
                    });
                }).catch(function () {});
        } catch (e) {}
    }

    /* ---------------- 新建对阵（只有能建的人才看得到按钮） ---------------- */
    function openEditor() {
        var groupTeams = groupData[currentGroup] ? Array.from(groupData[currentGroup].teams).sort() : [];
        if (groupTeams.length < 2) { toast('本组花名册里还没有两支队伍，先在「成员维护」补人。', 'err'); return; }
        var html = '<div class="data-section" style="margin-top:14px;">' +
            '<h3>新建对阵</h3>' +
            '<p class="data-note">队名来自花名册；建好后即出现在队列里，接着就能录比分。</p>' +
            '<div class="admin-row">' +
            '<select class="select" id="nf-a" style="min-width:160px;">' + groupTeams.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select>' +
            '<span style="color:var(--smoke);">vs</span>' +
            '<select class="select" id="nf-b" style="min-width:160px;">' + groupTeams.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select>' +
            '<input class="input" type="datetime-local" id="nf-date" aria-label="新赛程开赛时间" style="min-width:180px;">' +
            '<select class="select" id="nf-stage">' + STAGES.map(function (s) { return '<option>' + s + '</option>'; }).join('') + '</select>' +
            '<button class="btn btn-primary" id="nf-save" type="button">创建</button>' +
            '<button class="btn btn-ghost" id="nf-cancel" type="button">取消</button>' +
            '</div></div>';
        var host = document.getElementById('result-body');
        var box = document.createElement('div');
        box.innerHTML = html;
        host.parentNode.insertBefore(box, host);
        if (box.querySelector('#nf-b').options.length > 1) box.querySelector('#nf-b').selectedIndex = 1;
        box.querySelector('#nf-cancel').addEventListener('click', function () { box.remove(); });
        box.querySelector('#nf-save').addEventListener('click', function () {
            var a = box.querySelector('#nf-a').value, b = box.querySelector('#nf-b').value;
            if (!a || !b || a === b) { toast('请选择两支不同的队伍', 'err'); return; }
            var date = fromLocalInput(box.querySelector('#nf-date').value);
            var mid = 'M' + Date.now().toString(36).toUpperCase();
            var btn = box.querySelector('#nf-save');
            setBusy(btn, true);
            sb.from(seasonSchedule()).insert([{
                'group': currentGroup, match_id: mid, team_a: a, team_b: b,
                match_date: date, stage: box.querySelector('#nf-stage').value,
                event_id: boundEvent ? boundEvent.id : null
            }]).select().then(function (r) {
                setBusy(btn, false);
                if (r.error) { toast('创建失败：' + r.error.message, 'err'); return; }
                box.remove();
                toast('已创建：' + a + ' vs ' + b);
                loadFixtures().then(function () {
                    openKey = r.data && r.data[0] ? r.data[0].id : null;
                    renderShell();
                });
            }).catch(function (e) {
                setBusy(btn, false);
                toast('创建失败：' + (e.message || e), 'err');
            });
        });
    }

    /* ---------------- 成员维护 ---------------- */
    function idsRow(isNew, d) {
        d = d || {};
        var tr = document.createElement('tr');
        tr.dataset.isNew = isNew;
        tr.innerHTML =
            '<td><input class="input" type="text" data-col="name" value="' + esc(d.name) + '"' + (isNew ? '' : ' readonly') + '></td>' +
            '<td><input class="input" type="text" data-col="id" value="' + esc(d.id) + '"></td>' +
            '<td><input class="input" type="text" data-col="team" value="' + esc(d.team) + '" list="teams-datalist"></td>' +
            '<td><input class="input" type="text" data-col="image" value="' + esc(d.image) + '" placeholder="可留空"></td>' +
            '<td><input class="input" type="text" data-col="honor" value="' + esc(d.honor) + '" placeholder="用「、」分隔"></td>' +
            '<td><button class="btn btn-danger-ghost btn-sm" type="button" data-del-id>删除</button></td>';
        tr.querySelector('[data-del-id]').addEventListener('click', function () { deleteId(tr); });
        return tr;
    }

    function renderIds() {
        var body = document.getElementById('ids-table-body');
        if (!body) return;
        var rows = allPlayersData.filter(function (p) { return (p.group || '') === currentGroup; });
        body.innerHTML = '';
        if (!rows.length) {
            body.innerHTML = '<tr><td colspan="6" style="color:var(--smoke); text-align:center; padding:18px 0;">' +

    function collectIds() {
        var rows = Array.prototype.slice.call(document.querySelectorAll('#ids-table-body tr'));
        var out = [];
        rows.forEach(function (tr) {
            if (!tr.querySelector('input[data-col="name"]')) return;
            var o = { isNew: tr.dataset.isNew === 'true', 'group': currentGroup };
            Array.prototype.forEach.call(tr.querySelectorAll('input[data-col]'), function (i) {
                var v = i.value.trim();
                if (v !== '') o[i.dataset.col] = v;
            });
            if (Object.keys(o).length > 2) out.push(o);
        });

    function saveIds() {
        var data = collectIds();
        if (!data.length) { toast('没有要保存的内容。', 'info'); return; }
        var names = new Set(allPlayersData.map(function (p) { return p.name; }));
        for (var i = 0; i < data.length; i++) {
            if (data[i].isNew) {
                if (!data[i].name) { toast('新增选手必须填真名。', 'err'); return; }
                if (names.has(data[i].name)) { toast('真名「' + data[i].name + '」已存在。', 'err'); return; }
                names.add(data[i].name);
            }
        }
        var payload = data.map(function (r) { var o = Object.assign({}, r); delete o.isNew; return o; });
        sb.from(seasonIds()).upsert(payload, { onConflict: 'name' }).then(function (r) {
            if (r.error) { toast('保存失败：' + r.error.message, 'err'); return; }
            toast('花名册已保存（' + payload.length + ' 条）');
            loadRoster().then(renderIds);

    /* ---------------- CSV 导入（保留原有能力，挪到「导入 / 工具」） ---------------- */
    function parseCsv(text) {
        var rows = [], row = [], cur = '', inQ = false;
        for (var i = 0; i < text.length; i++) {
            var c = text[i];
            if (inQ) {
                if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
                else cur += c;
            } else if (c === '"') inQ = true;
            else if (c === ',') { row.push(cur); cur = ''; }
            else if (c === '\n' || c === '\r') {
                if (c === '\r' && text[i + 1] === '\n') i++;
                row.push(cur); cur = '';
                if (row.some(function (x) { return String(x).trim() !== ''; })) rows.push(row);
                row = [];
            } else cur += c;
        }
        row.push(cur);
        if (row.some(function (x) { return String(x).trim() !== ''; })) rows.push(row);
        return rows;
    }
    var csvChecked = null;
    var CSV_HEAD = ['组别', '阶段', '对战时间', '队伍A', '队伍B', '地图', '图比分A', '图比分B'];

    function initCsv() {
        var tpl = document.getElementById('csv-template');
        if (!tpl) return;
        tpl.addEventListener('click', function () {
            HWLayout.downloadCsv('赛果导入模板.csv',
                CSV_HEAD.map(function (h) { return { key: h, label: h }; }),
                [{ '组别': '传奇组', '阶段': '小组赛', '对战时间': '2026-12-01 19:00', '队伍A': '示例队A', '队伍B': '示例队B', '地图': '源工重镇', '图比分A': 13, '图比分B': 9 }]);
        });
        document.getElementById('csv-precheck').addEventListener('click', function () {
            var f = document.getElementById('csv-file').files[0];
            if (!f) { toast('先选择 CSV 文件', 'info'); return; }
            f.text().then(function (text) {
                var rows = parseCsv(text);
                var head = (rows.shift() || []).map(function (h) { return String(h).trim(); });
                var idx = {}, missing = [];
                CSV_HEAD.forEach(function (h) { idx[h] = head.indexOf(h); if (idx[h] < 0) missing.push(h); });
                var report = document.getElementById('csv-report');
                if (missing.length) {
                    report.innerHTML = '<p style="color:var(--tone-danger);">表头缺少：' + missing.join('、') + '（请用模板）</p>';
                    csvChecked = null; document.getElementById('csv-import').disabled = true; return;
                }
                if (rows.length > 500) { report.innerHTML = '<p style="color:var(--tone-danger);">单次最多 500 行，当前 ' + rows.length + ' 行</p>'; return; }
                var teams = new Set(allPlayersData.map(function (x) { return x.team; }).filter(Boolean));
                var errors = [], valid = [];
                rows.forEach(function (r, i) {
                    var o = {
                        'group': r[idx['组别']].trim(), stage: r[idx['阶段']].trim(), when: r[idx['对战时间']].trim(),
                        team_a: r[idx['队伍A']].trim(), team_b: r[idx['队伍B']].trim(), map: r[idx['地图']].trim(),
                        sa: parseInt(r[idx['图比分A']], 10), sb: parseInt(r[idx['图比分B']], 10)
                    };
                    var errs = [];
                    if (!o.group || !o.team_a || !o.team_b || !o.map) errs.push('组别/队伍/地图不能为空');
                    if (isNaN(o.sa) || isNaN(o.sb) || o.sa < 0 || o.sb < 0) errs.push('比分须为非负整数');
                    if (!o.when || isNaN(new Date(o.when.replace(' ', 'T')).getTime())) errs.push('对战时间格式不对');
                    if (teams.size && o.team_a && !teams.has(o.team_a)) errs.push('队伍A「' + o.team_a + '」不在花名册');
                    if (teams.size && o.team_b && !teams.has(o.team_b)) errs.push('队伍B「' + o.team_b + '」不在花名册');
                    if (!canConfirm && myTeams.length && myTeams.indexOf(o.team_a) < 0 && myTeams.indexOf(o.team_b) < 0) errs.push('仅能导入本队比赛');
                    if (errs.length) errors.push('第 ' + (i + 2) + ' 行：' + errs.join('；'));
                    else valid.push(o);
                });
                csvChecked = valid;
                document.getElementById('csv-import').disabled = !(valid.length && !errors.length);
                report.innerHTML =
                    (errors.length ? '<p style="color:var(--tone-danger); white-space:pre-line;">预检未通过（' + errors.length + ' 行）：\n' + errors.slice(0, 24).join('\n') + '</p>' : '') +
                    (valid.length ? '<p style="color:var(--success-green);">' + valid.length + ' 行通过预检' + (errors.length ? '，修正后可整批导入' : '，可确认导入') + '</p>' : '');
            });
        });
        document.getElementById('csv-import').addEventListener('click', doImport);
        loadBatches();
    }

    function doImport() {
        if (!csvChecked || !csvChecked.length) return;
        var me = HWAuth.getSession();
        var batchNo = 'IMP-' + Date.now();
        sb.from('import_batches').insert([{
            batch_no: batchNo, event_id: boundEvent ? boundEvent.id : null, season: currentSeason,
            imported_by: me ? me.id : null, row_count: csvChecked.length, detail: { rows: csvChecked }
        }]).select().single().then(function (b) {
            if (b.error) { toast('建批次失败（请先执行 install.sql）：' + b.error.message, 'err'); return; }
            var batchId = b.data.id;
            var mRows = csvChecked.map(function (o) {
                return {
                    'group': o.group, stage: o.stage,
                    match_date: HWLayout.fromBJInputValue(o.when.replace(' ', 'T')) || new Date(o.when.replace(' ', 'T')).toISOString(),
                    map: o.map, score: o.sa + ':' + o.sb, team_a: o.team_a, team_b: o.team_b,
                    event_id: boundEvent ? boundEvent.id : null, import_batch_id: batchId
                };
            });
            return sb.from(seasonMatches()).insert(mRows).then(function (m) {
                if (m.error) { toast('写入赛果失败：' + m.error.message, 'err'); return; }
                var series = {};
                csvChecked.forEach(function (o) {
                    var k = [o.group, o.stage, o.when, o.team_a, o.team_b].join('|');
                    series[k] = series[k] || { o: o, a: 0, b: 0 };
                    if (o.sa > o.sb) series[k].a++; else if (o.sb > o.sa) series[k].b++;
                });
                var sRows = Object.keys(series).map(function (k, i) {
                    var v = series[k];
                    return {
                        'group': v.o.group, match_id: batchNo + '-' + (i + 1), team_a: v.o.team_a, team_b: v.o.team_b,
                        score_a: v.a, score_b: v.b,
                        match_date: HWLayout.fromBJInputValue(v.o.when.replace(' ', 'T')) || new Date(v.o.when.replace(' ', 'T')).toISOString(),
                        import_batch_id: batchId, result_status: canConfirm ? 'confirmed' : 'pending'
                    };
                });
                return sb.from(seasonSchedule()).insert(sRows).then(function () {
                    HWLayout.writeAudit('import.create', 'import_batch', batchId, { rows: csvChecked.length, season: currentSeason });
                    toast('已导入 ' + csvChecked.length + ' 图 / ' + sRows.length + ' 场（批次 ' + batchNo + '）');
                    csvChecked = null;
                    document.getElementById('csv-import').disabled = true;
                    loadBatches();
                    loadFixtures().then(renderShell);
                });
            });
        }).catch(function (e) { toast('导入失败：' + (e.message || e), 'err'); });
    }

    function loadBatches() {
        var host = document.getElementById('csv-batches');
        if (!host) return;
        sb.from('import_batches').select('*').eq('season', currentSeason).order('created_at', { ascending: false }).limit(10)

                            '<span style="font-family:var(--font-mono);">' + esc(b.batch_no) + '</span>' +
                            '<span>' + b.row_count + ' 行 · ' + (b.status === 'undone' ? '已撤销' : '已导入') + '</span>' +
                            (b.status !== 'undone' ? '<button class="btn btn-ghost btn-sm" data-undo="' + b.id + '" type="button">整批撤销</button>' : '<span></span>') +
                            '</div>';

    function undoBatch(batchId) {
        HWLayout.confirmDialog({ title: '撤销整批导入', message: '删除该批次写入的全部赛果行；已确认的赛程行会保留并提示。确定撤销？', okText: '撤销导入', danger: true })
            .then(function (ok) {
                if (!ok) return;
                sb.from(seasonMatches()).delete().eq('import_batch_id', batchId).then(function () {
                    return sb.from(seasonSchedule()).select('id').eq('import_batch_id', batchId).eq('result_status', 'confirmed');
                }).then(function (conf) {
                    return sb.from(seasonSchedule()).delete().eq('import_batch_id', batchId).neq('result_status', 'confirmed')
                        .then(function () { return conf; });
                }).then(function (conf) {
                    return sb.from('import_batches').update({ status: 'undone', undone_at: new Date().toISOString() }).eq('id', batchId)
                        .then(function () { return conf; });
                }).then(function (conf) {
                    var kept = ((conf && conf.data) || []).length;
                    HWLayout.writeAudit('import.undo', 'import_batch', batchId, { keptConfirmed: kept });
                    toast('批次已撤销' + (kept ? '；' + kept + ' 场已确认赛程保留，需人工处理' : ''));
                    loadBatches(); loadFixtures().then(renderShell);
                }).catch(function (e) { toast('撤销失败：' + (e.message || e), 'err'); });
            });
    }

    function decideTransfer(id, accept) {

    function resolveMyTeams() {
        var u = HWAuth.getSession();
        if (!u) return Promise.resolve([]);
        return sb.from(seasonIds()).select('name, id, team, "group"').then(function (r) {
            var rows = (r && r.data) || [];
            var hit = rows.filter(function (x) {
                return (u.game_id && String(x.id) === String(u.game_id)) ||
                       (u.nickname && x.name === u.nickname) || (u.username && x.name === u.username);
            });
            var teams = hit.map(function (x) { return x.team; }).filter(Boolean);
            /* 活动队长表兜底 */
            if (!teams.length && boundEvent) {
                return sb.from('event_captains').select('player_name, game_id').eq('event_id', boundEvent.id).then(function (c) {
                    var caps = (c && c.data) || [];
                    var names = caps.map(function (x) { return x.player_name; }).filter(Boolean);
                    var gids = caps.map(function (x) { return String(x.game_id || ''); }).filter(Boolean);
                    return rows.filter(function (p) {
                        return (p.name && names.indexOf(p.name) !== -1) || (p.id && gids.indexOf(String(p.id)) !== -1);
                    }).map(function (p) { return p.team; }).filter(Boolean);
                });
            }
            return teams;
        }).catch(function () { return []; });
    }
