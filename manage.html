        HWLayout.resolveEvent().then(function (ev) {
            boundEvent = ev;
            if (ev) {
                currentSeason = HWLayout.seasonKey(ev) || 's6';
                if (ev.season && /^s\d$/i.test(ev.season)) currentSeason = String(ev.season).toLowerCase();
                var t = document.getElementById('mgr-event-title');
                if (t) t.textContent = ev.title + ' · ' + String(ev.season || '').toUpperCase();
                HWLayout.eventBar({ event: ev, perms: {} });
            }
            return HWLayout.access(currentSeason, ev || undefined);
        }).then(function (p) {
            perms = p || {};
            canConfirm = !!(perms.isAdmin || perms.isOrganizer || perms.isEventCaptain || perms.isCaptain);
            canCreate = !!(perms.isAdmin || perms.isOrganizer);
            if (boundEvent) HWLayout.eventBar({ event: boundEvent, active: 'manage', perms: perms });

            if (!(perms.isAdmin || perms.isOrganizer || perms.isEventCaptain || perms.isCaptain || HWAuth.getSession())) {
                gate('<h3>需要登录</h3>' +
                    '<p class="data-note">数据台对参赛者开放：登录后系统会自动认领你所在队伍的比赛。<br>' +
                    '队长可录本队全部比赛，组织者与管理员可录本活动全部比赛。</p>' +
                    '<button class="btn btn-primary" id="gate-login" type="button">登录 / 注册</button>');
                var gl = document.getElementById('gate-login');
                if (gl) gl.addEventListener('click', function () {
                    HWAuth.openModal({ stay: true }).then(function () { location.reload(); }).catch(function () {});
                });
                return;
            }
            return resolveMyTeams().then(function (teams) {
                myTeams = teams || [];
                document.getElementById('manage-shell').style.display = 'block';
                return loadRoster().then(function () {
                    renderIds();
                    return loadFixtures().then(function () {
                        /* 先把每场的图行拉一次，队列才能显示正确的「未录入 / 已生效」 */
                        return Promise.all(fixtures.slice(0, 60).map(function (fx) {
                            return loadMapsFor(fx).catch(function () { mapsByFixture[fx.id] = []; });
                        }));
                    }).then(function () {
                        renderShell();
                        initCsv(); initTeamMgmt(); applyArchivedGuard();
                    });
                });
            });
        }).catch(function (e) {
            gate('<h3>数据台加载失败</h3><p class="data-note">' + esc(e && e.message ? e.message : e) + '</p>' +
                '<p class="data-note">若提示缺少表/列，请先在 Supabase 执行 supabase/install.sql。</p>');
        });
    }

    function applyArchivedGuard() {
        HWLayout.getSeasons().then(function (list) {
            var row = (list || []).find(function (x) { return x.season_key === currentSeason; });
            if (!row || row.status !== 'archived') return;
            var shell = document.getElementById('manage-shell');
            if (!shell || document.getElementById('archived-banner')) return;
            var b = document.createElement('div');
            b.id = 'archived-banner';
            b.className = 'notice';
            b.innerHTML = '<strong>该赛季已归档（只读）。</strong> 需要继续录入，请管理员在管理后台取消归档。';
            shell.prepend(b);
            Array.prototype.forEach.call(shell.querySelectorAll('[data-save], #update-ids, #new-fixture-btn, #csv-import'), function (el) {
                el.disabled = true;
                el.title = '赛季已归档，只读';
            });
        }).catch(function () {});
    }

    /* ---------------- 事件绑定 ---------------- */
    document.getElementById('group-filter-buttons').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b || b.classList.contains('active')) return;
        Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) { x.classList.toggle('active', x === b); });
        writeDraft();          /* 换组前先落盘 */
        currentGroup = b.dataset.group;
        openKey = null; dirty = false; editorState = null;
        mapsByFixture = {};
        loadFixtures().then(function () {
            return Promise.all(fixtures.slice(0, 60).map(function (fx) {
                return loadMapsFor(fx).catch(function () { mapsByFixture[fx.id] = []; });
            }));
        }).then(function () {
            renderIds();
            renderShell();
            HWLayout.viewSwap(document.getElementById('result-body'));
        });
    });

    document.getElementById('tab-filters').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b || b.classList.contains('active')) return;
        Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) { x.classList.toggle('active', x === b); });
        Array.prototype.forEach.call(document.querySelectorAll('.tab-content'), function (c) {
            var on = c.id === b.dataset.tab;
            c.classList.toggle('active', on);
            if (on) { c.classList.remove('m-swap'); void c.offsetWidth; c.classList.add('m-swap'); }
        });
        if (b.dataset.tab === 'tools-tab') loadBatches();
    });

    document.getElementById('view-switch').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b || b.classList.contains('active')) return;
        view = b.dataset.view;
        writeDraft();          /* 先落盘，视图切换不丢内容 */
        syncViewSwitch();
        renderResultBody();
        HWLayout.viewSwap(document.getElementById('result-body'));
    });

    document.getElementById('new-fixture-btn').addEventListener('click', function () { openEditor(); });
    document.getElementById('add-id-row').addEventListener('click', function () {
        var body = document.getElementById('ids-table-body');
        if (body.querySelector('tr td[colspan]')) body.innerHTML = '';
        body.appendChild(idsRow(true, { 'group': currentGroup }));
    });
    document.getElementById('update-ids').addEventListener('click', saveIds);
    document.getElementById('resync-player-pages').addEventListener('click', resyncPlayers);

    /* 离开保护：有未保存内容时浏览器会拦一下（会丢东西的难误碰） */
    window.addEventListener('beforeunload', function (e) {
        if (!dirty) return;
        writeDraft();
        e.preventDefault();
        e.returnValue = '';
    });

    boot();
})();
</script>
</body>
</html>
