# 纯静态站点：没有任何打包步骤，html/css/js 直接就是产物。
# 但必须显式声明 command + publish，否则 Netlify 会判定"无需构建"而跳过部署。
[build]
  command = "node scripts/build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# HTML 不缓存：改了就能立刻看到，不用等 CDN 过期
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
