<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选手主页 · HWVCTS</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <style>
        :root {
            /* legacy aliases → theme tokens（深浅色随 theme.css 自动翻转） */
            --primary-color: var(--coral-pulse);
            --bg-color: var(--void-black);
            --bg-gradient-mid: var(--obsidian);
            --text-color: var(--mist);
            --card-bg-color: var(--ink);
            --header-bg-color: transparent;
            --border-color: var(--border);
            --border-highlight: var(--smoke);
            --shadow-color: rgba(0, 0, 0, 0.5);
            --control-height: 34px;
            --text-muted: var(--smoke);
            --winner-color: var(--success-green);
            --star-color: var(--mist);
            --star-color-inactive: rgba(128, 128, 128, 0.45);

            --gold-color: #FFD700; --gold-glow: rgba(255, 215, 0, 0.7); --gold-light: #fff3cd; --gold-main: #ffd700; --gold-medium: #ffc107; --gold-dark: #b8860b;
            /* 冷色旧变量 → 统一令牌（曾有 5 个十六进制副本，深浅色下不一致） */
            --cool-light: var(--ash); --cool-main: var(--mist);
            --cool-medium: var(--coral-pulse); --cool-dark: var(--ember-hush);
        }
        [data-theme="light"] {
            --star-color-inactive: rgba(0, 0, 0, 0.25);
        }

        /* 与 summary.html 同源：.page > .container > .page-header + .table-card。
           不再自造卡片体系（页面私有的 .container 宽度、红边框卡片都删掉了）。 */

        /* 页首：圆形头像 + 真名 + 游戏ID 一行排列 */
        .ph-player { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        #player-avatar-container { flex-shrink: 0; }
        .player-avatar {
            width: 68px; height: 68px; border-radius: 50%;
            object-fit: cover; border: 1px solid var(--border);
        }
        .player-avatar-fallback {
            width: 68px; height: 68px; border-radius: 50%;
            background: var(--graphite); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: 500; color: var(--mist);
        }
        .ph-player-text { min-width: 0; flex: 1; }
        .ph-player-text .page-sub { font-family: var(--font-mono); font-size: 13px; color: var(--smoke); letter-spacing: .06em; }
        .ph-player-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        /* 卡片：同 summary.html 的 .table-card（无边框 + 软阴影） */
        .table-card { background: var(--ink); border-radius: var(--r-card); box-shadow: var(--key-shadow); overflow: hidden; }
        .tc-title { margin: 0; font-size: 16px; font-weight: 500; color: var(--pure-white); }
        .tc-sub { margin: 0 0 10px; font-size: 13px; color: var(--smoke); }

        /* 生涯能力图 + 生涯数据详情：两列 */
        /* stretch：两栏等高。以前是 align-items:start，各按内容撑开，
           生涯详情 7 行列表 vs 雷达图 canvas 天然不等高，看着一高一矮。 */
        .pc-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; align-items: stretch; }
        /* 卡片撑满格子，内容在卡内垂直居中 —— 矮的那张不会底部留一截空白 */
        .pc-grid > section { display: flex; flex-direction: column; height: 100%; }
        .pc-grid > section > div { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .pc-grid #radar-chart-container { margin: auto auto; }
        .pc-grid #summary-list-content { justify-content: center; }
        @media (max-width: 900px) { .pc-grid { grid-template-columns: minmax(0, 1fr); } }
        .chart-wrap { width: 100%; max-width: 460px; margin: 0 auto; position: relative; }
        #event-stats-content .data-table { min-width: 640px; }
        /* 赛事数据 / 角色数据 / 评论：各自独占整行 */
        .pc-stack { display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
        .pc-stack > section { margin: 0; min-width: 0; }
        /* 宽表禁止换行挤压：以前塞在半栏里，「队名」「KDA」被挤成竖排。
           列多就该横向滚动，而不是把每个字折成一行。 */
        .pc-stack .data-table th,
        .pc-stack .data-table td { white-space: nowrap; }
        .pc-stack .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

        /* 页首加载态：用骨架屏占住标题的位置，避免文字先出现再跳动 */
        .sk-title { display: block; width: 180px; height: 26px; border-radius: var(--r-btn); }
        /* 表内数值列：等宽数字 + 右对齐，扫读一列数字时不会跳 */
        .data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
        .data-table .strong { color: var(--pure-white); font-weight: 600; }
        .data-table .dim { color: var(--smoke); }

        /* 生涯数据详情：与 summary.html 的对比表同构（左标签右数值，分隔线而非边框） */
        .summary-list { display: flex; flex-direction: column; font-size: 15px; }
        .summary-list div { padding: 12px 14px; display: flex; justify-content: space-between;
                            align-items: baseline; gap: 12px; border-bottom: 1px solid rgba(54,55,57,.5); }
        .summary-list div:last-child { border-bottom: none; }
        .summary-list div span:first-child { font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em;
                                             color: var(--smoke); text-transform: uppercase; }
        .summary-list div span:last-child, .summary-list div b { color: var(--pure-white); font-weight: 600; font-variant-numeric: tabular-nums; }
        .rank-top { font-size: 12px; color: var(--smoke); font-weight: 500; margin-left: 6px;
                    font-variant-numeric: tabular-nums; }
        [data-theme="light"] .summary-list div { border-bottom-color: var(--border); }

        #radar-chart-container { position: relative; margin: 0 auto; max-width: 360px; }
        .radar-empty { text-align: center; color: var(--smoke); font-size: 13px; line-height: 1.7;
                       padding: 48px 16px; }
        .player-avg-score { color: var(--pure-white); font-size: 14px; font-weight: 600;
                            font-variant-numeric: tabular-nums; }

        /* 小节标题（评论表单等处）：events.html 里有同名定义，这里不能漏 */
        .section-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em;
                         text-transform: uppercase; color: var(--smoke); margin: 0 0 12px; }

        /* 赛事折线图的指标切换 */
        .chip-btn { padding: 5px 12px; border-radius: var(--r-pill); border: 1px solid var(--border);
                    background: transparent; color: var(--ash); font-size: 13px; cursor: pointer;
                    font-family: inherit; transition: color var(--t-hover) var(--ease-out),
                    background var(--t-hover) var(--ease-out), border-color var(--t-hover) var(--ease-out); }
        .chip-btn:hover { color: var(--mist); border-color: var(--iron); }
        .chip-btn.active { background: var(--mist); color: var(--void-black); border-color: transparent; font-weight: 600; }
        .comment-card { position: relative; background: var(--obsidian); border: 1px solid var(--border);
                        border-radius: var(--r-btn); padding: 14px 16px; margin-bottom: 10px;
                        transition: border-color var(--t-hover) var(--ease-out); }
        .comment-card:hover { border-color: var(--iron); }
        .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; flex-wrap: wrap; gap: 10px; }
        .comment-author { font-weight: 600; color: var(--pure-white); margin-right: auto; }
        .comment-rating { white-space: nowrap; color: var(--smoke); font-variant-numeric: tabular-nums; }
        .comment-rating span { font-weight: 600; color: var(--pure-white); font-size: 14px; }
        .comment-body { font-size: 14px; line-height: 1.65; word-wrap: break-word; color: var(--mist); }
        .delete-comment-btn, .reply-comment-btn, .report-comment-btn {
            background: transparent; color: var(--smoke); border: 1px solid var(--border);
            border-radius: var(--r-btn); padding: 4px 10px; cursor: pointer; font-size: 12.5px;
            font-family: inherit; flex-shrink: 0;
            transition: color var(--t-hover) var(--ease-out), border-color var(--t-hover) var(--ease-out);
        }
        .delete-comment-btn:hover, .reply-comment-btn:hover, .report-comment-btn:hover {
            color: var(--pure-white); border-color: var(--iron);
        }
        .replies-container { margin-left: 20px; margin-top: 15px; border-left: 2px solid var(--border-color); padding-left: 15px; }
        
        #comment-form { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        .form-row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        #nickname-input { flex: 1; min-width: 150px; height: var(--control-height); padding: 0 15px; border-radius: 4px; border: 1px solid var(--border-color); background-color: rgba(0,0,0,0.2); color: var(--text-color); font-family: 'Noto Sans SC'; outline: none; transition: border-color var(--t-swap); }
        [data-theme="light"] #nickname-input { background: var(--fill); }
        #nickname-input, #comment-input { border-color: var(--border); background: var(--obsidian);
                                         color: var(--mist); border-radius: var(--r-btn); font-family: inherit; }
        #nickname-input:focus, #comment-input:focus { border-color: var(--iron); }
        .star-rating-container { display: flex; align-items: center; gap: 4px; }
        .star { font-size: 24px; color: var(--star-color-inactive); cursor: pointer; transition: transform var(--t-hover) var(--ease-out), opacity var(--t-hover) var(--ease-out), color var(--t-hover) var(--ease-out), background var(--t-hover) var(--ease-out), border-color var(--t-hover) var(--ease-out); line-height: 1; }
        .star:hover { transform: scale(1.2); }
        #comment-form textarea { width: 100%; padding: 15px; border-radius: 4px; border: 1px solid var(--border-color); background-color: rgba(0,0,0,0.2); color: var(--text-color); font-family: 'Noto Sans SC'; outline: none; transition: border-color var(--t-swap); resize: vertical; }
        [data-theme="light"] #comment-form textarea { background: var(--fill); }

        #comment-form button[type="submit"] { align-self: flex-start; }
        #comment-form button:hover { background: #9c9c9d; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        #comment-form button:disabled { background-color: var(--graphite); cursor: not-allowed; box-shadow: none; color: var(--smoke); }
        .reply-form-container { margin-top: 15px; }

        /* modal 容器由 theme.css 单一提供（.modal-backdrop/.modal-panel） */

        /* 成就墙（Phase 14）：封面缩略图 + 荣誉名 + 赛事 + 时间 */
        /* ── 荣誉带：活动图标 + 荣誉名称，横向排布，点开看详情 ── */
        .honor-strip { margin-bottom: 16px; }
        .honor-strip-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
        .honor-strip-count { font-family: var(--font-mono); font-size: 12px; color: var(--smoke);
                             font-variant-numeric: tabular-nums; }
        .honor-strip-body { display: flex; flex-wrap: wrap; gap: 10px; }

        /* 一枚荣誉 = 活动图标 + 名称；图标优先用活动封面，没有就用奖杯 */
        .honor-pill { display: inline-flex; align-items: center; gap: 10px;
                      padding: 8px 14px 8px 8px; background: var(--ink);
                      border-radius: var(--r-pill); box-shadow: var(--key-shadow);
                      border: 1px solid transparent; cursor: pointer;
                      font-family: inherit; color: var(--mist); text-align: left;
                      transition: transform var(--t-hover) var(--ease-out),
                                  border-color var(--t-hover) var(--ease-out); }
        .honor-pill:hover { transform: translateY(-1px); border-color: var(--border); }
        .honor-pill:active { transform: scale(.985); }
        .honor-pill-ico { width: 30px; height: 30px; border-radius: 50%; flex: none;
                          display: flex; align-items: center; justify-content: center;
                          background: var(--graphite); color: var(--pure-white); overflow: hidden; }
        .honor-pill-ico img { width: 100%; height: 100%; object-fit: cover; }
        .honor-pill-text { display: flex; flex-direction: column; min-width: 0; }
        .honor-pill-name { font-size: 13.5px; font-weight: 500; color: var(--pure-white);
                           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
        .honor-pill-sub { font-size: 11.5px; color: var(--smoke); white-space: nowrap;
                          overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
        /* 赛事数据：表格/折线图 */
        .ev-view-bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
        .ev-metric-chips { display:flex; flex-wrap:wrap; gap:6px; }
        #ev-chart-wrap { position: relative; height: 320px; }
        .empty-block { text-align:center; color: var(--text-muted); padding: 26px 12px; }
        .empty-block .btn { margin-top: 12px; }
        body { padding-top: 80px; }
    
        /* ── light adjustments (data-theme) ── */
        [data-theme="light"] .comment-card { background-color: var(--pure-white); }
        [data-theme="light"] input:not([type="checkbox"]):not([type="radio"]),
        [data-theme="light"] textarea { background: rgba(0, 0, 0, 0.04); color: var(--on-fill); }
    </style>
</head>
<body data-page="player" data-crumb="events">
    <main class="page">
        <div class="container">
            <header class="page-header">
                <div class="ph-player">
                    <div id="player-avatar-container"></div>
                    <div class="ph-player-text">
                        <span class="eyebrow">Player</span>
                        <h1 id="player-id-header" class="page-title" style="margin:8px 0 0;"><span class="sk sk-title" aria-hidden="true"></span><span class="sr-only">正在加载选手信息</span></h1>
                        <p class="page-sub" id="player-game-id">…</p>
                    </div>
                </div>
            </header>

            <!-- 荣誉带：活动图标 + 荣誉名称，点开看详情。
                 原来这里是「数据中心 / 赛程 / 复制链接」三个跳转按钮 ——
                 那些入口在导航栏里已经有了，占着页首位置却没提供任何本人信息。 -->
            <section class="honor-strip" id="honor-strip" hidden>
                <div class="honor-strip-head">
                    <span class="eyebrow">Honors</span>
                    <span class="honor-strip-count" id="honors-count">0</span>
                </div>
                <div class="honor-strip-body" id="honors-wall"></div>
            </section>

            <!-- 排版顺序：① 左生涯详情 / 右雷达（同一行）② 赛事数据 ③ 角色数据 ④ 评论。
                 赛事与角色是宽表（列多、队名长），必须独占整行 ——
                 塞进半栏会把「队名」「KDA」挤成竖排。 -->
            <div class="pc-grid">
                <section class="table-card" id="career-detail-card">
                    <div style="padding:24px;">
                        <div class="flex-between" style="margin-bottom:14px;">
                            <h2 class="tc-title">生涯数据详情</h2>
                            <span class="eyebrow">Detail</span>
                        </div>
                        <div class="summary-list" id="summary-list-content"><p class="smoke">正在计算数据…</p></div>
                    </div>
                </section>
                <section class="table-card" id="career-stats-card">
                    <div style="padding:24px;">
                        <div class="flex-between" style="margin-bottom:6px;">
                            <h2 class="tc-title">生涯能力图（同组百分位）</h2>
                            <span class="eyebrow">Radar</span>
                        </div>
                        <p class="tc-sub" id="career-scope">全部赛季</p>
                        <div class="chart-wrap" id="radar-chart-container"><canvas id="player-radar-chart"></canvas></div>
                    </div>
                </section>
            </div>

            <div class="pc-stack">
                <section class="table-card" id="event-stats-section">
                    <div style="padding:24px;">
                        <div class="flex-between" style="margin-bottom:14px;">
                            <h2 class="tc-title">赛事数据</h2>
                            <span class="eyebrow">Events</span>
                        </div>
                        <div class="ev-view-bar">
                            <div class="seg" role="group" aria-label="赛事数据视图">
                                <button type="button" class="active" data-evview="table">表格</button>
                                <button type="button" data-evview="chart">折线图</button>
                            </div>
                            <div class="ev-metric-chips" id="ev-metric-chips" aria-label="选择指标"></div>
                        </div>
                        <div id="event-stats-content"><p class="smoke">正在加载…</p></div>
                        <div id="ev-chart-wrap" hidden><canvas id="ev-chart"></canvas></div>
                    </div>
                </section>
                <section class="table-card" id="character-stats-section">
                    <div style="padding:24px;">
                    <div class="flex-between" style="margin-bottom:14px;">
                        <h2 class="tc-title">各角色平均数据</h2>
                        <span class="eyebrow">Agents</span>
                    </div>
                    <div class="table-wrap">
                        <table id="character-stats-table" class="data-table">
                            <thead><tr><th>角色</th><th class="num">出场</th><th class="num">ACS</th><th class="num">每局击杀</th><th class="num">每局死亡</th><th class="num">每局助攻</th><th class="num">首杀</th><th class="num">首杀率</th><th class="num">每回合击杀</th><th class="num">每回合死亡</th><th class="num">每回合助攻</th></tr></thead>
                            <tbody id="character-stats-body"></tbody>
                        </table>
                    </div>
                    </div>
                </section>
                
                <section class="table-card" id="comments-section">
                    <div style="padding:24px;">
                    <div class="flex-between" style="margin-bottom:14px;">
                        <h2 class="tc-title">玩家评分与评论</h2>
                        <span id="player-average-score" class="player-avg-score"></span>
                    </div>
                    <div id="comments-list"><p style="color:var(--text-muted);">正在加载评论...</p></div>
                    <div id="comment-form-container">
                        <div class="section-label" style="margin-top:16px;">发表你的看法</div>
                        <form id="comment-form">
                            <div class="form-row">
                                <input type="text" id="nickname-input" placeholder="您的昵称" required>
                                <div class="star-rating-container" id="star-rating"></div>
                                <input type="hidden" id="rating-input" required>
                            </div>
                            <textarea id="comment-input" class="input" placeholder="输入你的评论…" rows="4" required></textarea>
                            <button type="submit" class="btn btn-primary">提交评论</button>
                        </form>
                    </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

<script>

    const supabaseClient = HWLayout.supa(); /* 连接配置收敛：js/layout.js 唯一出处 */

    
    let currentUserIP = null;

    async function getUserIP() {
        if (currentUserIP) return currentUserIP;
        try { const response = await fetch('https://api64.ipify.org?format=json'); const data = await response.json(); currentUserIP = data.ip; return currentUserIP; } 
        catch (error) { console.error("无法获取IP地址:", error); return null; }
    }
    
    async function fetchAllComments(uniquePlayerKey) {
        let commentQuery = supabaseClient.from('s6_comments').select('*').eq('player_key', uniquePlayerKey).order('created_at', { ascending: true });
        const { data, error } = await commentQuery;
        if (error) { console.error('获取评论失败:', error); return []; }
        /* 已隐藏评论不对访客展示（旧数据无 status 列时不过滤） */
        return (data || []).filter(c => !c.status || c.status === 'visible');
    }
    
    function displayComments(playerComments, uniquePlayerKey) {
        const commentsList = document.getElementById('comments-list');
        const avgScoreEl = document.getElementById('player-average-score');
        const topLevelComments = playerComments.filter(c => c.rating !== null && c.rating !== undefined);
        if (topLevelComments.length > 0) {
            const totalScore = topLevelComments.reduce((sum, comment) => sum + comment.rating, 0);
            const averageScore = (totalScore / topLevelComments.length).toFixed(2);
            avgScoreEl.textContent = `平均分: ${averageScore} / 10`;
        } else { avgScoreEl.textContent = '暂无评分'; }

        const commentsById = playerComments.reduce((acc, comment) => { acc[comment.id] = { ...comment, replies: [] }; return acc; }, {});
        const commentTree = [];
        playerComments.forEach(comment => {
            if (comment.parent_id && commentsById[comment.parent_id]) { commentsById[comment.parent_id].replies.push(commentsById[comment.id]); } 
            else if(comment.rating !== null && comment.rating !== undefined) { commentTree.push(commentsById[comment.id]); }
        });
        commentTree.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

        const renderComment = (comment) => {
            return `
                <div class="comment-card" id="comment-${comment.id}">
                    <div class="comment-header">
                        <span class="comment-author">${escapeHTML(comment.nickname)}</span>
                        ${comment.rating ? `<span class="comment-rating">评分: <span>${comment.rating}</span> / 10</span>` : ''}
                         <div style="margin-left:auto; display:flex; gap:5px;">
                             <button class="reply-comment-btn" data-comment-id="${comment.id}">回复</button>
                             <button class="reply-comment-btn report-comment-btn" data-comment-id="${comment.id}">举报</button>
                            ${comment.ip === currentUserIP ? `<button class="delete-comment-btn" data-comment-id="${comment.id}">删除</button>` : ''}
                        </div>
                    </div>
                    <p class="comment-body">${escapeHTML(comment.content)}</p>
                    <small style="opacity: 0.4; font-size: 12px;">${new Date(comment.created_at).toLocaleString()}</small>
                    <div class="reply-form-container" id="reply-form-for-${comment.id}"></div>
                    <div class="replies-container">
                        ${comment.replies.map(renderComment).join('')}

    async function handleCommentSubmit(event, uniquePlayerKey, replyData = null) {
        event.preventDefault();
        const isReply = !!replyData; const form = isReply ? event.target : document.getElementById('comment-form'); const submitButton = form.querySelector('button[type="submit"]');

        if (!isReply) { const ratingInput = document.getElementById('rating-input'); if (!ratingInput.value) { HWLayout.toast('请选择一个评分！', 'err'); return; } }
        submitButton.disabled = true; submitButton.textContent = '提交中...';

        const newComment = {
            player_key: uniquePlayerKey, nickname: isReply ? replyData.nickname : document.getElementById('nickname-input').value,
            rating: isReply ? null : parseInt(document.getElementById('rating-input').value),
            content: isReply ? replyData.content : document.getElementById('comment-input').value,
            ip: await getUserIP(), parent_id: isReply ? replyData.parent_id : null,
        };
        const { error } = await supabaseClient.from('s6_comments').insert([newComment]);

        if (!error) {
            HWLayout.toast('评论已提交');
            if (!isReply) { form.reset(); document.getElementById('rating-input').value = ''; setupStarRating(); }
            const updatedComments = await fetchAllComments(uniquePlayerKey);
            displayComments(updatedComments, uniquePlayerKey);
        } else { console.error('提交失败:', error); HWLayout.toast('提交失败，请稍后再试。', 'err'); }
        submitButton.disabled = false; submitButton.textContent = isReply ? '提交回复' : '提 交 评 论';
    }

    function escapeHTML(str) { return str ? str.replace(/[&<>"']/g, match => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[match]) : ''; }

    async function loadComments(uniquePlayerKey) { await getUserIP(); const comments = await fetchAllComments(uniquePlayerKey); displayComments(comments, uniquePlayerKey); }
    
    function setupStarRating() {
        const starContainer = document.getElementById('star-rating'); const ratingInput = document.getElementById('rating-input');
        starContainer.innerHTML = ''; const stars = [];
        for (let i = 1; i <= 10; i++) {
            const star = document.createElement('span'); star.className = 'star'; star.textContent = '★'; star.dataset.value = i;
            starContainer.appendChild(star); stars.push(star);
        }
        const updateStars = (hoverValue) => { stars.forEach(star => { star.style.color = parseInt(star.dataset.value) <= hoverValue ? 'var(--star-color)' : 'var(--star-color-inactive)'; }); };
        starContainer.addEventListener('mouseover', e => { if (e.target.classList.contains('star')) updateStars(parseInt(e.target.dataset.value)); });
        starContainer.addEventListener('mouseout', () => updateStars(parseInt(ratingInput.value) || 0));
        starContainer.addEventListener('click', e => { if (e.target.classList.contains('star')) { const value = parseInt(e.target.dataset.value); ratingInput.value = value; updateStars(value); } });
        updateStars(parseInt(ratingInput.value) || 0);
    }

    let radarChartInstance = null;
    function drawRadarChart(percentileData) {
        const host = document.getElementById('radar-chart-container');
        if (typeof Chart === 'undefined') {
            if (host) host.innerHTML = '<div class="radar-empty">图表组件未加载（网络受限）。指标数值见右侧汇总表。</div>';
            return;
        }
        const canvas = document.getElementById('player-radar-chart');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const isLightTheme = document.documentElement.dataset.theme === 'light';
        const gridColor = isLightTheme ? 'rgba(0, 0, 0, 0.1)' : 'rgba(255, 255, 255, 0.1)';
        const angleLinesColor = isLightTheme ? 'rgba(0, 0, 0, 0.1)' : 'rgba(255, 255, 255, 0.1)';
        const pointLabelsColor = isLightTheme ? '#666' : '#aaa';
        /* 折线颜色以前写死成白色 —— 浅色模式下白线画在白底上，整张图看不见。
           改成跟随主题：浅色用珊瑚红，深色用亮白。 */
        const lineColor = isLightTheme ? '#e04545' : 'rgba(255,255,255,1)';
        const fillColor = isLightTheme ? 'rgba(224,69,69,0.16)' : 'rgba(255,255,255,0.12)';

        if (radarChartInstance) radarChartInstance.destroy();
        radarChartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['ACS', '每回合击杀', '每回合助攻', '每回合存活率', 'KDA'],
                datasets: [{
                    label: '选手能力 (百分位)', data: percentileData, backgroundColor: fillColor,
                    borderColor: lineColor,
                    borderWidth: 2, pointBackgroundColor: lineColor, pointBorderColor: lineColor,
                    pointHoverBackgroundColor: lineColor, pointHoverBorderColor: lineColor
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: true,
                scales: { r: { min: 0, max: 100, backgroundColor: 'transparent', grid: { color: gridColor }, angleLines: { color: angleLinesColor }, pointLabels: { color: pointLabelsColor, font: { family: 'Noto Sans SC', size: 12, weight: 700 } }, ticks: { display: false, stepSize: 25 } } },
                plugins: { legend: { display: false } }
            }
        });
    }

    /* 已报名未上场：从报名档案/账号解析出选手壳，让页面正常打开（数据全空） */
    async function resolveRegistrant_(playerName, idParam) {
        try {
            let prof = null;
            if (playerName) {
                const r = await supabaseClient.from('reg_profiles').select('user_id, real_name, game_id')
                    .eq('real_name', playerName).maybeSingle();
                if (r && !r.error) prof = r.data;
            }
            if (!prof && idParam) {
                const r2 = await supabaseClient.from('reg_profiles').select('user_id, real_name, game_id')
                    .eq('game_id', idParam).maybeSingle();
                if (r2 && !r2.error) prof = r2.data;
            }
            if (!prof) return null;
            return { name: prof.real_name || playerName || '', id: prof.game_id || idParam || '', __registrant: true };
        } catch (e) { return null; }
    }

    /* 没有比赛记录 / 花名册里查不到，都不是错误。
       从数据中心点进来的人当然还没打过比赛 —— 这时应当正常展示一个
       空档案（姓名、头像、各模块报"暂无数据"），而不是弹"未找到该选手"。 */
    /* 空档案里的"诊断行"：把客观事实说清楚，而不是一句"还没有数据"。
       场次为 0 有两种完全不同的原因 ——
         (a) 这个赛季确实还没录任何赛果；
         (b) 录了赛果，但那些行的选手 ID 不是这个人。
       以前两种情况显示同一句话，导致没人能判断到底是没数据还是匹配不上。 */
    function emptyDiagHtml_(diag) {
        if (!diag) return '';
        var total = diag.total || 0, mentioned = diag.mentioned || 0, name = diag.name || '';
        if (!total) {
            return '当前库里还没有任何赛果记录（0 场）。<br>' +
                '先在「数据台」录入赛果，这里就会出现生涯数据。';
        }
        if (!mentioned) {
            return '库里共有 ' + total + ' 场赛果，但没有任何一场把选手列成 <b>' +
                escapeHTML(name || '这个人') + '</b>。<br>' +
                '通常是录入赛果时那一格没选到对应选手 —— 去「数据台」核对该场对阵的选手下拉。';
        }
        /* 第三层：比赛确实提到了他，但还是算不出数据 →
           选手数据列（ACS/击杀/死亡/助攻）缺失或不是四段 */
        return '库里共有 ' + total + ' 场赛果，其中 <b>' + mentioned + '</b> 场有 <b>' +
            escapeHTML(name || '这个人') + '</b>。<br>' +
            '但这些行的「选手数据」列（ACS/击杀/死亡/助攻）是空的或格式不对，' +
            '所以算不出生涯均值 —— 去「数据台」补上该选手的这四个数字。';
    }

    /* 统计"库里共几场 / 其中几场提到这个人" */
    function emptyDiagFor_(matches, playerId, name, playerNameSet) {
        var total = (matches || []).length;
        var mentioned = 0;
        (matches || []).forEach(function (m) {
            for (var k = 0; k < 2; k++) {
                var tk = k === 0 ? 'team_a' : 'team_b';
                for (var i = 1; i <= 5; i++) {
                    if (isMe_(m[tk + '_player' + i + '_id'], playerId)) { mentioned++; return; }
                }
            }
        });
        return { total: total, mentioned: mentioned, name: name || '' };
    }

                : '还没有参加过赛事。<br><a href="events.html" class="btn btn-ghost btn-sm" style="margin-top:10px;">去看活动</a>')) + '</div>';
        var rc = document.getElementById('radar-chart-container');
        if (rc) rc.innerHTML = '<div class="radar-empty">还没有比赛数据，暂无法生成雷达图。</div>';
        /* 荣誉墙不在这里关闭。
           荣誉与比赛是两件独立的事 —— 组织者可以先给一个还没上场的选手颁奖
           （新人奖、参赛纪念），也可能这个人的比赛记录还没录进来。
           以前这里 hidden = true，会把刚渲染好的荣誉带直接抹掉，
           于是"有荣誉但没比赛"的人看到的是一片空白。 */

    function renderLoadError_(msg) {
        document.getElementById('player-id-header').textContent = '加载失败';
        document.getElementById('summary-list-content').innerHTML =
            '<div class="empty-block">数据加载失败：' + escapeHTML(String(msg || '')) + '<br><button class="btn btn-ghost btn-sm" type="button" onclick="location.reload()">重试</button></div>';
    }

    async function main() {
        const params = new URLSearchParams(window.location.search);
        const idParam = params.get('id');
        const playerName = params.get('name');
        /* 组别不再来自 URL：不同赛季可能在不同组，由数据自己决定 */
        let groupName = '';

        /* 生涯页：不认 season 参数。跨赛季汇总才是"生涯"，
           旧链接里带的 season/group 只会让同一个人的数据被切碎。 */
        const CAREER_SEASONS = ['s6', 's5'];
        window.currentSeason = CAREER_SEASONS[0];   /* 评论写入仍沿用主赛季表 */

        /* 旧链接兼容：?name=…&group=…&season=s6 → 立即改写成干净的 ?id=<游戏ID>，
           这样分享出去的链接不会再带上会被切碎的参数。 */
        (function canonicalize() {
            var clean = new URLSearchParams();
            if (idParam) clean.set('id', idParam);
            else if (playerName) clean.set('name', playerName);
            var want = location.pathname + (clean.toString() ? '?' + clean.toString() : '');
            if (location.search && location.search !== '?' + clean.toString()) {
                try { history.replaceState(null, '', want); } catch (e) { /* 旧浏览器忽略 */ }
            }
        })();

        if (!playerName && !idParam) {
            renderEmptyProfile_('未知选手');
            return;
        }
        
        setupStarRating();

        /* 跨赛季取数：生涯 = 所有赛季的并集 */
        const calls = [];
        CAREER_SEASONS.forEach(function (sea) {
            calls.push(supabaseClient.from(sea + '_matches').select('*').order('match_date', { ascending: true }));
            calls.push(supabaseClient.from(sea + '_player_ids').select('*'));
            calls.push(supabaseClient.from(sea + '_match_schedule')
                .select('"group", team_a, team_b, match_date, result_status').eq('result_status', 'pending'));
        });
        let res;
        try { res = await Promise.all(calls); } catch (e) { renderLoadError_(e && e.message ? e.message : e); return; }

        let matchesRaw = [], idData = [], pendingRows = [], fatal = null;
        CAREER_SEASONS.forEach(function (sea, i) {
            const m = res[i * 3], p = res[i * 3 + 1], sch = res[i * 3 + 2];
            /* 单个赛季表缺失（s5 没建过）不该让整页挂掉 */
            if (m && m.error) fatal = fatal || m.error;
            if (m && m.data) matchesRaw = matchesRaw.concat(m.data.map(function (r) { return Object.assign({ __season: sea }, r); }));
            if (p && p.data) idData = idData.concat(p.data.map(function (r) { return Object.assign({ __season: sea }, r); }));
            if (sch && !sch.error && sch.data) pendingRows = pendingRows.concat(sch.data);
        });
        if (fatal && !idData.length && !matchesRaw.length) { renderLoadError_(fatal.message); return; }

        /* 待确认结果不计入统计：按赛程 result_status='pending' 的对阵过滤（列未就绪时跳过） */
        let matches = matchesRaw || [];
        try {
            if (pendingRows.length) {
                const pk = new Set(pendingRows.map(r => [r.group || '', r.team_a || '', r.team_b || '', String(r.match_date || '').slice(0, 10)].join('|')));
                matches = matches.filter(m => !pk.has([m.group || '', m.team_a || '', m.team_b || '', String(m.match_date || '').slice(0, 10)].join('|')));
            }
        } catch (e) { /* migration_v3 未执行：不过滤 */ }

        /* 同名选手在两个赛季表里 ID 不同（s6 是 101、s5 是 201，各自 identity 序列）。
           赛果行里存的是"当季"花名册主键，所以查找身份时必须按赛季对齐，
           否则 s5 的行会把 s6 的同名行覆盖掉 → playerId 变成 201，
           而 s6 赛果行里写的是 101 → 一场都匹配不上（线上"有 8 场却显示空档案"）。
           CAREER_SEASONS 首个赛季优先：只在空缺时写入。 */
        const nameMap = (idData || []).reduce((map, row) => {
            if (!map[row.name]) map[row.name] = row;
            return map;
        }, {});
        const allPlayerData = processAllPlayerData(matches);
        /* 身份三层解析：花名册（id 优先，其次真名）→ 比赛记录 → 报名档案 */
        let currentPlayerInfo = null;
        /* 同一姓名在多个赛季表里可能有多个主键 —— 生涯是跨赛季的并集，
           所以身份不是"一个 ID"，而是"这个人的全部 ID"。 */
        const idsForName = {};
        (idData || []).forEach(r => {
            if (!r || !r.name || r.id == null) return;
            (idsForName[r.name] = idsForName[r.name] || []).push(String(r.id));
        });

        if (idParam) currentPlayerInfo = (idData || []).find(r => String(r.id) === String(idParam)) || null;
        if (!currentPlayerInfo && playerName) currentPlayerInfo = nameMap[playerName] || null;
        if (!currentPlayerInfo) currentPlayerInfo = await resolveRegistrant_(playerName, idParam);
        /* 花名册/报名档案里都没有 → 仍然按"这个人存在但还没打过比赛"展示 */
        if (!currentPlayerInfo) { renderEmptyProfile_(playerName || idParam); return; }
        if (!playerName) playerName = currentPlayerInfo.name || '';

        /* ID 语义归一：报名档案（reg_profiles.game_id，如 TESTER#001）和
           花名册主键（s6_player_ids.id，如 101）是两套编号，而赛果行里存的是后者。
           以前直接把 game_id 当 playerId 去比对，永远匹配不上 → 明明有比赛却显示空档案。
           这里用 player_stats 的 game_id 反查出 player_name，再回花名册取主键。 */
        if (currentPlayerInfo && currentPlayerInfo.__registrant) {
            try {
                const pr = await supabaseClient.from(window.currentSeason + '_player_stats')
                    .select('game_id, player_name').eq('game_id', String(currentPlayerInfo.id)).limit(1);
                const pn = pr && !pr.error && pr.data && pr.data[0] && pr.data[0].player_name;
                const rosterHit = pn ? (idData || []).find(r => r.name === pn) : null;
                if (rosterHit) {
                    currentPlayerInfo = rosterHit;
                    playerName = rosterHit.name || playerName;
                }
            } catch (e) { /* 查不到就沿用报名档案 */ }
        }

        const playerId = currentPlayerInfo.id || '暂无ID';
        /* 生涯匹配用"这个人的所有 ID"，不是单个 playerId */
        const aliasIds = (idsForName[currentPlayerInfo.name] || []).concat([String(playerId)]);
        const matchIdSet = new Set(aliasIds.filter(v => v && v !== '暂无ID' && v !== 'undefined'));
        window.__playerIdSet = matchIdSet;
        /* 生涯口径：一个人一个 key，不再按 URL 里的 group 切分 */
        /* 生涯数据：把这个人所有赛季 ID 的条目合并成一份
           （s6 里是 101、s5 里是 201，不合并就只看到其中一半的比赛） */
        let careerEntry = allPlayerData[careerKey(playerId)];
        if (matchIdSet.size > 1) {
            const parts = [...matchIdSet].map(id => allPlayerData[careerKey(id)]).filter(Boolean);
            if (parts.length > 1) {
                careerEntry = mergeCareerEntries_(parts);
            } else if (parts.length === 1) {
                careerEntry = parts[0];
            }
        }
        const careerGroups = careerEntry ? Object.keys(careerEntry.groups || {}) : [];
        if (!careerGroups.length && currentPlayerInfo.group) careerGroups.push(currentPlayerInfo.group);
        groupName = careerGroups.join('|');   /* 可能多组；空串=还没有数据 */
        const uniquePlayerKeyForComments = careerKey(playerId);
        loadComments(uniquePlayerKeyForComments);
        document.getElementById('comment-form').addEventListener('submit', (event) => handleCommentSubmit(event, uniquePlayerKeyForComments));

        const realName = currentPlayerInfo?.name || '';
        const imageUrl = currentPlayerInfo?.image;
        /* 页首：圆形头像 + 游戏ID + 真名（组别徽章已去掉） */
        const avHost = document.getElementById('player-avatar-container');
        if (imageUrl) {
            avHost.innerHTML = '<img class="player-avatar" src="' + escapeHTML(imageUrl) + '" alt="">';
        } else {
            avHost.innerHTML = '<div class="player-avatar-fallback">' + escapeHTML((realName || playerId || '?').charAt(0)) + '</div>';
        }
        /* 页首副标题：队伍 + 组别。
           注意不要显示 playerId —— 那是 s6_player_ids.id（数据库主键，如 101），
           不是人看的游戏 ID；真正的游戏 ID（TESTER#001）在 s6_player_stats.game_id 里。 */
        const careerTeams = careerEntry ? Object.keys(careerEntry.teams || {}) : [];
        const subBits = [];
        const primeTeam = careerTeams.length ? topKey_(careerEntry.teams) : (currentPlayerInfo.team || '');
        if (primeTeam) subBits.push(primeTeam);
        if (careerGroups.length) subBits.push(careerGroups.join(' / '));
        document.getElementById('player-game-id').textContent = subBits.filter(Boolean).join(' · ');
        /* 真正的游戏 ID 单独取一次（失败不影响页面） */
        try {
            const g = await supabaseClient.from(window.currentSeason + '_player_stats')
                .select('game_id').eq('player_name', realName).limit(1);
            const gid = g && !g.error && g.data && g.data[0] && g.data[0].game_id;
            if (gid) document.getElementById('player-game-id').textContent = [gid].concat(subBits).filter(Boolean).join(' · ');
        } catch (e) { /* 没有就是没有 */ }
        document.getElementById('player-id-header').textContent = realName || playerId;

        /* 必须 await：以前这里不等待，renderHonors_ 里的查询还没回来，
           下面的 renderEmptyProfile_ 就已经把荣誉带 hidden=true 了 —— 竞态。 */
        await renderHonors_(currentPlayerInfo, playerId);

        const playerDataForStats = careerEntry;
        
        if (!playerDataForStats) {
            renderEmptyProfile_(realName || playerId,
                currentPlayerInfo.__registrant ? 'registered' : '',
                emptyDiagFor_(matches, playerId, realName));
        } else {
            const { groupPlayersForRank, statsByCharacter } = calculateGroupRanks(allPlayerData, groupName);
            const currentPlayerStats = groupPlayersForRank.find(p => p.id === playerId);
            if (currentPlayerStats) {
                const radarKeys = ['acs', 'k_round', 'a_round', 'survival_rate', 'kda'];
                const vals = radarKeys.map(key => calculatePercentile(currentPlayerStats[key], groupPlayersForRank.map(p => p[key])));
                /* 雷达图有三个指标（每回合击杀/助攻、存活率）必须以回合数为分母。
                   没有比分 → 回合数为 0 → 这些值恒为 0 → 画出来是一张各项都在
                   50 百分位的无用五边形。这种"看起来有图其实没信息"的情况
                   也要拦住，直接说明缺什么。 */
                const hasRounds = (playerDataForStats?.total_stats?.totalRounds || 0) > 0;
                const usable = vals.filter(v => Number.isFinite(v));
                if (!hasRounds || usable.length < radarKeys.length) {
                    const rc = document.getElementById('radar-chart-container');
                    if (rc) rc.innerHTML = '<div class="radar-empty">雷达图需要「每回合」数据，而这批比赛还没有录比分（score_a / score_b）。<br>' +
                        '在数据台补上比分后即会自动出现。</div>';
                } else {
                    window.playerRadarPercentiles = vals;
                    drawRadarChart(vals);
                }
            } else {
                /* 没有回合数据时这名选手不会进入排名池（calculateGroupRanks 会跳过
                   totalRounds=0 的选手），于是雷达图那块就一直是初始的空 canvas。
                   空 canvas 看起来和"页面坏了"一模一样 —— 必须给出原因。 */
                const rc = document.getElementById('radar-chart-container');
                if (rc) rc.innerHTML = '<div class="radar-empty">雷达图需要「每回合」数据，而这批比赛还没有录比分（score_a / score_b）。<br>' +
                    '在数据台补上比分后即会自动出现。</div>';
            }
            renderSummaryList(playerDataForStats, playerId, groupPlayersForRank);
            renderCharacterTable(playerDataForStats, playerId, statsByCharacter);
        }
        renderEventStats(matches, playerId);
    }

    /* ---------- 赛事数据：不同赛事下的平均数据 + 对战记录 ---------- */
    /* ---------- 赛事数据：每赛事平均（按时间从早到晚）+ 可选指标折线图 ---------- */
    var EV_METRICS = [
        { key: 'acs', label: 'ACS' }, { key: 'kd', label: 'K/D' }, { key: 'kda', label: 'KDA' },
        { key: 'k_map', label: '每局击杀' }, { key: 'a_map', label: '每局助攻' }, { key: 'winRate', label: '胜率%' }
    ];
    var evSeries = [];        /* 与表格同源同序的每赛事聚合 */
    var evChart = null;
    var evSelectedMetrics = ['acs'];

    function aggregateByEvent_(matches, playerId, evInfo) {
        const mine = matches.filter(m => {
            for (const tk of ['team_a', 'team_b']) {
                for (let i = 1; i <= 5; i++) {
                    if (isMe_(m[tk + '_player' + i + '_id'], playerId)) return true;
                }
            }
            return false;
        });
        const byEvent = {};
        mine.forEach(m => {
            const k = m.event_id != null ? String(m.event_id) : '';
            (byEvent[k] = byEvent[k] || []).push(m);
        });
        const series = Object.keys(byEvent).map(evKey => {
            const rows = byEvent[evKey];
            let kills = 0, deaths = 0, assists = 0, acsSum = 0, acsN = 0, wins = 0, losses = 0, rounds = 0;
            let firstBloods = 0, fbMaps = 0, mapsPlayed = 0;
            const teams = {};
            let firstDate = '';
            rows.forEach(m => {
                if (m.match_date && (!firstDate || String(m.match_date) < firstDate)) firstDate = String(m.match_date);
                const mySide = ['team_a', 'team_b'].find(tk => {
                    for (let i = 1; i <= 5; i++) if (isMe_(m[tk + '_player' + i + '_id'], playerId)) return true;
                    return false;
                });
                if (mySide && m[mySide]) teams[m[mySide]] = (teams[m[mySide]] || 0) + 1;
                /* 同一口径：回合数与胜负都走同一对函数（score_a/b 或 score 字符串） */
                const rds = roundsOfMatch(m);
                if (rds > 0) {
                    rounds += rds;
                    const w = winnerOfMatch(m);
                    if (mySide && w) {
                        if (w === (mySide === 'team_a' ? 'a' : 'b')) wins++; else losses++;
                    }
                }
                ['team_a', 'team_b'].forEach(tk => {
                    for (let i = 1; i <= 5; i++) {
                        if (!isMe_(m[tk + '_player' + i + '_id'], playerId)) continue;
                        const ds = m[tk + '_player' + i + '_data'];
                        const st = parsePlayerData_(ds);
                        if (!st) continue;
                        if (st.acs > 0) { acsSum += st.acs; acsN++; }
                        kills += st.k; deaths += st.d; assists += st.a;
                        firstBloods += st.fb;
                        /* 首杀率 = 拿过首杀的图数 / 出场图数（按图记总数） */
                        mapsPlayed++;
                        if (st.fb > 0) fbMaps++;
                    }
                });
            });
            const ev = evKey ? (evInfo[evKey] || {}) : {};
            const team = Object.keys(teams).sort((a, b) => teams[b] - teams[a])[0] || '';
            const decided = wins + losses;
            return {
                key: evKey,
                title: evKey ? (ev.title || ('活动 #' + evKey)) : '未关联赛事',
                time: ev.start_time || firstDate || '',
                firstDate: firstDate,
                team: team,
                matches: rows.length,
                wins: wins, losses: losses,
                winRate: decided ? wins / decided * 100 : 0,
                acs: acsN ? acsSum / acsN : 0,
                kd: deaths ? kills / deaths : kills,
                kda: deaths ? (kills + assists) / deaths : kills + assists,
                k_map: rows.length ? kills / rows.length : 0,
                d_map: rows.length ? deaths / rows.length : 0,
                a_map: rows.length ? assists / rows.length : 0,
                k_round: rounds ? kills / rounds : 0,
                d_round: rounds ? deaths / rounds : 0,
                a_round: rounds ? assists / rounds : 0,
                fb: firstBloods,
                fb_map: mapsPlayed ? firstBloods / mapsPlayed : 0,
                fb_rate: mapsPlayed ? fbMaps / mapsPlayed * 100 : 0,
                unlinked: !evKey
            };
        });
        /* 时间从早到晚；未关联赛事永远置尾 */
        series.sort((a, b) => {
            if (a.unlinked !== b.unlinked) return a.unlinked ? 1 : -1;
            return String(a.time || a.firstDate).localeCompare(String(b.time || b.firstDate));
        });
        return series;
    }

    async function renderEventStats(matches, playerId) {
        const host = document.getElementById('event-stats-content');
        if (!host) return;
        let evInfo = {};
        try {
            const { data: evs } = await supabaseClient.from('events').select('id, title, start_time, status');
            (evs || []).forEach(e => {
                /* 已取消/已删除赛事不计入统计口径 */
                if (e.status !== 'cancelled' && e.status !== 'deleted') evInfo[String(e.id)] = e;
            });
        } catch (e) { /* 缺表不影响 */ }
        /* 已取消赛事的比赛剔除（event_id 命中的才剔） */
        let evStatus = {};
        try {
            const { data: evs2 } = await supabaseClient.from('events').select('id, status');
            (evs2 || []).forEach(e => { evStatus[String(e.id)] = e.status; });
        } catch (e) { /* ignore */ }
        const scoped = matches.filter(m => {
            if (m.event_id == null) return true;
            const st = evStatus[String(m.event_id)];
            return st !== 'cancelled' && st !== 'deleted';
        });
        evSeries = aggregateByEvent_(scoped, playerId, evInfo);
        renderEvTable_();
        wireEvView_();
    }

    var playerTrendMap = {};   /* P13i：每名选手按时间序的单场 ACS */
    /**
     * 一场比赛的回合数。
     *
     * 数据里比分有两种存法：score_a / score_b（结果录入页写这两个），
     * 以及 score 字符串 "13:9"（seed 与老数据写这个）。
     *
     * 坑：Number(null) === 0，而 0 是有限数 —— 于是「没写 score_a」会被
     * 误判成「比分 0:0」，永远读不到 score 字符串，回合数恒为 0。
     * 必须显式判断"字段真的存在且 > 0"。
     */
    function roundsOfMatch(m) {
        if (!m) return 0;
        const has = (v) => v !== null && v !== undefined && v !== '' && Number.isFinite(Number(v));
        if (has(m.score_a) && has(m.score_b)) {
            const a = Number(m.score_a), b = Number(m.score_b);
            if (a > 0 || b > 0) return a + b;
        }
        const legacy = String(m.score || '').split(/[/:：]/).map(Number);
        if (legacy.length === 2 && !isNaN(legacy[0]) && !isNaN(legacy[1]) && (legacy[0] > 0 || legacy[1] > 0)) {
            return legacy[0] + legacy[1];
        }
        return 0;
    }

    /** 一场比赛的胜负（"a" / "b" / null）。口径与 roundsOfMatch 一致 */
    function winnerOfMatch(m) {
        if (!m) return null;
        const has = (v) => v !== null && v !== undefined && v !== '' && Number.isFinite(Number(v));
        let a = null, b = null;
        if (has(m.score_a) && has(m.score_b)) { a = Number(m.score_a); b = Number(m.score_b); }
        else {
            const p = String(m.score || '').split(/[/:：]/).map(Number);
            if (p.length === 2 && !isNaN(p[0]) && !isNaN(p[1])) { a = p[0]; b = p[1]; }
        }
        if (a === null || b === null || a === b) return null;
        return a > b ? 'a' : 'b';
    }

    /** 生涯聚合键：一个人一条，与赛季/组别无关 */
    function careerKey(id) { return String(id) + '::__career'; }

    /* 选手每图数据：'ACS/K/D/A' 或 'ACS/K/D/A/首杀'。
       首杀是后加的，老的 4 段数据必须照常能读 —— 缺段按 0 计。 */
    function parsePlayerData_(raw) {
        if (raw == null || raw === '') return null;
        const parts = String(raw).split('/').map(Number);
        if (parts.length < 4 || parts.slice(0, 4).some(isNaN)) return null;
        return {
            acs: parts[0], k: parts[1], d: parts[2], a: parts[3],
            fb: parts.length >= 5 && !isNaN(parts[4]) ? parts[4] : 0,
            hasFb: parts.length >= 5 && !isNaN(parts[4])
        };
    }

    /* 是否拿到首杀（按图记总数：这张图他拿过首杀） */
    function hasFirstBlood_(raw) {
        const st = parsePlayerData_(raw);
        return !!(st && st.fb > 0);
    }

    /* 把同一个人在多个赛季的聚合条目并成一份生涯数据 */
    function mergeCareerEntries_(parts) {
        const out = { id: parts[0].id, group: parts[0].group, team: parts[0].team,
            groups: {}, teams: {}, by_character: {},
            total_stats: { kills: 0, deaths: 0, assists: 0, acs: 0, matchCount: 0, acsMatchCount: 0, totalRounds: 0, firstBloods: 0, fbMaps: 0 } };
        parts.forEach(p => {
            ['groups', 'teams'].forEach(f => {
                Object.keys(p[f] || {}).forEach(k => { out[f][k] = (out[f][k] || 0) + p[f][k]; });
            });
            Object.keys(p.by_character || {}).forEach(ch => {
                const src = p.by_character[ch];
                const dst = out.by_character[ch] = out.by_character[ch] ||
                    { kills: 0, deaths: 0, assists: 0, acs: 0, matchCount: 0, acsMatchCount: 0, totalRounds: 0, firstBloods: 0, fbMaps: 0 };
                Object.keys(dst).forEach(k => { dst[k] += (src[k] || 0); });
            });
            const t = p.total_stats || {};
            Object.keys(out.total_stats).forEach(k => { out.total_stats[k] += (t[k] || 0); });
        });
        return out;
    }

    /* 这个人是否出现在本行的这一格。
       生涯 = 跨赛季并集，同一个人在 s6/s5 花名册里主键不同，
       所以不能只比一个 playerId，要比他的全部 ID（window.__playerIdSet）。 */
    function isMe_(id, playerId) {
        if (id == null || id === '') return false;
        var set = window.__playerIdSet;
        if (set && set.size) return set.has(String(id));
        return String(id) === String(playerId);
    }

    function topKey_(obj) {
        var best = '', n = -1;
        Object.keys(obj || {}).forEach(function (k) { if (obj[k] > n) { n = obj[k]; best = k; } });
        return best;
    }

    function processAllPlayerData(matches) {
        const playerData = {};
        playerTrendMap = {};
        matches.forEach(match => {
            /* 回合数 = 双方比分之和。字段是 score_a / score_b（结果录入写的就是这两个）；
               以前读 match['score']，那个字段根本不存在 → totalRounds 恒为 0
               → 每回合击杀/助攻/存活率全是 0 或 NaN → 雷达图画出来是空的。 */
            const totalRounds = roundsOfMatch(match);
            ['team_a', 'team_b'].forEach(teamKey => {
                const teamName = match[teamKey];
                for (let p = 1; p <= 5; p++) {
                    const playerId = match[`${teamKey}_player${p}_id`]; const playerDataStr = match[`${teamKey}_player${p}_data`]; const playerCh = match[`${teamKey}_player${p}_ch`];
                    if (!playerId || !playerDataStr) continue;
                    const stats = parsePlayerData_(playerDataStr); if (!stats) continue;
                    /* 生涯口径：同一个人跨赛季、跨组别合并成一行。
                       （以前 key 里带 group，同一个人换组就被拆成两份数据） */
                    const uniquePlayerKey = careerKey(playerId);
                    if (!playerData[uniquePlayerKey]) {
                        playerData[uniquePlayerKey] = { id: playerId, group: match.group, team: teamName,
                            groups: {}, teams: {},
                            total_stats: { kills: 0, deaths: 0, assists: 0, acs: 0, matchCount: 0, acsMatchCount: 0, totalRounds: 0, firstBloods: 0, fbMaps: 0 }, by_character: {} };
                    }
                    var __pe = playerData[uniquePlayerKey];
                    if (match.group) __pe.groups[match.group] = (__pe.groups[match.group] || 0) + 1;
                    if (teamName) __pe.teams[teamName] = (__pe.teams[teamName] || 0) + 1;
                    const playerEntry = playerData[uniquePlayerKey]; playerEntry.team = teamName; const p_stats = playerEntry.total_stats;
                    if (stats.acs > 0) { p_stats.acs += stats.acs; p_stats.acsMatchCount++; }
                    p_stats.kills += stats.k; p_stats.deaths += stats.d; p_stats.assists += stats.a;
                    p_stats.matchCount++; p_stats.totalRounds += totalRounds;
                    p_stats.firstBloods += stats.fb;
                    p_stats.fbMaps += (stats.fb > 0 ? 1 : 0);
                    if (stats.acs > 0) { (playerTrendMap[playerId] = playerTrendMap[playerId] || []).push(stats.acs); }

                    if (playerCh) {
                        const charName = String(playerCh).trim();
                        if (!playerEntry.by_character[charName]) { playerEntry.by_character[charName] = { kills: 0, deaths: 0, assists: 0, acs: 0, matchCount: 0, acsMatchCount: 0, totalRounds: 0, firstBloods: 0, fbMaps: 0 }; }
                        const charStats = playerEntry.by_character[charName];
                        if (stats.acs > 0) { charStats.acs += stats.acs; charStats.acsMatchCount++; }
                        charStats.kills += stats.k; charStats.deaths += stats.d; charStats.assists += stats.a;
                        charStats.matchCount++; charStats.totalRounds += totalRounds;
                        charStats.firstBloods += stats.fb;
                        charStats.fbMaps += (stats.fb > 0 ? 1 : 0);
                    }
                }
            });
        });
        return playerData;
    }

    function calculateGroupRanks(allPlayerData, groupName) {
        const groupPlayersForRank = []; const statsByCharacter = {};
        /* 生涯口径下一个人可能属于多个组 → 池子取"这些组的并集"；
           groupName 为空（还没数据）时就取全体，避免百分比永远算不出来。 */
        const wanted = groupName ? String(groupName).split('|') : null;
        for (const key in allPlayerData) {
            const p = allPlayerData[key];
            const pg = Object.keys(p.groups || {}).length ? Object.keys(p.groups) : [p.group];
            if (!wanted || pg.some(g => wanted.indexOf(g) !== -1)) {
                const stats = p.total_stats; if (stats.matchCount === 0 || stats.totalRounds === 0) continue;
                groupPlayersForRank.push({ 
                    id: p.id, acs: stats.acsMatchCount > 0 ? stats.acs / stats.acsMatchCount : 0, 
                    k_map: stats.kills / stats.matchCount, d_map: stats.deaths / stats.matchCount, a_map: stats.assists / stats.matchCount, 
                    k_round: stats.kills / stats.totalRounds, d_round: stats.deaths / stats.totalRounds, a_round: stats.assists / stats.totalRounds, 
                    survival_rate: 1 - (stats.deaths / stats.totalRounds), kda: stats.deaths > 0 ? (stats.kills + stats.assists) / stats.deaths : (stats.kills + stats.assists), 
                    fb_map: (stats.firstBloods || 0) / stats.matchCount,
                    fb_rate: (stats.fbMaps || 0) / stats.matchCount * 100,
                });
                for (const charName in p.by_character) {
                    const charStats = p.by_character[charName]; if (charStats.matchCount === 0) continue;
                    if (!statsByCharacter[charName]) statsByCharacter[charName] = [];
                    statsByCharacter[charName].push({ 
                        id: p.id, acs: charStats.acsMatchCount > 0 ? charStats.acs / charStats.acsMatchCount : 0, 
                        k_map: charStats.kills / charStats.matchCount, d_map: charStats.deaths / charStats.matchCount, a_map: charStats.assists / charStats.matchCount, 
                        k_round: charStats.totalRounds > 0 ? charStats.kills / charStats.totalRounds : 0, d_round: charStats.totalRounds > 0 ? charStats.deaths / charStats.totalRounds : 0, a_round: charStats.totalRounds > 0 ? charStats.assists / charStats.totalRounds : 0, 
                        fb_map: (charStats.firstBloods || 0) / charStats.matchCount,
                        fb_rate: (charStats.fbMaps || 0) / charStats.matchCount * 100,
                    });
                }
            }
        }
        return { groupPlayersForRank, statsByCharacter };
    }
    
    function calculatePercentile(playerValue, allValues) {
        if (allValues.length <= 1) return 50; const sortedValues = [...allValues].sort((a, b) => a - b);
        const rank = sortedValues.findIndex(v => v === playerValue); if (rank === -1) return 50; return (rank / (sortedValues.length - 1)) * 100;
    }
    
    function getRank(id, key, rankList, invert = false) {
        if (!rankList || rankList.length === 0) return '';
        const sortedList = [...rankList].sort((a, b) => invert ? a[key] - b[key] : b[key] - a[key]);
        const rank = sortedList.findIndex(p => p.id === id) + 1; return rank > 0 ? `(TOP ${rank})` : '';
    }
    
    function sparklineSvg(vals, w, h) {
        if (!vals || vals.length < 2) return '';
        var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
        if (max === min) max = min + 1;
        var pts = vals.map(function (v, i) {
            var x = (i / (vals.length - 1)) * (w - 4) + 2;
            var y = h - 2 - ((v - min) / (max - min)) * (h - 4);
            return x.toFixed(1) + ',' + y.toFixed(1);
        });
        return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" style="vertical-align:middle;"><polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--coral-pulse)" stroke-width="2"/></svg>';
    }

    function renderSummaryList(playerData, playerId, groupPlayersForRank) {
        const playerAverages = { 
            acs: playerData.total_stats.acsMatchCount > 0 ? playerData.total_stats.acs / playerData.total_stats.acsMatchCount : 0, 
            k_map: playerData.total_stats.matchCount > 0 ? playerData.total_stats.kills / playerData.total_stats.matchCount : 0, d_map: playerData.total_stats.matchCount > 0 ? playerData.total_stats.deaths / playerData.total_stats.matchCount : 0, a_map: playerData.total_stats.matchCount > 0 ? playerData.total_stats.assists / playerData.total_stats.matchCount : 0, 
            k_round: playerData.total_stats.totalRounds > 0 ? playerData.total_stats.kills / playerData.total_stats.totalRounds : 0, d_round: playerData.total_stats.totalRounds > 0 ? playerData.total_stats.deaths / playerData.total_stats.totalRounds : 0, a_round: playerData.total_stats.totalRounds > 0 ? playerData.total_stats.assists / playerData.total_stats.totalRounds : 0, 
            fb_map: playerData.total_stats.matchCount > 0 ? (playerData.total_stats.firstBloods || 0) / playerData.total_stats.matchCount : 0,
            fb_rate: playerData.total_stats.matchCount > 0 ? (playerData.total_stats.fbMaps || 0) / playerData.total_stats.matchCount * 100 : 0,
        };
        const row = (label, val, rank) =>
            '<div><span>' + label + '</span><span>' + val + ' <span class="rank-top">' + rank + '</span></span></div>';
        document.getElementById('summary-list-content').innerHTML =
            row('平均 ACS', playerAverages.acs.toFixed(2), getRank(playerId, 'acs', groupPlayersForRank)) +
            row('每局击杀', playerAverages.k_map.toFixed(2), getRank(playerId, 'k_map', groupPlayersForRank)) +
            row('每局死亡', playerAverages.d_map.toFixed(2), getRank(playerId, 'd_map', groupPlayersForRank, true)) +
            row('每局助攻', playerAverages.a_map.toFixed(2), getRank(playerId, 'a_map', groupPlayersForRank)) +
            row('每回合击杀', playerAverages.k_round.toFixed(2), getRank(playerId, 'k_round', groupPlayersForRank)) +
            row('每回合死亡', playerAverages.d_round.toFixed(2), getRank(playerId, 'd_round', groupPlayersForRank, true)) +
            row('每回合助攻', playerAverages.a_round.toFixed(2), getRank(playerId, 'a_round', groupPlayersForRank)) +
            row('每局首杀', playerAverages.fb_map.toFixed(2), getRank(playerId, 'fb_map', groupPlayersForRank)) +
            row('首杀率', playerAverages.fb_rate.toFixed(1) + '%', getRank(playerId, 'fb_rate', groupPlayersForRank));
        /* 顶部说明这批数据覆盖的范围，避免"平均"口径不清 */
        const scope = document.getElementById('career-scope');
        if (scope) {
            const mc = playerData.total_stats.matchCount || 0;
            const rd = playerData.total_stats.totalRounds || 0;
            scope.textContent = mc + ' 场' + (rd ? ' · ' + rd + ' 回合' : '');
        }
    }
    
    function renderCharacterTable(playerData, playerId, statsByCharacter) {
        const tableBody = document.getElementById('character-stats-body'); tableBody.innerHTML = '';
        Object.entries(playerData.by_character).sort(([,a],[,b]) => b.matchCount - a.matchCount).forEach(([charName, stats]) => {
            const avg = { 
                acs: stats.acsMatchCount > 0 ? stats.acs / stats.acsMatchCount : 0, 
                k_map: stats.matchCount > 0 ? stats.kills / stats.matchCount : 0, d_map: stats.matchCount > 0 ? stats.deaths / stats.matchCount : 0, a_map: stats.matchCount > 0 ? stats.assists / stats.matchCount : 0, 
                k_round: stats.totalRounds > 0 ? stats.kills / stats.totalRounds : 0, d_round: stats.totalRounds > 0 ? stats.deaths / stats.totalRounds : 0, a_round: stats.totalRounds > 0 ? stats.assists / stats.totalRounds : 0, 
                fb_map: stats.matchCount > 0 ? (stats.firstBloods || 0) / stats.matchCount : 0,
                fb_rate: stats.matchCount > 0 ? (stats.fbMaps || 0) / stats.matchCount * 100 : 0,
            };
            const characterRankList = statsByCharacter[charName] || [];
            tableBody.innerHTML += `
                <tr><td><strong style="color:var(--text-color);">${charName}</strong></td><td>${stats.matchCount}</td>
                <td style="color:var(--primary-color); font-weight:700;">${avg.acs.toFixed(2)} <span class="rank-top">${getRank(playerId, 'acs', characterRankList)}</span></td>
                <td>${avg.k_map.toFixed(2)} <span class="rank-top">${getRank(playerId, 'k_map', characterRankList)}</span></td><td>${avg.d_map.toFixed(2)} <span class="rank-top">${getRank(playerId, 'd_map', characterRankList, true)}</span></td><td>${avg.a_map.toFixed(2)} <span class="rank-top">${getRank(playerId, 'a_map', characterRankList)}</span></td>
                <td>${avg.fb_map.toFixed(2)} <span class="rank-top">${getRank(playerId, 'fb_map', characterRankList)}</span></td>
                <td>${avg.fb_rate.toFixed(1)}% <span class="rank-top">${getRank(playerId, 'fb_rate', characterRankList)}</span></td>
                <td>${avg.k_round.toFixed(2)} <span class="rank-top">${getRank(playerId, 'k_round', characterRankList)}</span></td><td>${avg.d_round.toFixed(2)} <span class="rank-top">${getRank(playerId, 'd_round', characterRankList, true)}</span></td><td>${avg.a_round.toFixed(2)} <span class="rank-top">${getRank(playerId, 'a_round', characterRankList)}</span></td></tr>`;
        });
    }

    document.addEventListener('DOMContentLoaded', main);
</script>
</body>
