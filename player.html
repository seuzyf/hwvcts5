<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HWVCTS4 - 选手主页</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #ff4655;
            --bg-color: #0a0a0f;
            --bg-gradient-mid: #1a0a0a;
            --text-color: #fff;
            --card-bg-color: rgba(21, 21, 32, 0.85);
            --header-bg-color: transparent;
            --border-color: rgba(255, 70, 85, 0.2);
            --border-highlight: rgba(255, 70, 85, 0.5);
            --shadow-color: rgba(0,0,0,0.5);
            --winner-color: #81c784;
            --control-height: 42px;
            --star-color: #ff4655;
            --star-color-inactive: rgba(255,255,255,0.2);
            --text-muted: rgba(255, 255, 255, 0.5);

            --gold-color: #FFD700; --gold-glow: rgba(255, 215, 0, 0.7); --gold-light: #fff3cd; --gold-main: #ffd700; --gold-medium: #ffc107; --gold-dark: #b8860b;
            --cool-light: #ff8a80; --cool-main: #ff4655; --cool-medium: #d32f2f; --cool-dark: #b71c1c;
        }
        body.light-theme {
            --primary-color: #e53935;
            --bg-color: #f4f5f7;
            --bg-gradient-mid: #e9ecef;
            --text-color: #1c1e21;
            --card-bg-color: rgba(255, 255, 255, 0.9);
            --border-color: rgba(229, 57, 53, 0.3);
            --border-highlight: rgba(229, 57, 53, 0.6);
            --shadow-color: rgba(229, 57, 53, 0.15);
            --star-color-inactive: rgba(0,0,0,0.2);
            --winner-color: #4CAF50;
            --text-muted: rgba(0, 0, 0, 0.5);
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, var(--bg-color) 0%, var(--bg-gradient-mid) 50%, var(--bg-color) 100%);
            color: var(--text-color); margin: 0; padding: 20px 0; min-height: 100vh; position: relative;
        }

        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .particle { position: absolute; width: 2px; height: 2px; background: rgba(255, 70, 85, 0.6); border-radius: 50%; animation: float linear infinite; }
        body.light-theme .particle { background: rgba(229, 57, 53, 0.4); }
        @keyframes float { 0% { transform: translateY(100vh) translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-10vh) translateX(100px); opacity: 0; } }

        .container { width: 90%; max-width: 1400px; margin: 0 auto; position: relative; z-index: 10;}
        
        .main-header-block { padding: 25px; text-align: center; margin-bottom: 40px; position: relative; }
        
        /* 统一的顶部控制栏：设置按钮 + 昼夜切换 */
        .top-right-controls { position: absolute; top: 25px; right: 25px; display: flex; align-items: center; gap: 20px; z-index: 20; }
        #settings-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); transition: all 0.3s; padding: 5px; display: flex; align-items: center; justify-content: center; }
        #settings-btn:hover { color: var(--primary-color); transform: scale(1.1) rotate(30deg); }
        #settings-btn svg { width: 22px; height: 22px; }

        .theme-switch-wrapper { display: flex; align-items: center; gap: 10px; }
        #theme-text { font-size: 12px; color: var(--text-muted); letter-spacing: 1px; }
        .theme-switch { display: inline-block; height: 20px; position: relative; width: 40px; }
        .theme-switch input { display:none; }
        .slider-theme { background-color: rgba(255,255,255,0.1); border: 1px solid var(--border-color); bottom: 0; cursor: pointer; left: 0; position: absolute; right: 0; top: 0; transition: .4s; border-radius: 20px; }
        body.light-theme .slider-theme { background-color: rgba(0,0,0,0.1); }
        .slider-theme:before { background-color: var(--text-color); bottom: 2px; content: ""; height: 14px; left: 3px; position: absolute; transition: .4s; width: 14px; border-radius: 50%; }
        input:checked + .slider-theme { background-color: var(--primary-color); border-color: var(--primary-color); }
        input:checked + .slider-theme:before { transform: translateX(18px); background-color: #fff; }

        /* 统一的组别标签风格，并增加未分组样式 */
        .title-badge { display: inline-block; padding: 6px 20px; background: rgba(255, 70, 85, 0.15); border: 1px solid var(--border-highlight); border-radius: 20px; font-size: 14px; color: var(--primary-color); letter-spacing: 3px; margin-bottom: 20px; text-transform: uppercase; }
        body.light-theme .title-badge { background: rgba(229, 57, 53, 0.1); }
        .title-badge.unassigned { background: rgba(100, 100, 100, 0.2); color: #aaa; border-color: rgba(255,255,255,0.2); }
        body.light-theme .title-badge.unassigned { background: rgba(0,0,0,0.05); color: #666; border-color: rgba(0,0,0,0.1); }

        #player-avatar-container { margin-bottom: 15px; }
        .player-avatar { width: 100px; height: 100px; border-radius: 6px; border: 2px solid var(--primary-color); object-fit: cover; object-position: center center; box-shadow: 0 0 15px rgba(255, 70, 85, 0.4); }
        
        .main-header-block h1 { margin: 0; font-weight: 900; font-size: 50px; display: flex; align-items: baseline; justify-content: center; gap: 15px; flex-wrap: wrap; letter-spacing: 2px; }
        .player-id { color: var(--text-color); }
        .player-real-name { color: var(--primary-color); font-size: 18px; font-weight: 700; letter-spacing: 1px; }
        
        #player-honors { margin-top: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 20px; }
        .honor-item { display: inline-flex; align-items: center; gap: 10px; padding: 5px 12px; position: relative; }
        .honor-item .crown-icon { font-size: 1.3em; background: linear-gradient(135deg, var(--gold-light), var(--gold-main), var(--gold-dark)); -webkit-background-clip: text; color: transparent; filter: drop-shadow(0 0 6px var(--gold-glow)); animation: crown-shimmer 3s infinite ease-in-out, subtle-bob 4s infinite ease-in-out 0.2s; }
        .honor-text { font-family: 'Noto Sans SC', sans-serif; font-weight: 900; font-size: 24px; letter-spacing: 2px; color: transparent; background-size: 300% 100%; -webkit-background-clip: text; animation: subtle-bob 4s ease-in-out infinite, gradient-flow 8s ease-in-out infinite; }
        .honor-text.champion { background-image: linear-gradient(135deg, var(--gold-light) 10%, var(--gold-main) 30%, var(--gold-medium) 45%, #d4af37 60%, var(--gold-dark) 75%, var(--gold-main) 90%); filter: drop-shadow(0 2px 4px rgba(184, 134, 11, 0.2)); }
        .honor-text.cool-gradient { background-image: linear-gradient(135deg, var(--cool-light) 0%, var(--cool-medium) 40%, var(--cool-main) 70%, var(--cool-dark) 100%); filter: drop-shadow(0 2px 4px rgba(255, 70, 85, 0.2)); }

        @keyframes crown-shimmer { 0%, 100% { background-position: 0% 50%; filter: drop-shadow(0 0 5px var(--gold-glow)); } 50% { background-position: 100% 50%; filter: drop-shadow(0 0 8px var(--gold-glow)); } }
        @keyframes gradient-flow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes subtle-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

        .controls-container { display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; margin-top: 30px; }
        .nav-button { height: var(--control-height); display: inline-flex; align-items: center; border-radius: 6px; font-weight: 600; padding: 0 25px; border: 1px solid var(--border-color); color: var(--primary-color); text-decoration: none; transition: all 0.3s; background: rgba(255, 70, 85, 0.08); backdrop-filter: blur(5px); letter-spacing: 1px; }
        body.light-theme .nav-button { background: rgba(229, 57, 53, 0.05); }
        .nav-button:hover { background-color: rgba(255, 70, 85, 0.2); color: var(--text-color); border-color: var(--primary-color); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 70, 85, 0.2); }
        body.light-theme .nav-button:hover { color: var(--primary-color); }

        .main-layout { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; }
        #career-stats-card { flex: 1; min-width: 320px; position: sticky; top: 20px; }
        #right-column { flex: 2.5; min-width: 600px; }

        .data-section { background-color: var(--card-bg-color); backdrop-filter: blur(10px); border: 1px solid var(--border-color); border-radius: 8px; padding: 30px; box-shadow: 0 10px 40px var(--shadow-color); margin-bottom: 30px; position: relative; }
        .data-section::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: linear-gradient(to bottom, var(--primary-color), transparent); border-radius: 8px 0 0 8px; }
        .data-section h2 { margin-top: 0; color: var(--primary-color); border-bottom: 1px solid var(--border-highlight); padding-bottom: 15px; font-weight: 900; letter-spacing: 2px; font-size: 20px; }
        
        .summary-list { display: flex; flex-direction: column; gap: 15px; font-size: 14px; }
        .summary-list div { background-color: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 4px; display: flex; justify-content: space-between; align-items: baseline; border: 1px solid rgba(255,255,255,0.05); }
        body.light-theme .summary-list div { background-color: rgba(255,255,255,0.5); border: 1px solid rgba(0,0,0,0.05); }
        .summary-list strong { color: var(--text-muted); font-weight: 500; }
        .summary-list span { font-weight: 700; color: var(--text-color); font-size: 16px; }
        .rank-top { font-size: 12px; color: var(--primary-color); font-weight: 900; margin-left: 5px; }
        #radar-chart-container { position: relative; margin: 20px auto; max-width: 300px; filter: drop-shadow(0 0 10px rgba(255,70,85,0.1)); }
        
        #character-stats-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; margin-top: 10px; }
        #character-stats-table thead th { background-color: transparent; color: var(--text-muted); padding: 12px 8px; border-bottom: 1px solid var(--border-highlight); font-weight: 700; }
        #character-stats-table th, #character-stats-table td { padding: 12px 8px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); white-space: nowrap; }
        body.light-theme #character-stats-table th, body.light-theme #character-stats-table td { border-bottom: 1px solid rgba(0,0,0,0.05); }
        #character-stats-table tbody tr:last-child td { border-bottom: none; }
        #character-stats-table tbody tr:hover { background-color: rgba(255, 70, 85, 0.05); }

        #comments-section h2 { display: flex; justify-content: space-between; align-items: center; }
        .player-avg-score { color: var(--primary-color); font-size: 14px; font-weight: 700; letter-spacing: 1px; }
        .comment-card { position: relative; background-color: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 6px; padding: 20px; margin-bottom: 15px; transition: border-color 0.3s; }
        body.light-theme .comment-card { background-color: rgba(255,255,255,0.5); }
        .comment-card:hover { border-color: var(--primary-color); }
        .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; flex-wrap: wrap; gap: 10px;}
        .comment-author { font-weight: 900; color: var(--text-color); margin-right: auto; letter-spacing: 1px;}
        .comment-rating { white-space: nowrap; color: var(--text-muted); }
        .comment-rating span { font-weight: 900; color: var(--primary-color); font-size: 15px; }
        .comment-body { font-size: 15px; line-height: 1.6; word-wrap: break-word; color: var(--text-color); opacity: 0.9; }
        .delete-comment-btn, .reply-comment-btn { background: rgba(255,70,85,0.1); color: var(--primary-color); border: 1px solid var(--primary-color); border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; flex-shrink: 0; }
        .delete-comment-btn:hover, .reply-comment-btn:hover { background: var(--primary-color); color: #fff; }
        .reply-comment-btn { border-color: var(--text-muted); color: var(--text-muted); }
        .replies-container { margin-left: 20px; margin-top: 15px; border-left: 2px solid var(--border-color); padding-left: 15px; }
        
        #comment-form { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        .form-row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        #nickname-input { flex: 1; min-width: 150px; height: var(--control-height); padding: 0 15px; border-radius: 4px; border: 1px solid var(--border-color); background-color: rgba(0,0,0,0.2); color: var(--text-color); font-family: 'Noto Sans SC'; outline: none; transition: border-color 0.3s; }
        body.light-theme #nickname-input { background: #fff; }
        #nickname-input:focus { border-color: var(--primary-color); }
        .star-rating-container { display: flex; align-items: center; gap: 4px; }
        .star { font-size: 24px; color: var(--star-color-inactive); cursor: pointer; transition: all 0.2s; line-height: 1; }
        .star:hover { transform: scale(1.2); }
        #comment-form textarea { width: 100%; padding: 15px; border-radius: 4px; border: 1px solid var(--border-color); background-color: rgba(0,0,0,0.2); color: var(--text-color); font-family: 'Noto Sans SC'; outline: none; transition: border-color 0.3s; resize: vertical; }
        body.light-theme #comment-form textarea { background: #fff; }
        #comment-form textarea:focus { border-color: var(--primary-color); }
        #comment-form button { height: var(--control-height); border: none; border-radius: 4px; background-color: var(--primary-color); color: white; font-weight: 700; letter-spacing: 2px; cursor: pointer; transition: all 0.3s; align-self: flex-start; padding: 0 30px; }
        #comment-form button:hover { background: #ff8a80; box-shadow: 0 0 15px rgba(255,70,85,0.4); }
        #comment-form button:disabled { background-color: #333; cursor: not-allowed; box-shadow: none; color: #888; }
        .reply-form-container { margin-top: 15px; }

        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 1000; display: flex; justify-content: center; align-items: center; visibility: hidden; opacity: 0; transition: opacity 0.3s, visibility 0.3s; padding: 15px; box-sizing: border-box; }
        .modal-backdrop.visible { visibility: visible; opacity: 1; }
        .modal-content { background-color: var(--card-bg-color); padding: 30px; border-radius: 6px; border: 1px solid var(--border-highlight); box-shadow: 0 10px 40px rgba(0,0,0,0.8); width: 100%; max-width: 450px; transform: scale(0.9); transition: transform 0.3s ease; position: relative; }
        body.light-theme .modal-content { box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .modal-backdrop.visible .modal-content { transform: scale(1); }
        .modal-header { font-size: 20px; font-weight: 900; color: var(--primary-color); margin-bottom: 25px; text-align: center; letter-spacing: 2px; }
        
        .settings-switch { display: flex; justify-content: center; margin-bottom: 25px; background-color: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 4px; padding: 4px; }
        body.light-theme .settings-switch { background-color: rgba(255,255,255,0.5); }
        .settings-switch label { flex: 1; text-align: center; padding: 10px; border-radius: 2px; cursor: pointer; transition: all 0.3s; font-size: 14px; font-weight: 500; color: var(--text-muted); }
        .settings-switch input { display: none; }
        .settings-switch input:checked + label { background-color: rgba(255,70,85,0.15); color: var(--primary-color); font-weight: 700; }

        .settings-form { display: none; flex-direction: column; gap: 15px; }
        .settings-form.active { display: flex; }
        .settings-form .form-group { display: flex; flex-direction: column; }
        .settings-form label { margin-bottom: 8px; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; letter-spacing: 1px; }
        .settings-form input { padding: 0 15px; height: var(--control-height); background-color: rgba(0,0,0,0.2); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 4px; font-family: 'Noto Sans SC'; outline: none; transition: border-color 0.3s; }
        body.light-theme .settings-form input { background: #fff; }
        .settings-form input:focus { border-color: var(--primary-color); }
        .settings-form button { height: var(--control-height); border: none; border-radius: 4px; background-color: var(--primary-color); color: white; font-weight: 700; letter-spacing: 2px; cursor: pointer; transition: all 0.3s; margin-top: 10px; }
        .settings-form button:hover { background: #ff8a80; box-shadow: 0 0 15px rgba(255,70,85,0.4); }

        .tooltip { position: relative; display: inline-flex; justify-content: center; align-items: center; cursor: help; border: 1px solid var(--text-muted); border-radius: 50%; width: 16px; height: 16px; font-size: 11px; }
        .tooltip .tooltiptext { visibility: hidden; width: 260px; background-color: #151520; color: #fff; text-align: left; border-radius: 4px; border: 1px solid var(--border-color); padding: 10px; position: absolute; z-index: 10; bottom: 150%; left: 50%; margin-left: -130px; opacity: 0; transition: opacity 0.3s; font-size: 12px; line-height: 1.5; font-weight: normal; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        body.light-theme .tooltip .tooltiptext { background-color: #fff; color: #333; }
        .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="container">
        <div class="main-header-block">
            <div class="top-right-controls">
                <button id="settings-btn" title="修改资料">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19.8298 12.1741C19.9363 11.6963 19.9363 11.1963 19.8298 10.7185L21.6569 9.28148C21.8617 9.1237 21.9213 8.84815 21.8024 8.62222L20.0445 5.37778C19.9256 5.15185 19.6582 5.06667 19.4445 5.17037L17.2223 6.0963C16.6371 5.65185 15.9927 5.2963 15.3038 5.03704L14.9334 2.62222C14.9067 2.41481 14.7334 2.25185 14.526 2.25185H10.4741C10.2667 2.25185 10.0934 2.41481 10.0667 2.62222L9.6963 5.03704C8.99824 5.30519 8.36223 5.65185 7.77788 6.0963L5.55565 5.17037C5.34195 5.06667 5.07454 5.15185 4.95565 5.37778L3.19778 8.62222C3.07889 8.84815 3.13843 9.1237 3.34324 9.28148L5.17048 10.7185C5.06399 11.1963 5.06399 11.6963 5.17048 12.1741L3.34324 13.6111C3.13843 13.7689 3.07889 14.0444 3.19778 14.2704L4.95565 17.5148C5.07454 17.7407 5.34195 17.8259 5.55565 17.7222L7.77788 16.7963C8.36223 17.2407 8.99824 17.587 9.6963 17.8552L10.0667 20.27C10.0934 20.4774 10.2667 20.6404 10.4741 20.6404H14.526C14.7334 20.6404 14.9067 20.4774 14.9334 20.27L15.3038 17.8552C15.9927 17.5959 16.6371 17.25 17.2223 16.7963L19.4445 17.7222C19.6582 17.8259 19.9256 17.7407 20.0445 17.5148L21.8024 14.2704C21.9213 14.0444 21.8617 13.7689 21.6569 13.6111L19.8298 12.1741ZM12.5 14.9404C10.8167 14.9404 9.44454 13.5681 9.44454 11.8848C9.44454 10.2015 10.8167 8.82926 12.5 8.82926C14.1834 8.82926 15.5556 10.2015 15.5556 11.8848C15.5556 13.5681 14.1834 14.9404 12.5 14.9404Z"></path></svg>
                </button>
                <div class="theme-switch-wrapper">
                    <span id="theme-text"></span>
                    <label class="theme-switch">
                        <input type="checkbox" id="theme-toggle-checkbox">
                        <span class="slider-theme"></span>
                    </label>
                </div>
            </div>
            
            <div id="player-avatar-container"></div>
            <div class="title-badge" id="group-badge-container">Loading...</div>
            <h1 id="player-id-header" style="color:var(--text-muted); font-size:30px;">Loading...</h1>
            <div id="player-honors"></div>
            
            <div class="controls-container">
                <a href="index.html" class="nav-button">返 回 比 赛 中 心</a>
                <a href="summary.html" class="nav-button">查 看 选 手 数 据</a>
            </div>
        </div>
        
        <main class="main-layout">
            <section class="data-section" id="career-stats-card">
                <h2>生 涯 平 均 数 据</h2>
                <div id="radar-chart-container"><canvas id="player-radar-chart"></canvas></div>
                <div class="summary-list" id="summary-list-content"><p style="color:var(--text-muted);">正在计算数据...</p></div>
            </section>
            <div id="right-column">
                <section class="data-section" id="character-stats-section">
                    <h2>各 角 色 平 均 数 据</h2>
                    <div style="overflow-x: auto;">
                        <table id="character-stats-table">
                            <thead><tr><th>角色</th><th>出场</th><th>ACS</th><th>每局击杀</th><th>每局死亡</th><th>每局助攻</th><th>每回合击杀</th><th>每回合死亡</th><th>每回合助攻</th></tr></thead>
                            <tbody id="character-stats-body"></tbody>
                        </table>
                    </div>
                </section>
                
                <section class="data-section" id="comments-section">
                    <h2>玩 家 评 分 与 评 论 <span id="player-average-score" class="player-avg-score"></span></h2>
                    <div id="comments-list"><p style="color:var(--text-muted);">正在加载评论...</p></div>
                    <div id="comment-form-container">
                        <h3 style="color:var(--primary-color); font-weight:900; letter-spacing:1px;">发表您的看法</h3>
                        <form id="comment-form">
                            <div class="form-row">
                                <input type="text" id="nickname-input" placeholder="您的昵称" required>
                                <div class="star-rating-container" id="star-rating"></div>
                                <input type="hidden" id="rating-input" required>
                            </div>
                            <textarea id="comment-input" placeholder="输入您的评论..." rows="4" required></textarea>
                            <button type="submit">提 交 评 论</button>
                        </form>
                    </div>
                </section>
            </div>
        </main>
    </div>

<script>
    function createParticles() {

            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';

            particle.style.height = particle.style.width;
            container.appendChild(particle);
        }
    }
    createParticles();

    const SUPABASE_URL = 'https://jvmwfjvedijeapnegmqd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_iDpaoEOqjOK2WDcloYp69Q_UWUCwq-r';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let currentUserIP = null;

    async function getUserIP() {
        if (currentUserIP) return currentUserIP;
        try { const response = await fetch('https://api64.ipify.org?format=json'); const data = await response.json(); currentUserIP = data.ip; return currentUserIP; } 
        catch (error) { console.error("无法获取IP地址:", error); return null; }
    }
    
    async function fetchAllComments(uniquePlayerKey) {
        const { data, error } = await supabaseClient.from('comments').select('*').eq('player_key', uniquePlayerKey).order('created_at', { ascending: true });
        if (error) { console.error('获取评论失败:', error); return []; }
        return data;
    }
    
    function displayComments(playerComments, uniquePlayerKey) {
        const commentsList = document.getElementById('comments-list');
        const avgScoreEl = document.getElementById('player-average-score');
        const topLevelComments = playerComments.filter(c => c.rating !== null && c.rating !== undefined);
        if (topLevelComments.length > 0) {
            const totalScore = topLevelComments.reduce((sum, comment) => sum + comment.rating, 0);
            const averageScore = (totalScore / topLevelComments.length).toFixed(2);
            avgScoreEl.textContent = `平均分: ${averageScore} / 10`;
        } else { avgScoreEl.textContent = '暂无评分'; }

        const commentsById = playerComments.reduce((acc, comment) => { acc[comment.id] = { ...comment, replies: [] }; return acc; }, {});
        const commentTree = [];
        playerComments.forEach(comment => {
            if (comment.parent_id && commentsById[comment.parent_id]) { commentsById[comment.parent_id].replies.push(commentsById[comment.id]); } 
            else if(comment.rating !== null && comment.rating !== undefined) { commentTree.push(commentsById[comment.id]); }
        });
        commentTree.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

        const renderComment = (comment) => {
            return `
                <div class="comment-card" id="comment-${comment.id}">
                    <div class="comment-header">
                        <span class="comment-author">${escapeHTML(comment.nickname)}</span>
                        ${comment.rating ? `<span class="comment-rating">评分: <span>${comment.rating}</span> / 10</span>` : ''}
                         <div style="margin-left:auto; display:flex; gap:5px;">
                             <button class="reply-comment-btn" data-comment-id="${comment.id}">回复</button>
                            ${comment.ip === currentUserIP ? `<button class="delete-comment-btn" data-comment-id="${comment.id}">删除</button>` : ''}
                        </div>
                    </div>
                    <p class="comment-body">${escapeHTML(comment.content)}</p>
                    <small style="opacity: 0.4; font-size:11px;">${new Date(comment.created_at).toLocaleString()}</small>
                    <div class="reply-form-container" id="reply-form-for-${comment.id}"></div>
                    <div class="replies-container">
                        ${comment.replies.map(renderComment).join('')}
                    </div>
                </div>`;
        };
        commentsList.innerHTML = commentTree.length === 0 ? '<p style="color:var(--text-muted);">暂无评论，快来抢沙发吧！</p>' : commentTree.map(renderComment).join('');

        document.querySelectorAll('.delete-comment-btn').forEach(button => { button.addEventListener('click', (event) => { if (confirm('您确定要删除这条评论吗？')) { handleDeleteComment(event.target.dataset.commentId, uniquePlayerKey); } }); });
        document.querySelectorAll('.reply-comment-btn').forEach(button => { button.addEventListener('click', (event) => { const commentId = event.target.dataset.commentId; showReplyForm(commentId, uniquePlayerKey); }); });
    }
    
    function showReplyForm(parentCommentId, uniquePlayerKey) {
        document.querySelectorAll('.reply-form-container').forEach(c => c.innerHTML = '');
        const container = document.getElementById(`reply-form-for-${parentCommentId}`);
        if (!container) return;
        container.innerHTML = `
            <form class="reply-form" style="margin-top:10px;">
                <input type="text" placeholder="您的昵称" required style="width: 100%; padding: 8px 12px; margin-bottom: 10px; border-radius: 4px; border: 1px solid var(--border-color); background-color: rgba(0,0,0,0.2); color: var(--text-color); font-family: 'Noto Sans SC'; outline:none; box-sizing: border-box;">
                <textarea placeholder="输入您的回复..." rows="3" required style="width: 100%; padding: 8px 12px; margin-bottom: 10px; border-radius: 4px; border: 1px solid var(--border-color); background-color: rgba(0,0,0,0.2); color: var(--text-color); font-family: 'Noto Sans SC'; outline:none; box-sizing: border-box; resize: vertical;"></textarea>
                <button type="submit" style="height: 32px; border: none; border-radius: 4px; background-color: var(--primary-color); color: white; font-weight: 700; cursor: pointer; padding: 0 15px;">提交回复</button>
            </form>
        `;
        container.querySelector('.reply-form').addEventListener('submit', async (e) => {
            e.preventDefault(); const form = e.target;
            const nickname = form.querySelector('input').value; const content = form.querySelector('textarea').value;
            await handleCommentSubmit(e, uniquePlayerKey, { nickname: nickname, content: content, parent_id: parentCommentId });
        });
    }

    async function handleCommentSubmit(event, uniquePlayerKey, replyData = null) {
        event.preventDefault();
        const isReply = !!replyData; const form = isReply ? event.target : document.getElementById('comment-form'); const submitButton = form.querySelector('button[type="submit"]');

        if (!isReply) { const ratingInput = document.getElementById('rating-input'); if (!ratingInput.value) { alert('请选择一个评分！'); return; } }
        submitButton.disabled = true; submitButton.textContent = '提交中...';

        const newComment = {
            player_key: uniquePlayerKey, nickname: isReply ? replyData.nickname : document.getElementById('nickname-input').value,
            rating: isReply ? null : parseInt(document.getElementById('rating-input').value),
            content: isReply ? replyData.content : document.getElementById('comment-input').value,
            ip: await getUserIP(), parent_id: isReply ? replyData.parent_id : null,
        };
        const { error } = await supabaseClient.from('comments').insert([newComment]);

        if (!error) {
            alert('提交成功！');
            if (!isReply) { form.reset(); document.getElementById('rating-input').value = ''; setupStarRating(); }
            const updatedComments = await fetchAllComments(uniquePlayerKey);
            displayComments(updatedComments, uniquePlayerKey);
        } else { console.error('提交失败:', error); alert('提交失败，请稍后再试。'); }
        submitButton.disabled = false; submitButton.textContent = isReply ? '提交回复' : '提 交 评 论';
    }

    async function handleDeleteComment(commentId, uniquePlayerKey) {
        const { error } = await supabaseClient.from('comments').delete().match({ id: commentId, ip: currentUserIP });
        if (!error) { alert('删除成功！'); const updatedComments = await fetchAllComments(uniquePlayerKey); displayComments(updatedComments, uniquePlayerKey); } 
        else { console.error('删除失败:', error); alert('删除失败，请稍后再试。'); }
    }

    function escapeHTML(str) { return str ? str.replace(/[&<>"']/g, match => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[match]) : ''; }

    async function loadComments(uniquePlayerKey) { await getUserIP(); const comments = await fetchAllComments(uniquePlayerKey); displayComments(comments, uniquePlayerKey); }
    
    function setupStarRating() {
        const starContainer = document.getElementById('star-rating'); const ratingInput = document.getElementById('rating-input');
        starContainer.innerHTML = ''; const stars = [];
        for (let i = 1; i <= 10; i++) {
            const star = document.createElement('span'); star.className = 'star'; star.textContent = '★'; star.dataset.value = i;
            starContainer.appendChild(star); stars.push(star);
        }
        const updateStars = (hoverValue) => { stars.forEach(star => { star.style.color = parseInt(star.dataset.value) <= hoverValue ? 'var(--star-color)' : 'var(--star-color-inactive)'; }); };
        starContainer.addEventListener('mouseover', e => { if (e.target.classList.contains('star')) updateStars(parseInt(e.target.dataset.value)); });
        starContainer.addEventListener('mouseout', () => updateStars(parseInt(ratingInput.value) || 0));
        starContainer.addEventListener('click', e => { if (e.target.classList.contains('star')) { const value = parseInt(e.target.dataset.value); ratingInput.value = value; updateStars(value); } });
        updateStars(parseInt(ratingInput.value) || 0);
    }

    let radarChartInstance = null;
    function drawRadarChart(percentileData) {
        const ctx = document.getElementById('player-radar-chart').getContext('2d');
        const isLightTheme = document.body.classList.contains('light-theme');
        const gridColor = isLightTheme ? 'rgba(0, 0, 0, 0.1)' : 'rgba(255, 255, 255, 0.1)';
        const angleLinesColor = isLightTheme ? 'rgba(0, 0, 0, 0.1)' : 'rgba(255, 255, 255, 0.1)';
        const pointLabelsColor = isLightTheme ? '#666' : '#aaa';

        if (radarChartInstance) radarChartInstance.destroy();
        radarChartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['ACS', '每回合击杀', '每回合助攻', '每回合存活率', 'KDA'],
                datasets: [{
                    label: '选手能力 (百分位)', data: percentileData, backgroundColor: 'rgba(255, 70, 85, 0.2)', borderColor: 'rgba(255, 70, 85, 1)',
                    borderWidth: 2, pointBackgroundColor: 'rgba(255, 70, 85, 1)', pointBorderColor: '#fff',
                    pointHoverBackgroundColor: '#fff', pointHoverBorderColor: 'rgba(255, 70, 85, 1)'
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: true,
                scales: { r: { min: 0, max: 100, backgroundColor: 'transparent', grid: { color: gridColor }, angleLines: { color: angleLinesColor }, pointLabels: { color: pointLabelsColor, font: { family: 'Noto Sans SC', size: 12, weight: 700 } }, ticks: { display: false, stepSize: 25 } } },
                plugins: { legend: { display: false } }
            }
        });
    }

    function setupSettingsModal(playerData) {
        const modal = document.getElementById('settings-modal'); const settingsBtn = document.getElementById('settings-btn');
        const profileForm = document.getElementById('profile-form'); const passwordForm = document.getElementById('password-form');
        
        settingsBtn.addEventListener('click', () => {

            document.getElementById('honor-input').value = playerData.honor || ''; modal.classList.add('visible');
        });
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('visible'); });
        
        document.querySelectorAll('input[name="settings-tab"]').forEach(radio => {
            radio.addEventListener('change', (e) => { profileForm.classList.toggle('active', e.target.id === 'profile-tab'); passwordForm.classList.toggle('active', e.target.id === 'password-tab'); });
        });
        profileForm.addEventListener('submit', (e) => handleUpdateProfile(e, playerData.name));
        passwordForm.addEventListener('submit', (e) => handleChangePassword(e, playerData.name));
    }

    async function handleUpdateProfile(event, playerName) {
        event.preventDefault();
        const newId = document.getElementById('id-input').value.trim(); const imageUrl = document.getElementById('image-url-input').value.trim();
        const honor = document.getElementById('honor-input').value.trim(); const password = document.getElementById('profile-password-input').value;
        if (!password) { alert('请输入密码以确认修改！'); return; }

        const { data: playerData, error: fetchError } = await supabaseClient.from('player_ids').select('pwd').eq('name', playerName).single();
        if (fetchError || !playerData) { alert('获取用户信息失败，请重试。'); console.error(fetchError); return; }
        if (playerData.pwd && playerData.pwd !== password) { alert('密码错误！'); return; }

        const { error: updateError } = await supabaseClient.from('player_ids').update({ id: newId, image: imageUrl, honor: honor }).eq('name', playerName);
        if (updateError) { alert('更新资料失败: ' + updateError.message); } 
        else { alert('资料更新成功！页面将刷新以显示最新信息。'); window.location.reload(); }

    async function handleChangePassword(event, playerName) {
        event.preventDefault();
        const oldPassword = document.getElementById('old-password-input').value; const newPassword = document.getElementById('new-password-input').value; const confirmPassword = document.getElementById('confirm-password-input').value;
        if (newPassword !== confirmPassword) { alert('新密码与确认密码不匹配！'); return; }
        if (!newPassword) { alert('新密码不能为空！'); return; }

        const { data: playerData, error: fetchError } = await supabaseClient.from('player_ids').select('pwd').eq('name', playerName).single();
        if (fetchError) { alert('获取用户信息失败，请重试。'); return; }
        if (playerData.pwd && playerData.pwd !== oldPassword) { alert('原密码错误！'); return; }

        const { error: updateError } = await supabaseClient.from('player_ids').update({ pwd: newPassword }).eq('name', playerName);
        if (updateError) { alert('密码更新失败: ' + updateError.message); } 
        else { alert('密码更新成功！'); document.getElementById('settings-modal').classList.remove('visible'); passwordForm.reset(); }

    async function main() {
        const params = new URLSearchParams(window.location.search);
        const playerName = params.get('name'); 
        // 重点修改：兼容空组别的防报错解析
        let groupName = params.get('group');
        if (!groupName || groupName === 'null' || groupName === 'undefined') {
            groupName = '未分组';
        }

        if (!playerName) { 
            document.body.innerHTML = '<h1 style="text-align:center; margin-top:50px; color:var(--primary-color);">错误：缺少选手真名信息</h1>'; 
            return; 
        }
        
        setupStarRating();
        
        const themeToggle = document.getElementById('theme-toggle-checkbox'); const themeText = document.getElementById('theme-text');
        function setTheme(isLight) {
            document.body.classList.toggle('light-theme', isLight); themeToggle.checked = isLight;
            themeText.textContent = isLight ? '切换为暗色模式' : '切换为亮色模式'; localStorage.setItem('theme', isLight ? 'light' : 'dark');
            if (window.playerRadarPercentiles) drawRadarChart(window.playerRadarPercentiles);
        }
        const savedTheme = localStorage.getItem('theme');
        setTheme((savedTheme === 'light') ? true : false);
        themeToggle.addEventListener('change', (e) => setTheme(e.target.checked));

        const [{ data: matches, error: matchesError }, { data: idData, error: idError }] = await Promise.all([ supabaseClient.from('matches').select('*'), supabaseClient.from('player_ids').select('*') ]);
        if(matchesError || idError) { document.body.innerHTML = `<h1 style="text-align:center; color:var(--primary-color);">错误：加载数据失败</h1><p style="text-align:center;">${(matchesError || idError).message}</p>`; return; }

        const nameMap = idData.reduce((map, row) => { map[row.name] = row; return map; }, {});
        const allPlayerData = processAllPlayerData(matches);
        const currentPlayerInfo = nameMap[playerName];

        if(!currentPlayerInfo) { document.body.innerHTML = `<h1 style="text-align:center; color:var(--primary-color);">错误：未找到选手 ${playerName} 的信息</h1>`; return; }
        
        const playerId = currentPlayerInfo.id || '暂无ID';
        const uniquePlayerKeyForComments = `${playerId}::${groupName}`;
        loadComments(uniquePlayerKeyForComments);
        document.getElementById('comment-form').addEventListener('submit', (event) => handleCommentSubmit(event, uniquePlayerKeyForComments));
        setupSettingsModal(currentPlayerInfo);

        const realName = currentPlayerInfo?.name || ''; 
        const imageUrl = currentPlayerInfo?.image; 
        const header = document.getElementById('player-id-header');
        
        if (imageUrl) {
            const avatarContainer = document.createElement('div'); avatarContainer.id = 'player-avatar-container';
            const avatar = document.createElement('img'); avatar.src = imageUrl; avatar.className = 'player-avatar';
            avatarContainer.appendChild(avatar); 
            header.parentNode.insertBefore(avatarContainer, header);
        }
        
        header.innerHTML = `<span class="player-id">${playerId}</span><span class="player-real-name">${realName}</span>`;

        const honors = currentPlayerInfo?.honor;
        if (honors) {
            document.getElementById('player-honors').innerHTML = honors.split('、').map((h, i) => {
                const honorText = escapeHTML(h);
                if (honorText.includes('冠军')) { return `<span class="honor-item"><span class="crown-icon">👑</span><span class="honor-text champion" style="--i: ${i}">${honorText}</span></span>`; } 
                else { return `<span class="honor-item"><span class="honor-text cool-gradient" style="--i: ${i}">${honorText}</span></span>`; }
            }).join('');
        }

        // 渲染统一风格的组别标签
        const badgeContainer = document.getElementById('group-badge-container');
        badgeContainer.textContent = groupName;
        if (groupName === '未分组') {
            badgeContainer.classList.add('unassigned');
        }

        const uniquePlayerKeyForStats = `${playerId}::${groupName}`;
        const playerDataForStats = allPlayerData[uniquePlayerKeyForStats];
        
        // 如果数据为空（刚初始化的选手）则显示无数据提示，不抛出异常
        if (!playerDataForStats) { 
            document.getElementById('summary-list-content').innerHTML = '<p style="color:var(--text-muted); text-align:center;">暂无比赛数据</p>';
            document.getElementById('character-stats-body').innerHTML = '<tr><td colspan="9" style="text-align:center; color:var(--text-muted);">暂无比赛数据</td></tr>';
            document.getElementById('radar-chart-container').style.display = 'none';
        } else {
            const { groupPlayersForRank, statsByCharacter } = calculateGroupRanks(allPlayerData, groupName);
            const currentPlayerStats = groupPlayersForRank.find(p => p.id === playerId);
            if (currentPlayerStats) {
                window.playerRadarPercentiles = ['acs', 'k_round', 'a_round', 'survival_rate', 'kda'].map(key => calculatePercentile(currentPlayerStats[key], groupPlayersForRank.map(p => p[key])));
                drawRadarChart(window.playerRadarPercentiles);
            }
            renderSummaryList(playerDataForStats, playerId, groupPlayersForRank);
            renderCharacterTable(playerDataForStats, playerId, statsByCharacter);
        }
    }

    function processAllPlayerData(matches) {
        const playerData = {};
        matches.forEach(match => {
            const scoreText = match['score'] || ''; const score = String(scoreText).split(/[/:：]/).map(Number);
            const totalRounds = (score.length === 2 && !isNaN(score[0]) && !isNaN(score[1])) ? (score[0] + score[1]) : 0;
            ['team_a', 'team_b'].forEach(teamKey => {
                const teamName = match[teamKey];
                for (let p = 1; p <= 5; p++) {
                    const playerId = match[`${teamKey}_player${p}_id`]; const playerDataStr = match[`${teamKey}_player${p}_data`]; const playerCh = match[`${teamKey}_player${p}_ch`];
                    if (!playerId || !playerDataStr) continue;
                    const stats = String(playerDataStr).split('/').map(Number); if (stats.length !== 4 || stats.some(isNaN)) continue;
                    const uniquePlayerKey = `${playerId}::${match.group}`;
                    if (!playerData[uniquePlayerKey]) { playerData[uniquePlayerKey] = { id: playerId, group: match.group, team: teamName, total_stats: { kills: 0, deaths: 0, assists: 0, acs: 0, matchCount: 0, acsMatchCount: 0, totalRounds: 0 }, by_character: {} }; }
                    const playerEntry = playerData[uniquePlayerKey]; playerEntry.team = teamName; const p_stats = playerEntry.total_stats;
                    if (stats[0] > 0) { p_stats.acs += stats[0]; p_stats.acsMatchCount++; }
                    p_stats.kills += stats[1]; p_stats.deaths += stats[2]; p_stats.assists += stats[3]; p_stats.matchCount++; p_stats.totalRounds += totalRounds;

                    if (playerCh) {
                        const charName = String(playerCh).trim();
                        if (!playerEntry.by_character[charName]) { playerEntry.by_character[charName] = { kills: 0, deaths: 0, assists: 0, acs: 0, matchCount: 0, acsMatchCount: 0, totalRounds: 0 }; }
                        const charStats = playerEntry.by_character[charName];
                        if (stats[0] > 0) { charStats.acs += stats[0]; charStats.acsMatchCount++; }
                        charStats.kills += stats[1]; charStats.deaths += stats[2]; charStats.assists += stats[3]; charStats.matchCount++; charStats.totalRounds += totalRounds;
                    }
                }
            });
        });
        return playerData;
    }

    function calculateGroupRanks(allPlayerData, groupName) {
        const groupPlayersForRank = []; const statsByCharacter = {};
        for (const key in allPlayerData) {
            const p = allPlayerData[key];
            if (p.group === groupName) {
                const stats = p.total_stats; if (stats.matchCount === 0 || stats.totalRounds === 0) continue;
                groupPlayersForRank.push({ 
                    id: p.id, acs: stats.acsMatchCount > 0 ? stats.acs / stats.acsMatchCount : 0, 
                    k_map: stats.kills / stats.matchCount, d_map: stats.deaths / stats.matchCount, a_map: stats.assists / stats.matchCount, 
                    k_round: stats.kills / stats.totalRounds, d_round: stats.deaths / stats.totalRounds, a_round: stats.assists / stats.totalRounds, 
                    survival_rate: 1 - (stats.deaths / stats.totalRounds), kda: stats.deaths > 0 ? (stats.kills + stats.assists) / stats.deaths : (stats.kills + stats.assists), 
                });
                for (const charName in p.by_character) {
                    const charStats = p.by_character[charName]; if (charStats.matchCount === 0) continue;
                    if (!statsByCharacter[charName]) statsByCharacter[charName] = [];
                    statsByCharacter[charName].push({ 
                        id: p.id, acs: charStats.acsMatchCount > 0 ? charStats.acs / charStats.acsMatchCount : 0, 
                        k_map: charStats.kills / charStats.matchCount, d_map: charStats.deaths / charStats.matchCount, a_map: charStats.assists / charStats.matchCount, 
                        k_round: charStats.totalRounds > 0 ? charStats.kills / charStats.totalRounds : 0, d_round: charStats.totalRounds > 0 ? charStats.deaths / charStats.totalRounds : 0, a_round: charStats.totalRounds > 0 ? charStats.assists / charStats.totalRounds : 0, 
                    });
                }
            }
        }
        return { groupPlayersForRank, statsByCharacter };
    }
    
    function calculatePercentile(playerValue, allValues) {
        if (allValues.length <= 1) return 50; const sortedValues = [...allValues].sort((a, b) => a - b);
        const rank = sortedValues.findIndex(v => v === playerValue); if (rank === -1) return 50; return (rank / (sortedValues.length - 1)) * 100;
    }
    
    function getRank(id, key, rankList, invert = false) {
        if (!rankList || rankList.length === 0) return '';
        const sortedList = [...rankList].sort((a, b) => invert ? a[key] - b[key] : b[key] - a[key]);
        const rank = sortedList.findIndex(p => p.id === id) + 1; return rank > 0 ? `(TOP ${rank})` : '';
    }
    
    function renderSummaryList(playerData, playerId, groupPlayersForRank) {
        const playerAverages = { 
            acs: playerData.total_stats.acsMatchCount > 0 ? playerData.total_stats.acs / playerData.total_stats.acsMatchCount : 0, 
            k_map: playerData.total_stats.matchCount > 0 ? playerData.total_stats.kills / playerData.total_stats.matchCount : 0, d_map: playerData.total_stats.matchCount > 0 ? playerData.total_stats.deaths / playerData.total_stats.matchCount : 0, a_map: playerData.total_stats.matchCount > 0 ? playerData.total_stats.assists / playerData.total_stats.matchCount : 0, 
            k_round: playerData.total_stats.totalRounds > 0 ? playerData.total_stats.kills / playerData.total_stats.totalRounds : 0, d_round: playerData.total_stats.totalRounds > 0 ? playerData.total_stats.deaths / playerData.total_stats.totalRounds : 0, a_round: playerData.total_stats.totalRounds > 0 ? playerData.total_stats.assists / playerData.total_stats.totalRounds : 0, 
        };
        document.getElementById('summary-list-content').innerHTML = `
            <div><strong>平均ACS:</strong> <span>${playerAverages.acs.toFixed(2)} <span class="rank-top">${getRank(playerId, 'acs', groupPlayersForRank)}</span></span></div>
            <div><strong>每局击杀:</strong> <span>${playerAverages.k_map.toFixed(2)} <span class="rank-top">${getRank(playerId, 'k_map', groupPlayersForRank)}</span></span></div>
            <div><strong>每局死亡:</strong> <span>${playerAverages.d_map.toFixed(2)} <span class="rank-top">${getRank(playerId, 'd_map', groupPlayersForRank, true)}</span></span></div>
            <div><strong>每局助攻:</strong> <span>${playerAverages.a_map.toFixed(2)} <span class="rank-top">${getRank(playerId, 'a_map', groupPlayersForRank)}</span></span></div>
            <div><strong>每回合击杀:</strong> <span>${playerAverages.k_round.toFixed(2)} <span class="rank-top">${getRank(playerId, 'k_round', groupPlayersForRank)}</span></span></div>
            <div><strong>每回合死亡:</strong> <span>${playerAverages.d_round.toFixed(2)} <span class="rank-top">${getRank(playerId, 'd_round', groupPlayersForRank, true)}</span></span></div>
            <div><strong>每回合助攻:</strong> <span>${playerAverages.a_round.toFixed(2)} <span class="rank-top">${getRank(playerId, 'a_round', groupPlayersForRank)}</span></span></div>`;
    }
    
    function renderCharacterTable(playerData, playerId, statsByCharacter) {
        const tableBody = document.getElementById('character-stats-body'); tableBody.innerHTML = '';
        Object.entries(playerData.by_character).sort(([,a],[,b]) => b.matchCount - a.matchCount).forEach(([charName, stats]) => {
            const avg = { 
                acs: stats.acsMatchCount > 0 ? stats.acs / stats.acsMatchCount : 0, 
                k_map: stats.matchCount > 0 ? stats.kills / stats.matchCount : 0, d_map: stats.matchCount > 0 ? stats.deaths / stats.matchCount : 0, a_map: stats.matchCount > 0 ? stats.assists / stats.matchCount : 0, 
                k_round: stats.totalRounds > 0 ? stats.kills / stats.totalRounds : 0, d_round: stats.totalRounds > 0 ? stats.deaths / stats.totalRounds : 0, a_round: stats.totalRounds > 0 ? stats.assists / stats.totalRounds : 0, 
            };
            const characterRankList = statsByCharacter[charName] || [];
            tableBody.innerHTML += `
                <tr><td><strong style="color:var(--text-color);">${charName}</strong></td><td>${stats.matchCount}</td>
                <td style="color:var(--primary-color); font-weight:700;">${avg.acs.toFixed(2)} <span class="rank-top">${getRank(playerId, 'acs', characterRankList)}</span></td>
                <td>${avg.k_map.toFixed(2)} <span class="rank-top">${getRank(playerId, 'k_map', characterRankList)}</span></td><td>${avg.d_map.toFixed(2)} <span class="rank-top">${getRank(playerId, 'd_map', characterRankList, true)}</span></td><td>${avg.a_map.toFixed(2)} <span class="rank-top">${getRank(playerId, 'a_map', characterRankList)}</span></td>
                <td>${avg.k_round.toFixed(2)} <span class="rank-top">${getRank(playerId, 'k_round', characterRankList)}</span></td><td>${avg.d_round.toFixed(2)} <span class="rank-top">${getRank(playerId, 'd_round', characterRankList, true)}</span></td><td>${avg.a_round.toFixed(2)} <span class="rank-top">${getRank(playerId, 'a_round', characterRankList)}</span></td></tr>`;
        });
    }

    document.addEventListener('DOMContentLoaded', main);
</script>
</body>
