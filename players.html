<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据中心 · HWVCTS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <style>
    #dc-season { width: 320px; }
    #dc-search { width: 260px; }
    #dc-table tbody tr { cursor: default; }
    #dc-table a {
      color: var(--pure-white);
      text-decoration: none;
      font-family: var(--font-mono);
      font-weight: 600;
      border-bottom: 1px solid transparent;
    }
    #dc-table a:hover { color: var(--info-blue); border-bottom-color: currentColor; }
    #dc-table th.sortable:hover { color: var(--pure-white); }
    #dc-table th .sort-ind { margin-left: 4px; font-size: 10px; color: var(--ash); }
    @media (max-width: 720px) {
      #dc-season, #dc-event, #dc-search { width: 100%; }
      .filter-bar { align-items: stretch; }
      .filter-bar .form-label { width: 100%; }
    }
  </style>
</head>
<body data-page="players">
  <main class="page"><div class="container">
    <header class="page-header">
      <span class="eyebrow">Data Center</span>
      <h1 class="page-title">数 据 中 心</h1>
    </header>

    <div class="filter-bar">
      <label class="form-label" for="dc-season" style="margin:0;">赛季</label>
      <select id="dc-season" class="select" aria-label="按赛季筛选"></select>
      <label class="form-label" for="dc-event" style="margin:0;">赛事</label>
      <select id="dc-event" class="select" aria-label="按赛事筛选" style="width:260px;"></select>
      <input id="dc-search" class="input" type="search" placeholder="搜索选手 / 游戏ID / 分组…" aria-label="搜索选手" style="margin-left:auto;">
      <button class="btn btn-ghost btn-sm" id="dc-csv" type="button">导出 CSV</button>
    </div>

    <div class="table-wrap">
      <table class="data-table" id="dc-table">
        <thead>
          <tr>
            <th style="width:44px;">#</th>
            <th class="sortable" data-sort="gid">游戏ID<span class="sort-ind"></span></th>
            <th class="sortable" data-sort="name">真名<span class="sort-ind"></span></th>
            <th>分组</th>
            <th>队伍</th>
            <th>角色</th>
            <th class="sortable" data-sort="matches">场次<span class="sort-ind"></span></th>
            <th class="sortable" data-sort="kills">击杀<span class="sort-ind"></span></th>
            <th class="sortable" data-sort="deaths">死亡<span class="sort-ind"></span></th>
            <th>助攻</th>
            <th class="sortable" data-sort="kd">K/D<span class="sort-ind"></span></th>
            <th class="sortable" data-sort="kda">KDA<span class="sort-ind"></span></th>
            <th class="sortable" data-sort="acs">ACS<span class="sort-ind"></span></th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="dc-tbody"><tr><td colspan="14"><div class="sk-loader inline"><div class="sk"></div><span class="sr-only">正在加载选手</span></div></td></tr></tbody>
      </table>
    </div>

    <div id="dc-pager" style="display:none; gap:8px; align-items:center; justify-content:flex-end; margin-top:12px;">
      <button class="btn btn-ghost btn-sm" id="dc-prev" type="button">上一页</button>
      <span class="smoke" id="dc-pageinfo" style="font-size:13px;"></span>
      <button class="btn btn-ghost btn-sm" id="dc-next" type="button">下一页</button>
    </div>
    <div id="dc-empty" class="empty-state" hidden>
      <strong>暂无选手</strong>
      <p>当前筛选下没有选手（或尚未录入比赛数据）。</p>
    </div>
  </div></main>

  <script>
    (function () {
      var state = { season: '', event: '', evs: [], rows: [], view: [], sort: { key: 'kills', dir: -1 }, q: '', regCount: 0, page: 0, pageSize: 20 };

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }

      function seasonKeyOf(ev) { return String(ev && ev.season ? ev.season : '').trim().toLowerCase(); }

      /* —— 事件源 ——
       * 数据中心只展示真实存在的赛事：草稿 / 已取消不进入筛选器，
       * 避免把「还没发布」或「已经作废」的活动当成有效数据口径。
       */
      async function fetchEvents() {
        try {
          var res = await HWAuth.getClient().from('events')
            .select('id, code, title, season, status, created_at')
            .order('created_at', { ascending: false });
          if (res && !res.error && res.data) {
            return res.data.filter(function (ev) {
              return ev.status !== 'draft' && ev.status !== 'cancelled' && ev.status !== 'deleted';
            });
          }
        } catch (e) { /* 回退 */ }
        return [];
      }

      function buildSeasonSelect() {
        var sel = document.getElementById('dc-season');
        var seasons = [], seen = {};
        state.evs.forEach(function (ev) {
          var k = seasonKeyOf(ev);
          if (!k || seen[k]) return;
          seen[k] = 1;
          seasons.push(k);
        });
        if (!seasons.length) seasons = ['s6', 's5'];
        sel.innerHTML = '<option value="">全部赛季</option>' + seasons.map(function (k) {
          return '<option value="' + k + '"' + (state.season === k ? ' selected' : '') + '>' + k.toUpperCase() + '</option>';
        }).join('');
        if (state.season && seasons.indexOf(state.season) === -1) { state.season = ''; sel.value = ''; }
      }

      function buildEventSelect() {
        var sel = document.getElementById('dc-event');
        var evs = state.evs.filter(function (ev) {
          return !state.season || seasonKeyOf(ev) === state.season;
        });
        sel.innerHTML = '<option value="">全部赛事</option>' + evs.map(function (ev) {
          return '<option value="' + ev.id + '"' + (String(state.event) === String(ev.id) ? ' selected' : '') + '>' +
            esc(ev.title || ('活动#' + ev.id)) + (ev.season ? ' · ' + esc(String(ev.season).toUpperCase()) : '') + '</option>';
        }).join('');
        if (state.event && !evs.some(function (ev) { return String(ev.id) === String(state.event); })) {
          state.event = '';
          sel.value = '';
        }
      }

      /* —— ?season= / ?event= 深链 —— */
      function applyDeepLinks() {
        var params = null;
        try { params = new URLSearchParams(window.location.search); } catch (e) { params = null; }
        if (!params) return;
        var evQ = params.get('event');
        var qs = params.get('season');
        if (evQ) {
          var hit = state.evs.filter(function (ev) {
            return String(ev.id) === String(evQ) || String(ev.code || '') === String(evQ);
          })[0];
          if (hit) {
            var sk = seasonKeyOf(hit);
            if (sk) state.season = sk;
            state.event = String(hit.id);
            return;
          }
        }
        if (qs) state.season = String(qs).toLowerCase();
      }

      /* —— 报名集合：报名 ∪ 未上场（0 场行）+ 计数 + 封禁映射 —— */
      var regGids = {}, regNames = {}, regRows = [], banGids = {};
      async function loadRegistrants() {
        regGids = {}; regNames = {}; regRows = []; banGids = {};
        state.regCount = 0;
        var r = null;
        try {
          var sb = HWAuth.getClient();
          r = await Promise.all([
            sb.from('event_registrations').select('user_id, event_id, status'),
            sb.from('site_users').select('id, game_id, nickname, banned, banned_until'),
            sb.from('reg_profiles').select('user_id, game_id, real_name')
          ]).catch(function () { return null; });
        } catch (e) { r = null; }
        if (!r) return;
        var regs = (r[0] && !r[0].error && r[0].data) || [];
        var users = (r[1] && !r[1].error && r[1].data) || [];
        var profs = (r[2] && !r[2].error && r[2].data) || [];
        if (state.event) {
          regs = regs.filter(function (x) { return String(x.event_id) === String(state.event); });
        }
        var uMap = {}, pMap = {};
        users.forEach(function (u) { uMap[u.id] = u; });
        profs.forEach(function (p) { pMap[p.user_id] = p; });
        var seenUser = {};
        regs.forEach(function (x) {
          if (x.status === 'rejected') return;
          if (seenUser[x.user_id]) return;
          seenUser[x.user_id] = 1;
          var u = uMap[x.user_id] || null;
          var pr = pMap[x.user_id] || null;
          var gid = String((pr && pr.game_id) || (u && u.game_id) || '');
          var name = String((pr && pr.real_name) || (u && u.nickname) || '');
          state.regCount++;
          if (gid) regGids[gid] = 1;
          if (name) regNames[name] = 1;
          regRows.push({ gid: gid, name: name, uid: x.user_id });
          if (u && HWLayout.isBannedUser(u) && gid) banGids[gid] = 1;
        });
      }

      function topKey(obj) {
        var k = '', n = -1;
        Object.keys(obj).forEach(function (x) { if (obj[x] > n) { n = obj[x]; k = x; } });
        return k;
      }

      function mkRow(gid, name, group, team, agg) {
        var kd = agg.deaths > 0 ? agg.kills / agg.deaths : agg.kills;
        var kda = agg.deaths > 0 ? (agg.kills + agg.assists) / agg.deaths : agg.kills + agg.assists;
        var g = String(gid == null ? '' : gid);
        return {
          gid: g,
          name: name || '',
          group: group || '',
          team: team || '',
          role: '',
          matches: agg.matches || 0,
          kills: agg.kills || 0,
          deaths: agg.deaths || 0,
          assists: agg.assists || 0,
          kd: kd,
          kda: kda,
          acs: agg.acsN > 0 ? agg.acsSum / agg.acsN : 0,
          reg: !!(regGids[g] || (name && regNames[name])),
          banned: !!banGids[g]
        };
      }

      /* —— 加载：所有赛季/赛事的全部选手 ∪ 报名未上场 —— */
      async function loadAll() {
        var tb = document.getElementById('dc-tbody');
        var empty = document.getElementById('dc-empty');
        tb.innerHTML = (window.HWLayout && HWLayout.skeletonRows)
          ? HWLayout.skeletonRows(14, 6)
          : '<tr><td colspan="14">' + HWLayout.loader({ inline: true, label: '正在加载选手' }) + '</td></tr>';
        empty.hidden = true;

        var prefixes = state.season ? [state.season] : ['s6', 's5'];
        var r = null;
        try {
          var sb = HWAuth.getClient();
          var calls = [];
          prefixes.forEach(function (p) {
            calls.push(sb.from(p + '_matches').select('*'));
            calls.push(sb.from(p + '_player_ids').select('name, id, team, "group"'));
            calls.push(sb.from(p + '_player_stats').select('game_id, role'));
          });
          r = await Promise.all(calls);
        } catch (e) { r = null; }
        var matches = [], roster = [], stats = [];
        prefixes.forEach(function (p, i) {
          if (!r) return;
          var base = i * 3;
          if (r[base] && !r[base].error) matches = matches.concat(r[base].data || []);
          if (r[base + 1] && !r[base + 1].error) roster = roster.concat(r[base + 1].data || []);
          if (r[base + 2] && !r[base + 2].error) stats = stats.concat(r[base + 2].data || []);
        });

        /* 待确认结果不计入统计（result_status='pending' 的对阵整场剔除；列未就绪跳过） */
        try {
          var schCalls = prefixes.map(function (p) { return sb.from(p + '_match_schedule').select('"group", team_a, team_b, match_date, result_status').eq('result_status', 'pending'); });
          var schRes = await Promise.all(schCalls);
          var pendingKeys = {};
          (schRes || []).forEach(function (r) {
            ((r && r.data) || []).forEach(function (x) {
              pendingKeys[[x.group || '', x.team_a || '', x.team_b || '', String(x.match_date || '').slice(0, 10)].join('|')] = 1;
            });
          });
          if (Object.keys(pendingKeys).length) {
            matches = matches.filter(function (m) {
              return !pendingKeys[[m.group || '', m.team_a || '', m.team_b || '', String(m.match_date || '').slice(0, 10)].join('|')];
            });
          }
        } catch (e) { /* migration_v3 未执行：不过滤 */ }

        /* 赛事筛选：event_id 存在则按赛事过滤（无列/全空 → 退回赛季全量） */
        if (state.event) {
          var scoped = matches.filter(function (m) { return m.event_id != null && String(m.event_id) === String(state.event); });
          var anyScoped = matches.some(function (m) { return m.event_id != null; });
          if (anyScoped) matches = scoped;
        }

        if (!r && !matches.length && !roster.length) {
          tb.innerHTML = '<tr><td colspan="14">' + '加载失败，请检查网络后重试。 <button class="btn btn-ghost btn-sm" id="dc-retry" type="button">重试</button>' + '</td></tr>';
          var rb = document.getElementById('dc-retry');
          if (rb) rb.addEventListener('click', function () { loadAll(); });
          return;
        }
        await loadRegistrants();

        /* 与 player.html 同源解析 */
        var byId = {};
        matches.forEach(function (m) {
          var score = String(m.score || '').split(/[/:：]/).map(Number);
          var rounds = (score.length === 2 && !isNaN(score[0]) && !isNaN(score[1])) ? score[0] + score[1] : 0;
          ['team_a', 'team_b'].forEach(function (tk) {
            for (var i = 1; i <= 5; i++) {
              var gid = m[tk + '_player' + i + '_id'];
              var ds = m[tk + '_player' + i + '_data'];
              if (!gid || !ds) continue;
              var st = String(ds).split('/').map(Number);
              if (st.length !== 4 || st.some(isNaN)) continue;
              var row = byId[gid] || (byId[gid] = { matches: 0, kills: 0, deaths: 0, assists: 0, acsSum: 0, acsN: 0, rounds: 0, groups: {}, teams: {} });
              row.matches++;
              if (st[0] > 0) { row.acsSum += st[0]; row.acsN++; }
              row.kills += st[1];
              row.deaths += st[2];
              row.assists += st[3];
              row.rounds += rounds;
              if (m.group) row.groups[m.group] = (row.groups[m.group] || 0) + 1;
              var tn = m[tk];
              if (tn) row.teams[tn] = (row.teams[tn] || 0) + 1;
            }
          });
        });

        var roleByGid = {};
        stats.forEach(function (s) { if (s.game_id) roleByGid[String(s.game_id)] = s.role || ''; });

        var rows = [], seen = {};
        roster.forEach(function (p) {
          var gid = String(p.id == null ? '' : p.id);
          if (!gid) return;
          /* 赛事筛选：只显示 报名该赛事 ∪ 该赛事有出场 的选手 */
          if (state.event) {
            var inScope = !!(regGids[gid] || (p.name && regNames[p.name]) || byId[gid]);
            if (!inScope) return;
          }
          seen[gid] = true;
          var agg = byId[gid] || { matches: 0, kills: 0, deaths: 0, assists: 0, acsSum: 0, acsN: 0, rounds: 0, groups: {}, teams: {} };
          rows.push(mkRow(gid, p.name, p.group, p.team, agg));
        });
        Object.keys(byId).forEach(function (gid) {
          if (seen[gid]) return;
          seen[gid] = true;
          rows.push(mkRow(gid, '', topKey(byId[gid].groups), topKey(byId[gid].teams), byId[gid]));
        });
        /* 报名未上场 → 0 场行 */
        regRows.forEach(function (rr) {
          if (!rr.gid || seen[rr.gid]) return;
          seen[rr.gid] = true;
          rows.push(mkRow(rr.gid, rr.name, '', '', { matches: 0, kills: 0, deaths: 0, assists: 0, acsSum: 0, acsN: 0, rounds: 0, groups: {}, teams: {} }));
        });
        rows.forEach(function (row) { row.role = roleByGid[row.gid] || ''; });

        state.rows = rows;
        render();
      }

      function render() {
        var q = state.q.trim().toLowerCase();
        var rows = state.rows.filter(function (r) {
          if (!q) return true;
          return (r.gid || '').toLowerCase().indexOf(q) !== -1
            || (r.name || '').toLowerCase().indexOf(q) !== -1
            || (r.group || '').toLowerCase().indexOf(q) !== -1;
        });
        var s = state.sort;
        rows.sort(function (a, b) {
          var av = a[s.key], bv = b[s.key];
          if (typeof av === 'string' || typeof bv === 'string') {
            return s.dir * String(av).localeCompare(String(bv));
          }
          return s.dir * (av - bv);
        });
        rows.sort(function (a, b) { return (a.matches > 0 ? 0 : 1) - (b.matches > 0 ? 0 : 1); });
        state.view = rows;

        var tb = document.getElementById('dc-tbody');
        document.querySelectorAll('#dc-table th .sort-ind').forEach(function (el) { el.textContent = ''; });
        var activeTh = document.querySelector('#dc-table th[data-sort="' + s.key + '"] .sort-ind');
        if (activeTh) activeTh.textContent = s.dir === -1 ? '▼' : '▲';

        if (!rows.length) {
          tb.innerHTML = '';
          document.getElementById('dc-empty').hidden = false;
          document.getElementById('dc-pager').style.display = 'none';
          return;
        }
        document.getElementById('dc-empty').hidden = true;
        /* 分页渲染（20 条/页，序号按全局位次） */
        var totalPages = Math.max(1, Math.ceil(rows.length / state.pageSize));
        if (state.page >= totalPages) state.page = totalPages - 1;
        var pager = document.getElementById('dc-pager');
        pager.style.display = totalPages > 1 ? 'flex' : 'none';
        document.getElementById('dc-pageinfo').textContent = '第 ' + (state.page + 1) + ' / ' + totalPages + ' 页 · 共 ' + rows.length + ' 人';
        document.getElementById('dc-prev').disabled = state.page === 0;
        document.getElementById('dc-next').disabled = state.page >= totalPages - 1;
        var pageRows = rows.slice(state.page * state.pageSize, state.page * state.pageSize + state.pageSize);
        tb.innerHTML = pageRows.map(function (r, pidx) { var idx = state.page * state.pageSize + pidx;
          /* 选手页是生涯页：链接只带姓名，不带 group/season，
             否则同一个人从不同赛事点进去会拿到被切碎的数据。
             （r.gid 是游戏 ID，和 player.html 的 ?id= 语义不同，不要混传。） */
          var idCell = r.gid
            ? '<a href="player.html?name=' + encodeURIComponent(r.name || r.gid) + '">' + esc(r.gid) + '</a>'
            : esc(r.gid);
          var statusCell = r.reg ? '<span class="badge badge-green">已报名</span>'
            : (state.event && r.matches > 0 ? '<span class="badge badge-blue">替补</span>' : '—');
          return '<tr>'
            + '<td class="smoke">' + (idx + 1) + '</td>'
            + '<td>' + idCell + '</td>'
            + '<td>' + esc(r.name || '—') + (r.banned ? ' ' + HWLayout.bannedBadgeHtml() : '') + '</td>'
            + '<td>' + esc(r.group || '—') + '</td>'
            + '<td>' + (r.team ? '<a href="team.html?name=' + encodeURIComponent(r.team) + '&season=' + esc(state.season || 's6') + '">' + esc(r.team) + '</a>' : '—') + '</td>'
            + '<td>' + esc(r.role || '—') + '</td>'
            + '<td>' + r.matches + '</td>'
            + (r.matches > 0
                ? '<td>' + r.kills + '</td><td>' + r.deaths + '</td><td>' + r.assists + '</td>'
                  + '<td>' + r.kd.toFixed(2) + '</td><td>' + r.kda.toFixed(2) + '</td>'
                : '<td>—</td><td>—</td><td>—</td><td>—</td><td>—</td>')
            + '<td>' + (r.acs > 0 ? r.acs.toFixed(1) : '—') + '</td>'
            + '<td>' + statusCell + '</td>'
            + '</tr>';
        }).join('');
      }

      /* —— CSV（P13c） —— */
      function exportCsv() {
        var rows = state.view || [];
        var header = ['#', '游戏ID', '真名', '分组', '队伍', '角色', '状态', '场次', '击杀', '死亡', '助攻', 'K/D', 'KDA', 'ACS'];
        var body = rows.map(function (r, i) {
          return [i + 1, r.gid, r.name, r.group, r.team, r.role,
            r.reg ? '已报名' : ((state.event && r.matches > 0) ? '替补' : ''),
            r.matches, r.kills, r.deaths, r.assists,
            r.kd.toFixed(2), r.kda.toFixed(2), r.acs > 0 ? r.acs.toFixed(1) : ''];
        });
        HWLayout.exportCsv('players-' + (state.season || 'all') + (state.event ? '-event' + state.event : '') + '.csv', header, body);
      }

      document.querySelectorAll('#dc-table th[data-sort]').forEach(function (th) {
        th.addEventListener('click', function () {
          var key = th.dataset.sort;
          state.page = 0;
          if (state.sort.key === key) state.sort.dir *= -1;
          else state.sort = { key: key, dir: (key === 'name' || key === 'gid') ? 1 : -1 };
          render();
        });
      });
      document.getElementById('dc-prev').addEventListener('click', function () { if (state.page > 0) { state.page--; render(); } });
      document.getElementById('dc-next').addEventListener('click', function () { state.page++; render(); });
      document.getElementById('dc-search').addEventListener('input', function (e) {
        state.q = e.target.value;
        state.page = 0;
        render();
      });
      document.getElementById('dc-csv').addEventListener('click', exportCsv);
      document.getElementById('dc-season').addEventListener('change', function (e) {
        state.season = e.target.value;
        state.event = '';
        buildEventSelect();
        try {
          var u = new URL(window.location.href);
          u.searchParams.set('season', state.season);
          window.history.replaceState(null, '', u);
        } catch (err) { /* ignore */ }
        loadAll();
      });
      document.getElementById('dc-event').addEventListener('change', function (e) {
        state.event = e.target.value;
        try {
          var u = new URL(window.location.href);
          if (state.event) u.searchParams.set('event', state.event); else u.searchParams.delete('event');
          window.history.replaceState(null, '', u);
        } catch (err) { /* ignore */ }
        loadAll();
      });

      document.addEventListener('DOMContentLoaded', async function () {
        try {
          await Promise.race([
            (async function () {
              state.evs = await fetchEvents();
              applyDeepLinks();
              buildSeasonSelect();
              buildEventSelect();
              document.getElementById('dc-season').value = state.season;
              document.getElementById('dc-event').value = state.event;
              await loadAll();
            })(),
            new Promise(function (_, rej) {
              setTimeout(function () { rej(new Error('加载超时（15 秒）')); }, 15000);
            })
          ]);
        } catch (e) {
          console.error('[players] boot:', e);
          document.getElementById('dc-tbody').innerHTML =
            '<tr><td colspan="14">加载失败：' + esc(String((e && e.message) || e)) + '（详情见控制台）</td></tr>';
          document.getElementById('dc-empty').hidden = true;
        }
      });
    })();
  </script>
</body>
</html>
