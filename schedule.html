<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HWVCTS5 - 赛程中心</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
        <style>
        /* ═════════ 赛程 · 重构版（纯 theme 组件语言 · 无 legacy 别名 · 无旧装饰条） ═════════ */
        body { padding-top: 80px; }

        .stage-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
        .stage-head h2 { margin: 0; font-size: 18px; font-weight: 600; color: var(--pure-white); letter-spacing: 0; }
        .bracket-sub { font-size: 13px; font-weight: 500; color: var(--smoke); margin: 4px 0 16px; letter-spacing: 0; }

        /* 对阵图 */
        .bracket-container { width: 100%; overflow-x: auto; padding-bottom: 18px; }
        .bracket-container::-webkit-scrollbar { height: 6px; }
        .bracket-container::-webkit-scrollbar-track { background: transparent; }
        .bracket-container::-webkit-scrollbar-thumb { background: var(--graphite); border-radius: 4px; }
        .bracket { display: flex; justify-content: flex-start; gap: 28px; min-width: max-content; padding: 6px 2px; }
        .round { display: flex; flex-direction: column; gap: 14px; width: 216px; flex-shrink: 0; }
        .round-title {
            font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--smoke); font-weight: 500; text-align: left;
            padding: 0 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 2px;
        }
        .match-card {
            background: var(--obsidian); border: 1px solid var(--border); border-radius: 12px;
            padding: 12px; width: 100%; box-sizing: border-box; cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
        }
        .match-card:hover { border-color: var(--smoke); background: var(--graphite); transform: translateY(-2px); }
        .team { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; }
        .team-name { font-size: 14px; font-weight: 600; color: var(--pure-white); }
        .team-score {
            font-family: var(--font-mono); font-weight: 700; color: var(--smoke);
            font-variant-numeric: tabular-nums; font-size: 14px;
        }
        .team.winner .team-name, .team.winner .team-score { color: var(--success-green); }
        .team.loser .team-name, .team.loser .team-score { opacity: 0.45; }
        .match-card hr, hr { border: none; border-top: 1px solid var(--border); margin: 5px 0; opacity: 0.6; }
        .match-date {
            font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
            color: var(--smoke); margin-bottom: 6px;
        }
        .commentator-info {
            font-size: 12px; color: var(--smoke); margin-top: 8px; padding-top: 7px;
            border-top: 1px dashed var(--border);
        }
        .result-card {
            display: flex; align-items: center; justify-content: center; min-height: 48px;
            border: 1px solid var(--border); background: var(--ink); border-radius: 12px;
            font-size: 14px; font-weight: 600; color: var(--ash); text-align: center; padding: 8px;
        }
        .result-card.promoted { border-color: rgba(89, 212, 153, 0.5); color: var(--success-green); background: rgba(89, 212, 153, 0.06); }
        .result-card.eliminated { color: var(--smoke); opacity: 0.55; }
        .result-card.champion { border-color: rgba(255, 215, 0, 0.5); color: #ffd700; background: rgba(255, 215, 0, 0.07); font-size: 16px; }

        /* 比赛详情弹窗（容器由 theme 单源） */
        .md-box {
            flex: 1; min-width: 0; box-sizing: border-box; background: var(--obsidian);
            border: 1px solid var(--border); border-radius: 12px; padding: 18px;
            overflow-x: auto; text-align: left;
        }
        .md-box h3 {
            margin: 0 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
            color: var(--pure-white); font-size: 16px; font-weight: 600; text-align: center;
        }
        .md-box #modal-team-a-stats, .md-box #modal-team-b-stats { color: var(--mist); margin-top: 14px; min-height: 100px; }
        .md-vs {
            display: flex; align-items: center; font-family: var(--font-mono);
            font-size: 20px; font-weight: 700; color: var(--smoke); opacity: 0.5;
        }
        .md-edit {
            margin-top: 26px; background: var(--ink); border: 1px dashed var(--border);
            border-radius: 12px; padding: 18px; text-align: left;
        }
        .md-edit h3 { margin: 0 0 14px; font-size: 14px; font-weight: 600; color: var(--coral-pulse); }
        .md-label { display: block; font-size: 12px; color: var(--smoke); margin-bottom: 6px; }

        /* 解说统计 */
        .caster-stat-item {
            background: var(--obsidian); border: 1px solid var(--border); border-radius: 12px;
            padding: 16px; margin-bottom: 12px; text-align: left;
        }
        .caster-stat-header {
            display: flex; justify-content: space-between; align-items: center;
            color: var(--coral-pulse); font-size: 15px; font-weight: 600; margin: 0 0 10px;
        }
        .caster-stat-list { margin: 0; padding-left: 20px; color: var(--ash); font-size: 13px; line-height: 1.9; }
        .stats-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 14px; }
        .stats-table th {
            font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--smoke); font-weight: 500; text-align: left; padding: 8px 6px;
            border-bottom: 1px solid var(--border);
        }
        .stats-table td { padding: 8px 6px; color: var(--ash); border-bottom: 1px solid var(--border); }
        .stats-table tr:last-child td { border-bottom: none; }
        .stats-table a { color: var(--mist); font-weight: 600; text-decoration: none; }
        .stats-table a:hover { color: var(--coral-pulse); }

        /* 自动提交横幅 */
        #auto-submit-banner {
            position: fixed; right: 20px; bottom: 20px; z-index: 2000; max-width: 400px; white-space: pre-line;
            background: var(--ink); border: 1px solid rgba(89, 212, 153, 0.5); color: var(--success-green);
            padding: 11px 18px; border-radius: 12px; font-size: 13px; font-weight: 600;
            display: none; transition: opacity 0.5s; box-shadow: var(--key-shadow);
        }
    </style>
</head>
<body data-page="schedule" data-crumb="events">

    </div>

    <div class="container">
        <div id="event-bar" hidden></div>
        <header class="page-header">
            <span class="eyebrow">Schedule</span>
            <h1 class="page-title">赛程中心</h1>
            <p class="page-sub">组别与阶段随所选活动的赛季锁定 —— 点击卡片可编辑比分、时间与房间链接。</p>
        </header>

        <div class="filter-bar" style="flex-wrap: wrap; gap: 10px; margin-bottom: 26px;">
            <div class="seg" id="group-filters">
                <button class="active" data-group="传奇组" type="button">传奇组</button>
                <button data-group="中坚组" type="button">中坚组</button>

            <div class="seg" id="stage-filters">
                <button class="active" data-stage="swiss" type="button">小组赛</button>

            <input class="input" id="seed-input" placeholder="随机种子" style="width: 140px;">
            <button class="btn btn-ghost" id="random-draw-btn" type="button">随机生成对战</button>
            <div style="flex: 1"></div>
            <button id="caster-stats-btn" class="btn btn-ghost" type="button">解说统计</button>
            <button id="submit-changes-btn" class="btn btn-primary" type="button" style="display: none;">提交赛程</button>
        </div>

        <main class="card">
            <div class="stage-head">
                <h2 id="current-group-name"></h2>
                <span class="eyebrow">Bracket</span>
            </div>
            <div id="swiss-stage-section">
                <h3 class="bracket-sub">小组赛 · 点击比赛卡片查看数据 / 修改信息</h3>
                <div class="bracket-container">
                    <div id="swiss-bracket" class="bracket"></div>
                </div>
            </div>
            <div id="playoff-stage-section" style="display: none;">
                <h3 class="bracket-sub">淘汰赛 · 点击比赛卡片查看数据 / 修改信息</h3>

                    <div id="playoff-bracket" class="bracket"></div>
                </div>
            </div>
        </main>
    </div>

<script>

    document.addEventListener('DOMContentLoaded', () => {
        const SUPABASE_URL = 'https://odjmanvkhwiirswscrht.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_LVXTUDdXTQ8vlRS0U0G1xQ_qMnEiylO';
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        const groupFilters    = document.getElementById('group-filters');
        const stageFilters    = document.getElementById('stage-filters');
        const swissSection    = document.getElementById('swiss-stage-section');
        const playoffSection  = document.getElementById('playoff-stage-section');
        const randomDrawBtn   = document.getElementById('random-draw-btn');
        const passwordModal   = document.getElementById('password-modal');
        const passwordInputModal   = document.getElementById('password-input-modal');
        const passwordSubmitModal  = document.getElementById('password-submit-modal');
        const submitChangesBtn     = document.getElementById('submit-changes-btn');
        const casterStatsBtn       = document.getElementById('caster-stats-btn');
        const casterModal          = document.getElementById('caster-modal');
        const closeCasterModal     = document.getElementById('close-caster-modal');
        const casterStatsContainer = document.getElementById('caster-stats-container');
        const matchDetailModal     = document.getElementById('match-detail-modal');
        const modalCloseBtn        = document.getElementById('modal-close-btn');
        const modalSaveBtn         = document.getElementById('modal-save-btn');
        const autoSubmitBanner     = document.getElementById('auto-submit-banner');

        let currentEditingMatch  = null;
        let pendingAuthAction    = null;
        let allMatchesData       = {};
        let allTeamsByGroup      = {};
        let allRegisteredPlayers = [];
        let processedMatchStats  = {};
        let isPasswordVerified   = false;
        let pendingDataToUpsert  = [];
        let pendingIdsToDelete   = [];
        let currentSeason        = 's6'; 

        // ── 密码验证 ─────────────────────────────────────────────────────────────
        async function verifyPassword() {
            const inputPassword = passwordInputModal.value;
            if (!inputPassword) { alert('请输入口令！'); return; }
            try {
                const { data: isCorrect, error } = await supabaseClient.rpc('check_admin_password', { input_pwd: inputPassword });
                if (error) throw error;
                if (isCorrect === true) {
                    isPasswordVerified = true;
                    passwordModal.style.display = 'none';
                    passwordInputModal.value = '';
                    // 口令正确 → 全站管理会话（15 分钟）+ 尝试把当前账号升级为 admin 角色
                    HWLayout.markAdmin(15);
                    HWLayout.promoteRole();
                    document.dispatchEvent(new CustomEvent('hw:admin'));
                    if (pendingAuthAction) { pendingAuthAction(); pendingAuthAction = null; }
                } else { alert('口令错误！'); }
            } catch (error) { console.error('验证口令时出错:', error); alert('验证失败，请检查数据库连接。'); }
        }

        function requireAdminAuth(actionCallback) {
            if (isPasswordVerified) { actionCallback(); }
            else { pendingAuthAction = actionCallback; passwordModal.style.display = 'flex'; passwordInputModal.focus(); }
        }

        // ── 赛程布局 ─────────────────────────────────────────────────────────────
        
        // 传奇组 S6专属： 7队 7轮单循环布局
        const roundRobinLayout = [
            { type: 'round', content: [{ title: '第1轮', ids: ['RR-1-1','RR-1-2','RR-1-3'] }] },
            { type: 'round', content: [{ title: '第2轮', ids: ['RR-2-1','RR-2-2','RR-2-3'] }] },
            { type: 'round', content: [{ title: '第3轮', ids: ['RR-3-1','RR-3-2','RR-3-3'] }] },
            { type: 'round', content: [{ title: '第4轮', ids: ['RR-4-1','RR-4-2','RR-4-3'] }] },
            { type: 'round', content: [{ title: '第5轮', ids: ['RR-5-1','RR-5-2','RR-5-3'] }] },
            { type: 'round', content: [{ title: '第6轮', ids: ['RR-6-1','RR-6-2','RR-6-3'] }] },
            { type: 'round', content: [{ title: '第7轮', ids: ['RR-7-1','RR-7-2','RR-7-3'] }] }
        ];

        const swissBracketLayout = [
            { type: 'round', content: [{ title: '0-0组', ids: ['S1-1','S1-2','S1-3','S1-4'] }] },
            { type: 'round', content: [{ title: '1-0组', ids: ['S2-1W','S2-2W'] }, { title: '0-1组', ids: ['S2-1L','S2-2L'] }] },
            { type: 'round', content: [{ title: '2-0 晋级', ids: ['S3-PROMO-A','S3-PROMO-B'], type: 'promoted' }, { title: '1-1组', ids: ['S3-1M','S3-2M'] }, { title: '0-2 淘汰', ids: ['S3-ELIM-A','S3-ELIM-B'], type: 'eliminated' }] },
            { type: 'round', content: [{ title: '2-1 晋级', ids: ['S5-PROMO-A','S5-PROMO-B'], type: 'promoted' }, { title: '1-2 淘汰', ids: ['S5-ELIM-A','S5-ELIM-B'], type: 'eliminated' }] }
        ];
        const playoffBracketLayout = [
            { type: 'round', content: [{ title: '胜者组 R1', ids: ['P-WB1-1','P-WB1-2'] }] },
            { type: 'round', content: [{ title: '胜者组决赛', ids: ['P-WBF'] }, { title: '败者组 R1', ids: ['P-LB1'] }] },
            { type: 'round', content: [{ title: '败者组决赛', ids: ['P-LBF'] }] },
            { type: 'round', content: [{ title: '总决赛', ids: ['P-GF'] }] },
            { type: 'round', content: [{ title: '总冠军', ids: ['P-CHAMPION'], type: 'champion' }] }
        ];
        const swissBracketLayout_12 = [
            { type: 'round', content: [{ title: '0-0组', ids: ['S1-1','S1-2','S1-3','S1-4','S1-5','S1-6'] }] },
            { type: 'round', content: [{ title: '1-0组', ids: ['S2-1W','S2-2W','S2-3W'] }, { title: '0-1组', ids: ['S2-1L','S2-2L','S2-3L'] }] },
            { type: 'round', content: [{ title: '2-0 晋级', ids: ['S3-PROMO-1','S3-PROMO-2','S3-PROMO-3'], type: 'promoted' }, { title: '1-1组', ids: ['S3-1M','S3-2M','S3-3M'] }, { title: '0-2 淘汰', ids: ['S3-ELIM-1','S3-ELIM-2','S3-ELIM-3'], type: 'eliminated' }] },
            { type: 'round', content: [{ title: '2-1 晋级', ids: ['S4-PROMO-1','S4-PROMO-2','S4-PROMO-3'], type: 'promoted' }, { title: '1-2 淘汰', ids: ['S4-ELIM-1','S4-ELIM-2','S4-ELIM-3'], type: 'eliminated' }] }
        ];
        const playoffBracketLayout_12 = [
            { type: 'round', content: [{ title: '胜者组 R1 (种子1-4)', ids: ['P-WB1-1','P-WB1-2'] }] },
            { type: 'round', content: [{ title: '胜者组决赛', ids: ['P-WBF'] }, { title: '败者组 R1 (4队混抽)', ids: ['P-LB1-1','P-LB1-2'] }] },
            { type: 'round', content: [{ title: '败者组 R2', ids: ['P-LB2'] }] },
            { type: 'round', content: [{ title: '败者组决赛', ids: ['P-LBF'] }] },
            { type: 'round', content: [{ title: '总决赛', ids: ['P-GF'] }] },
            { type: 'round', content: [{ title: '总冠军', ids: ['P-CHAMPION'], type: 'champion' }] }
        ];

        // ── 辅助函数 ─────────────────────────────────────────────────────────────
        function getWinner(match) {
            if (!match || typeof match.score_a !== 'number' || typeof match.score_b !== 'number' || (match.score_a === 0 && match.score_b === 0)) return null;
            if (match.score_a === match.score_b) return null;
            return match.score_a > match.score_b ? match.team_a : match.team_b;
        }
        function getLoser(match) {
            if (!match || typeof match.score_a !== 'number' || typeof match.score_b !== 'number' || (match.score_a === 0 && match.score_b === 0)) return null;
            if (match.score_a === match.score_b) return null;
            return match.score_a < match.score_b ? match.team_a : match.team_b;
        }
        const isMatchInDbEmpty = (matchId, data) => {
            const m = data[matchId];
            return !m || !m.team_a || m.team_a === 'TBD' || m.team_a.trim() === '';
        };
        const isMatchFinished = (matchId, data) => {
            const m = data[matchId];
            return m && typeof m.score_a === 'number' && typeof m.score_b === 'number' && (m.score_a > 0 || m.score_b > 0);
        };
        const canRegenerateRound = (matchIds, groupName) => {
            const data = allMatchesData[groupName] || {};
            if (matchIds.some(id => isMatchInDbEmpty(id, data))) return false;
            return matchIds.every(id => {
                const m = data[id];
                return m && m.team_a && m.team_a !== 'TBD' && m.score_a === 0 && m.score_b === 0;
            });
        };
        function calcNetScore(team, groupData) {
            let wins = 0, losses = 0;
            Object.values(groupData).forEach(match => {
                if (!match.match_id || !match.match_id.startsWith('S')) return;
                if (typeof match.score_a !== 'number' || typeof match.score_b !== 'number') return;
                if (match.team_a === team) { wins += match.score_a; losses += match.score_b; }
                else if (match.team_b === team) { wins += match.score_b; losses += match.score_a; }
            });
            return wins - losses;
        }

        // 检查传奇组单循环赛是否已完成
        function isLegendRoundRobinComplete(groupData) {
            const rrMatches = Object.values(groupData).filter(m => m.match_id?.startsWith('RR-'));
            return rrMatches.length > 0 && rrMatches.every(m => 
                typeof m.score_a === 'number' && typeof m.score_b === 'number' && (m.score_a > 0 || m.score_b > 0)
            );
        }

        // ── 推导结果节点 ──────────────────────────────────────────────────────────
        function processResultNodes(rawData, is12Team) {
            const data = { ...rawData };
            const ensure = id => { if (!data[id]) data[id] = {}; };

            if (!is12Team) {
                ensure('S3-PROMO-A'); data['S3-PROMO-A'].result_team = getWinner(data['S2-1W']);
                ensure('S3-PROMO-B'); data['S3-PROMO-B'].result_team = getWinner(data['S2-2W']);
                ensure('S3-ELIM-A');  data['S3-ELIM-A'].result_team  = getLoser(data['S2-1L']);
                ensure('S3-ELIM-B');  data['S3-ELIM-B'].result_team  = getLoser(data['S2-2L']);
                ensure('S5-PROMO-A'); data['S5-PROMO-A'].result_team = getWinner(data['S3-1M']);
                ensure('S5-PROMO-B'); data['S5-PROMO-B'].result_team = getWinner(data['S3-2M']);
                ensure('S5-ELIM-A');  data['S5-ELIM-A'].result_team  = getLoser(data['S3-1M']);
                ensure('S5-ELIM-B');  data['S5-ELIM-B'].result_team  = getLoser(data['S3-2M']);

                const w1 = getWinner(data['P-WB1-1']), l1 = getLoser(data['P-WB1-1']);
                const w2 = getWinner(data['P-WB1-2']), l2 = getLoser(data['P-WB1-2']);
                if (w1 && w2) { ensure('P-WBF'); data['P-WBF'].team_a = w1; data['P-WBF'].team_b = w2; }
                if (l1 && l2) { ensure('P-LB1'); data['P-LB1'].team_a = l1; data['P-LB1'].team_b = l2; }
                const wWBF = getWinner(data['P-WBF']), lWBF = getLoser(data['P-WBF']), wLB1 = getWinner(data['P-LB1']);
                if (lWBF && wLB1) { ensure('P-LBF'); data['P-LBF'].team_a = lWBF; data['P-LBF'].team_b = wLB1; }
                const wLBF = getWinner(data['P-LBF']);
                if (wWBF && wLBF) { ensure('P-GF'); data['P-GF'].team_a = wWBF; data['P-GF'].team_b = wLBF; }
                ensure('P-CHAMPION'); data['P-CHAMPION'].result_team = getWinner(data['P-GF']);

            } else {
                ensure('S3-PROMO-1'); data['S3-PROMO-1'].result_team = getWinner(data['S2-1W']);
                ensure('S3-PROMO-2'); data['S3-PROMO-2'].result_team = getWinner(data['S2-2W']);
                ensure('S3-PROMO-3'); data['S3-PROMO-3'].result_team = getWinner(data['S2-3W']);
                ensure('S3-ELIM-1');  data['S3-ELIM-1'].result_team  = getLoser(data['S2-1L']);
                ensure('S3-ELIM-2');  data['S3-ELIM-2'].result_team  = getLoser(data['S2-2L']);
                ensure('S3-ELIM-3');  data['S3-ELIM-3'].result_team  = getLoser(data['S2-3L']);
                ensure('S4-PROMO-1'); data['S4-PROMO-1'].result_team = getWinner(data['S3-1M']);
                ensure('S4-PROMO-2'); data['S4-PROMO-2'].result_team = getWinner(data['S3-2M']);
                ensure('S4-PROMO-3'); data['S4-PROMO-3'].result_team = getWinner(data['S3-3M']);
                ensure('S4-ELIM-1');  data['S4-ELIM-1'].result_team  = getLoser(data['S3-1M']);
                ensure('S4-ELIM-2');  data['S4-ELIM-2'].result_team  = getLoser(data['S3-2M']);
                ensure('S4-ELIM-3');  data['S4-ELIM-3'].result_team  = getLoser(data['S3-3M']);

                const wWB1_1 = getWinner(data['P-WB1-1']);
                const wWB1_2 = getWinner(data['P-WB1-2']);
                if (wWB1_1 && wWB1_2) { ensure('P-WBF'); data['P-WBF'].team_a = wWB1_1; data['P-WBF'].team_b = wWB1_2; }

                const wLB1_1 = getWinner(data['P-LB1-1']), wLB1_2 = getWinner(data['P-LB1-2']);
                if (wLB1_1 && wLB1_2) { ensure('P-LB2'); data['P-LB2'].team_a = wLB1_1; data['P-LB2'].team_b = wLB1_2; }

                const wWBF = getWinner(data['P-WBF']), lWBF = getLoser(data['P-WBF']), wLB2 = getWinner(data['P-LB2']);
                if (lWBF && wLB2) { ensure('P-LBF'); data['P-LBF'].team_a = lWBF; data['P-LBF'].team_b = wLB2; }

                const wLBF = getWinner(data['P-LBF']);
                if (wWBF && wLBF) { ensure('P-GF'); data['P-GF'].team_a = wWBF; data['P-GF'].team_b = wLBF; }
                ensure('P-CHAMPION'); data['P-CHAMPION'].result_team = getWinner(data['P-GF']);
            }
            return data;
        }

        function processMatchData(matches) {
            const playerData = {};
            matches.forEach(match => {
                ['team_a','team_b'].forEach(teamKey => {
                    for (let p = 1; p <= 5; p++) {
                        const playerId    = match[`${teamKey}_player${p}_id`];
                        const playerDataStr = match[`${teamKey}_player${p}_data`];
                        if (!playerId || !playerDataStr) continue;
                        const stats = String(playerDataStr).split('/').map(Number);
                        if (stats.length !== 4 || stats.some(isNaN)) continue;
                        const key = `${playerId}::${match.group}`;
                        if (!playerData[key]) playerData[key] = { kills: 0, deaths: 0, assists: 0, acs: 0, acsMatchCount: 0 };
                        const ps = playerData[key];
                        if (stats[0] > 0) { ps.acs += stats[0]; ps.acsMatchCount++; }
                        ps.kills += stats[1]; ps.deaths += stats[2]; ps.assists += stats[3];
                    }
                });
            });
            return playerData;
        }

        async function autoSubmitDeterminedMatches() {
            const groups = ['传奇组','中坚组','挑战组'];
            const toUpsert = [];

            for (const groupName of groups) {
                const groupData  = allMatchesData[groupName] || {};
                const is12Team   = groupName === '挑战组';
                const processed  = processResultNodes(groupData, is12Team);

                const autoMatchDefs = !is12Team ? [
                    { id: 'P-WBF', prereqs: ['P-WB1-1','P-WB1-2'] },
                    { id: 'P-LB1', prereqs: ['P-WB1-1','P-WB1-2'] },
                    { id: 'P-LBF', prereqs: ['P-WBF','P-LB1'] },
                    { id: 'P-GF',  prereqs: ['P-WBF','P-LBF'] },
                ] : [
                    { id: 'P-WBF', prereqs: ['P-WB1-1','P-WB1-2'] },
                    { id: 'P-LB2', prereqs: ['P-LB1-1','P-LB1-2'] },
                    { id: 'P-LBF', prereqs: ['P-WBF','P-LB2'] },
                    { id: 'P-GF',  prereqs: ['P-WBF','P-LBF'] },
                ];

                for (const def of autoMatchDefs) {
                    const prereqsDone = def.prereqs.every(pid => isMatchFinished(pid, groupData));
                    if (!prereqsDone) continue;

                    const processedMatch = processed[def.id];
                    if (!processedMatch) continue;

                    const existing = groupData[def.id] || {};

                    const teamA = processedMatch.team_a;
                    const teamB = processedMatch.team_b;
                    if (!teamA || !teamB || teamA === 'TBD' || teamB === 'TBD') continue;
                    if (existing.team_a === teamA && existing.team_b === teamB) continue;
                    
                    const payload = {
                        group: groupName, match_id: def.id,
                        team_a: teamA, team_b: teamB,
                        score_a: existing.score_a || 0, score_b: existing.score_b || 0,
                        match_date: existing.match_date || null,
                        link: existing.link || null,
                        commentators: existing.commentators || null,
                    };
                    
                    toUpsert.push(payload);
                }
            }

            if (toUpsert.length === 0) return;

            autoSubmitBanner.style.display = 'block';
            autoSubmitBanner.style.opacity = '1';
            autoSubmitBanner.style.borderColor = 'var(--success-green)';
            autoSubmitBanner.style.color = 'var(--success-green)';
            autoSubmitBanner.textContent = `⚡ 正在自动写入 ${toUpsert.length} 场已确定赛程...`;

            try {
                const { error } = await supabaseClient
                                    .from('s6_match_schedule')
                                    .upsert(toUpsert, { onConflict: 'group,match_id' });
                if (error) throw error;

                toUpsert.forEach(match => {
                    if (!allMatchesData[match.group]) allMatchesData[match.group] = {};
                    allMatchesData[match.group][match.match_id] = {
                        ...allMatchesData[match.group][match.match_id], ...match
                    };
                });

                const names = toUpsert.map(m => `[${m.group}] ${m.match_id}: ${m.team_a} vs ${m.team_b}`).join('\n');
                autoSubmitBanner.textContent = `✅ 已自动写入 ${toUpsert.length} 场赛程:\n${names}`;

                const activeGroup = groupFilters.querySelector('.active').dataset.group;
                renderBrackets(activeGroup);

                setTimeout(() => {
                    autoSubmitBanner.style.opacity = '0';
                    setTimeout(() => {
                        autoSubmitBanner.style.display = 'none';
                        autoSubmitBanner.style.opacity = '1';
                    }, 500);
                }, 4000);

            } catch (err) {
                console.error('自动提交赛程失败:', err);
                autoSubmitBanner.style.borderColor = 'var(--ash)';
                autoSubmitBanner.style.color = 'var(--ash)';
                autoSubmitBanner.textContent = `❌ 自动写入失败: ${err.message}`;
                setTimeout(() => { autoSubmitBanner.style.display = 'none'; }, 4000);
            }
        }

        async function loadData() {
            try {
                const scheduleTable = currentSeason === 's5' ? 's5_match_schedule' : 's6_match_schedule';
                const playersTable = currentSeason === 's5' ? 's5_player_ids' : 's6_player_ids';
                const matchesTable = currentSeason === 's5' ? 's5_matches' : 's6_matches';
                
                const [
                    { data: scheduleData, error: scheduleError },
                    { data: playersData,  error: playersError  },
                    { data: matchesData,  error: matchesError  }
                ] = await Promise.all([
                    supabaseClient.from(scheduleTable).select('*'),
                    supabaseClient.from(playersTable).select('id, name, team, "group"'),
                    supabaseClient.from(matchesTable).select('*'),
                ]);
                if (scheduleError || playersError) throw scheduleError || playersError;

                allRegisteredPlayers = playersData || [];
                processedMatchStats  = processMatchData(matchesData || []);

                allTeamsByGroup = {};
                allRegisteredPlayers.forEach(p => {
                    if (p.group && p.team) {
                        if (!allTeamsByGroup[p.group]) allTeamsByGroup[p.group] = new Set();
                        allTeamsByGroup[p.group].add(p.team);
                    }
                });

                allMatchesData = {};
                (scheduleData || []).forEach(row => {
                    if (!allMatchesData[row.group]) allMatchesData[row.group] = {};
                    if (row.match_id) allMatchesData[row.group][String(row.match_id).trim()] = row;
                });

                const activeGroup = groupFilters.querySelector('.active').dataset.group;
                renderBrackets(activeGroup);

                await autoSubmitDeterminedMatches();

            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('swiss-bracket').innerHTML =
                    `<p style="color:var(--coral-pulse);text-align:center;">无法加载数据: ${error.message}</p>`;
            }
        }

        function createMatchCard(data) {
            const teamA  = data?.team_a  || 'TBD';
            const teamB  = data?.team_b  || 'TBD';
            const scoreA = data?.score_a ?? 0;
            const scoreB = data?.score_b ?? 0;
            const casters = data?.commentators || '暂无数据';
            let matchDateStr = '';
            if (data?.match_date) {
                try {
                    const date = new Date(data.match_date);
                    matchDateStr = date.toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false }).replace(/\//g,'-');
                } catch(e) { matchDateStr = data.match_date; }
            }
            const isFinished = typeof scoreA === 'number' && typeof scoreB === 'number' && (scoreA > 0 || scoreB > 0);
            const winnerA = isFinished && scoreA > scoreB;
            const winnerB = isFinished && scoreB > scoreA;
            const card = document.createElement('div');
            card.className = 'match-card';
            card.dataset.matchId = data?.match_id || '';
            card.dataset.group   = data?.group   || '';
            card.innerHTML = `
                <div class="match-date">${matchDateStr} ${data?.link ? '📺(附录像)' : ''}</div>
                <div class="team ${winnerA?'winner':''} ${winnerB?'loser':''}"><span class="team-name">${teamA}</span><span class="team-score">${scoreA}</span></div>
                <hr>
                <div class="team ${winnerB?'winner':''} ${winnerA?'loser':''}"><span class="team-name">${teamB}</span><span class="team-score">${scoreB}</span></div>
                <div class="commentator-info">🎙️ 解说: ${casters}</div>
            `;
            return card;
        }
        
        function createResultCard(data, type = '') {
            const card = document.createElement('div');
            card.className = `result-card ${type}`;
            card.textContent = data?.result_team || 'TBD';
            return card;
        }
        
        function buildBracket(container, layout, data) {
            container.innerHTML = '';
            layout.forEach(col => {
                const roundDiv = document.createElement('div');
                roundDiv.className = 'round';
                col.content.forEach(group => {
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'round-title';
                    titleDiv.textContent = group.title;
                    roundDiv.appendChild(titleDiv);
                    group.ids.forEach(id => {
                        const cardData = data[id];

                            el = createResultCard(cardData, group.type);
                        } else {
                            const safeData = cardData || { match_id: id, group: document.getElementById('current-group-name').textContent.replace('赛程','') };
                            el = createMatchCard(safeData);
                        }
                        roundDiv.appendChild(el);
                    });
                });
                container.appendChild(roundDiv);
            });
        }

        function renderBrackets(groupName, dataSource = allMatchesData) {
            const is12Team = groupName === '挑战组';
            const isS6Legend = groupName === '传奇组' && currentSeason === 's6';
            const rawData  = dataSource[groupName] || {};
            const processed = processResultNodes(rawData, is12Team);
            document.getElementById('current-group-name').textContent = `${groupName}赛程`;
            
            let swissLayout = swissBracketLayout;
            if (isS6Legend) {
                swissLayout = roundRobinLayout;
            } else if (is12Team) {
                swissLayout = swissBracketLayout_12;
            }
            
            buildBracket(document.getElementById('swiss-bracket'), swissLayout, processed);
            buildBracket(document.getElementById('playoff-bracket'),  is12Team ? playoffBracketLayout_12 : playoffBracketLayout, processed);
        }

        function seededRandom(seed) {
            let state = seed;
            return () => { state = (state * 9301 + 49297) % 233280; return state / 233280; };
        }
        function shuffleArray(array, rng) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function generateAndDisplaySchedule() {
            const groupName  = groupFilters.querySelector('.active').dataset.group;
            const is12Team   = groupName === '挑战组';
            const isS6Legend = groupName === '传奇组' && currentSeason === 's6';
            const groupData  = { ...allMatchesData[groupName] } || {};
            const processed  = processResultNodes(groupData, is12Team);
            const seedInput  = document.getElementById('seed-input').value;
            const seed       = seedInput ? parseInt(seedInput) : Date.now();
            const rng        = seededRandom(seed);
            
            // 检查当前阶段
            const currentStage = stageFilters.querySelector('.active').dataset.stage;
            const isOnPlayoffStage = currentStage === 'playoff';

            let dataToUpsert = [], idsToDelete = [];
            let operationMessage = '没有可生成的对战。请确保队伍池正确或所有必需的比赛已完成。';

            const getResultTeam = id => processed[id]?.result_team;

            // ══ 一、小组赛抽签 ══════════════════════════════════════════════════════
            const allTeamsInGroup = Array.from(allTeamsByGroup[groupName] || []);

            // 如果用户在淘汰赛标签页，跳过小组赛生成，直接进行淘汰赛抽签
            if (!isOnPlayoffStage) {
                if (isS6Legend) {
                    // 传奇组：只有当单循环赛未完成时才生成
                    if (!isLegendRoundRobinComplete(groupData) && allTeamsInGroup.length > 0) {
                        // 1. 获取队伍列表
                        const originalTeams = [...allTeamsInGroup].sort();
                        let teams = [...originalTeams];
                        if (teams.length % 2 !== 0) teams.push('BYE'); // 奇数队添加 BYE

                        const numTeams = teams.length;          // 实际参与轮转的队伍数（含 BYE）
                        const numRounds = numTeams - 1;        // 7 队时 = 7 轮

                        // 2. 圆桌轮转生成每轮比赛
                        for (let round = 0; round < numRounds; round++) {
                            let matchIndex = 0; // 当前轮真实比赛序号
                            for (let i = 0; i < numTeams / 2; i++) {
                                const teamA = teams[i];
                                const teamB = teams[numTeams - 1 - i];

                                if (teamA === 'BYE' || teamB === 'BYE') continue; // 跳过轮空

                                const matchId = `RR-${round + 1}-${matchIndex + 1}`;
                                matchIndex++;

                                // 3. 查找历史交手记录
                                const existingInSlot = groupData[matchId];
                                const playedAnywhere = Object.values(groupData).find(m =>
                                    ((m.team_a === teamA && m.team_b === teamB) ||
                                    (m.team_a === teamB && m.team_b === teamA)) &&
                                    m.match_id !== matchId
                                );

                                // 4. 初始化数据
                                let scoreA = 0, scoreB = 0;
                                let targetDbId = existingInSlot?.id;
                                let matchDate = existingInSlot?.match_date ?? null;
                                let link = existingInSlot?.link ?? '';
                                let commentators = existingInSlot?.commentators ?? '';

                                if (playedAnywhere) {
                                    // 继承历史比分
                                    scoreA = playedAnywhere.team_a === teamA ? playedAnywhere.score_a : playedAnywhere.score_b;
                                    scoreB = playedAnywhere.team_a === teamA ? playedAnywhere.score_b : playedAnywhere.score_a;
                                    matchDate = playedAnywhere.match_date ?? null;
                                    link = playedAnywhere.link ?? '';
                                    commentators = playedAnywhere.commentators ?? '';
                                    targetDbId = playedAnywhere.id; // 迁移 id

                                    // 如果当前槽位有旧记录且不是同一行，标记删除
                                    if (existingInSlot && existingInSlot.id !== playedAnywhere.id) {
                                        idsToDelete.push(existingInSlot.match_id);
                                    }
                                } else if (existingInSlot) {
                                    // 保持已有数据
                                    scoreA = existingInSlot.score_a || 0;
                                    scoreB = existingInSlot.score_b || 0;
                                }

                                // 5. 构造 upsert 数据
                                const payload = {
                                    group: groupName,
                                    match_id: matchId,
                                    team_a: teamA,
                                    team_b: teamB,
                                    score_a: scoreA,
                                    score_b: scoreB,
                                    match_date: matchDate,
                                    link: link,
                                    commentators: commentators,
                                };
                                if (targetDbId) payload.id = targetDbId;

                                dataToUpsert.push(payload);
                            }

                            // 6. 轮转队伍顺序（固定第一个，其余右移）
                            const fixed = teams[0];
                            const rest = teams.slice(1);
                            const rotatedRest = [rest[rest.length - 1], ...rest.slice(0, -1)];
                            teams = [fixed, ...rotatedRest];
                        }

                        // 7. 清理废弃旧瑞士轮记录
                        Object.values(groupData).forEach(m => {
                            if (m.match_id && !m.match_id.startsWith('RR-') && !m.match_id.startsWith('P-')) {
                                const isInherited = dataToUpsert.some(u => u.id === m.id);
                                if (!isInherited && !idsToDelete.includes(m.match_id)) {
                                    idsToDelete.push(m.match_id);
                                }
                            }
                        });

                        operationMessage = '已生成传奇组 7 轮单循环赛程，并自动继承历史数据。';
                    } else {
                        operationMessage = '传奇组小组赛已完成，请切换到淘汰赛标签页进行淘汰赛抽签。';
                    }
                } else {
                    // 中坚组与挑战组 - 瑞士轮逻辑
                    if (allTeamsInGroup.length > 0) {
                        const teamRecords = {};
                        allTeamsInGroup.forEach(t => { teamRecords[t] = { wins: 0, losses: 0, played: 0 }; });
                        Object.values(groupData).filter(m => m.match_id?.startsWith('S')).forEach(match => {
                            if (typeof match.score_a === 'number' && typeof match.score_b === 'number' && (match.score_a > 0 || match.score_b > 0)) {
                                const w = getWinner(match), l = getLoser(match);
                                if (w && teamRecords[w]) { teamRecords[w].wins++; teamRecords[w].played++; }
                                if (l && teamRecords[l]) { teamRecords[l].losses++; teamRecords[l].played++; }
                            }
                        });

                        const teamsByRecord = {};
                        for (const t in teamRecords) {
                            const key = teamRecords[t].played === 0 ? '0-0' : `${teamRecords[t].wins}-${teamRecords[t].losses}`;
                            if (!teamsByRecord[key]) teamsByRecord[key] = [];
                            teamsByRecord[key].push(t);
                        }
                        for (const rec in teamsByRecord) shuffleArray(teamsByRecord[rec], rng);

                        const assignments = is12Team
                            ? { '0-0':['S1-1','S1-2','S1-3','S1-4','S1-5','S1-6'], '1-0':['S2-1W','S2-2W','S2-3W'], '0-1':['S2-1L','S2-2L','S2-3L'], '1-1':['S3-1M','S3-2M','S3-3M'] }
                            : { '0-0':['S1-1','S1-2','S1-3','S1-4'], '1-0':['S2-1W','S2-2W'], '0-1':['S2-1L','S2-2L'], '1-1':['S3-1M','S3-2M'] };

                        for (const rec in assignments) {
                            const teams   = teamsByRecord[rec] || [];
                            const matchIds = assignments[rec];
                            const needed  = matchIds.length * 2;
                            if (teams.length >= needed && (matchIds.some(id => isMatchInDbEmpty(id, groupData)) || canRegenerateRound(matchIds, groupName))) {
                                idsToDelete.push(...matchIds);
                                let idx = 0;
                                for (const matchId of matchIds) {
                                    const tA = teams[idx++] || 'TBD', tB = teams[idx++] || 'TBD';
                                    if (tA !== 'TBD' && tB !== 'TBD') {
                                        const existing = groupData[matchId] || {};
                                        const payload = { group: groupName, match_id: matchId, team_a: tA, team_b: tB, score_a: 0, score_b: 0 };
                                        if (existing.id) payload.id = existing.id; // 添加现有 ID 以确保更新
                                        dataToUpsert.push(payload);
                                        operationMessage = `已为 ${rec} 组生成对阵！`;
                                    }
                                }
                            }
                        }
                    }
                }
            }

            // ══ 二、淘汰赛第一轮抽签 ═══════════════════════════════════════════════
            if (dataToUpsert.length === 0) {

                if (isS6Legend) {
                    // ══ 传奇组淘汰赛抽签 ══════════════════════════════════════════════════════
                    if (!isLegendRoundRobinComplete(groupData)) {
                        operationMessage = '传奇组小组赛尚未完成，请先完成所有单循环赛再进行淘汰赛抽签。';
                    } else {
                        // 计算单循环赛积分排名
                        const teamRecords = {};
                        allTeamsInGroup.forEach(t => { 
                            teamRecords[t] = { wins: 0, losses: 0, scoreFor: 0, scoreAgainst: 0, played: 0 }; 
                        });
                        
                        Object.values(groupData).filter(m => m.match_id?.startsWith('RR-')).forEach(match => {
                            if (typeof match.score_a === 'number' && typeof match.score_b === 'number' && (match.score_a > 0 || match.score_b > 0)) {
                                const w = getWinner(match), l = getLoser(match);
                                if (w && teamRecords[w]) { 
                                    teamRecords[w].wins++; 
                                    teamRecords[w].played++;
                                    teamRecords[w].scoreFor += match.team_a === w ? match.score_a : match.score_b;
                                    teamRecords[w].scoreAgainst += match.team_a === w ? match.score_b : match.score_a;
                                }
                                if (l && teamRecords[l]) { 
                                    teamRecords[l].losses++; 
                                    teamRecords[l].played++;
                                    teamRecords[l].scoreFor += match.team_a === l ? match.score_a : match.score_b;
                                    teamRecords[l].scoreAgainst += match.team_a === l ? match.score_b : match.score_a;
                                }
                            }
                        });
                        
                        // 按胜场数排名，胜场相同则按净胜分排名
                        const sortedTeams = Object.entries(teamRecords)
                            .filter(([_, rec]) => rec.played > 0)
                            .sort((a, b) => {
                                if (b[1].wins !== a[1].wins) return b[1].wins - a[1].wins;
                                const netA = a[1].scoreFor - a[1].scoreAgainst;
                                const netB = b[1].scoreFor - b[1].scoreAgainst;
                                if (netB !== netA) return netB - netA;
                                return a[0].localeCompare(b[0]);
                            })
                            .map(([team, _]) => team);
                        
                        // 取前4名晋级淘汰赛
                        const top4 = sortedTeams.slice(0, 4);
                        
                        if (top4.length === 4) {
                            const [s1, s2, s3, s4] = top4;
                            
                            // 种子配对：1 vs 4, 2 vs 3
                            let pair1 = [s1, s4];
                            let pair2 = [s2, s3];
                            
                            // 随机交换主客场
                            if (rng() < 0.5) pair1.reverse();
                            if (rng() < 0.5) pair2.reverse();
                            
                            const isWB1Empty = isMatchInDbEmpty('P-WB1-1', groupData) || isMatchInDbEmpty('P-WB1-2', groupData);
                            const canRegenWB1 = canRegenerateRound(['P-WB1-1','P-WB1-2'], groupName);
                            
                            if (isWB1Empty || canRegenWB1) {
                                idsToDelete.push('P-WB1-1','P-WB1-2');
                                
                                const ex1 = groupData['P-WB1-1'] || {};
                                const pl1 = { group: groupName, match_id: 'P-WB1-1', team_a: pair1[0], team_b: pair1[1], score_a: 0, score_b: 0 };
                                if (ex1.id) pl1.id = ex1.id;
                                dataToUpsert.push(pl1);
                                
                                const ex2 = groupData['P-WB1-2'] || {};
                                const pl2 = { group: groupName, match_id: 'P-WB1-2', team_a: pair2[0], team_b: pair2[1], score_a: 0, score_b: 0 };
                                if (ex2.id) pl2.id = ex2.id;
                                dataToUpsert.push(pl2);
                                
                                operationMessage = `已完成传奇组淘汰赛第一轮抽签！\n` +
                                    `小组赛排名：${sortedTeams.join(' > ')}\n` +
                                    `胜者组R1：${pair1[0]} vs ${pair1[1]} ／ ${pair2[0]} vs ${pair2[1]}`;
                            } else {
                                operationMessage = '传奇组淘汰赛第一轮已存在或已完成。';
                            }
                        } else {
                            operationMessage = `传奇组队伍不足4支（当前${top4.length}支），无法生成淘汰赛对阵。`;
                        }
                    }
                } else if (!is12Team) {
                    // ══ 中坚组淘汰赛抽签（原有逻辑）══════════════════════════════════════════════
                    const isWB1Empty  = isMatchInDbEmpty('P-WB1-1', groupData) || isMatchInDbEmpty('P-WB1-2', groupData);
                    const canRegenWB1 = canRegenerateRound(['P-WB1-1','P-WB1-2'], groupName);
                    if (isWB1Empty || canRegenWB1) {
                        const promo2_0 = [getResultTeam('S3-PROMO-A'), getResultTeam('S3-PROMO-B')].filter(Boolean);
                        const promo2_1 = [getResultTeam('S5-PROMO-A'), getResultTeam('S5-PROMO-B')].filter(Boolean);
                        if (promo2_0.length === 2 && promo2_1.length === 2) {
                            shuffleArray(promo2_1, rng);
                            idsToDelete.push('P-WB1-1','P-WB1-2');
                            
                            const ex1 = groupData['P-WB1-1'] || {};
                            const pl1 = { group: groupName, match_id: 'P-WB1-1', team_a: promo2_0[0], team_b: promo2_1[0], score_a: 0, score_b: 0 };
                            if (ex1.id) pl1.id = ex1.id; // 添加 ID
                            dataToUpsert.push(pl1);
                            
                            const ex2 = groupData['P-WB1-2'] || {};
                            const pl2 = { group: groupName, match_id: 'P-WB1-2', team_a: promo2_0[1], team_b: promo2_1[1], score_a: 0, score_b: 0 };
                            if (ex2.id) pl2.id = ex2.id; // 添加 ID
                            dataToUpsert.push(pl2);
                            
                            operationMessage = '已生成淘汰赛第一轮对阵！';
                        }
                    }

                } else {
                    // ══ 挑战组淘汰赛抽签（原有逻辑）══════════════════════════════════════════════
                    const promo2_0 = ['S3-PROMO-1','S3-PROMO-2','S3-PROMO-3'].map(getResultTeam).filter(Boolean);
                    const promo2_1 = ['S4-PROMO-1','S4-PROMO-2','S4-PROMO-3'].map(getResultTeam).filter(Boolean);

                    const isWB1Empty  = isMatchInDbEmpty('P-WB1-1', groupData) || isMatchInDbEmpty('P-WB1-2', groupData);
                    const canRegenWB1 = canRegenerateRound(['P-WB1-1','P-WB1-2'], groupName);

                    if ((isWB1Empty || canRegenWB1) && promo2_0.length === 3) {
                        const teamWins = {}, teamOpponents = {};
                        [...promo2_0, ...promo2_1].forEach(t => { teamWins[t] = 0; teamOpponents[t] = []; });
                        Object.values(groupData).filter(m => m.match_id?.startsWith('S')).forEach(m => {
                            const w = getWinner(m), l = getLoser(m);
                            if (!w || !l) return;
                            if (teamWins[w] !== undefined) teamWins[w]++;
                            if (teamOpponents[m.team_a]) teamOpponents[m.team_a].push(m.team_b);
                            if (teamOpponents[m.team_b]) teamOpponents[m.team_b].push(m.team_a);
                        });
                        const getBuchholz = t => (teamOpponents[t] || []).reduce((s, o) => s + (teamWins[o] || 0), 0);

                        const sorted2_0 = [...promo2_0].sort((a, b) => {
                            const d = getBuchholz(b) - getBuchholz(a);
                            return d !== 0 ? d : a.localeCompare(b);
                        });

                        const sorted2_1 = promo2_1.length === 3
                            ? [...promo2_1].sort((a, b) => {
                                const d = calcNetScore(b, groupData) - calcNetScore(a, groupData);
                                return d !== 0 ? d : a.localeCompare(b);
                            })
                            : [];

                        const [s1, s2, s3] = sorted2_0;
                        const s4 = sorted2_1[0];

                        if (!s1 || !s2 || !s3 || !s4) {
                            alert('2-1队排名第一尚未确定，无法生成第一轮对阵。');
                            return;
                        }

                        const pairingIdx = Math.floor(rng() * 3);
                        let pair1, pair2;
                        if      (pairingIdx === 0) { pair1 = [s1, s2]; pair2 = [s3, s4]; }
                        else if (pairingIdx === 1) { pair1 = [s1, s3]; pair2 = [s2, s4]; }
                        else                       { pair1 = [s1, s4]; pair2 = [s2, s3]; }

                        if (rng() < 0.5) pair1.reverse();
                        if (rng() < 0.5) pair2.reverse();
                        if (rng() < 0.5) { [pair1, pair2] = [pair2, pair1]; }

                        idsToDelete.push('P-WB1-1','P-WB1-2');
                        
                        const ex1 = groupData['P-WB1-1'] || {};
                        const pl1 = { group: groupName, match_id: 'P-WB1-1', team_a: pair1[0], team_b: pair1[1], score_a: 0, score_b: 0 };
                        if (ex1.id) pl1.id = ex1.id; // 添加 ID
                        dataToUpsert.push(pl1);
                        
                        const ex2 = groupData['P-WB1-2'] || {};
                        const pl2 = { group: groupName, match_id: 'P-WB1-2', team_a: pair2[0], team_b: pair2[1], score_a: 0, score_b: 0 };
                        if (ex2.id) pl2.id = ex2.id; // 添加 ID
                        dataToUpsert.push(pl2);

                        operationMessage =
                                `已完成挑战组淘汰赛第一轮抽签！\n` +
                                `胜者组R1：${pair1[0]} vs ${pair1[1]} ／ ${pair2[0]} vs ${pair2[1]}\n` ;

                    } else if (promo2_0.length < 3) {
                        operationMessage = '2-0队伍数量不足3支，请等待小组赛第二轮结束。';
                    }
                }
            }

            // ══ 二点五、挑战组败者组第一轮抽签 (4队混抽) ════════════════════════
            if (dataToUpsert.length === 0 && is12Team) {
                const wWB1_1 = getWinner(groupData['P-WB1-1']), lWB1_1 = getLoser(groupData['P-WB1-1']);
                const wWB1_2 = getWinner(groupData['P-WB1-2']), lWB1_2 = getLoser(groupData['P-WB1-2']);

                if (lWB1_1 && lWB1_2) {
                    const isLB1Empty = isMatchInDbEmpty('P-LB1-1', groupData) || isMatchInDbEmpty('P-LB1-2', groupData);
                    const canRegenLB1 = canRegenerateRound(['P-LB1-1','P-LB1-2'], groupName);

                    if (isLB1Empty || canRegenLB1) {
                        const promo2_1 = ['S4-PROMO-1','S4-PROMO-2','S4-PROMO-3'].map(getResultTeam).filter(Boolean);
                        const sorted2_1 = promo2_1.length === 3
                            ? [...promo2_1].sort((a, b) => {
                                const d = calcNetScore(b, groupData) - calcNetScore(a, groupData);
                                return d !== 0 ? d : a.localeCompare(b);
                            })
                            : [];
                        
                        const s5 = sorted2_1[1];
                        const s6 = sorted2_1[2];

                        if (s5 && s6) {
                            const lb1Teams = [lWB1_1, lWB1_2, s5, s6];
                            shuffleArray(lb1Teams, rng);

                            idsToDelete.push('P-LB1-1', 'P-LB1-2');
                            
                            const exLb1_1 = groupData['P-LB1-1'] || {};
                            const plLb1_1 = { group: groupName, match_id: 'P-LB1-1', team_a: lb1Teams[0], team_b: lb1Teams[1], score_a: 0, score_b: 0 };
                            if (exLb1_1.id) plLb1_1.id = exLb1_1.id; // 添加 ID
                            dataToUpsert.push(plLb1_1);
                            
                            const exLb1_2 = groupData['P-LB1-2'] || {};
                            const plLb1_2 = { group: groupName, match_id: 'P-LB1-2', team_a: lb1Teams[2], team_b: lb1Teams[3], score_a: 0, score_b: 0 };
                            if (exLb1_2.id) plLb1_2.id = exLb1_2.id; // 添加 ID
                            dataToUpsert.push(plLb1_2);

                            operationMessage = `已完成挑战组败者组第一轮抽签！\n败者组R1：${lb1Teams[0]} vs ${lb1Teams[1]} ／ ${lb1Teams[2]} vs ${lb1Teams[3]}`;
                        }
                    }
                }
            }

            // ══ 三、淘汰赛后续推进 ════════════════════════════════════════════════
            if (dataToUpsert.length === 0) {
                const advDefs = !is12Team ? [
                    { id:'P-WBF',  prereqs:['P-WB1-1','P-WB1-2'], getTeams:()=>[getWinner(groupData['P-WB1-1']), getWinner(groupData['P-WB1-2'])] },
                    { id:'P-LB1',  prereqs:['P-WB1-1','P-WB1-2'], getTeams:()=>[getLoser(groupData['P-WB1-1']),  getLoser(groupData['P-WB1-2'])] },
                    { id:'P-LBF',  prereqs:['P-WBF','P-LB1'],     getTeams:()=>[getLoser(groupData['P-WBF']),    getWinner(groupData['P-LB1'])] },
                    { id:'P-GF',   prereqs:['P-WBF','P-LBF'],     getTeams:()=>[getWinner(groupData['P-WBF']),   getWinner(groupData['P-LBF'])] },
                ] : [
                    { id:'P-WBF',  prereqs:['P-WB1-1','P-WB1-2'], getTeams:()=>[getWinner(groupData['P-WB1-1']), getWinner(groupData['P-WB1-2'])] },
                    { id:'P-LB2',  prereqs:['P-LB1-1','P-LB1-2'], getTeams:()=>[getWinner(groupData['P-LB1-1']), getWinner(groupData['P-LB1-2'])] },
                    { id:'P-LBF',  prereqs:['P-WBF','P-LB2'],     getTeams:()=>[getLoser(groupData['P-WBF']),    getWinner(groupData['P-LB2'])] },
                    { id:'P-GF',   prereqs:['P-WBF','P-LBF'],     getTeams:()=>[getWinner(groupData['P-WBF']),   getWinner(groupData['P-LBF'])] },
                ];

                for (const def of advDefs) {
                    const prereqsDone = def.prereqs.every(pid => isMatchFinished(pid, groupData));
                    if (!prereqsDone) continue;
                    const [tA, tB] = def.getTeams();
                    if (!tA || !tB) continue;
                    const existing = groupData[def.id] || {};
                    if (existing.team_a === tA && existing.team_b === tB) continue;
                    
                    const payload = { group: groupName, match_id: def.id, team_a: tA, team_b: tB, score_a: existing.score_a||0, score_b: existing.score_b||0, match_date: existing.match_date||null, link: existing.link||null, commentators: existing.commentators||null };
                    if (existing.id) payload.id = existing.id; // 添加 ID
                    dataToUpsert.push(payload);
                    
                    operationMessage = `已推导 ${def.id}：${tA} vs ${tB}`;
                }
            }

            // ══ 四、预览 & 提交 ══════════════════════════════════════════════════════
            pendingDataToUpsert = dataToUpsert;
            pendingIdsToDelete  = idsToDelete;

            if (pendingDataToUpsert.length > 0 || pendingIdsToDelete.length > 0) {
                alert(`✅ 已生成新对阵！\n${operationMessage}\n\n请点击「提交赛程」保存到数据库。`);
                const tempGroupData = { ...allMatchesData[groupName] };
                pendingIdsToDelete.forEach(id => delete tempGroupData[id]);
                pendingDataToUpsert.forEach(m => { tempGroupData[m.match_id] = { ...tempGroupData[m.match_id], ...m }; });
                renderBrackets(groupName, { ...allMatchesData, [groupName]: tempGroupData });
                submitChangesBtn.style.display = 'inline-flex';
            } else {
                alert(operationMessage);
            }
        }

        // ── 提交更改 ─────────────────────────────────────────────────────────────
        submitChangesBtn.addEventListener('click', async () => {
            if (!isPasswordVerified) { passwordModal.style.display = 'flex'; passwordInputModal.focus(); return; }
            if (pendingDataToUpsert.length === 0 && pendingIdsToDelete.length === 0) { alert('没有待提交的更改。'); return; }
            const groupName = groupFilters.querySelector('.active').dataset.group;
            submitChangesBtn.disabled = true; submitChangesBtn.textContent = '提交中...';
            try {
                if (pendingIdsToDelete.length > 0) {
                    const { error } = await supabaseClient.from('s6_match_schedule').delete().eq('group', groupName).in('match_id', pendingIdsToDelete);
                    if (error) {
                        // 友好的外键冲突错误提示
                        if (error.message && error.message.includes('violates foreign key constraint')) {
                            throw new Error("检测到有玩家对已被废弃的对局进行了竞猜。\n请先前往 Supabase 数据库将表 [s6_bet_bets] 的外键修改为 CASCADE（级联删除），然后再重试！");
                        }
                        throw error;
                    }
                }
                if (pendingDataToUpsert.length > 0) {
                    const { error } = await supabaseClient
                                            .from('s6_match_schedule')
                                            .upsert(pendingDataToUpsert, { onConflict: 'group,match_id' });
                    if (error) throw error;
                }
                alert('赛程已成功更新到数据库！');
                pendingDataToUpsert = []; pendingIdsToDelete = [];
                submitChangesBtn.style.display = 'none';
                await loadData();
            } catch (error) {
                alert('提交失败: \n\n' + error.message);
            } finally {
                submitChangesBtn.disabled = false; submitChangesBtn.textContent = '提 交 赛 程';
            }
        });

        function renderTeamStats(teamName, groupName, containerId) {
            const container = document.getElementById(containerId);
            if (!teamName || teamName === 'TBD') { container.innerHTML = '<div style="text-align:center;padding:20px;">暂无队伍信息</div>'; return; }
            const players = allRegisteredPlayers.filter(p => p.team === teamName && p.group === groupName);
            if (!players.length) { container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--smoke);">未找到该队伍的选手名单</div>'; return; }
            let html = '<table class="stats-table"><tr><th>选手ID</th><th>姓名</th><th>ACS</th><th>KDA</th></tr>';
            players.forEach(p => {
                const stats = processedMatchStats[`${p.id}::${groupName}`];
                const avg_acs = stats?.acsMatchCount > 0 ? (stats.acs / stats.acsMatchCount).toFixed(1) : '—';
                const kda = stats ? (stats.deaths > 0 ? ((stats.kills + stats.assists) / stats.deaths).toFixed(2) : (stats.kills + stats.assists)) : '—';
                const hasData = stats && (stats.kills > 0 || stats.assists > 0 || stats.deaths > 0);
                html += `<tr>
                    <td><a href="player.html?name=${encodeURIComponent(p.name)}&group=${encodeURIComponent(groupName)}" target="_blank">${p.id}</a></td>
                    <td>${p.name}</td>
                    <td style="color:var(--coral-pulse);font-weight:700;">${avg_acs}</td>
                    <td style="font-weight:700;">${hasData ? kda : '—'}</td>
                </tr>`;
            });
            container.innerHTML = html + '</table>';
        }

        document.querySelectorAll('.bracket').forEach(bracket => {
            bracket.addEventListener('click', e => {
                const card = e.target.closest('.match-card');
                if (!card) return;
                const matchId = card.dataset.matchId, group = card.dataset.group;
                if (!matchId || !group) return;
                const matchData = allMatchesData[group]?.[matchId];
                if (!matchData) return;
                currentEditingMatch = { matchId, group, raw: matchData };
                document.getElementById('modal-match-title').textContent = `[${group}] 赛事编号：${matchId}`;
                document.getElementById('modal-team-a-name').textContent = matchData.team_a || '队伍 A (TBD)';
                document.getElementById('modal-team-b-name').textContent = matchData.team_b || '队伍 B (TBD)';
                document.getElementById('modal-input-commentators').value = matchData.commentators || '';
                document.getElementById('modal-input-link').value = matchData.link || '';
                renderTeamStats(matchData.team_a, group, 'modal-team-a-stats');
                renderTeamStats(matchData.team_b, group, 'modal-team-b-stats');
                matchDetailModal.style.display = 'flex';
            });
        });

        modalSaveBtn.addEventListener('click', () => {
            if (!currentEditingMatch) return;
            requireAdminAuth(async () => {
                const newCommentators = document.getElementById('modal-input-commentators').value.trim();
                const newLink = document.getElementById('modal-input-link').value.trim();
                const { matchId, group } = currentEditingMatch;
                modalSaveBtn.disabled = true; modalSaveBtn.textContent = '保存中...';
                try {
                    const { error } = await supabaseClient.from('s6_match_schedule').update({ commentators: newCommentators, link: newLink }).eq('match_id', matchId).eq('group', group);
                    if (error) throw error;
                    alert('更新成功！');
                    matchDetailModal.style.display = 'none';
                    await loadData();
                } catch (err) {
                    alert('更新失败: ' + err.message);
                } finally {
                    modalSaveBtn.disabled = false; modalSaveBtn.textContent = '保 存 更 新';
                }
            });
        });

        casterStatsBtn.addEventListener('click', () => {
            const stats = {};
            Object.values(allMatchesData).forEach(gd => Object.values(gd).forEach(match => {
                if (!match.commentators?.trim() || match.commentators === '暂无数据') return;
                match.commentators.split(/[,，、\s]+/).filter(Boolean).forEach(c => {
                    if (!stats[c]) stats[c] = { count: 0, matches: [] };
                    stats[c].count++;
                    stats[c].matches.push(`[${match.group||'?'}] ${match.match_id}: ${match.team_a||'TBD'} vs ${match.team_b||'TBD'}`);
                });
            }));
            casterStatsContainer.innerHTML = Object.keys(stats).length === 0
                ? '<p style="text-align:center;color:var(--smoke);">暂无解说数据</p>'
                : Object.keys(stats).sort((a,b) => stats[b].count - stats[a].count).map(c =>
                    `<div class="caster-stat-item">
                        <h3 class="caster-stat-header">🎙️ ${c} <span>总计: ${stats[c].count} 场</span></h3>
                        <ul class="caster-stat-list">${stats[c].matches.map(m=>`<li>${m}</li>`).join('')}</ul>
                    </div>`).join('');
            casterModal.style.display = 'flex';
        });

        modalCloseBtn.addEventListener('click', () => matchDetailModal.style.display = 'none');
        closeCasterModal.addEventListener('click', () => casterModal.style.display = 'none');
        matchDetailModal.addEventListener('click', e => { if (e.target === matchDetailModal) matchDetailModal.style.display = 'none'; });
        casterModal.addEventListener('click', e => { if (e.target === casterModal) casterModal.style.display = 'none'; });
        randomDrawBtn.addEventListener('click', () => requireAdminAuth(generateAndDisplaySchedule));
        passwordSubmitModal.addEventListener('click', verifyPassword);
        passwordInputModal.addEventListener('keypress', e => { if (e.key === 'Enter') verifyPassword(); });
        passwordModal.addEventListener('click', e => { if (e.target === passwordModal) { passwordModal.style.display = 'none'; pendingAuthAction = null; } });

        groupFilters.addEventListener('click', e => {
            if (e.target.tagName !== 'BUTTON' || e.target.classList.contains('active')) return;
            groupFilters.querySelector('.active').classList.remove('active');
            e.target.classList.add('active');
            renderBrackets(e.target.dataset.group);
            submitChangesBtn.style.display = 'none';
            pendingDataToUpsert = []; pendingIdsToDelete = [];
        });
        stageFilters.addEventListener('click', e => {
            if (e.target.tagName !== 'BUTTON' || e.target.classList.contains('active')) return;
            stageFilters.querySelector('.active').classList.remove('active');
            e.target.classList.add('active');
            const stage = e.target.dataset.stage;
            swissSection.style.display   = stage === 'swiss'   ? 'block' : 'none';
            playoffSection.style.display = stage === 'playoff' ? 'block' : 'none';
        });

        /* 活动上下文：赛季随活动锁定（无赛季滑块，S5/S6 由活动决定），渲染活动栏后再加载 */
        HWLayout.resolveEvent().then(function (ev) {
            if (!ev) {
                HWLayout.eventBar({ event: null });
            } else {
                var key = HWLayout.seasonKey(ev);
                currentSeason = key;
                HWLayout.access(key, ev).then(function (perms) {
                    HWLayout.eventBar({ event: ev, perms: perms });
                });
            }
            loadData();
        });
    });
</script>
</body>
</html>
